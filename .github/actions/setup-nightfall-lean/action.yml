name: Setup NIGHTFALL pinned Lean/Mathlib
description: Resolve the checked-in Lean 4.36 compiler lock, verify compiler Git source and Mathlib commit, and reuse exact-pin cache
runs:
  using: composite
  steps:
    - name: Resolve and verify active compiler lock
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/check_nightfall_compiler_lock.py --checkout "$GITHUB_WORKSPACE"
        python3 - <<'PY' >> "$GITHUB_ENV"
        import json
        from pathlib import Path
        lock = json.loads(Path("docs/lean-compiler-lock.json").read_text(encoding="utf-8"))
        for key, value in {
            "NIGHTFALL_LEAN_TOOLCHAIN": lock["toolchain"],
            "NIGHTFALL_LEAN_COMMIT": lock["lean_source_commit"],
            "NIGHTFALL_MATHLIB_TAG": lock["mathlib_tag"],
            "NIGHTFALL_MATHLIB_COMMIT": lock["mathlib_commit"],
        }.items():
            print(f"{key}={value}")
        PY
    - name: Install source-pinned Lean via elan
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/nightfall-elan-init.sh
        sh /tmp/nightfall-elan-init.sh -y --no-modify-path --default-toolchain "$NIGHTFALL_LEAN_TOOLCHAIN"
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        "$HOME/.elan/bin/lean" --version | tee /tmp/nightfall-lean-version.txt
        grep -F "version ${NIGHTFALL_LEAN_TOOLCHAIN#leanprover/lean4:v}" /tmp/nightfall-lean-version.txt
        grep -F "$NIGHTFALL_LEAN_COMMIT" /tmp/nightfall-lean-version.txt
    - name: Clone exact pinned Mathlib
      shell: bash
      run: |
        set -euo pipefail
        git clone --depth 1 --branch "$NIGHTFALL_MATHLIB_TAG" https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4
        test "$(git -C /tmp/mathlib4 rev-parse HEAD)" = "$NIGHTFALL_MATHLIB_COMMIT"
        test "$(cat /tmp/mathlib4/lean-toolchain)" = "$NIGHTFALL_LEAN_TOOLCHAIN"
    - name: Independently verify installed compiler and Mathlib source identity
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/check_nightfall_compiler_lock.py \
          --checkout "$GITHUB_WORKSPACE" \
          --installed-mathlib /tmp/mathlib4 \
          --lean-version-file /tmp/nightfall-lean-version.txt
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0; Node 24
      id: mathlib-cache
      with:
        path: /tmp/mathlib4/.lake
        key: ${{ runner.os }}-nightfall-${{ env.NIGHTFALL_MATHLIB_TAG }}-mathlib-${{ env.NIGHTFALL_MATHLIB_COMMIT }}-v3
    - name: Fetch pinned Mathlib artifacts on cache miss
      if: steps.mathlib-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        (cd /tmp/mathlib4 && "$HOME/.elan/bin/lake" exe cache get)
    - name: Verify pinned Mathlib and artifacts after cache restore
      shell: bash
      run: |
        set -euo pipefail
        test "$(git -C /tmp/mathlib4 rev-parse HEAD)" = "$NIGHTFALL_MATHLIB_COMMIT"
        test "$(cat /tmp/mathlib4/lean-toolchain)" = "$NIGHTFALL_LEAN_TOOLCHAIN"
        test -f /tmp/mathlib4/.lake/build/lib/lean/Mathlib.olean
