name: NIGHTFALL active Lean pin audit (no dependency builds)

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/setup-nightfall-lean/**'
      - 'lean-toolchain'
      - 'scripts/check_active_lean_compiler.py'
      - 'scripts/audit_ci_architecture.py'
      - 'scripts/nightfall_q2_certify.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/setup-nightfall-lean/**'
      - 'lean-toolchain'
      - 'scripts/check_active_lean_compiler.py'
      - 'scripts/audit_ci_architecture.py'
      - 'scripts/nightfall_q2_certify.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  immutable-active-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject obsolete active CI dependencies and pin drift
        run: python3 scripts/check_active_lean_compiler.py --self-test
      - name: Reject duplicate Q2 kernel autostarts and terminal certificate drift
        run: python3 scripts/audit_ci_architecture.py --self-test
