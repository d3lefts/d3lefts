name: NIGHTFALL normalized quantum circuit → Jensen product-mixture simulation (pinned Lean)
on:
  push:
    branches: [nightfall-quantum-unitary-mixture-integration-20261119]
    paths:
      - 'research/nightfall/formalization/product_space/Quantum*.lean'
      - '.github/workflows/nightfall-quantum-mixture-simulation.yml'
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/Quantum*.lean'
      - '.github/workflows/nightfall-quantum-mixture-simulation.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nightfall-circuit-mixture-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-circuit-mixture-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile source-exact 179-module product+Jensen mixture closure
        shell: bash
        run: |
          set -euo pipefail
          while read -r M P; do
            [ -z "$M" ] && continue
            REL="${M//.//}"
            mkdir -p "/tmp/mathlib4/$(dirname "$REL")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$REL")"
            cp "$P" "/tmp/mathlib4/$REL.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$REL.olean" "$REL.lean" >"/tmp/log-$M.txt" 2>&1) || { tail -120 "/tmp/log-$M.txt"; exit 1; }
            if grep -E 'declaration uses .sorry|sorryAx|error:' "/tmp/log-$M.txt"; then exit 1; fi
          done < research/nightfall/formalization/aa_product/CLOSURE.txt
      - name: Compile semantic complex circuit, normalization and Jensen composite
        shell: bash
        run: |
          set -euo pipefail
          for M in QuantumCircuitPaths QuantumPathDegree QuantumCircuitNormalization QuantumCircuitSimulation QuantumMixtureSimulation; do
            cp "research/nightfall/formalization/product_space/$M.lean" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean" 2>&1 | tee "$GITHUB_WORKSPACE/quantum-mixture-$M-compile.log")
            ! grep -E 'sorryAx|declaration uses .sorry|error:' "quantum-mixture-$M-compile.log"
          done
      - name: Strict kernel and named-declaration axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/quantum-mixture
          python3 scripts/lean_bridge.py research/nightfall/formalization/product_space/QuantumMixtureSimulation.lean \
            --workspace /tmp/mathlib4 --strict --timeout 1800 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl "Nightfall.QuantumCircuitNormalization.execute_energy_one" \
            --decl "Nightfall.QuantumCircuitNormalization.probability_in_unit_interval" \
            --decl "Nightfall.ProductSpace.QuantumCircuitSimulation.acceptance_degree" \
            --decl "Nightfall.ProductSpace.Mixture.mixture_simulation_jensen" \
            --decl "Nightfall.ProductSpace.QuantumMixtureSimulation.unitary_circuit_mixture_simulation_jensen" \
            --decl "Nightfall.ProductSpace.QuantumMixtureSimulation.unitary_circuit_mixture_delta" \
            --json-out lean-receipts/quantum-mixture/receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/quantum-mixture/receipt.json
          cat > /tmp/mathlib4/QuantumMixtureAudit.lean <<'LEAN'
          import QuantumMixtureSimulation
          #check @Nightfall.ProductSpace.QuantumMixtureSimulation.unitary_circuit_mixture_simulation_jensen
          #check @Nightfall.ProductSpace.QuantumMixtureSimulation.unitary_circuit_mixture_delta
          #print axioms Nightfall.ProductSpace.QuantumMixtureSimulation.unitary_circuit_mixture_simulation_jensen
          #print axioms Nightfall.ProductSpace.QuantumMixtureSimulation.unitary_circuit_mixture_delta
          LEAN
          (cd /tmp/mathlib4 && lake env lean QuantumMixtureAudit.lean) | tee lean-receipts/quantum-mixture/axioms.txt
          ! grep -E 'sorryAx|native_decide|unknown constant|error:' lean-receipts/quantum-mixture/axioms.txt
      - name: Preserve exact source identity and full verification logs
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/quantum-mixture
          git rev-parse HEAD > lean-receipts/quantum-mixture/ci-checkout-head.txt
          sha256sum research/nightfall/formalization/product_space/Quantum{CircuitPaths,PathDegree,CircuitNormalization,CircuitSimulation,MixtureSimulation}.lean \
            research/nightfall/formalization/product_space/MixtureSimulation.lean \
            research/nightfall/formalization/aa_product/CLOSURE.txt > lean-receipts/quantum-mixture/source-sha256.txt
          cp quantum-mixture-*compile.log lean-receipts/quantum-mixture/ 2>/dev/null || true
          cp /tmp/nightfall-lean-version.txt lean-receipts/quantum-mixture/lean-version.txt 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nightfall-quantum-mixture-${{ github.run_id }}
          path: lean-receipts/quantum-mixture
          if-no-files-found: warn
