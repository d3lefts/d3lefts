name: NIGHTFALL actual squared posterior influences — Lean 4.33.0
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/RealSquaredPosteriorOneStep.lean'
      - '.github/workflows/nightfall-real-squared-posterior.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-posterior:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build pinned Turturean source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/physical-superintelligence/aaronson-ambainis.git /tmp/aa
          git -C /tmp/aa checkout 2a6ceaef872ae993708950f951989134084b851a
          (cd /tmp/aa && lake exe cache get && lake build AaronsonAmbainis.DetTheorem AaronsonAmbainis.TwoSided.Antipodal AaronsonAmbainis.Bridge.Positivity)
      - name: Compile existing concrete Bayesian proof dependencies in original order
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aa/.lake/build/lib/lean
          for module in ProductSpaceTwoSidedBridge CertificateObservationBridge NonconstantSamplerBridge CertificateCostBridge VariancePosteriorOneStep; do
            cp "research/nightfall/formalization/product_space/${module}.lean" "/tmp/aa/${module}.lean"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean")
          done
      - name: Kernel-check actual scalar and finite-rank Hilbert squared posterior decrements
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.ProductSpace.RealPosterior
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/RealSquaredPosteriorOneStep.lean \
            --workspace /tmp/aa --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.scalar_actual_posterior_total_mean \
            --decl $N.vector_actual_posterior_total_mean \
            --json-out lean-receipts/real-posterior.json || {
              cat lean-receipts/real-posterior.json || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/real-posterior.json
      - name: Preserve source provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/product_space/{RealSquaredPosteriorOneStep,VariancePosteriorOneStep,ProductSpaceTwoSidedBridge}.lean > lean-receipts/SHA256SUMS
          git -C /tmp/aa rev-parse HEAD > lean-receipts/turturean-pinned-commit.txt 2>/dev/null || true
          echo leanprover/lean4:v4.33.0 > lean-receipts/toolchain.txt
          git rev-parse HEAD > lean-receipts/nightfall-commit.txt
      - name: Upload kernel receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-actual-real-posterior-lean
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 45
