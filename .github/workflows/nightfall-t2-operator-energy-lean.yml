name: NIGHTFALL T2 complex noncommuting operator energy (kernel)

on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/structural_information/T2OperatorEnergy.lean'
      - 'research/nightfall/formalization/structural_information/T2HilbertCrossed.lean'
      - 'research/nightfall/formalization/structural_information/T2HilbertEffect.lean'
      - 'research/nightfall/formalization/structural_information/T2HeavyQuery.lean'
      - 'research/nightfall/formalization/structural_information/T2LightFrame.lean'
      - 'research/nightfall/formalization/structural_information/T2EffectOrder.lean'
      - 'research/nightfall/formalization/structural_information/T2CorrectionSix.lean'
      - 'research/nightfall/formalization/structural_information/T2CorrectionEventBridge.lean'
      - 'research/nightfall/formalization/structural_information/T2FrameEnergy.lean'
      - 'research/nightfall/formalization/structural_information/T2SecondStageLight.lean'
      - 'research/nightfall/formalization/structural_information/T2FirstStageLight.lean'
      - 'research/nightfall/formalization/structural_information/T2PathEnergy.lean'
      - 'research/nightfall/formalization/structural_information/T2WalshTranscript.lean'
      - 'research/nightfall/formalization/structural_information/T2ActualSource.lean'
      - 'research/nightfall/formalization/structural_information/T2OutsideSpanLight.lean'
      - 'research/nightfall/formalization/structural_information/T2QuantumPhaseExpansion.lean'
      - 'research/nightfall/formalization/structural_information/T2PhysicalSectors.lean'
      - 'research/nightfall/formalization/structural_information/T2ZeroTripleOverlap31.lean'
      - 'research/nightfall/formalization/structural_information/T2ZeroTripleMultiplicity.lean'
      - '.github/workflows/nightfall-t2-operator-energy-lean.yml'
      - 'research/nightfall/structural_information/TWO_QUERY_COMPLEX_RANKFREE_COMPLETE_PROOF_20261122.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t2-operator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-exact-operator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Pin paper source, compile operator, replay kernel, verify axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t2-operator-receipt
          src=research/nightfall/formalization/structural_information/T2OperatorEnergy.lean
          more=research/nightfall/formalization/structural_information/T2HilbertCrossed.lean
          effect=research/nightfall/formalization/structural_information/T2HilbertEffect.lean
          heavy=research/nightfall/formalization/structural_information/T2HeavyQuery.lean
          light=research/nightfall/formalization/structural_information/T2LightFrame.lean
          order=research/nightfall/formalization/structural_information/T2EffectOrder.lean
          six=research/nightfall/formalization/structural_information/T2CorrectionSix.lean
          bridge=research/nightfall/formalization/structural_information/T2CorrectionEventBridge.lean
          frame=research/nightfall/formalization/structural_information/T2FrameEnergy.lean
          stage2=research/nightfall/formalization/structural_information/T2SecondStageLight.lean
          stage1=research/nightfall/formalization/structural_information/T2FirstStageLight.lean
          pathenergy=research/nightfall/formalization/structural_information/T2PathEnergy.lean
          walsh=research/nightfall/formalization/structural_information/T2WalshTranscript.lean
          actual=research/nightfall/formalization/structural_information/T2ActualSource.lean
          outside=research/nightfall/formalization/structural_information/T2OutsideSpanLight.lean
          phase=research/nightfall/formalization/structural_information/T2QuantumPhaseExpansion.lean
          physical=research/nightfall/formalization/structural_information/T2PhysicalSectors.lean
          overlap=research/nightfall/formalization/structural_information/T2ZeroTripleOverlap31.lean
          multi=research/nightfall/formalization/structural_information/T2ZeroTripleMultiplicity.lean
          paper=research/nightfall/structural_information/TWO_QUERY_COMPLEX_RANKFREE_COMPLETE_PROOF_20261122.md
          test "$(git hash-object "$paper")" = "42e5b34955304fe6b454160a6abbd2df73777438"
          git rev-parse HEAD | tee t2-operator-receipt/commit.txt
          sha256sum "$src" "$more" "$effect" "$heavy" "$light" "$order" "$six" "$bridge" "$frame" "$stage2" "$stage1" "$pathenergy" "$walsh" "$actual" "$outside" "$phase" "$physical" "$overlap" "$multi" "$paper" | tee t2-operator-receipt/SHA256SUMS
          cp "$src" /tmp/mathlib4/T2OperatorEnergy.lean
          cp "$more" /tmp/mathlib4/T2HilbertCrossed.lean
          cp "$effect" /tmp/mathlib4/T2HilbertEffect.lean
          cp "$heavy" /tmp/mathlib4/T2HeavyQuery.lean
          cp "$light" /tmp/mathlib4/T2LightFrame.lean
          cp "$order" /tmp/mathlib4/T2EffectOrder.lean
          cp "$six" /tmp/mathlib4/T2CorrectionSix.lean
          cp "$bridge" /tmp/mathlib4/T2CorrectionEventBridge.lean
          cp "$frame" /tmp/mathlib4/T2FrameEnergy.lean
          cp "$stage2" /tmp/mathlib4/T2SecondStageLight.lean
          cp "$stage1" /tmp/mathlib4/T2FirstStageLight.lean
          cp "$pathenergy" /tmp/mathlib4/T2PathEnergy.lean
          cp "$walsh" /tmp/mathlib4/T2WalshTranscript.lean
          cp "$actual" /tmp/mathlib4/T2ActualSource.lean
          cp "$outside" /tmp/mathlib4/T2OutsideSpanLight.lean
          cp "$phase" /tmp/mathlib4/T2QuantumPhaseExpansion.lean
          cp "$physical" /tmp/mathlib4/T2PhysicalSectors.lean
          cp "$overlap" /tmp/mathlib4/T2ZeroTripleOverlap31.lean
          cp "$multi" /tmp/mathlib4/T2ZeroTripleMultiplicity.lean
          status=0
          for mod in T2ZeroTripleOverlap31 T2ZeroTripleMultiplicity T2OperatorEnergy T2HilbertCrossed T2HilbertEffect T2HeavyQuery T2LightFrame T2EffectOrder T2CorrectionSix T2CorrectionEventBridge T2FrameEnergy T2SecondStageLight T2FirstStageLight T2PathEnergy T2WalshTranscript T2ActualSource T2OutsideSpanLight T2QuantumPhaseExpansion T2PhysicalSectors; do
            echo "=== COMPILE $mod ===" | tee -a t2-operator-receipt/compile.log
            if (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$mod.olean" "$mod.lean") 2>&1 | tee -a t2-operator-receipt/compile.log; then
              if ! (cd /tmp/mathlib4 && lake env leanchecker "$mod") 2>&1 | tee -a t2-operator-receipt/kernel.log; then
                echo "KERNEL_FAILED:$mod" | tee -a t2-operator-receipt/kernel.log
                status=1
              fi
            else
              echo "COMPILATION_FAILED:$mod" | tee -a t2-operator-receipt/compile.log
              status=1
            fi
          done
          test "$status" -eq 0
          python3 - <<'PY'
          from pathlib import Path
          import re
          sources=[
              Path('research/nightfall/formalization/structural_information/T2OperatorEnergy.lean'),
              Path('research/nightfall/formalization/structural_information/T2HilbertCrossed.lean'),
              Path('research/nightfall/formalization/structural_information/T2HilbertEffect.lean'),
              Path('research/nightfall/formalization/structural_information/T2HeavyQuery.lean'),
              Path('research/nightfall/formalization/structural_information/T2LightFrame.lean'),
              Path('research/nightfall/formalization/structural_information/T2EffectOrder.lean'),
              Path('research/nightfall/formalization/structural_information/T2CorrectionSix.lean'),
              Path('research/nightfall/formalization/structural_information/T2CorrectionEventBridge.lean'),
              Path('research/nightfall/formalization/structural_information/T2FrameEnergy.lean'),
              Path('research/nightfall/formalization/structural_information/T2SecondStageLight.lean'),
              Path('research/nightfall/formalization/structural_information/T2FirstStageLight.lean'),
              Path('research/nightfall/formalization/structural_information/T2PathEnergy.lean'),
              Path('research/nightfall/formalization/structural_information/T2WalshTranscript.lean'),
              Path('research/nightfall/formalization/structural_information/T2ActualSource.lean'),
              Path('research/nightfall/formalization/structural_information/T2OutsideSpanLight.lean'),
              Path('research/nightfall/formalization/structural_information/T2QuantumPhaseExpansion.lean'),
              Path('research/nightfall/formalization/structural_information/T2PhysicalSectors.lean'),
              Path('research/nightfall/formalization/structural_information/T2ZeroTripleOverlap31.lean'),
              Path('research/nightfall/formalization/structural_information/T2ZeroTripleMultiplicity.lean'),
          ]
          log=Path('t2-operator-receipt/compile.log').read_text()
          for p in sources:
              src=p.read_text()
              assert not re.search(r'(?m)^\s*(sorry|admit|axiom|opaque)\b',src),p
          assert 'error:' not in log and 'sorryAx' not in log
          prefix='Nightfall.StructuralInformation.'
          scalar=['selected_output_energy_le','crossed_energy_le',
                  'weighted_path_sum','crossed_synthesis',
                  'noncommuting_crossed_slot_bound']
          hilbert=['energy_nonneg','single_sector_energy_le',
                   'selected_sector_contraction','crossed_energy_le',
                   'weighted_path_sum','crossed_synthesis',
                   'noncommuting_crossed_slot_bound']
          expected=[prefix+'T2OperatorEnergy.'+x for x in scalar]
          expected += [prefix+'T2HilbertCrossed.'+x for x in hilbert]
          effect=['norm_sq_eq_energy','contractive_operator_energy',
                  'selected_sector_energy','crossed_operator_energy']
          expected += [prefix+'T2HilbertEffect.'+x for x in effect]
          heavy=['heavy_query_mass_budget','heavy_query_card_real',
                 'finite_markov_actual_legal_queries']
          expected += [prefix+'T2HeavyQuery.'+x for x in heavy]
          expected += [prefix+'T2LightFrame.orthonormal_light_frame_energy']
          expected += [prefix+'T2EffectOrder.effect_norm_le_one']
          expected += [prefix+'T2CorrectionSix.'+x for x in
            ['correction_fiber_subset_six_images','correction_fiber_card_le_six_pair_fiber',
             'correction_fiber_card_le_six_M']]
          expected += [prefix+'T2CorrectionEventBridge.'+x for x in
            ['drop_two_equal_labels','two_zero_triple_events_in_six_cover',
             'event_correction_subset_six_cover','event_correction_card_le_six_pair_fiber',
             'event_correction_card_le_six_M']]
          expected += [prefix+'T2FrameEnergy.'+x for x in
            ['restricted_double_frame_energy','restricted_double_frame_energy_of_opNorm']]
          expected += [prefix+'T2SecondStageLight.'+x for x in
            ['path_inner','norm_inner_sq_le','block_frame_energy','second_light_path_frame']]
          expected += [prefix+'T2FirstStageLight.'+x for x in
            ['block_norm_sq','inner_block_right','first_light_path_frame','first_light_after_unitary']]
          expected += [prefix+'T2PathEnergy.'+x for x in
            ['fullPath_norm_sq','fullPath_mass_le','first_frame_pair',
             'second_frame_pair','first_light_four_slot_energy',
             'second_light_four_slot_energy']]
          expected += [prefix+'T2WalshTranscript.'+x for x in
            ['character_agree_on_generated_span','character_agree_of_transcript',
             'walsh_polynomial_depends_only_on_original_labels',
             'four_frequency_in_generated_span',
             'four_slot_polynomial_depends_only_on_original_queries']]
          expected += [prefix+'T2ActualSource.'+x for x in
            ['psi_sector_inner','source_input_light_frame',
             'source_path_unitary_inner','first_light_after_unitary_actual_source',
             'source_path_mass_eq','actual_first_light_four_slot_energy',
             'actual_second_light_four_slot_energy']]
          expected += [prefix+'T2OutsideSpanLight.'+x for x in
            ['outside_span_has_outside_slot','outside_span_original_label_is_light',
             'outside_heavy_four_frequency_has_legal_light_slot']]
          expected += [prefix+'T2QuantumPhaseExpansion.'+x for x in
            ['psi_eq_sum_sectors','phaseOracle_eq_sum_original_sector_paths',
             'unitary_after_first_oracle','twoQueryState_coordinate_eq_path_sum',
             'twoQueryState_eq_original_path_sum','four_phases_eq_one_walsh_frequency']]
          expected += [prefix+'T2PhysicalSectors.'+x for x in
            ['norm_sq_eq_sum_physical_sectors','inner_eq_sum_physical_sectors',
             'transportedUnitary_norm_eq']]
          expected += [prefix+'T2ZeroTripleOverlap.'+x for x in
            ['survivor_is_total','two_zero_triple_survivors_equal',
             'three_survivors_force_fourth_zero','pair_energy_coefficient_le_31']]
          expected += [prefix+'T2ZeroTripleMultiplicity.'+x for x in
            ['survivorCount_eq_correctedCount','complex_weighted_survivor_identity',
             'complementary_triple_zero_iff_total',
             'e0_iff_survivor_total','e1_iff_survivor_total',
             'e2_iff_survivor_total','e3_iff_survivor_total',
             'four_event_incidence','four_zero_triple_exclusions',
             'zero_triple_event_multiplicity']]
          reports=dict(re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",log))
          axiom_free=set(re.findall(r"'([^']+)' does not depend on any axioms",log))
          allowed={'propext','Classical.choice','Quot.sound'}
          for full in expected:
              assert full in reports or full in axiom_free,(full,log[-7000:])
              if full in reports:
                  deps={x.strip() for x in reports[full].split(',') if x.strip()}
                  assert deps<=allowed,(full,deps)
          print('T2_OPERATOR_ENERGY_SOURCE_EXACT_KERNEL_PASS')
          PY
      - name: Artifact of exact compiler/kernel/axiom source receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: t2-complex-operator-receipt
          path: t2-operator-receipt
          retention-days: 90
