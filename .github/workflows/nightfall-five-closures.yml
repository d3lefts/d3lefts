name: NIGHTFALL Five Primes — independent finite falsification
on:
  pull_request:
    paths:
      - 'research/nightfall/2026-11-five-closures/**'
      - '.github/workflows/nightfall-five-closures.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact finite audit (does not establish universal theorem)
        run: python3 -I research/nightfall/2026-11-five-closures/checks/independent_five_audit.py
      - name: Exact fixed-budget transition and independent conditional tables
        run: python3 -I research/nightfall/2026-11-five-closures/checks/check_exact_budget_phase.py
      - name: General-degree LP primal-dual and homogeneous equality
        run: python3 -I research/nightfall/2026-11-five-closures/checks/check_fractional_lp_general.py
      - name: Exact global nonadaptive fixed-budget allocation
        run: python3 -I research/nightfall/2026-11-five-closures/checks/check_global_fixed_allocation.py
