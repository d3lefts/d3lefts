name: CGSHOP 2027 - 250-instance verification campaign

on:
  push:
    branches:
      - research/cgshop-2027-250-coverage
    paths:
      - "research/cgshop2027/**"
      - ".github/workflows/cgshop-2027-250.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cgshop-250-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construct-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official verifier
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cgshop2027-pyutils>=0.2.0,<1"
          python -c "from cgshop2027_pyutils.verify import SolutionValidator; print('Official verifier available')"
      - name: Fetch challenge dataset v0
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 --retry-delay 5 --max-time 300 \
            "https://cgshop.ibr.cs.tu-bs.de/content_management/media/cgshop_2027_challenge_instances" \
            --output cgshop2027_challenge_v0.zip
          unzip -tq cgshop2027_challenge_v0.zip
          sha256sum cgshop2027_challenge_v0.zip | tee challenge_sha256.txt
      - name: Archive official benchmark for offline independent analysis
        uses: actions/upload-artifact@v4
        with:
          name: cgshop2027-official-250-input
          path: cgshop2027_challenge_v0.zip
          if-no-files-found: error
          retention-days: 7
      - name: Solve and officially verify all 250 instances
        shell: bash
        run: |
          set -euxo pipefail
          python research/cgshop2027/solve250.py \
            --instances cgshop2027_challenge_v0.zip \
            --expected 250 \
            --output cgshop2027_250_solutions.zip \
            --manifest cgshop2027_250_manifest.json | tee run.log
          sha256sum cgshop2027_250_solutions.zip cgshop2027_250_manifest.json | tee output_sha256.txt
      - name: Upload verification and solutions
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-cgshop-2027-250-verified
          path: |
            cgshop2027_250_solutions.zip
            cgshop2027_250_manifest.json
            challenge_sha256.txt
            output_sha256.txt
            run.log
          if-no-files-found: error
          retention-days: 30
