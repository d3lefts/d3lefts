name: NIGHTFALL Q2 pointwise third difference to source ESDegreeLE Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2FiniteDegreeBridge.lean'
      - '.github/workflows/nightfall-infinitepi-q2-finite-degree-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-third-difference-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  source-finite-degree-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned Lean and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Build original-source canonical degree dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.nightfall_q2_certify import local_sources, closure
          from pathlib import Path
          import shutil,subprocess
          files=local_sources()
          ws=Path("/tmp/mathlib4")
          out=ws/".lake/build/lib/lean"
          out.mkdir(parents=True,exist_ok=True)
          for name in closure("ActualSourceANOVA",files):
              print("BUILD SOURCE",name,flush=True)
              shutil.copyfile(files[name],ws/(name+".lean"))
              subprocess.run(["lake","env","lean","-o",str(out/(name+".olean")),name+".lean"],cwd=ws,check=True,timeout=1200)
          for name in ["InfinitePiQ2DegreeRetraction","InfinitePiQ2FiniteDegreeBridge"]:
              src=Path("research/nightfall/formalization/universal")/(name+".lean")
              shutil.copyfile(src,ws/(name+".lean"))
              print("BUILD BRIDGE",name,flush=True)
              subprocess.run(["lake","env","lean","-o",str(out/(name+".olean")),name+".lean"],cwd=ws,check=True,timeout=1200)
          PY
      - name: Strict named theorem and standard-axiom check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-infinite
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2FiniteDegreeBridge.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2FiniteDegreeBridge.esComp_sub \
            --decl Nightfall.InfinitePiQ2FiniteDegreeBridge.esComp_anchorDifference \
            --decl Nightfall.InfinitePiQ2FiniteDegreeBridge.anchor_triple_eq_delta \
            --decl Nightfall.InfinitePiQ2FiniteDegreeBridge.anchor_triple_zero \
            --decl Nightfall.InfinitePiQ2FiniteDegreeBridge.pointwiseDegreeTwo_implies_ESDegreeLE \
            --json-out lean-receipts/q2-infinite/finite-degree-bridge.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-infinite/finite-degree-bridge.json
      - name: Exact source provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-infinite
          git rev-parse HEAD > lean-receipts/q2-infinite/finite-degree-head.txt
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2FiniteDegreeBridge.lean > lean-receipts/q2-infinite/finite-degree-sha256.txt
      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-source-finite-degree-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-infinite
          if-no-files-found: warn
