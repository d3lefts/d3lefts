name: NIGHTFALL Q2 heterogeneous finite labels to common source alphabet Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2HeterogeneousAlphabet.lean'
      - '.github/workflows/nightfall-q2-heterogeneous-common-alphabet.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-heterogeneous-alphabet-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  original-heterogeneous-source-alphabet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned Lean and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile pointwise degree retraction and common alphabet embedding
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2DegreeRetraction InfinitePiQ2HeterogeneousAlphabet; do
            cp "research/nightfall/formalization/universal/${name}.lean" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Strict named theorem and standard axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-infinite
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2HeterogeneousAlphabet.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2HeterogeneousAlphabet.decode_embed \
            --decl Nightfall.InfinitePiQ2HeterogeneousAlphabet.taggedMass_embed \
            --decl Nightfall.InfinitePiQ2HeterogeneousAlphabet.taggedMass_wrong_tag \
            --decl Nightfall.InfinitePiQ2HeterogeneousAlphabet.taggedMass_nonneg \
            --decl Nightfall.InfinitePiQ2HeterogeneousAlphabet.taggedMass_normalized \
            --decl Nightfall.InfinitePiQ2HeterogeneousAlphabet.decode_embed_word \
            --decl Nightfall.InfinitePiQ2HeterogeneousAlphabet.degree_two_under_common_alphabet \
            --decl Nightfall.InfinitePiQ2HeterogeneousAlphabet.bound_under_common_alphabet \
            --json-out lean-receipts/q2-infinite/heterogeneous-common-alphabet.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-infinite/heterogeneous-common-alphabet.json
      - name: Exact source provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-infinite
          git rev-parse HEAD > lean-receipts/q2-infinite/heterogeneous-head.txt
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2HeterogeneousAlphabet.lean > lean-receipts/q2-infinite/heterogeneous-sha256.txt
      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-heterogeneous-alphabet-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-infinite
          if-no-files-found: warn
