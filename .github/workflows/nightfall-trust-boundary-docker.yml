name: NIGHTFALL Docker separate-origin synthetic controls
on:
  push:
    paths:
      - 'research/nightfall/evaluations/assurance/trust-boundary/docker_boundary.py'
      - 'research/nightfall/evaluations/assurance/trust-boundary/DOCKER_PREREG.md'
      - '.github/workflows/nightfall-trust-boundary-docker.yml'
  pull_request:
    paths:
      - 'research/nightfall/evaluations/assurance/trust-boundary/docker_boundary.py'
      - 'research/nightfall/evaluations/assurance/trust-boundary/DOCKER_PREREG.md'
      - '.github/workflows/nightfall-trust-boundary-docker.yml'
  workflow_dispatch:
jobs:
  docker-separate-origin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.10','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare Docker image
        run: docker pull python:3.13-slim && docker image inspect python:3.13-slim --format '{{.Id}}'
      - name: Execute preregistered four-case proof attack
        run: python research/nightfall/evaluations/assurance/trust-boundary/docker_boundary.py --receipt docker_boundary_receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trust-boundary-docker-${{ matrix.python-version }}
          path: docker_boundary_receipt.json
          if-no-files-found: warn