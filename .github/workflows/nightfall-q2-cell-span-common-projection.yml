name: NIGHTFALL Q2 source cell finite sum common label L2 projection Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2CellSpanProjection.lean'
      - '.github/workflows/nightfall-q2-cell-span-common-projection.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-cell-span-projection-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  actual-source-finite-cell-span:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout original source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned Lean and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile transitive original source label dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.nightfall_q2_certify import local_sources, closure, sha256
          from pathlib import Path
          import shutil, subprocess, json
          files=local_sources()
          ws=Path("/tmp/mathlib4")
          out=ws/".lake/build/lib/lean"
          out.mkdir(parents=True,exist_ok=True)
          manifest=[]
          for name in closure("InfinitePiQ2CellSpanProjection", files):
              src=files[name]
              dst=ws/(name+".lean")
              shutil.copyfile(src,dst)
              assert sha256(src)==sha256(dst)
              print("SOURCE",name,flush=True)
              subprocess.run(["lake","env","lean","-o",str(out/(name+".olean")),name+".lean"],cwd=ws,check=True,timeout=1200)
              manifest.append({"source":str(src),"sha256":sha256(src)})
          Path("lean-receipts/q2-cell-span").mkdir(parents=True,exist_ok=True)
          Path("lean-receipts/q2-cell-span/dependencies.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
      - name: Strict source theorem and standard axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2CellSpanProjection.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2CellSpanProjection.sourceFiniteCellSum_fixed_by_one_finite_label \
            --json-out lean-receipts/q2-cell-span/strict.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-cell-span/strict.json
      - name: Immutable source provenance
        if: always()
        run: |
          mkdir -p lean-receipts/q2-cell-span
          git rev-parse HEAD > lean-receipts/q2-cell-span/HEAD
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2CellSpanProjection.lean > lean-receipts/q2-cell-span/SHA256
        shell: bash
      - name: Upload exact proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-cell-span-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-cell-span
          if-no-files-found: warn
