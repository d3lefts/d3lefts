name: NIGHTFALL T2 zero-triple 31 scoped Lean kernel

on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/structural_information/T2ZeroTripleOverlap31.lean'
      - 'research/nightfall/formalization/structural_information/T2ZeroTripleMultiplicity.lean'
      - 'research/nightfall/structural_information/T2_ZERO_TRIPLE_OVERLAP_31_20261122.md'
      - 'scripts/check_t2_zero_triple_overlap_31_exact.py'
      - '.github/workflows/nightfall-t2-zero-triple-31-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-exact-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Freeze exact author-side paper source (no semantic promotion)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/nightfall/structural_information/TWO_QUERY_COMPLEX_RANKFREE_COMPLETE_PROOF_20261122.md)" = "42e5b34955304fe6b454160a6abbd2df73777438"
          test "$(git hash-object research/nightfall/structural_information/T2_ZERO_TRIPLE_OVERLAP_31_20261122.md)" = "4aeb33e6031e7221a1b5f489528debfcab1dbca0"
      - name: Pin source and run Lean/leanchecker with axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t2-overlap-31-receipt
          src=research/nightfall/formalization/structural_information/T2ZeroTripleOverlap31.lean
          aux=research/nightfall/formalization/structural_information/T2ZeroTripleMultiplicity.lean
          cp "$src" /tmp/mathlib4/T2ZeroTripleOverlap31.lean
          cp "$aux" /tmp/mathlib4/T2ZeroTripleMultiplicity.lean
          git rev-parse HEAD | tee t2-overlap-31-receipt/commit.txt
          sha256sum "$src" "$aux" research/nightfall/structural_information/TWO_QUERY_COMPLEX_RANKFREE_COMPLETE_PROOF_20261122.md research/nightfall/structural_information/T2_ZERO_TRIPLE_OVERLAP_31_20261122.md scripts/check_t2_zero_triple_overlap_31_exact.py | tee t2-overlap-31-receipt/SHA256SUMS
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/T2ZeroTripleOverlap31.olean T2ZeroTripleOverlap31.lean) 2>&1 | tee t2-overlap-31-receipt/lean.log
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/T2ZeroTripleMultiplicity.olean T2ZeroTripleMultiplicity.lean) 2>&1 | tee -a t2-overlap-31-receipt/lean.log
          (cd /tmp/mathlib4 && lake env leanchecker T2ZeroTripleOverlap31 && lake env leanchecker T2ZeroTripleMultiplicity) 2>&1 | tee t2-overlap-31-receipt/kernel.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          paths=[
            Path('research/nightfall/formalization/structural_information/T2ZeroTripleOverlap31.lean'),
            Path('research/nightfall/formalization/structural_information/T2ZeroTripleMultiplicity.lean'),
          ]
          log=Path('t2-overlap-31-receipt/lean.log').read_text()
          for p in paths:
              s=p.read_text()
              assert not re.search(r'(?m)^\s*(sorry|admit|axiom)\b',s), p
          assert 'error:' not in log and 'sorryAx' not in log
          expected=[
            'Nightfall.StructuralInformation.T2ZeroTripleOverlap.survivor_is_total',
            'Nightfall.StructuralInformation.T2ZeroTripleOverlap.two_zero_triple_survivors_equal',
            'Nightfall.StructuralInformation.T2ZeroTripleOverlap.three_survivors_force_fourth_zero',
            'Nightfall.StructuralInformation.T2ZeroTripleOverlap.pair_energy_coefficient_le_31',
            'Nightfall.StructuralInformation.T2ZeroTripleMultiplicity.four_event_incidence',
            'Nightfall.StructuralInformation.T2ZeroTripleMultiplicity.four_zero_triple_exclusions',
            'Nightfall.StructuralInformation.T2ZeroTripleMultiplicity.zero_triple_event_multiplicity',
            'Nightfall.StructuralInformation.T2ZeroTripleMultiplicity.survivorCount_eq_correctedCount',
            'Nightfall.StructuralInformation.T2ZeroTripleMultiplicity.complex_weighted_survivor_identity',
          ]
          allowed={'propext','Classical.choice','Quot.sound'}
          reports=dict(re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",log))
          axiom_free=set(re.findall(r"'([^']+)' does not depend on any axioms",log))
          for name in expected:
              assert name in reports or name in axiom_free,(name,log[-3000:])
              if name in reports:
                  deps={x.strip() for x in reports[name].split(',') if x.strip()}
                  assert deps<=allowed,(name,deps)
          print('T2_ZERO_TRIPLE_MULTIPLICITY_SCOPED_KERNEL_PASS')
          PY
      - name: Exact tuple multiplicity regression
        run: |
          set -euo pipefail
          python3 scripts/check_t2_zero_triple_overlap_31_exact.py | tee t2-overlap-31-receipt/exact.log
          grep -q 'PASS exact all-groups paper coefficient' t2-overlap-31-receipt/exact.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: t2-overlap-31-receipt
          path: t2-overlap-31-receipt/
          retention-days: 90
