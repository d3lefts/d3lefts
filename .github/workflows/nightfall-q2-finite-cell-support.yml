name: NIGHTFALL Q2 finite-cell exact coordinate support Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2FiniteCellSupport.lean'
      - '.github/workflows/nightfall-q2-finite-cell-support.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-finite-cell-support-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  source-cell-support:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned Lean and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile existing source density, cell density and new finite-support bridge
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2Density InfinitePiQ2FiniteCellDensity InfinitePiQ2FiniteCellSupport; do
            cp "research/nightfall/formalization/universal/${name}.lean" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Strict named declarations and standard axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-infinite
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2FiniteCellSupport.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2FiniteCellSupport.sourceFiniteCellAlgebra_subset_measurableCylinders \
            --decl Nightfall.InfinitePiQ2FiniteCellSupport.sourceFiniteCellAlgebra_exists_finite_support \
            --json-out lean-receipts/q2-infinite/finite-cell-support.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-infinite/finite-cell-support.json
      - name: Exact source provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-infinite
          git rev-parse HEAD > lean-receipts/q2-infinite/finite-cell-support-head.txt
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2FiniteCellSupport.lean > lean-receipts/q2-infinite/finite-cell-support-sha256.txt
      - name: Upload source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-finite-cell-support-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-infinite
          if-no-files-found: warn
