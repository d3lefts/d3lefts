name: NIGHTFALL nonconstant product sampler — pinned Lean 4.33.0
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/NonconstantSamplerBridge.lean'
      - '.github/workflows/nightfall-nonconstant-sampler.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nonconstant-sampler:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.33.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build Turturean's exact pinned antipodal theorem
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/physical-superintelligence/aaronson-ambainis.git /tmp/aa
          git -C /tmp/aa checkout 2a6ceaef872ae993708950f951989134084b851a
          (cd /tmp/aa && lake exe cache get && lake build AaronsonAmbainis.DetTheorem AaronsonAmbainis.TwoSided.Antipodal AaronsonAmbainis.Bridge.Positivity)
      - name: Compile prerequisite finite product and concrete sampler modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aa/.lake/build/lib/lean
          for module in ProductSpaceTwoSidedBridge CertificateObservationBridge; do
            cp "research/nightfall/formalization/product_space/${module}.lean" "/tmp/aa/${module}.lean"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/${module}.olean" "${module}.lean")
          done
      - name: Kernel-check elimination of row and mass positivity assumptions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/NonconstantSamplerBridge.lean \
            --workspace /tmp/aa --timeout 900 \
            --decl Nightfall.ProductSpace.Observation.positive_class_value_pos \
            --decl Nightfall.ProductSpace.Observation.negative_class_value_pos \
            --decl Nightfall.ProductSpace.Observation.nonconstant_sampler_premises \
            --decl Nightfall.ProductSpace.Observation.nonconstant_finite_product_sampler \
            --json-out lean-receipts/nonconstant-sampler.json || {
              cat lean-receipts/nonconstant-sampler.json || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/nonconstant-sampler.json
      - name: Preserve source and dependency hashes
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/product_space/NonconstantSamplerBridge.lean research/nightfall/formalization/product_space/CertificateObservationBridge.lean research/nightfall/formalization/product_space/ProductSpaceTwoSidedBridge.lean > lean-receipts/SHA256SUMS.txt
          echo 2a6ceaef872ae993708950f951989134084b851a > lean-receipts/turturean-upstream.txt
          echo leanprover/lean4:v4.33.0 > lean-receipts/toolchain.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonconstant-sampler-lean-receipt
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 30
