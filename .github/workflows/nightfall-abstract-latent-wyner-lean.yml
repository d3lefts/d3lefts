name: NIGHTFALL arbitrary-latent Wyner pushforward pinned Lean
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/Route1PolylogTools.lean'
      - 'research/nightfall/formalization/product_space/Route1Entropy.lean'
      - 'research/nightfall/formalization/product_space/Route1KeyLemma.lean'
      - 'research/nightfall/formalization/product_space/Route1Lift.lean'
      - 'research/nightfall/formalization/product_space/Route1PolylogSimulation.lean'
      - 'research/nightfall/formalization/product_space/Route1WynerSimulation.lean'
      - 'research/nightfall/formalization/product_space/Route1AbstractLatentPushforward.lean'
      - '.github/workflows/nightfall-abstract-latent-wyner-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  abstract-latent-wyner:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile pinned AA and mixture closure in dependency order
        shell: bash
        run: |
          set -euo pipefail
          while read -r M P; do
            [ -z "$M" ] && continue
            REL="$(printf '%s' "$M" | tr '.' '/')"
            mkdir -p "/tmp/mathlib4/$(dirname "$REL")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$REL")"
            cp "$P" "/tmp/mathlib4/$REL.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$REL.olean" "$REL.lean" 2>&1 | tee "/tmp/log-$M.txt")
            ! grep -q 'declaration uses .sorry' "/tmp/log-$M.txt"
          done < research/nightfall/formalization/aa_product/CLOSURE.txt
      - name: Compile Route 1 chain (merged star coupling and latent degree, then polylog modules)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/abstract-latent-wyner
          for M in Route1LatentDegree Route1DegreeSourceBridge Route1FiniteMaxCoupling Route1FiniteJointMass \
                   Route1MaximalConditionalKernel Route1StarCoupling Route1StarMaximalBridge \
                   Route1PolylogTools Route1Entropy Route1KeyLemma Route1Lift Route1PolylogSimulation Route1WynerSimulation Route1WynerGeneral Route1AbstractLatentPushforward; do
            cp "research/nightfall/formalization/product_space/$M.lean" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean") 2>&1 \
              | tee "receipts/abstract-latent-wyner/$M.log"
            ! grep -E '(^|:)error:|declaration uses .sorry' "receipts/abstract-latent-wyner/$M.log"
          done
      - name: Independent kernel replay and strict axiom audit
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/mathlib4/.lake/build/lib/lean/Route1AbstractLatentPushforward.olean
          (cd /tmp/mathlib4 && lake env leanchecker Route1AbstractLatentPushforward) 2>&1 | tee receipts/abstract-latent-wyner/checker.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          d=Path('receipts/abstract-latent-wyner')
          s=''.join(p.read_text() for p in sorted(d.glob('Route1*.log')))
          reports=re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",s,re.S)
          names={n for n,_ in reports}
          for need in ['Nightfall.Route1Polylog.crux','Nightfall.Route1Polylog.route1_wyner_general','Nightfall.Route1Polylog.abstract_latent_pushforward_probability','Nightfall.Route1Polylog.abstract_latent_pushforward_input','Nightfall.Route1Polylog.abstract_latent_pushforward_conditional_entropy','Nightfall.Route1Polylog.abstract_latent_pushforward_information','Nightfall.Route1Polylog.abstract_latent_value_in_wynerGenSet','Nightfall.Route1Polylog.abstract_latent_exact_finite_reduction']:
              assert need in names,(need,names)
          for n,x in reports:
              a={z.strip() for z in x.split(',') if z.strip()}
              assert a <= {'Classical.choice','propext','Quot.sound'},(n,a)
          assert 'sorryAx' not in s
          src=Path('research/nightfall/formalization/product_space/Route1AbstractLatentPushforward.lean').read_text()
          assert not re.search(r'(?m)^\s*(sorry|admit|axiom)\b',src)
          print('PASS Route 1 polylog-M mixture simulation:',len(reports),'axiom reports, all standard')
          PY
      - name: Preserve evidence
        if: always()
        shell: bash
        run: |
          mkdir -p receipts/abstract-latent-wyner
          git rev-parse HEAD > receipts/abstract-latent-wyner/commit.txt
          sha256sum research/nightfall/formalization/product_space/Route1{PolylogTools,Entropy,KeyLemma,Lift,PolylogSimulation,WynerSimulation,WynerGeneral,AbstractLatentPushforward}.lean > receipts/abstract-latent-wyner/SHA256SUMS
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abstract-latent-wyner-lean-receipt
          path: receipts/abstract-latent-wyner
          if-no-files-found: warn
          retention-days: 90
