name: NIGHTFALL Wyner locality obstruction Lean
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/WynerLocality*.lean'
      - '.github/workflows/nightfall-wyner-locality-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locality:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Strict named-declaration audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/wyner-locality
          P=research/nightfall/formalization/product_space/WynerLocalityCore.lean
          python3 scripts/lean_bridge.py "$P" --workspace /tmp/mathlib4 \
            --decl Nightfall.WynerLocality.shallow_retraction_identity \
            --decl Nightfall.WynerLocality.product_range_obstruction \
            --decl Nightfall.WynerLocality.rectangle_preimage_local_exclusion \
            --decl Nightfall.WynerLocality.rectangle_preimage_subset \
            --decl Nightfall.WynerLocality.parity_full_projection \
            --decl Nightfall.WynerLocality.parity_product_range_obstruction \
            --decl Nightfall.WynerLocality.parity_isolated \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --strict --timeout 1200 --json-out receipts/wyner-locality/core.json
          cp "$P" /tmp/mathlib4/WynerLocalityCore.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/WynerLocalityCore.olean WynerLocalityCore.lean)
          (cd /tmp/mathlib4 && lake env leanchecker WynerLocalityCore) 2>&1 | tee receipts/wyner-locality/kernel.log
      - name: Compile source-exact Route 1 closure
        shell: bash
        run: |
          set -euo pipefail
          while read -r M P; do
            [ -z "$M" ] && continue
            REL="$(printf '%s' "$M" | tr '.' '/')"
            mkdir -p "/tmp/mathlib4/$(dirname "$REL")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$REL")"
            cp "$P" "/tmp/mathlib4/$REL.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$REL.olean" "$REL.lean") 2>&1 | tee "/tmp/wyner-locality-$M.log"
            ! grep -q 'declaration uses .sorry' "/tmp/wyner-locality-$M.log"
          done < research/nightfall/formalization/aa_product/CLOSURE.txt
          for M in Route1LatentDegree Route1DegreeSourceBridge Route1FiniteMaxCoupling Route1FiniteJointMass \
                   Route1MaximalConditionalKernel Route1StarCoupling Route1StarMaximalBridge \
                   Route1PolylogTools Route1Entropy Route1KeyLemma Route1Lift Route1PolylogSimulation Route1WynerSimulation Route1WynerGeneral; do
            cp "research/nightfall/formalization/product_space/$M.lean" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean") 2>&1 | tee "receipts/wyner-locality/$M.log"
            ! grep -q 'declaration uses .sorry' "receipts/wyner-locality/$M.log"
          done
      - name: Strict general-latent bridge audit
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space/WynerLocalityInformation.lean
          python3 scripts/lean_bridge.py "$P" --workspace /tmp/mathlib4 \
            --decl Nightfall.WynerLocality.entropy_le_log_support \
            --decl Nightfall.WynerLocality.wyner_general_lower_of_component_entropy \
            --decl Nightfall.WynerLocality.wyner_locality_of_ppz \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --strict --timeout 1200 --json-out receipts/wyner-locality/information.json
          cp "$P" /tmp/mathlib4/WynerLocalityInformation.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/WynerLocalityInformation.olean WynerLocalityInformation.lean)
          (cd /tmp/mathlib4 && lake env leanchecker WynerLocalityInformation) 2>&1 | tee receipts/wyner-locality/information-kernel.log
      - name: Strict PPZ and unconditional Wyner terminal audit
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space/WynerLocalityPPZ.lean
          python3 scripts/lean_bridge.py "$P" --workspace /tmp/mathlib4 \
            --decl Nightfall.WynerLocality.guess_packing \
            --decl Nightfall.WynerLocality.last_order_count \
            --decl Nightfall.WynerLocality.ppz_log_card \
            --decl Nightfall.WynerLocality.wyner_locality_general \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --strict --timeout 1200 --json-out receipts/wyner-locality/terminal.json
          cp "$P" /tmp/mathlib4/WynerLocalityPPZ.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/WynerLocalityPPZ.olean WynerLocalityPPZ.lean)
          (cd /tmp/mathlib4 && lake env leanchecker WynerLocalityPPZ) 2>&1 | tee receipts/wyner-locality/terminal-kernel.log
      - name: Preserve source identity
        if: always()
        run: |
          mkdir -p receipts/wyner-locality
          git rev-parse HEAD > receipts/wyner-locality/commit.txt
          sha256sum research/nightfall/formalization/product_space/WynerLocality*.lean > receipts/wyner-locality/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wyner-locality-core-receipt
          path: receipts/wyner-locality
          retention-days: 90
