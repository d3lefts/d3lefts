name: NIGHTFALL Wyner locality obstruction Lean
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/WynerLocality*.lean'
      - '.github/workflows/nightfall-wyner-locality-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Strict named-declaration audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/wyner-locality
          P=research/nightfall/formalization/product_space/WynerLocalityCore.lean
          python3 scripts/lean_bridge.py "$P" --workspace /tmp/mathlib4 \
            --decl Nightfall.WynerLocality.shallow_retraction_identity \
            --decl Nightfall.WynerLocality.product_range_obstruction \
            --decl Nightfall.WynerLocality.rectangle_preimage_local_exclusion \
            --decl Nightfall.WynerLocality.rectangle_preimage_subset \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --strict --timeout 1200 --json-out receipts/wyner-locality/core.json
          cp "$P" /tmp/mathlib4/WynerLocalityCore.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/WynerLocalityCore.olean WynerLocalityCore.lean)
          (cd /tmp/mathlib4 && lake env leanchecker WynerLocalityCore) 2>&1 | tee receipts/wyner-locality/kernel.log
      - name: Preserve source identity
        if: always()
        run: |
          mkdir -p receipts/wyner-locality
          git rev-parse HEAD > receipts/wyner-locality/commit.txt
          sha256sum research/nightfall/formalization/product_space/WynerLocalityCore.lean > receipts/wyner-locality/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wyner-locality-core-receipt
          path: receipts/wyner-locality
          retention-days: 90
