name: NIGHTFALL SCIF invariant Efron-Stein degree Lean
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research/nightfall/formalization/observability/SCIFDegreeInvariant.lean'
      - '.github/workflows/nightfall-scif-degree-invariance-lean.yml'
  workflow_dispatch:

concurrency:
  group: nightfall-scif-degree-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile exact source import closure without duplicating modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, pathlib, shutil, subprocess
          root=pathlib.Path.cwd()
          spec=importlib.util.spec_from_file_location("q2dag",root/"scripts/nightfall_q2_certify.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          files=mod.local_sources()
          modules=mod.closure("SCIFDegreeInvariant",files)
          ws=pathlib.Path("/tmp/mathlib4")
          out=ws/".lake/build/lib/lean"
          out.mkdir(parents=True,exist_ok=True)
          for name in modules:
              src=files[name]; dst=ws/(name+".lean")
              shutil.copyfile(src,dst)
              print("LEAN_BUILD",name,flush=True)
              subprocess.run(["lake","env","lean","-o",str(out/(name+".olean")),name+".lean"],
                             cwd=ws,check=True,timeout=1200)
          print("ALL_IMPORTS_COMPILED",len(modules))
          PY
      - name: Strict source bridge declaration and standard-axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.SCIFDegreeInvariant
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/SCIFDegreeInvariant.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.degree_transport_to_any_law \
            --decl $N.degree_equiv_between_product_laws \
            --decl $N.degree_two_survives_source_edit \
            --json-out lean-receipts/scif-degree-invariance.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/scif-degree-invariance.json
      - name: Preserve exact build provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/SCIFDegreeInvariant.lean > lean-receipts/SHA256SUMS
          git rev-parse HEAD > lean-receipts/HEAD
          cat lean-toolchain > lean-receipts/PIN
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scif-canonical-source-lean-receipts
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 90
