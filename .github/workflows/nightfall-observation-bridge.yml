name: NIGHTFALL certificate-to-observation bridge — pinned Lean 4.33.0
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/CertificateObservationBridge.lean'
      - 'research/nightfall/formalization/product_space/ProductSpaceTwoSidedBridge.lean'
      - '.github/workflows/nightfall-observation-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observation-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.33.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build exact pinned Turturean source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/physical-superintelligence/aaronson-ambainis.git /tmp/aa
          git -C /tmp/aa checkout 2a6ceaef872ae993708950f951989134084b851a
          (cd /tmp/aa && lake exe cache get && lake build AaronsonAmbainis.DetTheorem AaronsonAmbainis.TwoSided.Antipodal AaronsonAmbainis.Bridge.Positivity)
      - name: Compile source-certified product theorem and abstract sampler
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/product_space/ProductSpaceTwoSidedBridge.lean /tmp/aa/ProductSpaceTwoSidedBridge.lean
          mkdir -p /tmp/aa/.lake/build/lib/lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/ProductSpaceTwoSidedBridge.olean ProductSpaceTwoSidedBridge.lean)
      - name: Compile full source-to-sampler bridge and check axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/CertificateObservationBridge.lean \
            --workspace /tmp/aa --timeout 900 \
            --decl Nightfall.ProductSpace.Observation.positive_load_total \
            --decl Nightfall.ProductSpace.Observation.negative_load_total \
            --decl Nightfall.ProductSpace.Observation.row_cost_pos_of_two_classes \
            --decl Nightfall.ProductSpace.Observation.finite_product_certificate_sampler \
            --json-out lean-receipts/certificate-observation-bridge.json || {
              cat lean-receipts/certificate-observation-bridge.json || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/certificate-observation-bridge.json
      - name: Record source hashes and pin
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/product_space/CertificateObservationBridge.lean research/nightfall/formalization/product_space/ProductSpaceTwoSidedBridge.lean > lean-receipts/SHA256SUMS.txt
          echo leanprover/lean4:v4.33.0 > lean-receipts/lean-version.txt
          echo 2a6ceaef872ae993708950f951989134084b851a > lean-receipts/turturean-upstream-commit.txt
      - name: Preserve compiler receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificate-observation-bridge-receipt
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 30
