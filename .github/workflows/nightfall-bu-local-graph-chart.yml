name: NIGHTFALL exact local zero-graph to open partial homeomorphism Lean
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/finite_field/ProductBULocalGraphChart.lean'
      - 'research/nightfall/formalization/finite_field/ProductBUHalfspaceGraphChart.lean'
      - '.github/workflows/nightfall-bu-local-graph-chart.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bu-local-graph-chart-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  genuine-graph-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile exact open partial homeomorphism constructed from graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/bu-local-graph-chart
          for M in ProductBULocalGraphChart ProductBUHalfspaceGraphChart; do
            src="research/nightfall/formalization/finite_field/$M.lean"
            ! grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' "$src"
            cp "$src" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean") 2>&1 | tee "receipts/bu-local-graph-chart/$M.log"
            ! grep -E '(^|:)error:|declaration uses .sorry' "receipts/bu-local-graph-chart/$M.log"
          done
      - name: Named constructed chart and ordinary axiom check
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          for mod,name in (
              ("ProductBULocalGraphChart","Nightfall.ProductBULocalGraphChart.actual_local_graph_chart"),
              ("ProductBUHalfspaceGraphChart","Nightfall.ProductBUHalfspaceGraphChart.actual_left_halfspace_chart"),
          ):
              s=Path("receipts/bu-local-graph-chart",mod+".log").read_text()
              assert name in s,("MISSING_NAMED_CHART",name)
              a=re.search(r"'"+re.escape(name)+r"' depends on axioms:\s*\[([^\]]*)\]",s,re.S)
              if a:
                  ax={x.strip() for x in a[1].split(",") if x.strip()}
              else:
                  assert f"'{name}' does not depend on any axioms" in s
                  ax=set()
              assert ax <= {"propext","Classical.choice","Quot.sound"},(name,ax)
              assert "sorryAx" not in s
              print("PASS",name,sorted(ax))
          print("SCOPE: actual graph halfspace chart, physical fiber gluing, overlaps and ProductSphereZero open.")
          PY
      - name: Retain source hash and pin
        if: always()
        run: |
          mkdir -p receipts/bu-local-graph-chart
          git rev-parse HEAD > receipts/bu-local-graph-chart/HEAD.txt
          cat lean-toolchain > receipts/bu-local-graph-chart/toolchain.txt
          sha256sum research/nightfall/formalization/finite_field/{ProductBULocalGraphChart,ProductBUHalfspaceGraphChart}.lean > receipts/bu-local-graph-chart/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bu-local-graph-chart-lean-receipt
          path: receipts/bu-local-graph-chart
          retention-days: 90
