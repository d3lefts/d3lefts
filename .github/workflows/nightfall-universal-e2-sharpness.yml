name: NIGHTFALL universal exponent-two conjecture sharpness audit (not a proof)
on:
  push:
    branches: [nightfall-universal-product-e2-flagship-20261117]
    paths:
      - 'research/nightfall/flagship-influence/**'
      - 'research/nightfall/formalization/universal/UE2ConditionalImplications.lean'
      - '.github/workflows/nightfall-universal-e2-sharpness.yml'
  pull_request:
    paths:
      - 'research/nightfall/flagship-influence/**'
      - 'research/nightfall/formalization/universal/UE2ConditionalImplications.lean'
      - '.github/workflows/nightfall-universal-e2-sharpness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-sharpness-and-normalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exact rational classical examples and normalization checker
        run: python3 research/nightfall/flagship-influence/check_ue2_sharpness.py
      - name: Exact even-odd Chebyshev witnesses (not a universal theorem)
        run: python3 research/nightfall/flagship-influence/check_ue2_chebyshev.py

  conditional-implications-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile only explicit conditional implications and print axioms
        shell: bash
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/universal/UE2ConditionalImplications.lean
          cp "$SRC" /tmp/mathlib4/UE2ConditionalImplications.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/UE2ConditionalImplications.olean UE2ConditionalImplications.lean)
          mkdir -p lean-receipts/ue2-conditional
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.UE2ConditionalImplications.degree_two_implies_degree_six \
            --decl Nightfall.UE2ConditionalImplications.implies_aa_flip_normalization \
            --decl Nightfall.UE2ConditionalImplications.dominates_five_halves_when_coefficient_allows \
            --json-out lean-receipts/ue2-conditional/implications.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/ue2-conditional/implications.json
          sha256sum "$SRC" > lean-receipts/ue2-conditional/SHA256SUMS
          git rev-parse HEAD > lean-receipts/ue2-conditional/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ue2-conditional-lean-passport
          path: lean-receipts/ue2-conditional/
          retention-days: 45
