name: NIGHTFALL Q2 190 spherical rotation certificate
on:
  pull_request:
    branches: [main]
    paths:
      - "research/nightfall/formalization/observability/Q2190*.lean"
      - ".github/workflows/nightfall-q2-rotation-v436.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-rotation-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  kernel-check:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile exact four-point rotation and check named axioms
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          mkdir -p lean-receipts/q2-rotation
          cp "$SRC/Q2190FourPoint.lean" /tmp/mathlib4/
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Q2190FourPoint.olean Q2190FourPoint.lean)
          python3 scripts/lean_bridge.py "$SRC/Q2190FourPoint.lean" \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Q2190.r_sq \
            --decl Nightfall.Q2190.fourpoint_derivative_exact \
            --decl Nightfall.Q2190.fourpoint_functional_bound \
            --decl Nightfall.Q2190.degree_two_fourpoint_bernstein \
            --decl Nightfall.Q2190.rotated_mass_normalized \
            --json-out lean-receipts/q2-rotation/fourpoint.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-rotation/fourpoint.json
      - name: Compile actual-source zero-atom tangent and rotating law
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          cp "$SRC/Q2190FourPoint.lean" /tmp/mathlib4/
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Q2190FourPoint.olean Q2190FourPoint.lean)
          cp "$SRC/Q2190SiteRotation.lean" /tmp/mathlib4/
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Q2190SiteRotation.olean Q2190SiteRotation.lean)
          python3 scripts/lean_bridge.py "$SRC/Q2190SiteRotation.lean" \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Q2190.sitePsi_unit \
            --decl Nightfall.Q2190.tangent_unit_when_nonzero \
            --decl Nightfall.Q2190.tangent_orthogonal \
            --decl Nightfall.Q2190.signedTangent_pairs_to_norm \
            --decl Nightfall.Q2190.siteRotation_normalized \
            --decl Nightfall.Q2190.siteRotation_plus_sub_minus \
            --json-out lean-receipts/q2-rotation/actual-site-rotation.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-rotation/actual-site-rotation.json
      - name: Compile quadratic four-law expectation cancellation
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          cp "$SRC/Q2190FourPoint.lean" /tmp/mathlib4/
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Q2190FourPoint.olean Q2190FourPoint.lean)
          cp "$SRC/Q2190QuadraticExpected.lean" /tmp/mathlib4/
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Q2190QuadraticExpected.olean Q2190QuadraticExpected.lean)
          python3 scripts/lean_bridge.py "$SRC/Q2190QuadraticExpected.lean" \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Q2190.quadraticExpectation_sign_difference \
            --decl Nightfall.Q2190.quadraticExpectation_fourpoint_exact \
            --decl Nightfall.Q2190.quadraticExpectation_first_chaos_bound \
            --json-out lean-receipts/q2-rotation/quadratic-expectation.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-rotation/quadratic-expectation.json
      - name: Source provenance
        if: always()
        run: |
          mkdir -p lean-receipts/q2-rotation
          sha256sum research/nightfall/formalization/observability/Q2190*.lean > lean-receipts/q2-rotation/SHA256SUMS
          git rev-parse HEAD > lean-receipts/q2-rotation/HEAD
          cat lean-toolchain > lean-receipts/q2-rotation/LEAN_PIN
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: q2-190-spherical-rotation-receipts
          path: lean-receipts/q2-rotation/
          retention-days: 45
