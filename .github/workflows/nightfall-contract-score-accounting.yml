name: NIGHTFALL contract scorer subTest parent identity audit

on:
  pull_request:
    paths:
      - 'research/nightfall/evaluations/external/contract_scorer.py'
      - 'research/nightfall/evaluations/external/test_contract_score_accounting.py'
      - '.github/workflows/nightfall-contract-score-accounting.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-score-count:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Exact source and 3 independent synthetic accounting checks
        run: |
          set -euo pipefail
          mkdir -p proof-receipts/score-accounting
          git rev-parse HEAD > proof-receipts/score-accounting/HEAD.txt
          sha256sum research/nightfall/evaluations/external/contract_scorer.py research/nightfall/evaluations/external/test_contract_score_accounting.py > proof-receipts/score-accounting/SHA256SUMS
          python -I research/nightfall/evaluations/external/test_contract_score_accounting.py -v 2>&1 | tee proof-receipts/score-accounting/checks.txt
      - name: Archive exact-head receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-score-accounting-python-${{ matrix.python }}
          path: proof-receipts/score-accounting/
