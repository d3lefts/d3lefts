name: Verify NIGHTFALL quotient-observability finite pilot

on:
  pull_request:
    paths:
      - "research/nightfall/2026-11-task-distinction-engineering/quotient-observability/**"
      - ".github/workflows/task-relevant-quotient-audit.yml"
  push:
    branches: [main]
    paths:
      - "research/nightfall/2026-11-task-distinction-engineering/quotient-observability/**"
      - ".github/workflows/task-relevant-quotient-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-posterior-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Independently enumerate finite posteriors, adaptation, revelation and deltas
        run: python3 -I research/nightfall/2026-11-task-distinction-engineering/quotient-observability/exact_audit.py
      - name: Confirm frozen deterministic audit outputs
        run: git diff --exit-code -- research/nightfall/2026-11-task-distinction-engineering/quotient-observability/audit_results.json
      - name: Check scoped research passport
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("research/nightfall/2026-11-task-distinction-engineering/quotient-observability/CERTIFICATE_SCOPE.json")
          c=json.loads(p.read_text())
          assert c["status"].startswith("author-analytic theorem")
          for field in ["independent_human_review","lean_terminal_proof","novelty_certified","real_sensor_attestation","model_calibration_certified"]:
              assert c[field] is False, field
          assert len(c["claims"]) == 5
          print("Scope passport retains all negative certification gates")
          PY
