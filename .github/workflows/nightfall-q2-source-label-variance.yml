name: NIGHTFALL Q2 genuine original-product label variance transport Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2SourceLabelVariance.lean'
      - '.github/workflows/nightfall-q2-source-label-variance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-label-variance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  true-original-product-label-variance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout source exactly
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Build exact source product and label law transitive dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.nightfall_q2_certify import local_sources, closure, sha256, ROOT
          from pathlib import Path
          import shutil, subprocess, json
          files=local_sources()
          ws=Path("/tmp/mathlib4")
          out=ws/".lake/build/lib/lean"
          out.mkdir(parents=True,exist_ok=True)
          receipt=Path("lean-receipts/q2-source-label-variance")
          receipt.mkdir(parents=True,exist_ok=True)
          manifest=[]
          for name in closure("InfinitePiQ2SourceLabelVariance",files):
              src=files[name]
              dst=ws/(name+".lean")
              shutil.copyfile(src,dst)
              assert sha256(src)==sha256(dst)
              print("SOURCE-EXACT",name,flush=True)
              subprocess.run(["lake","env","lean","-o",str(out/(name+".olean")),name+".lean"],cwd=ws,check=True,timeout=1200)
              manifest.append({"path":str(src.relative_to(ROOT)),"sha256":sha256(src)})
          (receipt/"sources.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
      - name: Strict named real product mean and variance transfer
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2SourceLabelVariance.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2SourceLabelVariance.sourceLabelLift_mean_exact \
            --decl Nightfall.InfinitePiQ2SourceLabelVariance.sourceLabelLift_variance_exact \
            --json-out lean-receipts/q2-source-label-variance/strict.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-source-label-variance/strict.json
      - name: Immutable source provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-source-label-variance
          git rev-parse HEAD > lean-receipts/q2-source-label-variance/HEAD
          cat lean-toolchain > lean-receipts/q2-source-label-variance/TOOLCHAIN
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2SourceLabelVariance.lean > lean-receipts/q2-source-label-variance/SOURCE_SHA256
      - name: Upload exact proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-original-label-variance-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-source-label-variance
          if-no-files-found: warn
