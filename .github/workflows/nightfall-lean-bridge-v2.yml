name: NIGHTFALL Lean Bridge v2 exact theorem contract

on:
  pull_request:
    paths:
      - 'scripts/lean_bridge.py'
      - 'research/nightfall/formalization/product_space/check_receipts.py'
      - 'scripts/test_lean_bridge_v2.py'
      - 'scripts/check_proof_graph.py'
      - 'research/nightfall/formalization/compiler/**'
      - '.github/actions/setup-nightfall-lean/**'
      - '.github/workflows/nightfall-lean-bridge-v2.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lean_bridge.py'
      - 'research/nightfall/formalization/product_space/check_receipts.py'
      - 'scripts/test_lean_bridge_v2.py'
      - 'scripts/check_proof_graph.py'
      - 'research/nightfall/formalization/compiler/**'
      - '.github/actions/setup-nightfall-lean/**'
      - '.github/workflows/nightfall-lean-bridge-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed bridge and graph mutation controls
        run: |
          set -euo pipefail
          python3 scripts/test_lean_bridge_v2.py
          python3 scripts/check_proof_graph.py --self-test research/nightfall/formalization/compiler/PROOF_GRAPH.json

  exact-type-kernel:
    needs: adversarial-unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Pinned kernel check of exact theorem type
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/compiler/ContractSmoke.lean \
            --workspace /tmp/mathlib4 --timeout 480 --strict \
            --allow-axiom Classical.choice \
            --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Certification.additive_symmetry \
            --contract research/nightfall/formalization/compiler/contract-smoke.json \
            --json-out lean-receipts/bridge-v2-contract.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/bridge-v2-contract.json
      - name: Upload exact compiler and source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-lean-bridge-v2-receipts
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 45
