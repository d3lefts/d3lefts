name: NIGHTFALL Lean Bridge v2 exact theorem contract

on:
  pull_request:
    paths:
      - 'scripts/lean_bridge.py'
      - 'research/nightfall/formalization/product_space/check_receipts.py'
      - 'scripts/test_lean_bridge_v2.py'
      - 'scripts/check_proof_graph.py'
      - 'scripts/check_nightfall_compiler_lock.py'
      - 'scripts/audit_active_lean_436.py'
      - 'docs/lean-compiler-lock.json'
      - 'research/nightfall/formalization/compiler/**'
      - '.github/actions/setup-nightfall-lean/**'
      - '.github/workflows/nightfall-lean-bridge-v2.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lean_bridge.py'
      - 'research/nightfall/formalization/product_space/check_receipts.py'
      - 'scripts/test_lean_bridge_v2.py'
      - 'scripts/check_proof_graph.py'
      - 'research/nightfall/formalization/compiler/**'
      - '.github/actions/setup-nightfall-lean/**'
      - '.github/workflows/nightfall-lean-bridge-v2.yml'
  workflow_dispatch:

# Older commits on the same branch never need to consume runner time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adversarial-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
      - name: Reject unpinned compiler or retired workspaces in active CI
        run: |
          set -euo pipefail
          python3 scripts/check_nightfall_compiler_lock.py --checkout .
          python3 scripts/audit_active_lean_436.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          lock = json.loads(Path("docs/lean-compiler-lock.json").read_text())
          assert Path("lean-toolchain").read_text().strip() == lock["toolchain"]
          source = Path(".github/actions/setup-nightfall-lean/action.yml").read_text()
          assert "docs/lean-compiler-lock.json" in source
          assert "NIGHTFALL_LEAN_COMMIT" in source
          assert "NIGHTFALL_MATHLIB_COMMIT" in source
          old_dependency = "/".join(("physical-superintelligence", "aaronson-ambainis"))
          old_workspace = "/tmp/" + "aa/"
          for workflow in Path(".github/workflows").glob("*.yml"):
              body = workflow.read_text()
              if "./.github/actions/setup-nightfall-lean" not in body:
                  continue
              assert old_dependency not in body, workflow
              assert old_workspace not in body, workflow
          print("PASS: all active compiler pins derived from central 4.36 lock")
          PY
      - name: Fail-closed bridge and graph mutation controls
        run: |
          set -euo pipefail
          python3 scripts/test_lean_bridge_v2.py
          python3 scripts/check_proof_graph.py --self-test research/nightfall/formalization/compiler/PROOF_GRAPH.json

  exact-type-kernel:
    needs: adversarial-unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Pinned kernel check of exact theorem type
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/compiler/ContractSmoke.lean \
            --workspace /tmp/mathlib4 --timeout 480 --strict \
            --allow-axiom Classical.choice \
            --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Certification.additive_symmetry \
            --contract research/nightfall/formalization/compiler/contract-smoke.json \
            --json-out lean-receipts/bridge-v2-contract.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/bridge-v2-contract.json
      - name: Upload exact compiler and source receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: nightfall-lean-bridge-v2-receipts
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 45
