name: NIGHTFALL Q2 source-owned distinct-neighbor projection
on:
  push:
    branches:
      - nightfall-q2-distinct-owned-neighbors-20261113
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/ActualESDistinctNeighborSections.lean'
      - '.github/workflows/nightfall-q2-distinct-neighbors.yml'
      - 'research/nightfall/formalization/observability/ActualESMatchingFromGreedy.lean'
      - 'research/nightfall/formalization/observability/ActualESDistinctNeighborEnergy.lean'
      - 'research/nightfall/formalization/observability/ActualESOrthogonality.lean'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  actual-source-moment-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Turturean Lean 4.33.0 source dependency pin
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone https://github.com/physical-superintelligence/aaronson-ambainis.git /tmp/aa
          git -C /tmp/aa checkout 2a6ceaef872ae993708950f951989134084b851a
          (cd /tmp/aa && lake exe cache get)
          (cd /tmp/aa && lake build AaronsonAmbainis.DetTheorem AaronsonAmbainis.TwoSided.Antipodal \
            AaronsonAmbainis.Bridge.Positivity AaronsonAmbainis.Row.Main \
            AaronsonAmbainis.Pack.Main AaronsonAmbainis.Dual.Main \
            AaronsonAmbainis.Level.Integral AaronsonAmbainis.TwoSided.CauchySchwarz)
      - name: Build Efron-Stein actual source and independent Hilbert dependencies on one pin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aa/.lake/build/lib/lean
          P=research/nightfall/formalization/product_space
          O=research/nightfall/formalization/observability
          for module in ProductSpaceTwoSidedBridge ProductRowBound ProductInfluence EfronSteinDegree; do
            cp "$P/$module.lean" "/tmp/aa/$module.lean"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean")
          done
          cp "$P/QuadraticHoeffdingBridge.lean" /tmp/aa/QuadraticHoeffdingBridge.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/QuadraticHoeffdingBridge.olean QuadraticHoeffdingBridge.lean)
          for module in CenteredRectangles ActualESPairMatchingBridge ArbitraryLawFourthMoment HilbertTwoIncrementMoment HilbertManyIncrementMoment QuadraticEndpointInterpolation QuadraticActualMomentEndpoint; do
            case "$module" in
              ActualESPairMatchingBridge) cp "$P/$module.lean" "/tmp/aa/$module.lean";;
              *) cp "$O/$module.lean" "/tmp/aa/$module.lean";;
            esac
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean")
          done
      - name: Build embedded arbitrary-matching and weighted-greedy dependencies
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space
          O=research/nightfall/formalization/observability
          for m in ActualESQuadraticRectangles; do
            cp "$P/$m.lean" "/tmp/aa/$m.lean"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean")
          done
          for m in ParityBlockCancellation QuadraticHybridTelescoping ActualESPackedParity ActualESGeneralMatching WeightedGreedyMatching; do
            cp "$O/$m.lean" "/tmp/aa/$m.lean"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean")
          done
      - name: Strict source matching-to-greedy endpoint lift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualESMatchingFromGreedy
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualESMatchingFromGreedy.lean \
            --workspace /tmp/aa --timeout 1200 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.selected_matchingCoord_injective \
            --decl $N.actual_matching_witness_from_graph \
            --json-out lean-receipts/actual-matching-greedy.json || {
              cat lean-receipts/actual-matching-greedy.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/actual-matching-greedy.json
      - name: Strict distinct actual owned-neighbor projection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualESDistinctNeighborSections
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualESDistinctNeighborSections.lean \
            --workspace /tmp/aa --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.product_expect_single \
            --decl $N.condExp_single_inside \
            --decl $N.condExp_single_outside \
            --decl $N.actual_owned_section_is_conditional_projection \
            --decl $N.finite_weighted_vector_jensen \
            --json-out lean-receipts/actual-owned-neighbor-projection.json || {
              cat lean-receipts/actual-owned-neighbor-projection.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/actual-owned-neighbor-projection.json
      - name: Build direct source conditional projection
        shell: bash
        run: |
          set -euo pipefail
          O=research/nightfall/formalization/observability
          cp "$O/ActualESDistinctNeighborSections.lean" /tmp/aa/ActualESDistinctNeighborSections.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/ActualESDistinctNeighborSections.olean ActualESDistinctNeighborSections.lean)
      - name: Strict source-law orthogonal distinct-neighbor cross terms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualESDistinctNeighborEnergy
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualESDistinctNeighborEnergy.lean \
            --workspace /tmp/aa --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.centered_distinct_coordinate_cross_zero \
            --decl $N.centered_source_owned_second_moment \
            --json-out lean-receipts/actual-owned-neighbor-cross-zero.json || {
              cat lean-receipts/actual-owned-neighbor-cross-zero.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/actual-owned-neighbor-cross-zero.json
      - name: Strict actual source Efron-Stein cross-support orthogonality
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualESOrthogonality
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualESOrthogonality.lean \
            --workspace /tmp/aa --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.actual_es_components_cross_zero_of_missing \
            --json-out lean-receipts/actual-es-orthogonality.json || {
              cat lean-receipts/actual-es-orthogonality.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/actual-es-orthogonality.json
      - name: Record exact source hashes and compiler pin
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/{ActualESDistinctNeighborSections,ActualESMatchingFromGreedy,ActualESDistinctNeighborEnergy,ActualESOrthogonality}.lean > lean-receipts/SHA256SUMS.txt
          echo leanprover/lean4:v4.33.0 > lean-receipts/lean-toolchain.txt
          echo 2a6ceaef872ae993708950f951989134084b851a > lean-receipts/upstream.txt
          git rev-parse HEAD > lean-receipts/repo-commit.txt
      - name: Upload exact owned-neighbor receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-owned-neighbor-conditional-projection-receipts
          path: lean-receipts/
          retention-days: 45
