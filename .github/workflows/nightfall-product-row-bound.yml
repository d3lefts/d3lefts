name: NIGHTFALL product-space product row bound (Lemma B, pinned Turturean toolchain)
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/ProductRowBound.lean'
      - 'research/nightfall/2026-11-certificate-engine/CERTIFICATION_UPDATE_20261110.md'
      - 'research/nightfall/formalization/product_space/check_certificate_guided_descent.py'
      - 'research/nightfall/formalization/product_space/check_posterior_adaptive_exact.py'
      - '.github/workflows/nightfall-product-row-bound.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-row-bound:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Independent exact-rational sampler and posterior check
        run: python3 research/nightfall/formalization/product_space/check_certificate_guided_descent.py
      - name: Exhaustive conditional-product and adaptive Markov audit
        run: python3 research/nightfall/formalization/product_space/check_posterior_adaptive_exact.py
      - name: Install Lean 4.33.0 (Turturean pin)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned antipodal theorem
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/physical-superintelligence/aaronson-ambainis.git /tmp/aa
          git -C /tmp/aa checkout 2a6ceaef872ae993708950f951989134084b851a
          cd /tmp/aa
          lake exe cache get
          lake build AaronsonAmbainis.Row.Main AaronsonAmbainis.Pack.Main AaronsonAmbainis.Dual.Main
      - name: Compile bridge and record axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/ProductRowBound.lean \
            --workspace /tmp/aa --timeout 1500 \
            --decl Nightfall.ProductSpace.RowBound.Hp_eq_mul \
            --decl Nightfall.ProductSpace.RowBound.Hp_bounds \
            --decl Nightfall.ProductSpace.RowBound.natDegree_Hp_le \
            --decl Nightfall.ProductSpace.RowBound.sum_indMono_mul_prod \
            --decl Nightfall.ProductSpace.RowBound.Pv_sum \
            --decl Nightfall.ProductSpace.RowBound.Pv_nonneg \
            --decl Nightfall.ProductSpace.RowBound.hasDegreeLE_Pv \
            --decl Nightfall.ProductSpace.RowBound.Pv_unit \
            --decl Nightfall.ProductSpace.RowBound.hasDegreeLE_Gsel \
            --decl Nightfall.ProductSpace.RowBound.abs_Gsel_le_one \
            --decl Nightfall.ProductSpace.RowBound.product_block_inequality \
            --decl Nightfall.ProductSpace.RowBound.product_scaled_bound \
            --decl Nightfall.ProductSpace.RowBound.product_packing_bound \
            --decl Nightfall.ProductSpace.RowBound.product_row_bound \
            --json-out lean-receipts/product-row-bound.json || {
              cat lean-receipts/product-row-bound.json || true
              exit 1
            }
      - name: Axiom policy
        run: |
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/product-row-bound.json
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-row-bound-receipt
          path: lean-receipts/
          if-no-files-found: warn
