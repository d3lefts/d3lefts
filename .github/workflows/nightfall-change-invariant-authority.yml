name: NIGHTFALL change-invariant authority exact proof audit
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/2026-11-change-invariant-authority/**'
      - '.github/workflows/nightfall-change-invariant-authority.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nightfall-change-invariant-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-rational-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact effective source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Rehash, replay and check exact finite receipt
        shell: bash
        run: |
          set -euo pipefail
          cd research/nightfall/2026-11-change-invariant-authority
          sha256sum --check SHA256SUMS.txt
          python3 audit_independent.py > executed_receipt.json
          diff -u audit_receipt.json executed_receipt.json
          grep -q '"status": "PASS"' executed_receipt.json
          sha256sum --check SHA256SUMS.txt
          git rev-parse HEAD > effective-commit.txt
      - name: Retain audit receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: change-invariant-authority-${{ github.run_id }}
          path: |
            research/nightfall/2026-11-change-invariant-authority/executed_receipt.json
            research/nightfall/2026-11-change-invariant-authority/effective-commit.txt
          retention-days: 60
