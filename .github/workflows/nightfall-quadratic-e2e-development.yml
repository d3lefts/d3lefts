name: NIGHTFALL quadratic full-chain Lean development
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/HilbertManyIncrementMoment.lean'
      - '.github/workflows/nightfall-quadratic-e2e-development.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  many-increment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          git clone --depth 1 --branch v4.35.0 https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4
          (cd /tmp/mathlib4 && "$HOME/.elan/bin/lake" exe cache get)
      - name: Compile actual Hilbert increment modules in dependency order
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/observability/{ArbitraryLawFourthMoment,HilbertTwoIncrementMoment,HilbertManyIncrementMoment}.lean /tmp/mathlib4/
          cd /tmp/mathlib4
          lake env lean -o .lake/build/lib/lean/ArbitraryLawFourthMoment.olean ArbitraryLawFourthMoment.lean
          lake env lean -o .lake/build/lib/lean/HilbertTwoIncrementMoment.olean HilbertTwoIncrementMoment.lean
          lake env lean -o .lake/build/lib/lean/HilbertManyIncrementMoment.olean HilbertManyIncrementMoment.lean
      - name: Strict kernel axiom audit and source SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.QuadraticHilbertMany
          python3 scripts/lean_bridge.py research/nightfall/formalization/observability/HilbertManyIncrementMoment.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.expectation_succ \
            --decl $N.mass_nonneg \
            --decl $N.mass_one \
            --decl $N.joint_center_add \
            --decl $N.independent_two_second \
            --decl $N.sumVector_center \
            --json-out lean-receipts/hilbert-many.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/hilbert-many.json
          sha256sum research/nightfall/formalization/observability/HilbertManyIncrementMoment.lean > lean-receipts/SHA256SUMS
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-hilbert-many-lean
          path: lean-receipts/
          if-no-files-found: warn
