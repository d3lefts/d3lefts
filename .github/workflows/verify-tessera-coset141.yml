name: Verify TESSERA Singer coset rigidity
on:
  pull_request:
    paths:
      - "research/nightfall/projects/erdos/tessera-coset141-20261029/**"
      - ".github/workflows/verify-tessera-coset141.yml"
  push:
    paths:
      - "research/nightfall/projects/erdos/tessera-coset141-20261029/**"
      - ".github/workflows/verify-tessera-coset141.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-coset:
    name: Independent field and subgroup quotient certificates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 research/nightfall/projects/erdos/tessera-coset141-20261029/verify_field.py
      - run: python3 research/nightfall/projects/erdos/tessera-coset141-20261029/verify_coset.py
