name: Verify scholarly research archive
on:
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/pull_request_template.md'
      - 'papers/**'
      - 'research/**'
      - 'scripts/check_research_archive.py'
      - 'scripts/check_paper_c_bundle.py'
      - '.github/workflows/verify-scholarly-archive.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.github/pull_request_template.md'
      - 'papers/**'
      - 'research/**'
      - 'scripts/check_research_archive.py'
      - 'scripts/check_paper_c_bundle.py'
      - '.github/workflows/verify-scholarly-archive.yml'
  # GitHub Actions bot commits of regenerated Paper C artifacts do not fire push
  # workflows. Recheck the default-branch outputs whenever the publisher finishes.
  workflow_run:
    workflows: ['Build Paper C typeset manuscript and exact archive']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    # A failed publisher may leave old artifacts; do not certify that run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Provenance, sources, and dependency contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical claims, local sources and academic reading routes
        run: |
          python3 scripts/check_research_archive.py --self-test
          python3 scripts/test_repository_docs.py
          python3 scripts/check_paper_c_bundle.py
      - name: State exact scope of this job
        run: |
          echo "This job verifies editorial metadata, source links and mutation resistance."
          echo "It does NOT certify theorem validity, source originality or external peer review."
