name: NIGHTFALL effect-time information-budget exact audit
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/2026-11-effect-time-information-budget/**'
      - '.github/workflows/nightfall-effect-time-information-budget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: effect-time-budget-\${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  exact-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact effective source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact independent three-criterion and finite-policy audit
        shell: bash
        run: |
          set -euo pipefail
          cd research/nightfall/2026-11-effect-time-information-budget
          python3 -B check_exact.py | tee receipt.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('receipt.json').read_text())
          assert receipt['status']=='PASS'
          assert receipt['exact_models']==600
          assert receipt['deterministic_policies']==74
          assert receipt['feasible_policies']==7
          assert receipt['optimal_evidence_cost']=='1'
          PY
          git rev-parse HEAD > effective-commit.txt
          sha256sum check_exact.py THEORY.md README.md > executed-source-sha256.txt
      - name: Retain independent check receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: effect-time-budget-\${{ github.run_id }}
          path: |
            research/nightfall/2026-11-effect-time-information-budget/receipt.json
            research/nightfall/2026-11-effect-time-information-budget/effective-commit.txt
            research/nightfall/2026-11-effect-time-information-budget/executed-source-sha256.txt
          retention-days: 60
