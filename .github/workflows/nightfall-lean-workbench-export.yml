name: Export pinned Lean interactive workbench
on:
  pull_request:
    paths:
      - '.github/workflows/nightfall-lean-workbench-export.yml'
      - 'scripts/export_lean_workbench.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve exporter before selecting exact proof sources
        run: cp scripts/export_lean_workbench.py /tmp/export_lean_workbench.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 39cff6496c2c75696a62946eb27f423abbcbaaa2
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Smoke-test pinned compiler against Mathlib
        shell: bash
        run: |
          set -euo pipefail
          printf 'import Mathlib\nexample : (2 : Nat) + 2 = 4 := by norm_num\n' > /tmp/mathlib4/WorkbenchSmoke.lean
          (cd /tmp/mathlib4 && lake env lean WorkbenchSmoke.lean)
      - name: Export runtime and exact proof sources (no AA/Q2 rebuild)
        id: export
        shell: bash
        run: |
          python3 /tmp/export_lean_workbench.py
          for f in /tmp/nightfall-workbench-export/part-*; do echo "$(basename "$f")=true" >> "$GITHUB_OUTPUT"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lean-workbench-manifest
          path: /tmp/nightfall-workbench-export/manifest.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.export.outputs.part-00 == 'true'
        with:
          name: lean-workbench-part-00
          path: /tmp/nightfall-workbench-export/part-00
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.export.outputs.part-01 == 'true'
        with:
