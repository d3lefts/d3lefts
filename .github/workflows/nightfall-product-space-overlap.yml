name: NIGHTFALL product-space — localized overlap
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/**'
      - '.github/workflows/nightfall-product-space-overlap.yml'
permissions:
  contents: read
jobs:
  overlap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile localized overlap
        run: |
          cd /tmp/mathlib4
          python3 "$GITHUB_WORKSPACE/scripts/lean_bridge.py"             "$GITHUB_WORKSPACE/research/nightfall/formalization/product_space/LocalizedOverlapConsequence.lean"             --workspace /tmp/mathlib4             --decl Nightfall.ProductSpace.localized_overlap_consequence             --json-out "$GITHUB_WORKSPACE/lean-receipts/overlap.json"
      - name: Audit standard axioms
        run: |
          python3 "$GITHUB_WORKSPACE/research/nightfall/formalization/product_space/check_receipts.py" "$GITHUB_WORKSPACE/lean-receipts/overlap.json"
      - name: Save receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-space-overlap-receipt
          path: lean-receipts/
          if-no-files-found: warn
