name: NIGHTFALL ArtifactGraph-B2 public smoke
on:
  pull_request:
    paths:
      - 'research/nightfall/evaluations/artifactgraph-b2/**'
      - '.github/workflows/nightfall-artifactgraph-public.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: research/nightfall/evaluations/artifactgraph-b2/candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate agent-visible smoke tests only
        run: python -m unittest discover -s tests -v
