name: NIGHTFALL Q2 actual finite pair fourth moment Lean 4.36
on:
  push:
    branches: [nightfall-q2-source-anova-global-v436-20261113, nightfall-q2-consolidated-terminal-20261114]
    paths:
      - 'research/nightfall/formalization/observability/ActualSourceFinitePairMoment.lean'
      - '.github/workflows/nightfall-q2-source-finite-pair-moment-v436.yml'
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/ActualSourceFinitePairMoment.lean'
      - '.github/workflows/nightfall-q2-source-finite-pair-moment-v436.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-fourth:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile current source derived original pair tables and resampling
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ActualProductMergeTower ActualProductHilbertJensen ActualProductSoftNoise ActualProductSourceMarginal ActualProductPairSector ActualProductSoftStar ActualProductSoftStarEnergy ActualProductSoftStarParseval ActualProductSourcePairCentering ActualSourceANOVA ActualProductResampleBridge; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Compile recursive independent Hilbert moments and original source distinct samples
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ArbitraryLawFourthMoment HilbertTwoIncrementMoment HilbertManyIncrementMoment QuadraticEndpointInterpolation QuadraticActualMomentEndpoint ActualSourceFiniteSampleLaw; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Strict finite source-pair Hilbert increment and fourth endpoint
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourceFinitePairMoment
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceFinitePairMoment.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.sourcePairIncrement_norm_bounded \
            --decl $N.finitePairIncrement_centered \
            --decl $N.finitePairIncrement_norm_bounded \
            --decl $N.finitePairIncrement_moment2_eq_budget \
            --decl $N.finitePairIncrement_fourth_endpoint \
            --decl $N.finitePairIncrement_moment2_eq_source_pair_energies \
            --decl $N.original_source_distinct_pair_fourth_endpoint \
            --json-out lean-receipts/q2-source-finite-pair-fourth.json || {
              cat lean-receipts/q2-source-finite-pair-fourth.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-source-finite-pair-fourth.json
      - name: Source identities
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/ActualSourceFinitePairMoment.lean > lean-receipts/SHA256SUMS.txt
          git rev-parse HEAD > lean-receipts/repo-commit.txt
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-original-source-finite-pair-fourth
          path: lean-receipts/
          retention-days: 45
