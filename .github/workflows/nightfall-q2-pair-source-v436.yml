name: NIGHTFALL Q2 genuine two-site source bridge Lean 4.36
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/ActualProductPairSector.lean'
      - '.github/workflows/nightfall-q2-pair-source-v436.yml'
  push:
    branches:
      - nightfall-q2-pair-sector-v436-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-actual-product-two-site:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile source-identical prerequisites under pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ActualProductMergeTower ActualProductHilbertJensen ActualProductSoftNoise ActualProductSourceMarginal; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Strict two-site event theorem and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualProductPairSector
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualProductPairSector.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.actual_product_two_site_event \
            --json-out lean-receipts/q2-actual-two-site-event.json || {
              cat lean-receipts/q2-actual-two-site-event.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-actual-two-site-event.json
      - name: Record source and pin hashes
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/ActualProduct{MergeTower,HilbertJensen,SoftNoise,SourceMarginal,PairSector}.lean > lean-receipts/SHA256SUMS.txt
          git rev-parse HEAD > lean-receipts/repo-commit.txt
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
          git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/mathlib-commit.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-actual-two-site-event-v436
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 45
