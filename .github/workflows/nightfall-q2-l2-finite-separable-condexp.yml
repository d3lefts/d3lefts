name: NIGHTFALL Q2 original-source finite separable conditional expectation
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2FiniteSeparableCondExp.lean'
      - '.github/workflows/nightfall-q2-l2-finite-separable-condexp.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-finite-separable-condexp-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  exact-source-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile original-product finite-rank source certificate
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2Density InfinitePiQ2InfluenceStability InfinitePiQ2OriginalIndependence InfinitePiQ2ConditionalSourceTest InfinitePiQ2FiniteSeparableCondExp; do
            cp "research/nightfall/formalization/universal/${name}.lean" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Strict actual declaration and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-finite-separable
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2FiniteSeparableCondExp.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2FiniteSeparableCondExp.source_condExp_finite_separable_sum \
            --json-out lean-receipts/q2-finite-separable/finite-separable.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-finite-separable/finite-separable.json
      - name: Preserve source identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-finite-separable
          git rev-parse HEAD > lean-receipts/q2-finite-separable/HEAD
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2FiniteSeparableCondExp.lean \
            > lean-receipts/q2-finite-separable/SOURCE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-finite-separable-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-finite-separable
          if-no-files-found: warn
