name: NIGHTFALL Q2 actual arbitrary-law moment endpoint

on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/QuadraticActualMomentEndpoint.lean'
      - '.github/workflows/nightfall-q2-actual-moment-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.35.0 and Mathlib v4.35.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          git clone --depth 1 --branch v4.35.0 https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4
          (cd /tmp/mathlib4 && "$HOME/.elan/bin/lake" exe cache get)
      - name: Build concrete arbitrary-law Hilbert prerequisites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mathlib4/.lake/build/lib/lean
          P=research/nightfall/formalization/observability
          for module in ArbitraryLawFourthMoment HilbertTwoIncrementMoment HilbertManyIncrementMoment QuadraticEndpointInterpolation; do
            cp "$P/$module.lean" "/tmp/mathlib4/$module.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean")
          done
      - name: Strict kernel check all new actual moment declarations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.QuadraticActualMomentEndpoint
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/QuadraticActualMomentEndpoint.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.weighted_l1_l2_l4 \
            --decl $N.actual_product_l1_l2_l4 \
            --decl $N.actual_product_fourth_endpoint \
            --json-out lean-receipts/q2-actual-moment-endpoint.json || {
              cat lean-receipts/q2-actual-moment-endpoint.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-actual-moment-endpoint.json
      - name: Hash exact sources and compiler inputs
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/{ArbitraryLawFourthMoment,HilbertTwoIncrementMoment,HilbertManyIncrementMoment,QuadraticEndpointInterpolation,QuadraticActualMomentEndpoint}.lean > lean-receipts/SHA256SUMS
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
          git rev-parse HEAD > lean-receipts/source-commit.txt
          (git -C /tmp/mathlib4 rev-parse HEAD || true) > lean-receipts/mathlib-commit.txt
      - name: Upload source-hashed kernel receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-actual-moment-endpoint-kernel-receipt
          path: lean-receipts/
          retention-days: 45
          if-no-files-found: warn
