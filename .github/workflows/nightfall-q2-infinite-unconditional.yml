            cp "$P" "/tmp/mathlib4/$F.lean"
            echo "::group::$F"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$F.olean" "$F.lean")
            echo "::endgroup::"
          done
      - name: Strict named-theorem and standard axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-infinite-unconditional
          N=Nightfall.InfinitePiQ2UnconditionalTerminal
          C=Nightfall.InfinitePiQ2CellAverage.CellLabels
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2UnconditionalTerminal.lean \
            --workspace /tmp/mathlib4 --strict --timeout 1800 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl "$N.infinitePi_q2_105416_ae" \
            --decl "$N.infinitePi_q2_core" \
            --decl "$N.infinitePi_q2_105416_unconditional" \
            --decl "$N.infinitePi_q2_105416_unconditional_variance" \
            --decl "$N.exists_labels_variance_gap" \
            --decl "$N.cellAverage_q2_all" \
            --decl "$C.native_influence_le" \
            --decl "$C.avg_nativeSupportedDegreeTwo" \
            --decl "$C.avg_nativeSupportedDegreeTwo_of_triple" \
            --decl "$C.variance_gap_le" \
            --json-out lean-receipts/q2-infinite-unconditional/receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-infinite-unconditional/receipt.json
      - name: Print axioms and types of the terminal declarations (not an independent kernel replay)
