          #check @Nightfall.InfinitePiQ2UnconditionalTerminal.infinitePi_q2_105416_unconditional_variance
          LEAN
          lake env lean NightfallQ2InfiniteAudit.lean | tee "$GITHUB_WORKSPACE/lean-receipts/q2-infinite-unconditional/axioms.txt"
