      - name: Capture exact source and compiler head
        if: always()
        run: |
          mkdir -p lean-receipts/q2-infinite-unconditional
          git rev-parse HEAD > lean-receipts/q2-infinite-unconditional/head
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2CellAverage.lean \
            research/nightfall/formalization/universal/InfinitePiQ2UnconditionalTerminal.lean \
            > lean-receipts/q2-infinite-unconditional/source-sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-infinite-unconditional-${{ github.run_id }}
          path: lean-receipts/q2-infinite-unconditional
          if-no-files-found: warn
