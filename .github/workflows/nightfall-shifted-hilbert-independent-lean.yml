name: NIGHTFALL independent shifted Hilbert source-only 6over25 certificate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - nightfall-q2-unrestricted-105-742-quarter-sharpen-20261114
    paths:
      - 'research/nightfall/formalization/q2_shifted/ShiftedIndependentHilbert6over25.lean'
      - '.github/workflows/nightfall-shifted-hilbert-independent-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightfall-independent-hilbert-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  independent-hilbert-source:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact effective PR merge tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Lean and exact Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile exact transitive independent-Hilbert proof sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.nightfall_q2_certify import local_sources, closure, sha256, ROOT
          from pathlib import Path
          import subprocess, shutil, json
          files=local_sources()
          names=closure("ShiftedIndependentHilbert6over25",files)
          space=Path("/tmp/mathlib4")
          out=space/".lake/build/lib/lean"
          out.mkdir(parents=True,exist_ok=True)
          receipts=Path("lean-receipts/independent-hilbert-6over25")
          receipts.mkdir(parents=True,exist_ok=True)
          manifest=[]
          for name in names:
              src=files[name]
              dst=space/(name+".lean")
              shutil.copyfile(src,dst)
              assert sha256(src)==sha256(dst)
              print("BUILD",name,flush=True)
              subprocess.run(["lake","env","lean","-o",str(out/(name+".olean")),dst.name],
                check=True,cwd=space,timeout=1200)
              manifest.append({"path":str(src.relative_to(ROOT)),"sha256":sha256(src)})
          (receipts/"source-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
      - name: Strict full independent-family named-axiom audit
        shell: bash
        run: |
          set -euo pipefail
          OUT=lean-receipts/independent-hilbert-6over25
          SRC=research/nightfall/formalization/q2_shifted/ShiftedIndependentHilbert6over25.lean
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.ShiftedIndependentHilbert.independent_shifted_product_l1_l2_l4 \
            --decl Nightfall.ShiftedIndependentHilbert.independent_shifted_hilbert_six_over_twentyfive \
            --json-out "$OUT/declarations.json"
          python3 research/nightfall/formalization/product_space/check_receipts.py "$OUT/declarations.json"
      - name: Immutable provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/independent-hilbert-6over25
          git rev-parse HEAD > lean-receipts/independent-hilbert-6over25/effective-commit.txt
          cat lean-toolchain > lean-receipts/independent-hilbert-6over25/toolchain.txt
          if [ -d /tmp/mathlib4/.git ]; then
            git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/independent-hilbert-6over25/mathlib-commit.txt
          fi
          sha256sum research/nightfall/formalization/q2_shifted/ShiftedIndependentHilbert6over25.lean > lean-receipts/independent-hilbert-6over25/SHA256SUMS.txt
      - name: Preserve exact kernel receipts (including failures)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: independent-hilbert-6over25-${{ github.run_id }}
          path: lean-receipts/independent-hilbert-6over25
          retention-days: 60
