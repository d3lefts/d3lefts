name: NIGHTFALL mass-weighted weight removal - Lean 4.35.0
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/MassWeightedRemoval.lean'
      - '.github/workflows/nightfall-mass-weight-removal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mass-weight-removal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.35.0 and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          git clone --depth 1 --branch v4.35.0 https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4
          (cd /tmp/mathlib4 && $HOME/.elan/bin/lake exe cache get)
      - name: Compile exact merged predecessor as an importable module
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/product_space/LocalizedWeightRemoval.lean /tmp/mathlib4/LocalizedWeightRemoval.lean
          mkdir -p /tmp/mathlib4/.lake/build/lib/lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/LocalizedWeightRemoval.olean LocalizedWeightRemoval.lean)
      - name: Kernel-check mass absorption and full conditional connection
        shell: bash
        run: |
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/MassWeightedRemoval.lean \
            --workspace /tmp/mathlib4 \
            --timeout 600 \
            --decl Nightfall.ProductSpace.invCost_scaled \
            --decl Nightfall.ProductSpace.scaled_pair_sum \
            --decl Nightfall.ProductSpace.scaled_pair_inv \
            --decl Nightfall.ProductSpace.load_scaled \
            --decl Nightfall.ProductSpace.localized_weight_removal_mass \
            --json-out lean-receipts/mass-weight-removal.json || {
              cat lean-receipts/mass-weight-removal.json
              exit 1
            }
      - name: Axiom audit
        run: |
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/mass-weight-removal.json
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mass-weight-removal-receipt
          path: lean-receipts/*.json
          if-no-files-found: warn
          retention-days: 30
