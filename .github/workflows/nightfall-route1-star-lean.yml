name: NIGHTFALL Route 1 finite star kernel Lean 4.36.0-rc2
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/Route1StarCoupling.lean'
      - '.github/workflows/nightfall-route1-star-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  star-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Lean and resolve pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" update
          test -s lake-manifest.json
      - name: Download Mathlib build cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get
      - name: Kernel-check exact finite star marginals and print axioms
        shell: bash
        run: |
          set -euo pipefail
          lake env lean research/nightfall/formalization/product_space/Route1StarCoupling.lean 2>&1 | tee route1-star-lean.log
          ! grep -Eq '(sorryAx|unknown constant|error:)' route1-star-lean.log
          grep -q 'starMass_component' route1-star-lean.log
          sha256sum research/nightfall/formalization/product_space/Route1StarCoupling.lean | tee route1-star-lean-source-sha256.txt
      - name: Preserve exact-head source and kernel receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route1-finite-star-kernel-receipt
          path: |
            route1-star-lean.log
            route1-star-lean-source-sha256.txt
          if-no-files-found: warn
          retention-days: 60
