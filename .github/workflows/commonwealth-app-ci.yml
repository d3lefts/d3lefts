name: Commonwealth OS app — synthetic CI
on:
  pull_request:
    paths:
      - 'projects/commonwealth-os/app/**'
      - 'projects/commonwealth-os/workflow/**'
      - '.github/workflows/commonwealth-app-ci.yml'
  push:
    branches: [main]
    paths:
      - 'projects/commonwealth-os/app/**'
      - 'projects/commonwealth-os/workflow/**'
      - '.github/workflows/commonwealth-app-ci.yml'
permissions:
  contents: read
jobs:
  contract-and-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application test dependencies
        run: python -m pip install -r projects/commonwealth-os/app/requirements.txt
      - name: Compile Python code
        run: python -m compileall -q projects/commonwealth-os/app projects/commonwealth-os/workflow
      - name: JavaScript syntax
        run: |
          node --check projects/commonwealth-os/app/static/app.js
          node --check projects/commonwealth-os/app/static/riverfront.js
      - name: Contract tests and HTTP integration tests
        working-directory: projects/commonwealth-os
        run: python -m pytest -q app/tests/test_app.py workflow/test_workflow.py
