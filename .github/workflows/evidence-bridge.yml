name: RYEV Evidence Bridge and controlled-evaluation checks
on:
  pull_request:
    paths:
      - "docs/claim-lab.html"
      - "docs/evidence-bridge-core.js"
      - "research/nightfall/evidence-bridge/**"
      - "research/nightfall/observatory/gate-c-ryev/**"
      - ".github/workflows/evidence-bridge.yml"
  push:
    branches: [main]
    paths:
      - "docs/claim-lab.html"
      - "docs/evidence-bridge-core.js"
      - "research/nightfall/evidence-bridge/**"
      - "research/nightfall/observatory/gate-c-ryev/**"
      - ".github/workflows/evidence-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-security-and-independent-arithmetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse source and assert published adapter matches test source
        run: |
          node --check docs/evidence-bridge-core.js
          node --check research/nightfall/evidence-bridge/core.js
          node --check research/nightfall/evidence-bridge/test.cjs
          node --check research/nightfall/evidence-bridge/test_browser.mjs
          node --check research/nightfall/evidence-bridge/test_owner_handoff.mjs
          cmp docs/evidence-bridge-core.js research/nightfall/evidence-bridge/core.js
      - name: Strict receipt tests and frozen fixture exports
        run: |
          BRIDGE_FIXTURE_DIR=/tmp/ryev-bridge-fixtures node research/nightfall/evidence-bridge/test.cjs
          python3 -m json.tool /tmp/ryev-bridge-fixtures/refusals.json > /dev/null
      - name: Independent Python finite replay
        run: |
          python3 research/nightfall/referee/independent_verify.py /tmp/ryev-bridge-fixtures/sidon.json
          python3 research/nightfall/referee/independent_verify.py /tmp/ryev-bridge-fixtures/overlap.json
          if python3 research/nightfall/referee/independent_verify.py /tmp/ryev-bridge-fixtures/tamperedSidon.json; then
            echo "ERROR: Python accepted tampered witness"; exit 1
          fi
      - name: Invariant Forge positive metamorphic controls
        run: |
          node --check research/nightfall/evidence-bridge/invariant_forge.cjs
          node research/nightfall/evidence-bridge/invariant_forge.cjs > /tmp/invariant-forge.json
          python3 -m json.tool /tmp/invariant-forge.json > /dev/null
      - name: Freeze Gate C inputs and enforce blinded matched allocations
        run: |
          node --check research/nightfall/observatory/gate-c-ryev/runner.cjs
          node research/nightfall/observatory/gate-c-ryev/runner.cjs --selftest
          node research/nightfall/observatory/gate-c-ryev/runner.cjs --freeze /tmp/ryev-gate-c
          python3 -m json.tool /tmp/ryev-gate-c/freeze.json > /dev/null
      - name: Vesper original v1 equal-retrieval and Scope Faultline preflight
        run: |
          node --check research/nightfall/observatory/gate-c-ryev/parity_runner.cjs
          node --check research/nightfall/observatory/gate-c-ryev/metering_core.cjs
          node --check research/nightfall/observatory/gate-c-ryev/run_metered.cjs
          node --check research/nightfall/observatory/gate-c-ryev/test_metering.cjs
          node research/nightfall/observatory/gate-c-ryev/test_metering.cjs
          node --check research/nightfall/evidence-bridge/scope_faultline.cjs
          node research/nightfall/observatory/gate-c-ryev/parity_runner.cjs --selftest
          node research/nightfall/observatory/gate-c-ryev/parity_runner.cjs --freeze /tmp/ryev-original-gate-c
          node research/nightfall/evidence-bridge/scope_faultline.cjs --selftest
          node research/nightfall/evidence-bridge/scope_faultline.cjs --json > /tmp/ryev-scope-faultline.json
          python3 -m json.tool /tmp/ryev-original-gate-c/freeze.json >/dev/null
      - name: Browser consent, backup, reload, import security
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          BRIDGE_FIXTURE_DIR=/tmp/ryev-bridge-fixtures CHROME_BIN="$(command -v google-chrome)" node research/nightfall/evidence-bridge/test_browser.mjs
          CHROME_BIN="$(command -v google-chrome)" node research/nightfall/evidence-bridge/test_owner_handoff.mjs
      - name: Archive Invariant Forge and blinded Gate C execution package
        uses: actions/upload-artifact@v4
        with:
          name: ryEV-invariant-and-gate-c-frozen-inputs
          path: |
            /tmp/invariant-forge.json
            /tmp/ryev-gate-c/freeze.json
            /tmp/ryev-gate-c/operator-jobs.json
            /tmp/ryev-gate-c/blind-grading-template.json
            /tmp/ryev-original-gate-c/freeze.json
            /tmp/ryev-scope-faultline.json
          retention-days: 90
      - name: Archive receipt fixtures and refusal explanations
        uses: actions/upload-artifact@v4
        with:
          name: ryEV-evidence-bridge-security-receipts
          path: /tmp/ryev-bridge-fixtures
          retention-days: 90

