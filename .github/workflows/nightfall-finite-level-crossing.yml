name: NIGHTFALL finite level crossing - pinned Lean 4.33.0
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/FiniteLevelCrossing.lean'
      - 'research/nightfall/formalization/product_space/ProductSpaceTwoSidedBridge.lean'
      - 'research/nightfall/2026-11-certificate-engine/CERTIFICATION_UPDATE_20261110.md'
      - '.github/workflows/nightfall-finite-level-crossing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-level-crossing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Pin Turturean's antipodal input
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/physical-superintelligence/aaronson-ambainis.git /tmp/aa
          git -C /tmp/aa checkout 2a6ceaef872ae993708950f951989134084b851a
          cd /tmp/aa
          lake exe cache get
          lake build AaronsonAmbainis.DetTheorem AaronsonAmbainis.TwoSided.Antipodal AaronsonAmbainis.Bridge.Positivity
      - name: Compile PR298 two-sided theorem as imported Lean module
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/product_space/ProductSpaceTwoSidedBridge.lean /tmp/aa/ProductSpaceTwoSidedBridge.lean
          mkdir -p /tmp/aa/.lake/build/lib/lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/ProductSpaceTwoSidedBridge.olean ProductSpaceTwoSidedBridge.lean)
      - name: Kernel-check threshold rows and finite level-crossing implication
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/FiniteLevelCrossing.lean \
            --workspace /tmp/aa --timeout 900 \
            --decl Nightfall.ProductSpace.LevelCrossing.thresholdRow_isProductRow \
            --decl Nightfall.ProductSpace.LevelCrossing.thresholdRow_norm_pos \
            --decl Nightfall.ProductSpace.LevelCrossing.threshold_positive_inverse_cost \
            --decl Nightfall.ProductSpace.LevelCrossing.threshold_negative_inverse_cost \
            --decl Nightfall.ProductSpace.LevelCrossing.finite_level_crossing \
            --json-out lean-receipts/finite-level-crossing.json || {
              cat lean-receipts/finite-level-crossing.json || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/finite-level-crossing.json
      - name: Capture immutable source hashes and upstream pin
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/product_space/FiniteLevelCrossing.lean research/nightfall/formalization/product_space/ProductSpaceTwoSidedBridge.lean > lean-receipts/SHA256SUMS.txt
          echo 2a6ceaef872ae993708950f951989134084b851a > lean-receipts/turturean-upstream-commit.txt
          echo leanprover/lean4:v4.33.0 > lean-receipts/lean-toolchain.txt
      - name: Archive checker receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-level-crossing-receipt
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 30
