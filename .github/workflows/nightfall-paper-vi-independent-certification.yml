name: NIGHTFALL Paper VI independent certification
on:
  pull_request:
    paths:
      - 'research/nightfall/paper-vi-independent-20261125/**'
      - '.github/workflows/nightfall-paper-vi-independent-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper-vi:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Restore exact checkpoint or rebuild on GitHub runner
        uses: ./.github/actions/setup-nightfall-paper-vi-dependencies
        with:
          receipts: receipts
          require-warm: 'false'
      - name: Compile recovered and newly composed actual theorem sources
        shell: bash
        env:
          LEAN_NUM_THREADS: '1'
        run: |
          set -uo pipefail
          mkdir -p receipts
          git rev-parse HEAD > receipts/head.txt
          ps=research/nightfall/formalization/product_space
          si=research/nightfall/formalization/structural_information
          old=research/nightfall/paper-vi-independent-20261125
          base=research/nightfall/paper-vi-independent-20261125
          failed=0
          compile() {
            local path="$1" m
            m=$(basename "$path" .lean)
            sha256sum "$path" >> receipts/SHA256SUMS
            cp "$path" "/tmp/mathlib4/$m.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean") 2>&1 | tee "receipts/$m.log"
          }
          replay() {
            local m="$1"
            (cd /tmp/mathlib4 && lake env leanchecker -v "$m") 2>&1 | tee "receipts/$m.kernel.log"
          }
          target() {
            local p="$1" m
            m=$(basename "$p" .lean)
            if compile "$p" && replay "$m"; then echo "$m PASS" | tee -a receipts/status.txt
            else echo "$m FAIL" | tee -a receipts/status.txt; failed=1; fi
          }
          for M in QueryLocalWynerCompiler QueryLocalWynerDegree QueryLocalWynerTerminal QueryLocalWynerComplete; do
            compile "$base/recovered/$M.lean" || failed=1
          done
          for M in QuadraticWynerLabelProjection QuadraticWynerSeedAverage QuadraticWynerSeedResampling QuadraticWynerQ2SourceBridge QuadraticWynerQuadraticProgress QuadraticWynerGoodQuery QuadraticWynerMeanIncrementProgress PaperVIProjectedCrux PaperVISquaredEnergy PaperVIRiskTree PaperVIStageBudget PaperVILinearCharge PaperVIMSETerminal PaperVIGeneralLatentTerminal; do
            compile "$ps/$M.lean" || failed=1
          done
          replay PaperVIGeneralLatentTerminal || failed=1
          target "$old/PaperVIReferenceTransfer.lean"
          target "$base/PaperVIPaidTransfer.lean"
          exit "$failed"
      - name: Standard-axiom and named terminal audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 research/nightfall/paper-vi-independent-20261125/audit.py route1 receipts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: paper-vi-independent-${{ github.run_id }}
          path: receipts
          retention-days: 90
