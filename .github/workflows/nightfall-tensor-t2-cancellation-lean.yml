name: NIGHTFALL tensor T2 cancellation Lean audit
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/structural_information/TensorT2Cancellation.lean'
      - '.github/workflows/nightfall-tensor-t2-cancellation-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-t2-cancellation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile and kernel-check genuine algebra theorem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tensor-t2-cancellation-receipt
          src=research/nightfall/formalization/structural_information/TensorT2Cancellation.lean
          cp "$src" /tmp/mathlib4/TensorT2Cancellation.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/TensorT2Cancellation.olean TensorT2Cancellation.lean) 2>&1 | tee tensor-t2-cancellation-receipt/compile.log
          (cd /tmp/mathlib4 && lake env leanchecker TensorT2Cancellation) 2>&1 | tee tensor-t2-cancellation-receipt/kernel.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('research/nightfall/formalization/structural_information/TensorT2Cancellation.lean').read_text()
          log=Path('tensor-t2-cancellation-receipt/compile.log').read_text()
          assert not re.search(r'(?m)^\s*(sorry|admit|axiom)\b',s)
          assert 'error:' not in log
          names=['pair_zero_iff_eq','repeated_four_labels_collapse','overlapping_zero_triples_force_repeat']
          assert all(name in log for name in names)
          matches=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',log)
          assert len(matches)>=3
          allowed={'propext','Classical.choice','Quot.sound'}
          assert all(set(v.strip() for v in m.split(',') if v.strip())<=allowed for m in matches)
          print('TENSOR_T2_CANCELLATION_KERNEL_PASS_SCOPED')
          PY
      - name: Persist source and receipt
        if: always()
        run: |
          mkdir -p tensor-t2-cancellation-receipt
          git rev-parse HEAD > tensor-t2-cancellation-receipt/commit.txt
          sha256sum research/nightfall/formalization/structural_information/TensorT2Cancellation.lean > tensor-t2-cancellation-receipt/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tensor-t2-cancellation-receipt
          path: tensor-t2-cancellation-receipt/
          retention-days: 90
