name: NIGHTFALL minimal zero-circuit extraction Lean kernel
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/structural_information/TensorMinimalZeroCircuit.lean'
      - '.github/workflows/nightfall-tensor-minimal-zero-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimal-circuit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile and kernel-check minimal-zero-subset theorem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p minimal-zero-receipt
          src=research/nightfall/formalization/structural_information/TensorMinimalZeroCircuit.lean
          cp "$src" /tmp/mathlib4/TensorMinimalZeroCircuit.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/TensorMinimalZeroCircuit.olean TensorMinimalZeroCircuit.lean) 2>&1 | tee minimal-zero-receipt/compile.log
          (cd /tmp/mathlib4 && lake env leanchecker TensorMinimalZeroCircuit) 2>&1 | tee minimal-zero-receipt/kernel.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('research/nightfall/formalization/structural_information/TensorMinimalZeroCircuit.lean').read_text()
          log=Path('minimal-zero-receipt/compile.log').read_text()
          assert not re.search(r'(?m)^\s*(sorry|admit|axiom)\b',s)
          assert 'error:' not in log
          for name in ['exists_minimal_zero_circuit','no_singleton_zero_circuit','remove_minimal_circuit_preserves_zero']:
            assert name in log
          reports=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',log)
          none=re.findall(r'does not depend on any axioms',log)
          assert len(reports)+len(none)>=3
          allowed={'propext','Classical.choice','Quot.sound'}
          assert all(set(x.strip() for x in m.split(',') if x.strip())<=allowed for m in reports)
          print('TENSOR_MINIMAL_ZERO_CIRCUIT_KERNEL_PASS')
          PY
      - name: Exact source receipt
        if: always()
        run: |
          mkdir -p minimal-zero-receipt
          git rev-parse HEAD > minimal-zero-receipt/HEAD
          sha256sum research/nightfall/formalization/structural_information/TensorMinimalZeroCircuit.lean > minimal-zero-receipt/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: tensor-minimal-zero-receipt
          path: minimal-zero-receipt/
          retention-days: 90
