name: NIGHTFALL Q3 reuse all-degree original-law Efron-Stein Lean
on:
  push:
    branches: [nightfall-fair-cubic-rainbow-e2-20261117]
    paths:
      - '.github/workflows/nightfall-q3-efronstein-reuse.yml'
      - 'research/nightfall/formalization/observability/ActualSourceEfronStein.lean'
  pull_request:
    paths:
      - '.github/workflows/nightfall-q3-efronstein-reuse.yml'
      - 'research/nightfall/formalization/observability/ActualSourceEfronStein.lean'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  q3-original-source-efron-reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile source-pinned original-law ANOVA transitive imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, shutil
          from scripts.nightfall_q2_certify import local_sources, closure
          files = local_sources()
          for module in closure('ActualSourceEfronStein', files):
              shutil.copyfile(files[module], Path('/tmp/mathlib4') / (module+'.lean'))
              subprocess.run(['lake','env','lean','-o',
                  '.lake/build/lib/lean/'+module+'.olean', module+'.lean'],
                  cwd='/tmp/mathlib4',check=True)
          PY
      - name: Strict original-law all-degree Efron Stein named theorem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          SRC=research/nightfall/formalization/observability/ActualSourceEfronStein.lean
          N=Nightfall.Observability.ActualSourceEfronStein
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.sector_energy_nonneg \
            --decl $N.sector_below_coordinate_incidence \
            --decl $N.original_source_all_degree_efron_stein \
            --json-out lean-receipts/q3-original-law-efronstein.json || {
              cat lean-receipts/q3-original-law-efronstein.json || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q3-original-law-efronstein.json
      - name: Preserve exact source and compiler revisions
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/ActualSourceEfronStein.lean > lean-receipts/SHA256SUMS
          git rev-parse HEAD > lean-receipts/repository-head.txt
          (git -C /tmp/mathlib4 rev-parse HEAD || true) > lean-receipts/mathlib-head.txt
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
      - name: Archive original-law Efron Stein receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-q3-source-efronstein-lean
          path: lean-receipts/
          retention-days: 45
          if-no-files-found: warn
