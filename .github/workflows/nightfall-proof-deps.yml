name: NIGHTFALL exact shared proof dependency checkpoint
on:
  pull_request:
    paths:
      - 'scripts/nightfall_proof_deps_cache.py'
      - '.github/actions/setup-nightfall-proof-deps/**'
      - '.github/workflows/nightfall-proof-deps.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/nightfall_proof_deps_cache.py'
      - '.github/actions/setup-nightfall-proof-deps/**'
      - '.github/workflows/nightfall-proof-deps.yml'
      - 'research/nightfall/formalization/aa_product/**'
      - 'research/nightfall/formalization/product_space/**'
      - 'research/nightfall/formalization/universal/**'
      - 'research/nightfall/formalization/observability/**'
      - 'research/nightfall/formalization/q2_shifted/**'
      - 'research/nightfall/formalization/vendor/aaronson_ambainis/**'
      - 'lean-toolchain'
      - 'docs/lean-compiler-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - uses: ./.github/actions/setup-nightfall-proof-deps
      - name: Dependency kernel replay
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          LEAN_NUM_THREADS=1 lake env leanchecker -v Route1WynerGeneral
  restore-test:
    needs: checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - uses: ./.github/actions/setup-nightfall-proof-deps
      - name: Verify restored dependency kernel
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          LEAN_NUM_THREADS=1 lake env leanchecker -v Route1WynerGeneral
