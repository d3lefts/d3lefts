name: NIGHTFALL Q2 finite original-source zero-cell repair Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2FiniteSupportRepair.lean'
      - '.github/workflows/nightfall-infinitepi-q2-positive-support-repair.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-positive-support-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  original-source-support-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned Lean and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile degree retraction and source support repair
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/universal/InfinitePiQ2DegreeRetraction.lean /tmp/mathlib4/InfinitePiQ2DegreeRetraction.lean
          cp research/nightfall/formalization/universal/InfinitePiQ2FiniteSupportRepair.lean /tmp/mathlib4/InfinitePiQ2FiniteSupportRepair.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/InfinitePiQ2DegreeRetraction.olean InfinitePiQ2DegreeRetraction.lean)
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/InfinitePiQ2FiniteSupportRepair.olean InfinitePiQ2FiniteSupportRepair.lean)
      - name: Strict named theorem and standard-axiom check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-infinite
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2FiniteSupportRepair.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2FiniteSupportRepair.exists_positive_original_letter \
            --decl Nightfall.InfinitePiQ2FiniteSupportRepair.positiveDefault_pos \
            --decl Nightfall.InfinitePiQ2FiniteSupportRepair.retractToPositive_pos \
            --decl Nightfall.InfinitePiQ2FiniteSupportRepair.retractToPositive_eq_of_pos \
            --decl Nightfall.InfinitePiQ2FiniteSupportRepair.mapped_word_supported \
            --decl Nightfall.InfinitePiQ2FiniteSupportRepair.mapped_word_eq_of_supported \
            --decl Nightfall.InfinitePiQ2FiniteSupportRepair.supported_degree_two_retraction \
            --decl Nightfall.InfinitePiQ2FiniteSupportRepair.supported_bound_retraction \
            --json-out lean-receipts/q2-infinite/positive-support-repair.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-infinite/positive-support-repair.json
      - name: Exact source provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-infinite
          git rev-parse HEAD > lean-receipts/q2-infinite/positive-support-head.txt
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2FiniteSupportRepair.lean > lean-receipts/q2-infinite/positive-support-sha256.txt
      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-original-support-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-infinite
          if-no-files-found: warn
