name: PR1000 product-sphere maximal-padding Lean (conditional topology)
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/finite_field/ProductSpherePadding.lean'
      - '.github/workflows/nightfall-pr1000-productsphere-padding.yml'
  push:
    paths:
      - 'research/nightfall/formalization/finite_field/ProductSpherePadding.lean'
      - '.github/workflows/nightfall-pr1000-productsphere-padding.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-padding-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile exact pinned source and its already merged topology interface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/pr1000-productsphere-padding
          for M in ProductSphereObstruction ProductSpherePadding; do
            cp "research/nightfall/formalization/finite_field/$M.lean" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean") 2>&1 | tee "receipts/pr1000-productsphere-padding/$M.log"
            ! grep -E '(^|:)error:|declaration uses .sorry' "receipts/pr1000-productsphere-padding/$M.log"
          done
      - name: Reject nonstandard axioms and validate exact terminal signature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('receipts/pr1000-productsphere-padding/ProductSpherePadding.log').read_text()
          for name in ['Nightfall.ProductSpherePadding.productSphereZero_of_max',
                       'Nightfall.ProductSpherePadding.productSphereZero_all_subcritical']:
              m=re.search(r"'" + re.escape(name) + r"' depends on axioms:\s*\[([^\]]*)\]",s,re.S)
              assert m,("MISSING_AXIOMS",name)
              a={z.strip() for z in m.group(1).split(',') if z.strip()}
              assert a <= {'propext','Classical.choice','Quot.sound'},(name,a)
          assert 'sorryAx' not in s
          assert 'theorem Nightfall.ProductSpherePadding.productSphereZero_all_subcritical' in s
          assert 'ProductSphereZero n (n - 1) (n - 1)' in s
          assert 'ProductSphereZero n p q' in s
          print("PASS: pure-character rank padding is kernel-checked, conditional on maximal ProductSphereZero only.")
          print("UNPROVED: maximal product-sphere topological existence theorem.")
          PY
      - name: Preserve exact source evidence
        if: always()
        shell: bash
        run: |
          mkdir -p receipts/pr1000-productsphere-padding
          git rev-parse HEAD > receipts/pr1000-productsphere-padding/commit.txt
          cat lean-toolchain > receipts/pr1000-productsphere-padding/toolchain.txt
          sha256sum research/nightfall/formalization/finite_field/ProductSpherePadding.lean > receipts/pr1000-productsphere-padding/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1000-productsphere-padding-lean-receipt
          path: receipts/pr1000-productsphere-padding
          if-no-files-found: warn
          retention-days: 90
