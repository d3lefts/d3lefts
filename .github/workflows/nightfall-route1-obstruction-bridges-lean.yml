name: NIGHTFALL Route1 obstruction bridges
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/Route1RecoveryEntropy.lean'
      - 'research/nightfall/formalization/product_space/Route1OrthogonalCorrelation.lean'
      - '.github/workflows/nightfall-route1-obstruction-bridges-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridges:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile and replay named bridge declarations
        shell: bash
        run: |
          set -euo pipefail
          R="$PWD/receipts/route1-obstruction-bridges"
          mkdir -p "$R"
          git rev-parse HEAD > "$R/commit.txt"
          for M in Route1StaticObstruction Route1RecoveryEntropy Route1OrthogonalCorrelation; do
            P="research/nightfall/formalization/product_space/$M.lean"
            sha256sum "$P" >> "$R/SHA256SUMS"
            cp "$P" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean") 2>&1 | tee "$R/$M.compile.log"
            (cd /tmp/mathlib4 && lake env leanchecker "$M") 2>&1 | tee "$R/$M.checker.log"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('receipts/route1-obstruction-bridges')
          targets = {
              'Route1RecoveryEntropy': ['BinaryRecovery.image_card_le', 'support_entropy_le', 'recovery_entropy_le'],
              'Route1OrthogonalCorrelation': ['twice_score_le_energy', 'one_block_energy', 'weighted_bias_jensen', 'tv_one_block_energy'],
          }
          for module, names in targets.items():
              s = (root / (module + '.compile.log')).read_text()
              assert 'sorryAx' not in s and 'declaration uses' not in s
              reports = dict(re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]", s))
              for name in names:
                  full = 'Nightfall.' + module + '.' + name
                  assert full in reports, (full, reports)
                  assert {a.strip() for a in reports[full].split(',') if a.strip()} <= {'propext', 'Classical.choice', 'Quot.sound'}
          print('PASS: seven named bridge declarations; standard axioms only')
          PY
      - name: Preserve exact replay receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route1-obstruction-bridges-receipt
          path: receipts/route1-obstruction-bridges
          if-no-files-found: error
