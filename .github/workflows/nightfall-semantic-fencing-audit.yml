name: NIGHTFALL semantic-fencing source-matched audit
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'research/nightfall/assurance/semantic-fencing-v0.3/**'
      - '.github/workflows/nightfall-semantic-fencing-audit.yml'
  workflow_dispatch:
concurrency:
  group: nightfall-semantic-fencing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  exact-finite-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reproduce exact Python/SQLite checks
        shell: bash
        run: bash research/nightfall/assurance/semantic-fencing-v0.3/run_all.sh
