name: NIGHTFALL Q2 625 scalar and arbitrary-index transfer stages

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/Q2UniversalTransfer.lean'
      - 'research/nightfall/formalization/observability/Q2625ScalarEnvelope.lean'
      - '.github/workflows/nightfall-q2-625-universal-stage.yml'
  workflow_dispatch:

concurrency:
  group: nightfall-q2-625-transfer-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scalar-transfer-lean:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup exact Lean and Mathlib pin
        uses: ./.github/actions/setup-nightfall-lean
      - name: Strict scalar-budget implication (conditional on sitewise proof)
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability/Q2625ScalarEnvelope.lean
          mkdir -p lean-receipts/q2-625-transfer
          cp "$SRC" /tmp/mathlib4/Q2625ScalarEnvelope.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Q2625ScalarEnvelope.olean Q2625ScalarEnvelope.lean)
          N=Nightfall.Q2625ScalarEnvelope
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.sitewise_budget_to_variance_squared \
            --json-out lean-receipts/q2-625-transfer/scalar.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-625-transfer/scalar.json
      - name: Strict arbitrary-index limit (conditional on actual-cylinder interface)
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/universal/Q2UniversalTransfer.lean
          cp "$SRC" /tmp/mathlib4/Q2UniversalTransfer.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Q2UniversalTransfer.olean Q2UniversalTransfer.lean)
          N=Nightfall.Q2UniversalTransfer
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.finite_cylinder_upper_limit \
            --decl $N.quadratic_bound_from_finite_cylinders \
            --json-out lean-receipts/q2-625-transfer/transfer.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-625-transfer/transfer.json
      - name: Immutable code provenance
        if: always()
        run: |
          mkdir -p lean-receipts/q2-625-transfer
          sha256sum research/nightfall/formalization/observability/Q2625ScalarEnvelope.lean research/nightfall/formalization/universal/Q2UniversalTransfer.lean > lean-receipts/q2-625-transfer/SHA256SUMS.txt
          git rev-parse HEAD > lean-receipts/q2-625-transfer/source-head.txt
      - name: Upload scoped receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-625-scalar-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-625-transfer
          if-no-files-found: warn
