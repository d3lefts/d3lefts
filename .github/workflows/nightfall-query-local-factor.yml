name: NIGHTFALL query-local factor theorem (pinned Lean)
on:
  push:
    branches: [nightfall-query-local-factor-transfer-lean-20261119]
    paths:
      - 'research/nightfall/formalization/product_space/QueryLocalDegree.lean'
      - 'research/nightfall/formalization/product_space/QueryDecoderLift.lean'
      - 'research/nightfall/formalization/product_space/QueryLocalFactorTransfer.lean'
      - '.github/workflows/nightfall-query-local-factor.yml'
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/QueryLocalDegree.lean'
      - 'research/nightfall/formalization/product_space/QueryDecoderLift.lean'
      - 'research/nightfall/formalization/product_space/QueryLocalFactorTransfer.lean'
      - '.github/workflows/nightfall-query-local-factor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factor:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile pinned source closure and factor transfer modules
        shell: bash
        run: |
          set -euo pipefail
          while read -r M P; do
            [ -z "$M" ] && continue
            REL="${M//.//}"
            mkdir -p "/tmp/mathlib4/$(dirname "$REL")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$REL")"
            cp "$P" "/tmp/mathlib4/$REL.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$REL.olean" "$REL.lean" 2>&1 | tee "/tmp/factor-$M.log")
          done < research/nightfall/formalization/aa_product/CLOSURE.txt
          for M in QueryLocalDegree QueryDecoderLift QueryLocalFactorTransfer; do
            if [ ! -f "research/nightfall/formalization/product_space/$M.lean" ]; then continue; fi
            cp "research/nightfall/formalization/product_space/$M.lean" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean" 2>&1 | tee "$GITHUB_WORKSPACE/$M-compile.log")
          done
      - name: Named declarations and standard axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/query-factor
          cat >/tmp/mathlib4/QueryFactorAudit.lean <<'LEAN'
          import QueryLocalDegree
          import QueryDecoderLift
          #check @Nightfall.ProductSpace.QueryLocalDegree.degree_pullback
          #check @Nightfall.ProductSpace.QueryDecoderLift.substitute_queries
          #check @Nightfall.ProductSpace.QueryDecoderLift.substitute_eval
          #print axioms Nightfall.ProductSpace.QueryLocalDegree.degree_pullback
          #print axioms Nightfall.ProductSpace.QueryDecoderLift.substitute_queries
          #print axioms Nightfall.ProductSpace.QueryDecoderLift.substitute_eval
          LEAN
          (cd /tmp/mathlib4 && lake env lean QueryFactorAudit.lean) | tee lean-receipts/query-factor/axioms.txt
          ! grep -E 'sorryAx|unknown constant|error:' lean-receipts/query-factor/axioms.txt
      - name: Preserve source hashes
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/query-factor
          git rev-parse HEAD > lean-receipts/query-factor/head
          sha256sum research/nightfall/formalization/product_space/QueryLocal*.lean research/nightfall/formalization/product_space/QueryDecoderLift.lean > lean-receipts/query-factor/source.sha256
          sha256sum research/nightfall/formalization/aa_product/CLOSURE.txt > lean-receipts/query-factor/closure.sha256
          cp /tmp/nightfall-lean-version.txt lean-receipts/query-factor/lean-version.txt 2>/dev/null || true
          cp *-compile.log lean-receipts/query-factor/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nightfall-query-factor-${{ github.run_id }}
          path: lean-receipts/query-factor
          if-no-files-found: warn
