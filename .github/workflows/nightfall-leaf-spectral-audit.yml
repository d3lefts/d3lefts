name: NIGHTFALL leaf-spectral cubic reduction — exact finite audit
on:
  pull_request:
    paths:
      - 'research/nightfall/2026-11-leaf-spectral-transfer/**'
      - '.github/workflows/nightfall-leaf-spectral-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-rational-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact finite Hilbert obstruction and selector resampling checks
        run: python3 -I research/nightfall/2026-11-leaf-spectral-transfer/check_leaf_spectral.py
      - name: Record source hashes
        if: always()
        run: |
          sha256sum research/nightfall/2026-11-leaf-spectral-transfer/LEAF_SPECTRAL_REDUCTION.md research/nightfall/2026-11-leaf-spectral-transfer/check_leaf_spectral.py > leaf-spectral-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaf-spectral-exact-audit
          path: leaf-spectral-sha256.txt
          if-no-files-found: warn
