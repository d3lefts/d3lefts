name: NIGHTFALL actual physical Born and full POVM terminal Lean
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [nightfall/quantum-physical-numerator-bridge-20261116]
    paths:
      - 'research/nightfall/formalization/quantum/PhysicalBornTerminal.lean'
      - 'research/nightfall/2026-11-quantum-terminal/**'
      - '.github/workflows/nightfall-quantum-born-terminal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Build actual physical source and arbitrary POVM dependencies with pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          for F in PhysicalQubitEnsemble TensorCharacter TernaryPhase LocalTernaryMoments PhysicalOperatorReduction BayesPOVMCorner PhysicalPOVMCompression ComplexPOVMOptimal PhysicalSourceBorn PhysicalSourceBornTrace PhysicalOutcomeNumerator AmbientGHZMeasurement; do
            cp "research/nightfall/formalization/quantum/$F.lean" "/tmp/mathlib4/$F.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$F.olean" "$F.lean")
          done
      - name: Compile dependency-closed physical measurement comparison
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/PhysicalBornTerminal.lean /tmp/mathlib4/PhysicalBornTerminal.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/PhysicalBornTerminal.olean PhysicalBornTerminal.lean)
      - name: Audit named statements against pinned kernel and standard axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p physical-terminal-receipts
          N=Nightfall.Quantum.ActualBornTerminal
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/PhysicalBornTerminal.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.bornNum_coherence" --decl "$N.bornDen_actual_weight" --decl "$N.all_physical_povms_bounded" --decl "$N.fullGHZ_positive" --decl "$N.fullGHZ_complete" --decl "$N.plus_actual_source_born" --decl "$N.minus_actual_source_born" --decl "$N.full_GHZ_attains_actual_physical_bound" --decl "$N.actual_physical_povm_optimal" --json-out physical-terminal-receipts/terminal.json
          python3 research/nightfall/formalization/product_space/check_receipts.py physical-terminal-receipts/terminal.json
      - name: Independent exact and numerical physical-state audit
        run: python3 research/nightfall/2026-11-quantum-terminal/check_ghz_full_independent.py
      - name: Freeze exact source identities
        if: always()
        run: |
          mkdir -p physical-terminal-receipts
          git rev-parse HEAD > physical-terminal-receipts/commit.txt
          git -C /tmp/mathlib4 rev-parse HEAD > physical-terminal-receipts/mathlib.txt || true
          sha256sum research/nightfall/formalization/quantum/{PhysicalQubitEnsemble,TensorCharacter,TernaryPhase,LocalTernaryMoments,PhysicalOperatorReduction,PhysicalSourceBorn,PhysicalSourceBornTrace,PhysicalOutcomeNumerator,AmbientGHZMeasurement,PhysicalBornTerminal}.lean > physical-terminal-receipts/source_sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: nightfall-quantum-born-terminal-${{ github.run_id }}
          path: physical-terminal-receipts/
          retention-days: 60
