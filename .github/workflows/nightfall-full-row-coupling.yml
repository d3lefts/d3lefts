name: NIGHTFALL full-row coupling structural theorem exact audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/FullRowScalarTensorization.lean'
      - 'research/nightfall/flagship-influence/check_full_row_tensorization_exact.py'
      - 'research/nightfall/flagship-influence/FULL_ROW_COUPLING_TENSORIZATION_20261118.md'
      - '.github/workflows/nightfall-full-row-coupling.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-exact-scalar-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pin exact Lean Mathlib compiler
        uses: ./.github/actions/setup-nightfall-lean
      - name: Kernel check conditional scalar direct-sum coefficient
        shell: bash
        run: |
          set -euo pipefail
          OUT=proof-receipts/full-row-coupling
          mkdir -p "$OUT"
          SRC=research/nightfall/formalization/universal/FullRowScalarTensorization.lean
          cp "$SRC" /tmp/mathlib4/FullRowScalarTensorization.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/FullRowScalarTensorization.olean FullRowScalarTensorization.lean)
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.FullRowTensorization.scalar_full_row_direct_sum \
            --json-out "$OUT/scalar-conditional.json"
          python3 research/nightfall/formalization/product_space/check_receipts.py "$OUT/scalar-conditional.json"
      - name: Independent original-source row LP and coupled thresholds
        shell: bash
        run: |
          set -euo pipefail
          python3 -I research/nightfall/flagship-influence/check_full_row_tensorization_exact.py \
            | tee proof-receipts/full-row-coupling/exact-replay.txt
      - name: Source SHA256 and compiler provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=proof-receipts/full-row-coupling
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/HEAD.txt"
          git -C /tmp/mathlib4 rev-parse HEAD > "$OUT/mathlib-head.txt" 2>/dev/null || true
          cat lean-toolchain > "$OUT/toolchain.txt" || true
          sha256sum research/nightfall/formalization/universal/FullRowScalarTensorization.lean \
            research/nightfall/flagship-influence/check_full_row_tensorization_exact.py \
            research/nightfall/flagship-influence/FULL_ROW_COUPLING_TENSORIZATION_20261118.md \
            > "$OUT/SHA256SUMS"
      - name: Archive exact source-coupled certificate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightfall-full-row-structural
          path: proof-receipts/full-row-coupling/
          retention-days: 60
