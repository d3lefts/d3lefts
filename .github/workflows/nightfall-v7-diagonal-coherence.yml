name: NIGHTFALL v7 pointwise diagonal sign transfer Lean kernel
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/DiagonalSignCoherence.lean'
      - '.github/workflows/nightfall-v7-diagonal-coherence.yml'
  push:
    branches: [main]
    paths:
      - 'research/nightfall/formalization/observability/DiagonalSignCoherence.lean'
      - '.github/workflows/nightfall-v7-diagonal-coherence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v7-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and Mathlib 4.35.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          git clone --depth 1 --branch v4.35.0 https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4
          (cd /tmp/mathlib4 && "$HOME/.elan/bin/lake" exe cache get)
      - name: Compile declarations and strict standard-axiom receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/DiagonalSignCoherence.lean \
            --workspace /tmp/mathlib4 --timeout 480 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Observability.V7.diagonal_signed_variance \
            --decl Nightfall.Observability.V7.scalar_to_trace_with_coherence \
            --json-out lean-receipts/v7-diagonal-coherence.json || {
              cat lean-receipts/v7-diagonal-coherence.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/v7-diagonal-coherence.json
      - name: Save immutable source and compiler hashes
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/DiagonalSignCoherence.lean > lean-receipts/SHA256SUMS
          echo leanprover/lean4:v4.35.0 > lean-receipts/lean-version.txt
          git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/mathlib-commit.txt 2>/dev/null || true
      - name: Upload compiler and axiom receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-diagonal-coherence-lean-receipts
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 45
