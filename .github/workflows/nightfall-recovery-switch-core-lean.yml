name: NIGHTFALL finite switching core - Lean 4.36.0-rc2
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/FiniteSwitchingCore.lean'
      - 'research/nightfall/formalization/product_space/FiniteSectionSensitivity.lean'
      - 'research/nightfall/formalization/product_space/FiniteEnergyCauchy.lean'
      - '.github/workflows/nightfall-recovery-switch-core-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-switching:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Kernel-check deterministic switching theorems
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/FiniteSwitchingCore.lean \
            --workspace /tmp/mathlib4 --timeout 900 \
            --decl Nightfall.Recovery.switchSupport_card_le \
            --decl Nightfall.Recovery.hybrid_agree_on_support \
            --decl Nightfall.Recovery.hybrid_term_depends \
            --decl Nightfall.Recovery.hybrid_preserves_degree \
            --decl Nightfall.Recovery.hybrid_zero \
            --decl Nightfall.Recovery.hybrid_singleton \
            --decl Nightfall.Recovery.sensitive_block_to_switch \
            --json-out lean-receipts/finite-switch-core.json || {
              cat lean-receipts/finite-switch-core.json || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/finite-switch-core.json
      - name: Kernel-check finite sections and positive-atom sensitivity
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/product_space/FiniteSwitchingCore.lean /tmp/mathlib4/FiniteSwitchingCore.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/FiniteSwitchingCore.olean FiniteSwitchingCore.lean)
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/FiniteSectionSensitivity.lean \
            --workspace /tmp/mathlib4 --timeout 900 \
            --decl Nightfall.Recovery.overwrite_agree_on \
            --decl Nightfall.Recovery.section_term_depends \
            --decl Nightfall.Recovery.section_preserves_degree \
            --decl Nightfall.Recovery.atomMass_pos \
            --decl Nightfall.Recovery.positive_resampling_of_nonconstant \
            --json-out lean-receipts/finite-section-sensitivity.json || {
              cat lean-receipts/finite-section-sensitivity.json || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/finite-section-sensitivity.json
      - name: Kernel-check quantitative energy-to-resampling implication
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/FiniteEnergyCauchy.lean \
            --workspace /tmp/mathlib4 --timeout 900 \
            --decl Nightfall.Recovery.energy_controls_resampling \
            --json-out lean-receipts/finite-energy-cauchy.json || {
              cat lean-receipts/finite-energy-cauchy.json || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/finite-energy-cauchy.json
      - name: Save hashes and pinned inputs
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/product_space/FiniteSwitchingCore.lean research/nightfall/formalization/product_space/FiniteSectionSensitivity.lean research/nightfall/formalization/product_space/FiniteEnergyCauchy.lean > lean-receipts/SHA256SUMS.txt
          git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/mathlib-commit.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-switching-kernel-receipt
          path: lean-receipts/
          if-no-files-found: warn
