name: Publish verified NIGHTFALL AI-safety review ZIP
on:
  push:
    paths:
      - '.github/workflows/publish-ai-safety-review-2026-10-28.yml'
      - 'research/nightfall/releases/.zip-staging-20261028/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and independently verify exact archive bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat research/nightfall/releases/.zip-staging-20261028/zip_part_*.txt | tr -d '\n\r\t ' | base64 --decode > dist/NIGHTFALL_AI_Safety_Peer_Review_Package_2026-10-28.zip
          printf '%s  %s\n' 'c2cd8db71f7116a90d6ba0d0ddfaf6a08b6d710328c0c7d463fa1d1af5f74618' dist/NIGHTFALL_AI_Safety_Peer_Review_Package_2026-10-28.zip | sha256sum -c -
          python - <<'PY'
          import os, zipfile
          p='dist/NIGHTFALL_AI_Safety_Peer_Review_Package_2026-10-28.zip'
          assert os.path.getsize(p) == 4272825
          with zipfile.ZipFile(p) as archive:
              assert len(archive.namelist()) == 116
              assert archive.testzip() is None
          print('VALIDATED: exact SHA-256, 4,272,825 bytes, 116 entries, ZIP CRC integrity.')
          PY
      - name: Upload verified build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: NIGHTFALL_AI_Safety_Peer_Review_2026-10-28
          path: dist/NIGHTFALL_AI_Safety_Peer_Review_Package_2026-10-28.zip
          if-no-files-found: error
      - name: Publish immutable research-release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="ai-safety-review-2026-10-28"
          file="dist/NIGHTFALL_AI_Safety_Peer_Review_Package_2026-10-28.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber
          else
            gh release create "$tag" "$file" --target "${{ github.sha }}" --title "NIGHTFALL AI Safety: Theory and Evidence Review (28 Oct 2026)" --notes "Frozen 116-entry peer-review archive (4,272,825 bytes; SHA-256 c2cd8db71f7116a90d6ba0d0ddfaf6a08b6d710328c0c7d463fa1d1af5f74618). Contains proof manuscripts, SourceBound implementation and evaluation materials, independent finite checker and reviewer guide. External peer review and natural-web validation remain open."
          fi
          gh release view "$tag" --json assets -q '.assets[] | select(.name=="NIGHTFALL_AI_Safety_Peer_Review_Package_2026-10-28.zip") | .size' | grep -Fx '4272825'
