name: NIGHTFALL unified Lean source certificate audit (not a kernel build)

on:
  pull_request:
    paths:
      - 'research/nightfall/**/*.lean'
      - 'research/nightfall/formalization/CERTIFICATE_INDEX.md'
      - 'research/nightfall/formalization/README.md'
      - 'docs/lean-certificate-provenance.json'
      - 'docs/lean-pending-source-custody.json'
      - 'docs/current-lean-proof-receipts-20261114.json'
      - 'scripts/check_current_named_certificates.py'
      - 'docs/q2-source-lean-certificate-20261114.json'
      - 'scripts/check_q2_named_certificate.py'
      - 'scripts/lean_certificate_registry.py'
      - 'scripts/test_lean_certificate_provenance.cjs'
      - 'tests/test_lean_certificate_registry.py'
      - '.github/workflows/nightfall-lean-certificate-registry.yml'
  push:
    branches: [main]
    paths:
      - 'research/nightfall/**/*.lean'
      - 'docs/lean-certificate-provenance.json'
      - 'docs/lean-pending-source-custody.json'
      - 'docs/current-lean-proof-receipts-20261114.json'
      - 'scripts/check_current_named_certificates.py'
      - 'docs/q2-source-lean-certificate-20261114.json'
      - 'scripts/check_q2_named_certificate.py'
      - 'scripts/lean_certificate_registry.py'
      - 'scripts/test_lean_certificate_provenance.cjs'
      - 'tests/test_lean_certificate_registry.py'
      - '.github/workflows/nightfall-lean-certificate-registry.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # Only PR checkouts may have experimental Lean sources with no historical receipt.
  # Main stays fail-closed via the provenance scripts.
  NIGHTFALL_ALLOW_UNREVIEWED: ${{ github.event_name == 'pull_request' && '1' || '0' }}
permissions:
  contents: read

jobs:
  source-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Adversarial mutation tests of source identity and receipt custody
        run: python3 tests/test_lean_certificate_registry.py
      - name: Reconcile all current Lean source hashes with one canonical registry
        run: |
          set -euo pipefail
          pending=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then pending+=(--allow-pending); fi
          python3 scripts/lean_certificate_registry.py --audit "${pending[@]}" \
            --json-out lean-receipts/consolidated-source-index.json
      - name: Verify separately certified current Q2 named declarations and exact source bytes
        run: python3 scripts/check_q2_named_certificate.py --self-test
      - name: Verify all newly merged current named certificate sources and negative controls
        run: python3 scripts/check_current_named_certificates.py --self-test
      - name: Preserve scope-labeled inventory for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-consolidated-lean-source-index
          path: lean-receipts/consolidated-source-index.json
          retention-days: 45
          if-no-files-found: warn
