name: NIGHTFALL two-model public calibration receipt consistency

on:
  pull_request:
    paths:
      - 'research/nightfall/evaluations/assurance/real_agent_pilot/TWO_MODEL_PUBLIC_RECEIPT.json'
      - 'research/nightfall/evaluations/assurance/real_agent_pilot/check_two_model_public_receipt.py'
      - '.github/workflows/nightfall-two-model-public-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata-verification:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Exact source custody and independent public metadata consistency
        run: |
          set -euo pipefail
          mkdir -p proof-receipts/two-model-public
          git rev-parse HEAD > proof-receipts/two-model-public/head.txt
          sha256sum research/nightfall/evaluations/assurance/real_agent_pilot/TWO_MODEL_PUBLIC_RECEIPT.json research/nightfall/evaluations/assurance/real_agent_pilot/check_two_model_public_receipt.py > proof-receipts/two-model-public/SHA256SUMS
          python -I research/nightfall/evaluations/assurance/real_agent_pilot/check_two_model_public_receipt.py | tee proof-receipts/two-model-public/check.txt
      - name: Preserve public metadata certificate with source head
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: two-model-public-receipt-python-${{ matrix.python }}
          path: proof-receipts/two-model-public/
