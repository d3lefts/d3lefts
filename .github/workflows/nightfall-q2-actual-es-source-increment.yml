name: NIGHTFALL Q2 actual ES source-to-Hilbert-moment single-pin bridge
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/ActualESPairHilbertMoment.lean'
      - 'research/nightfall/formalization/observability/ActualESPackedParity.lean'
      - 'research/nightfall/formalization/observability/ActualESGeneralMatching.lean'
      - 'research/nightfall/formalization/observability/ActualESMatchingMass.lean'
      - 'research/nightfall/formalization/observability/ActualESGreedyCover.lean'
      - 'research/nightfall/formalization/observability/ActualESGreedyOwnership.lean'
      - 'research/nightfall/formalization/observability/ActualESOwnedSourceCover.lean'
      - 'research/nightfall/formalization/observability/ActualESOwnedEnergy.lean'
      - 'research/nightfall/formalization/observability/ActualESCanonicalPairGraph.lean'
      - 'research/nightfall/formalization/observability/ActualESFiniteNeighborMoment.lean'
      - 'research/nightfall/formalization/product_space/ActualESConditionalSection.lean'
      - 'research/nightfall/formalization/product_space/ActualESConditionalProjection.lean'
      - 'research/nightfall/formalization/product_space/ActualESOwnedConditional.lean'
      - 'research/nightfall/formalization/product_space/ActualESOrthogonalEnergy.lean'
      - 'research/nightfall/formalization/observability/QuadraticHybridTelescoping.lean'
      - 'research/nightfall/formalization/product_space/ActualESQuadraticRectangles.lean'
      - 'research/nightfall/formalization/observability/QuadraticActualMomentEndpoint.lean'
      - '.github/workflows/nightfall-q2-actual-es-source-increment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-source-moment-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Turturean Lean 4.33.0 source dependency pin
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          git clone https://github.com/physical-superintelligence/aaronson-ambainis.git /tmp/aa
          git -C /tmp/aa checkout 2a6ceaef872ae993708950f951989134084b851a
          (cd /tmp/aa && lake exe cache get)
          (cd /tmp/aa && lake build AaronsonAmbainis.DetTheorem AaronsonAmbainis.TwoSided.Antipodal \
            AaronsonAmbainis.Bridge.Positivity AaronsonAmbainis.Row.Main \
            AaronsonAmbainis.Pack.Main AaronsonAmbainis.Dual.Main \
            AaronsonAmbainis.Level.Integral AaronsonAmbainis.TwoSided.CauchySchwarz)
      - name: Build Efron-Stein actual source and independent Hilbert dependencies on one pin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aa/.lake/build/lib/lean
          P=research/nightfall/formalization/product_space
          O=research/nightfall/formalization/observability
          for module in ProductSpaceTwoSidedBridge ProductRowBound ProductInfluence EfronSteinDegree; do
            cp "$P/$module.lean" "/tmp/aa/$module.lean"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean")
          done
          cp "$P/QuadraticHoeffdingBridge.lean" /tmp/aa/QuadraticHoeffdingBridge.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/QuadraticHoeffdingBridge.olean QuadraticHoeffdingBridge.lean)
          for module in CenteredRectangles ActualESPairMatchingBridge ArbitraryLawFourthMoment HilbertTwoIncrementMoment HilbertManyIncrementMoment QuadraticEndpointInterpolation QuadraticActualMomentEndpoint; do
            case "$module" in
              ActualESPairMatchingBridge) cp "$P/$module.lean" "/tmp/aa/$module.lean";;
              *) cp "$O/$module.lean" "/tmp/aa/$module.lean";;
            esac
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean")
          done
      - name: Strict canonical source mixed-rectangle reduction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/ActualESQuadraticRectangles.lean \
            --workspace /tmp/aa --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl Nightfall.Observability.ActualESQuadraticRectangles.actual_quadratic_rectangle_eq_es_pair \
            --decl Nightfall.Observability.ActualESQuadraticRectangles.pair_dependent_rectangle_base_independent \
            --decl Nightfall.Observability.ActualESQuadraticRectangles.actual_quadratic_rectangle_base_independent \
            --json-out lean-receipts/actual-es-quadratic-rectangle.json || {
              cat lean-receipts/actual-es-quadratic-rectangle.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/actual-es-quadratic-rectangle.json
      - name: Strict real-source packed parity and matching rectangle bound
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space
          O=research/nightfall/formalization/observability
          for module in ActualESQuadraticRectangles; do
            cp "$P/$module.lean" "/tmp/aa/$module.lean"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean")
          done
          for module in ParityBlockCancellation QuadraticHybridTelescoping; do
            cp "$O/$module.lean" "/tmp/aa/$module.lean"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean")
          done
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualESPackedParity
          python3 scripts/lean_bridge.py \
            "$O/ActualESPackedParity.lean" \
            --workspace /tmp/aa --timeout 1200 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.blockReplace_eq_source_updates \
            --decl $N.blockRectangle_eq_sourceRectangle \
            --decl $N.actual_source_global_packed_parity \
            --decl $N.actual_source_packed_rectangles_le_four \
            --json-out lean-receipts/actual-source-packed-parity.json || {
              cat lean-receipts/actual-source-packed-parity.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/actual-source-packed-parity.json
      - name: Strict arbitrary embedded matching and actual source 4B amplitude
        shell: bash
        run: |
          set -euo pipefail
          O=research/nightfall/formalization/observability
          cp "$O/ActualESPackedParity.lean" /tmp/aa/ActualESPackedParity.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/ActualESPackedParity.olean ActualESPackedParity.lean)
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualESGeneralMatching
          python3 scripts/lean_bridge.py \
            "$O/ActualESGeneralMatching.lean" \
            --workspace /tmp/aa --timeout 1200 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.liftMatching_update \
            --decl $N.liftMatching_blockReplace \
            --decl $N.blockRectangle_liftMatching \
            --decl $N.actual_source_general_matching_rectangles_le_four \
            --decl $N.sourceRectangle_eq_actualPairKernel_rectangle \
            --decl $N.actual_source_general_matching_amplitude_witness \
            --json-out lean-receipts/actual-es-general-matching.json || {
              cat lean-receipts/actual-es-general-matching.json
              exit 1
