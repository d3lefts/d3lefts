          echo leanprover/lean4:v4.33.0 > lean-receipts/lean-toolchain.txt
          echo 2a6ceaef872ae993708950f951989134084b851a > lean-receipts/upstream.txt
          git rev-parse HEAD > lean-receipts/repo-commit.txt
      - name: Upload exact source-to-moment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-actual-es-source-increment-receipts
          path: lean-receipts/
          retention-days: 45
