          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/actual-es-greedy-ownership.json
      - name: Strict derived 8B actual-source greedy endpoint cover
        shell: bash
        run: |
          set -euo pipefail
          O=research/nightfall/formalization/observability
          cp "$O/ActualESMatchingMass.lean" /tmp/aa/ActualESMatchingMass.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/ActualESMatchingMass.olean ActualESMatchingMass.lean)
          cp "$O/WeightedGreedyCover.lean" /tmp/aa/WeightedGreedyCover.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/WeightedGreedyCover.olean WeightedGreedyCover.lean)
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualESGreedyCover
          python3 scripts/lean_bridge.py \
            "$O/ActualESGreedyCover.lean" \
