            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.merge_update_outside \
            --decl $N.actual_condExp_esComp_subset \
            --decl $N.actual_condExp_esComp_missing \
            --decl $N.actual_condExp_sum \
            --json-out lean-receipts/actual-es-condexp-projection.json || {
              cat lean-receipts/actual-es-condexp-projection.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/actual-es-condexp-projection.json
      - name: Strict true conditional section on observed source neighbors
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space
          for module in ActualESConditionalSection ActualESConditionalProjection; do
            cp "$P/$module.lean" "/tmp/aa/$module.lean"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean")
