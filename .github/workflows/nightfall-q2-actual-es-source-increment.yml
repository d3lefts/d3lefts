          cp "$O/ActualESGeneralMatching.lean" /tmp/aa/ActualESGeneralMatching.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/ActualESGeneralMatching.olean ActualESGeneralMatching.lean)
          cp "$O/WeightedGreedyMatching.lean" /tmp/aa/WeightedGreedyMatching.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/WeightedGreedyMatching.olean WeightedGreedyMatching.lean)
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualESMatchingMass
