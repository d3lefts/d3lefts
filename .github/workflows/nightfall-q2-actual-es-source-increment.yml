          O=research/nightfall/formalization/observability
          cp "$O/ActualESOwnedSourceCover.lean" /tmp/aa/ActualESOwnedSourceCover.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/ActualESOwnedSourceCover.olean ActualESOwnedSourceCover.lean)
          mkdir -p lean-receipts
