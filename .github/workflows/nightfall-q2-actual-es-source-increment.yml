          cp "$O/ActualESGreedyOwnership.lean" /tmp/aa/ActualESGreedyOwnership.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/ActualESGreedyOwnership.olean ActualESGreedyOwnership.lean)
          cp "$O/ActualESGreedyCover.lean" /tmp/aa/ActualESGreedyCover.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/ActualESGreedyCover.olean ActualESGreedyCover.lean)
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualESOwnedSourceCover
          python3 scripts/lean_bridge.py \
