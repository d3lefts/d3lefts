      - name: Record exact source hashes and compiler pin
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/{ActualESPairHilbertMoment,QuadraticActualMomentEndpoint,HilbertManyIncrementMoment}.lean research/nightfall/formalization/product_space/{ActualESPairMatchingBridge,ActualESQuadraticRectangles}.lean > lean-receipts/SHA256SUMS.txt
          sha256sum research/nightfall/formalization/observability/{ActualESPackedParity,QuadraticHybridTelescoping}.lean >> lean-receipts/SHA256SUMS.txt
          sha256sum research/nightfall/formalization/observability/ActualESGeneralMatching.lean >> lean-receipts/SHA256SUMS.txt
          sha256sum research/nightfall/formalization/observability/{ActualESMatchingMass,WeightedGreedyMatching}.lean >> lean-receipts/SHA256SUMS.txt
          sha256sum research/nightfall/formalization/observability/{ActualESGreedyCover,WeightedGreedyCover}.lean >> lean-receipts/SHA256SUMS.txt
          sha256sum research/nightfall/formalization/observability/ActualESGreedyOwnership.lean >> lean-receipts/SHA256SUMS.txt
