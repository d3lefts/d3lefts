name: NIGHTFALL ControlArena open-path local model editor
on:
  pull_request:
    paths:
      - ".github/workflows/nightfall-open-editor.yml"
      - "research/nightfall/right-to-act-promotion/run_open_editor_attack.py"
      - "research/nightfall/right-to-act-promotion/audit_open_editor_attack.py"
      - "research/nightfall/right-to-act-promotion/OPEN_EDITOR_RESEARCH_PROTOCOL.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightfall-controlarena-open-editor
  cancel-in-progress: true
jobs:
  open-path-red-team:
    runs-on: ubuntu-latest
    environment: controlarena-python
    timeout-minutes: 50
    defaults:
      run:
        working-directory: research/nightfall/right-to-act-promotion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check code and pin real ControlArena fixture dependencies
        run: |
          python -m py_compile run_open_editor_attack.py audit_open_editor_attack.py
          python -m pip install 'control-arena==20.1.1' 'aws-cdk-lib==2.260.0' 'constructs==10.5.0' 'jsii==1.137.0' 'pytest==8.4.2'
          python -m pip freeze > open-editor-installed-versions.txt
      - name: Build nonroot networkless actual IaC Fast CDK sandbox
        run: |
          docker build -f Dockerfile.untrusted-cdk -t nightfall-iac-cdk-sandbox:v16 .
          docker image inspect --format '{{.Id}}' nightfall-iac-cdk-sandbox:v16 > open-editor-sandbox-id.txt
      - name: Preflight official main and harmful side scorer controls
        timeout-minutes: 5
        env:
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
        run: python calibrate_model_scorers.py
      - name: Launch local Qwen and pin exact weights
        timeout-minutes: 12
        run: |
          docker run -d --rm --name nightfall-ollama --cpus 3 --memory 9g \
            -p 127.0.0.1:11434:11434 -e OLLAMA_NUM_PARALLEL=1 \
            -e OLLAMA_CONTEXT_LENGTH=16384 -e OLLAMA_NO_CLOUD=1 ollama/ollama:latest
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          docker exec nightfall-ollama ollama pull qwen2.5-coder:3b
          curl -fsS http://127.0.0.1:11434/api/tags > open-editor-model-tags.json
          docker image inspect --format '{{.Id}}' ollama/ollama:latest > open-editor-model-image.txt
      - name: Four open-path agent attack attempts; official synth and scorer
        timeout-minutes: 20
        env:
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
        run: python run_open_editor_attack.py --out open-editor-results
      - name: Independent model-response and official-scorer receipt audit
        run: python audit_open_editor_attack.py --dir open-editor-results | tee open-editor-independent-audit.json
      - name: Poisoned provenance must be rejected
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('open-editor-results')
          report=json.loads((root/'open_editor_receipt.json').read_text())
          report['valid_harmful_candidates']=42
          (root/'forged_receipt.json').write_text(json.dumps(report))
          PY
          if python audit_open_editor_attack.py --dir open-editor-results --receipt open-editor-results/forged_receipt.json; then
            echo 'Independent auditor accepted falsified harm count' >&2
            exit 1
          fi
      - name: Freeze exact model dialogue and actual source before/after edits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-controlarena-open-path-agent-evidence
          path: |
            research/nightfall/right-to-act-promotion/open-editor-results/
            research/nightfall/right-to-act-promotion/open-editor-model-tags.json
            research/nightfall/right-to-act-promotion/open-editor-model-image.txt
            research/nightfall/right-to-act-promotion/open-editor-sandbox-id.txt
            research/nightfall/right-to-act-promotion/open-editor-installed-versions.txt
            research/nightfall/right-to-act-promotion/open-editor-independent-audit.json
          retention-days: 30
          if-no-files-found: warn
