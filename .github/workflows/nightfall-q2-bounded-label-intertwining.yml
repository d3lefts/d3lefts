name: NIGHTFALL Q2 genuine bounded source and label heat-bath intertwining
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2BoundedLabelIntertwining.lean'
      - '.github/workflows/nightfall-q2-bounded-label-intertwining.yml'
      - 'docs/lean-pending-source-custody.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-original-bounded-label-intertwining-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  original-source-intertwining:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile actual original source and label conditional expectation interchange
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2Density InfinitePiQ2InfluenceStability InfinitePiQ2OriginalIndependence InfinitePiQ2ConditionalSourceTest InfinitePiQ2FiniteRankConditional InfinitePiQ2OriginalLabelTransport InfinitePiQ2OriginalHeatBath InfinitePiQ2FrozenLabelMeasurable InfinitePiQ2ActiveFiniteLabelCondExp InfinitePiQ2LabelAtomMass InfinitePiQ2BoundedLabelIntertwining; do
            cp "research/nightfall/formalization/universal/${name}.lean" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Strict named theorem standard-axiom gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-bounded-label-intertwining
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2BoundedLabelIntertwining.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2BoundedLabelIntertwining.source_condExp_lift_intertwines_bounded \
            --json-out lean-receipts/q2-bounded-label-intertwining/receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-bounded-label-intertwining/receipt.json
      - name: Preserve source identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-bounded-label-intertwining
          git rev-parse HEAD > lean-receipts/q2-bounded-label-intertwining/HEAD
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2BoundedLabelIntertwining.lean > lean-receipts/q2-bounded-label-intertwining/SOURCE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-bounded-label-intertwining-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-bounded-label-intertwining
          if-no-files-found: warn
