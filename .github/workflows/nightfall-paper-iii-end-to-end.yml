name: Paper III Lean compilation and manuscript coverage report
on:
  pull_request:
    paths:
      - '.github/workflows/nightfall-paper-iii-end-to-end.yml'
      - 'research/nightfall/formalization/finite_field/**'
      - 'research/nightfall/paper-iii-certification/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: paper-iii-end-to-end-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  existing-source-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recover verified compilation receipts without rebuilding
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Immutable successful compilation from the previous failed coverage gate.
          old=c8d36b9ca614da90c6d2f3364f03323a278b4446
          artifact=15062668332
          run=45700694880
          # Compare Git tree identities, not timestamps or branch names. The
          # coverage manifest and this workflow are intentionally not inputs.
          python3 - <<'PY' > /tmp/paper-iii-reuse-match
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          old='c8d36b9ca614da90c6d2f3364f03323a278b4446'
          def api(endpoint):
              return json.loads(subprocess.check_output(['gh','api',endpoint]))
          oldtree=api(f'repos/{repo}/git/commits/{old}')['tree']['sha']
          paths=['research/nightfall/formalization/finite_field',
                 'research/nightfall/local-certificates/20261125-iii-v/lean',
                 'docs/lean-compiler-lock.json', '.github/actions/setup-nightfall-lean',
                 'scripts/check_nightfall_compiler_lock.py']
          def historical(path):
              tree=oldtree
              for part in path.split('/'):
                  entry=next(e for e in api(f'repos/{repo}/git/trees/{tree}')['tree'] if e['path']==part)
                  tree=entry['sha']
              return tree
          def current(path):
              return subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
          print('yes' if all(historical(p)==current(p) for p in paths) else 'no')
          PY
          if [ "$(cat /tmp/paper-iii-reuse-match)" != yes ]; then
            echo 'reused=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" > /tmp/paper-iii-artifact.json
          python3 - <<'PY'
          import json
          a=json.load(open('/tmp/paper-iii-artifact.json'))
          assert not a['expired'] and a['workflow_run']['id']==45700694880
          assert a['workflow_run']['head_sha']=='dff27b7502fe08ab710954a26109ab170d1d4f55'
          assert a['digest']=='sha256:bd021f1faebc966de4fb0d81d84cd991275ecab730c1d5b1709a2fbae6ad0dc7'
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > /tmp/paper-iii-receipts.zip
          echo 'bd021f1faebc966de4fb0d81d84cd991275ecab730c1d5b1709a2fbae6ad0dc7  /tmp/paper-iii-receipts.zip' | sha256sum -c -
          mkdir -p receipts
          unzip -q /tmp/paper-iii-receipts.zip -d receipts
          test "$(cat receipts/paper-iii/head.txt)" = "$old"
          test "$(grep -c '^PASS ' receipts/paper-iii/status.txt)" = 18
          ! grep -q '^FAIL ' receipts/paper-iii/status.txt
          sha256sum -c receipts/paper-iii/SHA256SUMS
          cp receipts/paper-iii/head.txt receipts/paper-iii/compiled-head.txt
          printf '%s\n' "$run" > receipts/paper-iii/compiled-run.txt
          echo 'reused=true' >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-nightfall-lean
        if: steps.reuse.outputs.reused != 'true'
      - name: Exact ATLAS source retrieval and full 1D classification closure
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/bu-global-boundary
          git clone --filter=blob:none https://github.com/facebookresearch/atlas-lean.git /tmp/atlas-lean
          git -C /tmp/atlas-lean checkout --detach 7857a2e8c32088b5002f7cafe29a21d936baf704
          test "$(git -C /tmp/atlas-lean rev-parse HEAD)" = "7857a2e8c32088b5002f7cafe29a21d936baf704"
          for M in             MathlibExt/MeasureTheory/Measure/ImageNull             MathlibExt/Geometry/Manifold/Sard             MathlibExt/Geometry/Manifold/ParametricSard             MathlibExt/Geometry/Manifold/RiemannianMetricExistence             MathlibExt/Geometry/Manifold/OneDimensional; do
            dst="/tmp/mathlib4/$M.lean"
            mkdir -p "$(dirname "$dst")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$M")"
            cp "/tmp/atlas-lean/$M.lean" "$dst"
            ! grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' "$dst"
            sha256sum "$dst" >> receipts/bu-global-boundary/ATLAS-SHA256SUMS
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean") 2>&1 | tee "receipts/bu-global-boundary/$(basename "$M").log"
            ! grep -E '(^|:)error:|declaration uses .sorry' "receipts/bu-global-boundary/$(basename "$M").log"
          done
      - name: Compile original IVT and the global boundary assembly theorem
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for M in ProductSphereObstruction ProductBUSphereExtension ProductBUParityReference ProductBUOrbitCertificate ProductBUSphereCompact ProductBUCompactFiber ProductBUFiberFreeAction ProductBUIntervalStabilizer ProductBUComponentOrbit ProductBUActualFiberOrbit ProductBUGlobalBoundary ProductBUComponentClassification ProductBUComponentEndpoints ProductBUGlobalAssembly ProductBUTimeZeroOrbit ProductBUFinalGeometricReduction ProductBUReferenceFace ProductBUAxisBoundaryTerminal; do
            src="research/nightfall/formalization/finite_field/$M.lean"
            ! grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' "$src"
            cp "$src" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean") 2>&1 | tee "receipts/bu-global-boundary/$M.log"
            ! grep -E '(^|:)error:|declaration uses .sorry' "receipts/bu-global-boundary/$M.log"
          done
      - name: Audit kernel axiom receipts (names reported, not a failure condition)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          root=Path("receipts/bu-global-boundary")
          allowed={"propext","Classical.choice","Quot.sound"}
          declarations={}
          for path in sorted(root.glob("*.log")):
              data=path.read_text()
              if re.search(r"\bsorryAx\b|declaration uses .sorry",data):
                  raise SystemExit(f"Admitted proof: {path}")
              for name, body in re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",data,re.S):
                  axioms={v.strip() for v in body.split(",") if v.strip()}
                  if not axioms <= allowed:
                      raise SystemExit(f"Nonstandard axioms in {name}: {sorted(axioms-allowed)}")
                  declarations[name]=sorted(axioms)
              for name in re.findall(r"'([^']+)' does not depend on any axioms",data):
                  declarations[name]=[]
          (root/"named-axiom-inventory.json").write_text(json.dumps(declarations,indent=2)+"\n")
          print("Kernel axiom receipts discovered:",len(declarations))
          if not declarations:
              print("::warning::No named topology axiom receipts discovered; no theorem coverage inferred.")
          PY
      - name: Algebraic thresholds, causal obstruction, annular decoding and noise closure
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p receipts/paper-iii
          failures=0
          for m in InfiniteFieldSignedStep InfiniteFieldFixedLower InfiniteFieldFixedUpper InfiniteFieldAdaptiveLower InfiniteFieldLegalUpper InfiniteFieldTerminal ContinuousPhaseCrossing ContinuousPhaseOracleObstruction ContinuousPhaseAllDimensions GenuinePrefixPhase ProductSphereCausalComposition ConditionalPhaseThreshold ProductBUQuantitativeCollision ProductBUDecoderRiskFloor ProductBUMixedRadius ProductBUCausalScaling AnnularBalancedDecode PaperIIINoiseErasure; do
            src="research/nightfall/formalization/finite_field/$m.lean"
            if [ "$m" = AnnularBalancedDecode ]; then
              src="research/nightfall/local-certificates/20261125-iii-v/lean/$m.lean"
            fi
            cp "$src" "/tmp/mathlib4/$m.lean"
            sha256sum "$src" >> receipts/paper-iii/SHA256SUMS
            if (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean") 2>&1 | tee "receipts/paper-iii/$m.log"; then
              if grep -Eq 'sorryAx|declaration uses .sorry' "receipts/paper-iii/$m.log"; then
                failures=$((failures+1))
                echo "FAIL $m admitted proof" | tee -a receipts/paper-iii/status.txt
              else
                echo "PASS $m" | tee -a receipts/paper-iii/status.txt
              fi
            else
              failures=$((failures+1))
              echo "FAIL $m" | tee -a receipts/paper-iii/status.txt
            fi
          done
          test "$failures" = 0
      - name: Report all manuscript claims and their available Lean evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/paper-iii
          git rev-parse HEAD > receipts/paper-iii/coverage-head.txt
          if [ ! -f receipts/paper-iii/head.txt ]; then
            cp receipts/paper-iii/coverage-head.txt receipts/paper-iii/head.txt
          fi
          python3 - <<'PY' | tee receipts/paper-iii/coverage.log
          import json, os, re
          from pathlib import Path
          root=Path("receipts/paper-iii")
          spec=json.loads(Path("research/nightfall/paper-iii-certification/coverage.json").read_text())
          module_status=(root/"status.txt").read_text().splitlines() if (root/"status.txt").exists() else []
          allowed={"propext","Classical.choice","Quot.sound"}
          pending=[]
          results=[]
          for item in spec["claims"]:
              checked=[]
              for target in item.get("targets",[]):
                  module,name=target["module"],target["name"]
                  path=root/(module+".log")
                  data=path.read_text() if path.exists() else ""
                  hit=re.search(r"'"+re.escape(name)+r"' depends on axioms:\s*\[([^\]]*)\]",data,re.S)
                  clean=(hit is not None and {x.strip() for x in hit[1].split(",") if x.strip()}<=allowed) or ("'"+name+"' does not depend on any axioms" in data)
                  checked.append("PASS "+module in module_status and clean)
              match=item["match"]
              if match=="full" and checked and all(checked):
                  status="full_terminal_verified"
              elif match=="partial" and checked and all(checked):
                  status="partial_terminal_verified"
              elif checked:
                  status="receipt_missing_or_failed"
              else:
                  status=match
              results.append({"label":item["label"],"status":status,"targets":item.get("targets",[]),"target_pass":checked})
              print(item["label"],status,item["scope"])
              if status!="full_terminal_verified":
                  pending.append(item["label"])
          (root/"coverage-result.json").write_text(json.dumps(results,indent=2)+"\n")
          full=len(results)-len(pending)
          conclusion={
              "claims_reported":len(results),
              "full_terminal_verified":full,
              "pending":pending,
              "manuscript_source_coverage":"complete" if not pending else "not_established",
              "deposited_manuscript_identity":"not_independently_verified",
              "compilation_success_does_not_imply_manuscript_certification":True
          }
          (root/"coverage-summary.json").write_text(json.dumps(conclusion,indent=2)+"\n")
          print("Full source-matched manuscript targets:",full,"/",len(results))
          if pending:
              print("::warning::Full manuscript certification is not established by the available receipts: "+", ".join(pending))
          print("Deposit identity is recorded separately; it does not block Lean compilation or source coverage reporting.")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as summary:
              summary.write(f"### Paper III manuscript coverage\n\n{full}/{len(results)} full claim receipts; all {len(results)} claims reported.\n\n")
              summary.write("**Manuscript source coverage:** "+conclusion["manuscript_source_coverage"]+"\n\n")
              summary.write("A green compilation/report run is not itself full manuscript certification. Deposit identity is recorded separately.\n")
              for row in results:
                  summary.write(f"- `{row['label']}`: {row['status']}\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-iii-manuscript-wide-receipts
          path: receipts/
          retention-days: 90
