name: NIGHTFALL Route1 polylog-M mixture simulation Lean
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/Route1PolylogTools.lean'
      - 'research/nightfall/formalization/product_space/Route1Entropy.lean'
      - 'research/nightfall/formalization/product_space/Route1KeyLemma.lean'
      - 'research/nightfall/formalization/product_space/Route1Lift.lean'
      - 'research/nightfall/formalization/product_space/Route1PolylogSimulation.lean'
      - 'research/nightfall/formalization/product_space/Route1WynerSimulation.lean'
      - '.github/workflows/nightfall-route1-polylog-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route1-polylog:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile pinned AA and mixture closure in dependency order
        shell: bash
        run: |
          set -euo pipefail
          while read -r M P; do
            [ -z "$M" ] && continue
            REL="$(printf '%s' "$M" | tr '.' '/')"
            mkdir -p "/tmp/mathlib4/$(dirname "$REL")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$REL")"
            cp "$P" "/tmp/mathlib4/$REL.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$REL.olean" "$REL.lean" 2>&1 | tee "/tmp/log-$M.txt")
            ! grep -q 'declaration uses .sorry' "/tmp/log-$M.txt"
          done < research/nightfall/formalization/aa_product/CLOSURE.txt
      - name: Compile Route 1 chain (merged star coupling and latent degree, then polylog modules)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/route1-polylog
          for M in Route1LatentDegree Route1DegreeSourceBridge Route1FiniteMaxCoupling Route1FiniteJointMass \
                   Route1MaximalConditionalKernel Route1StarCoupling Route1StarMaximalBridge \
                   Route1PolylogTools Route1Entropy Route1KeyLemma Route1Lift Route1PolylogSimulation Route1WynerSimulation; do
            cp "research/nightfall/formalization/product_space/$M.lean" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean") 2>&1 \
              | tee "receipts/route1-polylog/$M.log"
            ! grep -E '(^|:)error:|declaration uses .sorry' "receipts/route1-polylog/$M.log"
          done
      - name: Independent kernel replay and strict axiom audit
        shell: bash
        run: |
          set -euo pipefail
          if (cd /tmp/mathlib4 && lake env which leanchecker >/dev/null 2>&1); then
            (cd /tmp/mathlib4 && lake env leanchecker Route1WynerSimulation) 2>&1 | tee receipts/route1-polylog/checker.log
          else
            echo "leanchecker unavailable; axiom audit only" | tee receipts/route1-polylog/checker.log
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          d=Path('receipts/route1-polylog')
          s=''.join(p.read_text() for p in sorted(d.glob('Route1*.log')))
          reports=re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]",s,re.S)
          names={n for n,_ in reports}
          for need in ['Nightfall.Route1Polylog.crux','Nightfall.Route1Polylog.route1_polylog_simulation','Nightfall.Route1Polylog.info_chain','Nightfall.Route1Polylog.info_nonneg','Nightfall.Route1Polylog.route1_wyner_simulation','Nightfall.Route1Polylog.route1_wyner_CI']:
              assert need in names,(need,names)
          for n,x in reports:
              a={z.strip() for z in x.split(',') if z.strip()}
              assert a <= {'Classical.choice','propext','Quot.sound'},(n,a)
          assert 'sorryAx' not in s
          print('PASS Route 1 polylog-M mixture simulation:',len(reports),'axiom reports, all standard')
          PY
      - name: Preserve evidence
        if: always()
        shell: bash
        run: |
          mkdir -p receipts/route1-polylog
          git rev-parse HEAD > receipts/route1-polylog/commit.txt
          sha256sum research/nightfall/formalization/product_space/Route1{PolylogTools,Entropy,KeyLemma,Lift,PolylogSimulation,WynerSimulation}.lean > receipts/route1-polylog/SHA256SUMS
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route1-polylog-lean-receipt
          path: receipts/route1-polylog
          if-no-files-found: warn
          retention-days: 90
