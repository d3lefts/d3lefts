name: NIGHTFALL ArtifactGraph-B2 independent public contract audit
on:
  pull_request:
    paths:
      - "research/nightfall/evaluations/artifactgraph-b2/**"
      - ".github/workflows/nightfall-artifactgraph-public-audit.yml"
  push:
    branches: [main]
    paths:
      - "research/nightfall/evaluations/artifactgraph-b2/**"
      - ".github/workflows/nightfall-artifactgraph-public-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Independently discriminate seed-contract violations
        run: |
          python research/nightfall/evaluations/artifactgraph-b2/audit/public_contract_probe.py --mode seed --output artifactgraph-public-canary.json
      - name: Preserve evidence receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifactgraph-public-audit-${{ matrix.python-version }}
          path: artifactgraph-public-canary.json
          retention-days: 30
          if-no-files-found: warn
