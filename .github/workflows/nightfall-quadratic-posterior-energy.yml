name: NIGHTFALL quadratic posterior energy Lean gate
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/PosteriorEnergyDrift.lean'
      - 'research/nightfall/formalization/observability/ParityBlockCancellation.lean'
      - '.github/workflows/nightfall-quadratic-posterior-energy.yml'
      - 'research/nightfall/2026-11-quadratic-law-free-audit/check_posterior_drift_exact.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  posterior:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          git clone --depth 1 --branch v4.35.0 https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4
          (cd /tmp/mathlib4 && "$HOME/.elan/bin/lake" exe cache get)
      - name: Kernel-compile the exact ANOVA energy drift
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.PosteriorEnergy
          python3 scripts/lean_bridge.py research/nightfall/formalization/observability/PosteriorEnergyDrift.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.card_remaining_insert \
            --decl $N.remainingTotal_insert_add_influence \
            --decl $N.remainingTotal_insert_eq_sub \
            --decl $N.remainingInf_nonneg \
            --decl $N.remainingTotal_nonneg \
            --decl $N.remainingTotal_empty \
            --decl $N.remainingInf_revealed \
            --json-out lean-receipts/posterior-energy.json || {
              cat lean-receipts/posterior-energy.json || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/posterior-energy.json
          python3 scripts/lean_bridge.py research/nightfall/formalization/observability/ParityBlockCancellation.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl Nightfall.Observability.ParityBlocks.flip_self \
            --decl Nightfall.Observability.ParityBlocks.flip_other \
            --decl Nightfall.Observability.ParityBlocks.flip_flip \
            --decl Nightfall.Observability.ParityBlocks.sum_flip \
            --decl Nightfall.Observability.ParityBlocks.cross_block_left_right \
            --decl Nightfall.Observability.ParityBlocks.right_marginal \
            --decl Nightfall.Observability.ParityBlocks.cross_block_right_left \
            --decl Nightfall.Observability.ParityBlocks.cross_block_right_right \
            --decl Nightfall.Observability.ParityBlocks.cross_block_all_sides \
            --decl Nightfall.Observability.ParityBlocks.off_matching_pair_family_cancel \
            --decl Nightfall.Observability.ParityBlocks.matched_block_mixed_difference \
            --json-out lean-receipts/parity-blocks.json || {
              cat lean-receipts/parity-blocks.json || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/parity-blocks.json
          sha256sum research/nightfall/formalization/observability/{PosteriorEnergyDrift,ParityBlockCancellation}.lean > lean-receipts/SHA256SUMS
      - name: Exact real-posterior drift, all transcript branches
        run: |
          set -euo pipefail
          python3 research/nightfall/2026-11-quadratic-law-free-audit/check_posterior_drift_exact.py
          python3 research/nightfall/2026-11-quadratic-law-free-audit/check_exact_quadratic.py
      - name: Archive receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-posterior-energy-lean
          path: lean-receipts/
          if-no-files-found: warn
