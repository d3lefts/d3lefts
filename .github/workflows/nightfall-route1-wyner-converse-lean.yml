name: NIGHTFALL Route1 explicit Wyner converse Lean kernel replay
on:
  pull_request:
    paths:
      - 'research/formalization_candidates/route1/Route1WynerConverse.lean'
      - '.github/workflows/nightfall-route1-wyner-converse-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route1-converse:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile pinned AA and source-defined product-structure closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/route1-converse-lean
          while read -r M P; do
            [ -z "$M" ] && continue
            REL="$(printf '%s' "$M" | tr '.' '/')"
            mkdir -p "/tmp/mathlib4/$(dirname "$REL")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$REL")"
            cp "$P" "/tmp/mathlib4/$REL.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$REL.olean" "$REL.lean")
          done < research/nightfall/formalization/aa_product/CLOSURE.txt
      - name: Compile original merged Route1 and arbitrary-latent Wyner theorem sources
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space
          for M in Route1LatentDegree Route1DegreeSourceBridge Route1FiniteMaxCoupling Route1FiniteJointMass \
                   Route1MaximalConditionalKernel Route1StarCoupling Route1StarMaximalBridge \
                   Route1PolylogTools Route1Entropy Route1KeyLemma Route1Lift \
                   Route1PolylogSimulation Route1WynerSimulation Route1WynerGeneral; do
            cp "$P/$M.lean" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean")
          done
      - name: Strict exact converse statement and independent Lean kernel replay
        shell: bash
        run: |
          set -euo pipefail
          P=research/formalization_candidates/route1/Route1WynerConverse.lean
          cp "$P" /tmp/mathlib4/Route1WynerConverse.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Route1WynerConverse.olean Route1WynerConverse.lean)
          python3 scripts/lean_bridge.py "$P" \
            --workspace /tmp/mathlib4 --strict --timeout 2400 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Route1Polylog.wyner_converse_from_approximation_hardness \
            --json-out receipts/route1-converse-lean/converse.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            receipts/route1-converse-lean/converse.json
          (cd /tmp/mathlib4 && lake env leanchecker -v Route1WynerConverse) \
            | tee receipts/route1-converse-lean/leanchecker.log
      - name: Capture source SHA and scope
        if: always()
        shell: bash
        run: |
          mkdir -p receipts/route1-converse-lean
          git rev-parse HEAD > receipts/route1-converse-lean/head
          sha256sum research/formalization_candidates/route1/Route1WynerConverse.lean \
                    research/nightfall/formalization/product_space/Route1WynerGeneral.lean \
                    > receipts/route1-converse-lean/SHA256SUMS
          echo 'This proves only the explicit contrapositive assuming distributional approximation hardness, not Forrelation or Simon lower bounds' > receipts/route1-converse-lean/scope.txt
      - name: Upload source/kernel receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: route1-converse-lean-${{ github.run_id }}
          path: receipts/route1-converse-lean
          if-no-files-found: error
