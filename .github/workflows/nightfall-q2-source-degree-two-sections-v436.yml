name: NIGHTFALL Q2 source-derived section budget Lean 4.36
on:
  push:
    branches: [nightfall-q2-source-anova-global-v436-20261113]
    paths:
      - 'research/nightfall/formalization/observability/ActualSourceDegreeTwoSections.lean'
      - '.github/workflows/nightfall-q2-source-degree-two-sections-v436.yml'
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/ActualSourceDegreeTwoSections.lean'
      - '.github/workflows/nightfall-q2-source-degree-two-sections-v436.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-derived-section:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile current-pin product source ANOVA dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ActualProductMergeTower ActualProductHilbertJensen ActualProductSoftNoise ActualSourceANOVA; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Compile current-pin quadratic switching and Popoviciu prerequisites
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ParityBlockCancellation QuadraticMatchedParity QuadraticSwitchingIdentity QuadraticSingleReplacement QuadraticOscillationBound QuadraticRealizedRangeBudget ActualSourceSectionBudgetEight; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Strict source-derived no-hpoly quadratic representation and 8B L2 budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourceDegreeTwoSections
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceDegreeTwoSections.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.source_small_support_embeds_in_pair \
            --decl $N.source_degree_two_as_actual_quadratic \
            --decl $N.actual_degree_two_source_section_budget_eight_current \
            --json-out lean-receipts/q2-source-derived-section.json || {
              cat lean-receipts/q2-source-derived-section.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-source-derived-section.json
      - name: Source identity and exact toolchain
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/ActualSourceDegreeTwoSections.lean > lean-receipts/SHA256SUMS.txt
          git rev-parse HEAD > lean-receipts/repo-commit.txt
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-no-hpoly-original-source-section
          path: lean-receipts/
          retention-days: 45
