name: NIGHTFALL Q2 quantitative switching and moments pinned 4.36
on:
  # Retained as manual diagnostic; automated Q2 proof CI is consolidated.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-quadratic-switching:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Recompile historical original-function switching on active pin
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ParityBlockCancellation QuadraticMatchedParity QuadraticSwitchingIdentity QuadraticSingleReplacement QuadraticOscillationBound; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Strict unconditional quadratic switching 16B range bound
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.QuadraticSwitching
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/QuadraticRealizedRangeBudget.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.quadratic_realized_range_budget \
            --decl $N.quadratic_actual_all_section_ranges_le_sixteen \
            --json-out lean-receipts/q2-current-pin-switching-16B.json || {
              cat lean-receipts/q2-current-pin-switching-16B.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-current-pin-switching-16B.json
      - name: Compile quadratic range budget before actual source section estimate
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/observability/QuadraticRealizedRangeBudget.lean /tmp/mathlib4/QuadraticRealizedRangeBudget.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/QuadraticRealizedRangeBudget.olean QuadraticRealizedRangeBudget.lean)
      - name: Strict bounded actual quadratic f original-source 8B section budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourceSectionBudgetEight
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceSectionBudgetEight.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.weighted_variance_le_quarter_range \
            --decl $N.weighted_std_le_half_range \
            --decl $N.actual_quadratic_source_section_budget_eight \
            --json-out lean-receipts/q2-current-pin-actual-f-section-8B.json || {
              cat lean-receipts/q2-current-pin-actual-f-section-8B.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-current-pin-actual-f-section-8B.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-current-pin-switching-16B
          path: lean-receipts/
          retention-days: 45
  strict-hilbert-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Recompile independent arbitrary-law Hilbert moment tower on active pin
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ArbitraryLawFourthMoment HilbertTwoIncrementMoment HilbertManyIncrementMoment QuadraticEndpointInterpolation; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Strict independent Hilbert fourth-moment interpolation endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.QuadraticActualMomentEndpoint
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/QuadraticActualMomentEndpoint.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.weighted_l1_l2_l4 \
            --decl $N.actual_product_l1_l2_l4 \
            --decl $N.actual_product_fourth_endpoint \
            --json-out lean-receipts/q2-current-pin-hilbert-fourth.json || {
              cat lean-receipts/q2-current-pin-hilbert-fourth.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-current-pin-hilbert-fourth.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-current-pin-hilbert-fourth
          path: lean-receipts/
          retention-days: 45
  strict-single-source-scalar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile proven conditional original budget arithmetic
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/observability/ActualProductQ2ScalarClosure.lean /tmp/mathlib4/ActualProductQ2ScalarClosure.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/ActualProductQ2ScalarClosure.olean ActualProductQ2ScalarClosure.lean)
      - name: Strict single-section-budget Q2 scalar endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourceQ2WeakScalarClosure
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceQ2WeakScalarClosure.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.q2_scalar_from_single_source_section_budget \
            --decl $N.q2_scalar_squared_from_single_source_section_budget \
            --json-out lean-receipts/q2-single-source-section-scalar.json || {
              cat lean-receipts/q2-single-source-section-scalar.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-single-source-section-scalar.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-single-source-section-scalar
          path: lean-receipts/
          retention-days: 45
  strict-weighted-greedy-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile original finite max-first matching proof on active pin
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/observability/WeightedGreedyMatching.lean /tmp/mathlib4/WeightedGreedyMatching.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/WeightedGreedyMatching.olean WeightedGreedyMatching.lean)
      - name: Strict derived 8B matching-to-cover structural implication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.WeightedGreedyCover
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/WeightedGreedyCover.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.matching_endpoint_cover \
            --decl $N.matching_budget_to_endpoint_budget \
            --json-out lean-receipts/q2-pinned-weighted-greedy-cover.json || {
              cat lean-receipts/q2-pinned-weighted-greedy-cover.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-pinned-weighted-greedy-cover.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-pinned-weighted-greedy-cover
          path: lean-receipts/
          retention-days: 45
