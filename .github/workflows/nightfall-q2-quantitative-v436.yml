name: NIGHTFALL Q2 quantitative switching and moments pinned 4.36
on:
  push:
    branches:
      - nightfall-q2-source-anova-global-v436-20261113
  pull_request:
    paths:
      - '.github/workflows/nightfall-q2-quantitative-v436.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-quadratic-switching:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Recompile historical original-function switching on active pin
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ParityBlockCancellation QuadraticMatchedParity QuadraticSwitchingIdentity QuadraticSingleReplacement QuadraticOscillationBound; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Strict unconditional quadratic switching 16B range bound
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.QuadraticSwitching
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/QuadraticRealizedRangeBudget.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.quadratic_realized_range_budget \
            --decl $N.quadratic_actual_all_section_ranges_le_sixteen \
            --json-out lean-receipts/q2-current-pin-switching-16B.json || {
              cat lean-receipts/q2-current-pin-switching-16B.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-current-pin-switching-16B.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-current-pin-switching-16B
          path: lean-receipts/
          retention-days: 45
  strict-hilbert-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Recompile independent arbitrary-law Hilbert moment tower on active pin
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ArbitraryLawFourthMoment HilbertTwoIncrementMoment HilbertManyIncrementMoment QuadraticEndpointInterpolation; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Strict independent Hilbert fourth-moment interpolation endpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.QuadraticActualMomentEndpoint
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/QuadraticActualMomentEndpoint.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.weighted_l1_l2_l4 \
            --decl $N.actual_product_l1_l2_l4 \
            --decl $N.actual_product_fourth_endpoint \
            --json-out lean-receipts/q2-current-pin-hilbert-fourth.json || {
              cat lean-receipts/q2-current-pin-hilbert-fourth.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-current-pin-hilbert-fourth.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-current-pin-hilbert-fourth
          path: lean-receipts/
          retention-days: 45
