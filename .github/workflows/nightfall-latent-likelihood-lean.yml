name: NIGHTFALL latent likelihood overlap strict Lean
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/LatentComponentLikelihood.lean'
      - 'research/nightfall/formalization/product_space/LatentComponentHellinger.lean'
      - 'research/nightfall/formalization/product_space/LatentComponentProductAffinity.lean'
      - 'research/nightfall/formalization/product_space/LatentComponentHighTV.lean'
      - '.github/workflows/nightfall-latent-likelihood-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  likelihood:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile and audit all named likelihood steps (not full component theorem)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/latent-likelihood
          SRC=research/nightfall/formalization/product_space/LatentComponentLikelihood.lean
          cp "$SRC" /tmp/mathlib4/LatentComponentLikelihood.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/LatentComponentLikelihood.olean LatentComponentLikelihood.lean)
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.ProductSpace.LatentComponent.likelihood_error_eq_overlap \
            --decl Nightfall.ProductSpace.LatentComponent.margin_forces_bad_mass \
            --decl Nightfall.ProductSpace.LatentComponent.overlap_from_local_bad \
            --decl Nightfall.ProductSpace.LatentComponent.likelihood_error_le_of_conditional_bounds \
            --json-out lean-receipts/latent-likelihood/strict.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/latent-likelihood/strict.json
      - name: Compile and audit Hellinger-TV finite bound
        shell: bash
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/product_space/LatentComponentHellinger.lean
          cp "$SRC" /tmp/mathlib4/LatentComponentHellinger.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/LatentComponentHellinger.olean LatentComponentHellinger.lean)
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.ProductSpace.LatentComponent.finiteAffinity_nonneg \
            --decl Nightfall.ProductSpace.LatentComponent.finiteAffinity_le_one \
            --decl Nightfall.ProductSpace.LatentComponent.finiteTV_sq_le_one_sub_affinity_sq \
            --decl Nightfall.ProductSpace.LatentComponent.finiteAffinity_le_one_sub_half_tv_sq \
            --json-out lean-receipts/latent-likelihood/hellinger-strict.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/latent-likelihood/hellinger-strict.json
      - name: Tensor product affinity and likelihood overlap
        shell: bash
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/product_space/LatentComponentProductAffinity.lean
          cp "$SRC" /tmp/mathlib4/LatentComponentProductAffinity.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/LatentComponentProductAffinity.olean LatentComponentProductAffinity.lean)
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.ProductSpace.LatentComponent.finite_product_affinity_factor \
            --decl Nightfall.ProductSpace.LatentComponent.min_le_sqrt_mul_sqrt \
            --decl Nightfall.ProductSpace.LatentComponent.finite_product_overlap_le_affinity \
            --json-out lean-receipts/latent-likelihood/product-strict.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/latent-likelihood/product-strict.json
      - name: High-TV product likelihood power certificate
        shell: bash
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/product_space/LatentComponentHighTV.lean
          cp "$SRC" /tmp/mathlib4/LatentComponentHighTV.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/LatentComponentHighTV.olean LatentComponentHighTV.lean)
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.ProductSpace.LatentComponent.finite_product_overlap_le_power \
            --json-out lean-receipts/latent-likelihood/high-tv-strict.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/latent-likelihood/high-tv-strict.json
      - name: Provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/latent-likelihood
          git rev-parse HEAD > lean-receipts/latent-likelihood/head.txt
          cat lean-toolchain > lean-receipts/latent-likelihood/toolchain.txt
          sha256sum research/nightfall/formalization/product_space/LatentComponentLikelihood.lean research/nightfall/formalization/product_space/LatentComponentHellinger.lean research/nightfall/formalization/product_space/LatentComponentProductAffinity.lean research/nightfall/formalization/product_space/LatentComponentHighTV.lean > lean-receipts/latent-likelihood/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: latent-likelihood-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/latent-likelihood
          if-no-files-found: warn
