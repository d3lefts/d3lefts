name: NIGHTFALL product-space influence theorem (Level/Average port, pinned Turturean toolchain)
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/ProductInfluence.lean'
      - 'research/nightfall/formalization/product_space/ProductRowBound.lean'
      - 'research/nightfall/formalization/product_space/ProductSpaceTwoSidedBridge.lean'
      - 'research/nightfall/formalization/product_space/HeterogeneousAlphabets.lean'
      - 'research/formalization_candidates/wright/HeterogeneousESDegreeEndpoint.lean'
      - 'research/nightfall/formalization/product_space/EfronSteinDegree.lean'
      - 'research/nightfall/formalization/product_space/QuadraticHoeffdingBridge.lean'
      - 'research/nightfall/formalization/product_space/QuadraticActualRowOscillation.lean'
      - 'research/nightfall/formalization/product_space/ActualESPairMatchingBridge.lean'
      - 'research/nightfall/formalization/product_space/Q2SharpSections.lean'
      - 'research/nightfall/formalization/product_space/Q2SourceRepresentation.lean'
      - 'research/nightfall/formalization/observability/CenteredRectangles.lean'
      - 'research/nightfall/formalization/observability/QuadraticUnifiedFinite.lean'
      - '.github/workflows/nightfall-product-influence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  product-influence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.33.0 (Turturean pin)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned Turturean formalization
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/physical-superintelligence/aaronson-ambainis.git /tmp/aa
          git -C /tmp/aa checkout 2a6ceaef872ae993708950f951989134084b851a
          cd /tmp/aa
          lake exe cache get
          lake build AaronsonAmbainis.DetTheorem AaronsonAmbainis.TwoSided.Antipodal \
            AaronsonAmbainis.Bridge.Positivity AaronsonAmbainis.Row.Main AaronsonAmbainis.Pack.Main \
            AaronsonAmbainis.Dual.Main AaronsonAmbainis.Level.Integral \
            AaronsonAmbainis.TwoSided.CauchySchwarz
      - name: Compile merged two-sided bridge (#298) and Lemma B (#310) as imported modules
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space
          mkdir -p /tmp/aa/.lake/build/lib/lean
          for m in ProductSpaceTwoSidedBridge ProductRowBound; do
            cp "$P/$m.lean" "/tmp/aa/$m.lean"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean")
          done
      - name: Kernel-check the product-space influence chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.ProductSpace.Influence
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/ProductInfluence.lean \
            --workspace /tmp/aa --timeout 2400 \
            --decl $N.swap_sum \
            --decl $N.resample_sum \
            --decl $N.integrated_incr \
            --decl $N.weighted_cs \
            --decl $N.pairCost_pos \
            --decl $N.third_moment \
            --decl $N.exists_median \
            --decl $N.weighted_sq_cube \
            --decl $N.variance_cube_le \
            --decl $N.mean_increment \
            --decl $N.pvar_avg \
            --decl $N.pinfl_avg_le \
            --decl $N.pincr_avg_le \
            --decl $N.rows_avg \
            --decl $N.exists_avg_set \
            --decl $N.influence_bound \
            --decl $N.sum_pincr_le \
            --decl $N.influence_cost \
            --decl $N.product_influence \
            --json-out lean-receipts/product-influence.json || {
              python3 -c "import json;r=json.load(open('lean-receipts/product-influence.json'));print(r.get('status'));print((r.get('stdout') or '')[:60000]);print((r.get('stderr') or '')[:5000])" || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/product-influence.json
      - name: Compile influence chain and Efron–Stein module as imported modules
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space
          cp "$P/ProductInfluence.lean" /tmp/aa/ProductInfluence.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/ProductInfluence.olean ProductInfluence.lean)
      - name: Kernel-check indicator-monomial degree = Efron–Stein degree
        shell: bash
        run: |
          set -euo pipefail
          N=Nightfall.ProductSpace.EfronStein
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/EfronSteinDegree.lean \
            --workspace /tmp/aa --timeout 2400 \
            --decl $N.condExp_univ \
            --decl $N.esComp_dependsOn \
            --decl $N.esComp_lin \
            --decl $N.esComp_indep \
            --decl $N.inner_mobius \
            --decl $N.es_decomp \
            --decl $N.junta_expand \
            --decl $N.esDegree_of_prodDegree \
            --decl $N.prodDegree_of_esDegree \
            --decl $N.prodDegree_iff_esDegree \
            --json-out lean-receipts/efron-stein-degree.json || {
              python3 -c "import json;r=json.load(open('lean-receipts/efron-stein-degree.json'));print(r.get('status'));print((r.get('stdout') or '')[:60000]);print((r.get('stderr') or '')[:5000])" || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/efron-stein-degree.json
          cp research/nightfall/formalization/product_space/EfronSteinDegree.lean /tmp/aa/EfronSteinDegree.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/EfronSteinDegree.olean EfronSteinDegree.lean)
      - name: Kernel-check actual finite-product quadratic Hoeffding truncation
        shell: bash
        run: |
          set -euo pipefail
          N=Nightfall.Observability.QuadraticANOVA
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/QuadraticHoeffdingBridge.lean \
            --workspace /tmp/aa --timeout 2400 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.quadratic_hoeffding_decomposition \
            --decl $N.quadratic_hoeffding_filter \
            --decl $N.quadratic_actual_product_influence_e2e \
            --json-out lean-receipts/quadratic-hoeffding-bridge.json || {
              python3 -c "import json;r=json.load(open('lean-receipts/quadratic-hoeffding-bridge.json'));print(r.get('status'));print((r.get('stdout') or '')[:35000]);print((r.get('stderr') or '')[:4000])" || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/quadratic-hoeffding-bridge.json
      - name: Compile full matching/switching dependencies and exact actual product bridge in common Lean pin
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space
          O=research/nightfall/formalization/observability
          mkdir -p /tmp/aa/.lake/build/lib/lean lean-receipts
          cp "$P/QuadraticHoeffdingBridge.lean" /tmp/aa/QuadraticHoeffdingBridge.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/QuadraticHoeffdingBridge.olean QuadraticHoeffdingBridge.lean)
          for name in ParityBlockCancellation QuadraticMatchedParity QuadraticSwitchingIdentity QuadraticSingleReplacement QuadraticOscillationBound QuadraticRealizedRangeBudget; do
            cp "$O/$name.lean" "/tmp/aa/$name.lean"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean")
          done
          N=Nightfall.Observability.QuadraticUnifiedFinite
          python3 scripts/lean_bridge.py "$O/QuadraticUnifiedFinite.lean" \
            --workspace /tmp/aa --timeout 1200 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.actual_degree_two_baseline_and_all_sections \
            --json-out lean-receipts/quadratic-unified-actual-f.json || {
              python3 -c "import json;r=json.load(open('lean-receipts/quadratic-unified-actual-f.json'));print(r.get('status'));print((r.get('stdout') or '')[-40000:]);print((r.get('stderr') or '')[-9000:])" || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/quadratic-unified-actual-f.json
          sha256sum "$O/QuadraticUnifiedFinite.lean" "$P/QuadraticHoeffdingBridge.lean" "$O/QuadraticRealizedRangeBudget.lean" > lean-receipts/quadratic-joint-source-SHA256SUMS.txt
      - name: Strict kernel-check actual degree-two all-coordinate row oscillation
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space
          N=Nightfall.Observability.QuadraticActualRows
          python3 scripts/lean_bridge.py "$P/QuadraticActualRowOscillation.lean" \
            --workspace /tmp/aa --timeout 1200 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.actual_degree_two_row_controls_all_sections \
            --decl $N.actual_degree_two_total_section_budget \
            --decl $N.actual_degree_two_centered_sections_from_rows \
            --decl $N.actual_degree_two_hilbert_section_budget \
            --json-out lean-receipts/quadratic-actual-row-oscillation.json || {
              python3 -c "import json;r=json.load(open('lean-receipts/quadratic-actual-row-oscillation.json'));print(r.get('status'));print((r.get('stdout') or '')[-40000:]);print((r.get('stderr') or '')[-9000:])" || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/quadratic-actual-row-oscillation.json
      - name: Strict kernel-check actual Efron–Stein pair matching source bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          cp research/nightfall/formalization/observability/CenteredRectangles.lean /tmp/aa/CenteredRectangles.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/CenteredRectangles.olean CenteredRectangles.lean)
          N=Nightfall.Observability.ActualESPairMatching
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/ActualESPairMatchingBridge.lean \
            --workspace /tmp/aa --timeout 1200 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.average_condExp_update_mem \
            --decl $N.average_condExp_update \
            --decl $N.actual_esComp_centered \
            --decl $N.actual_pair_component_is_kernel \
            --decl $N.actual_pair_kernel_left_centered \
            --decl $N.actual_pair_kernel_right_centered \
            --decl $N.actual_pair_kernel_oriented_rectangle \
            --decl $N.actual_all_edges_oriented_rectangles \
            --json-out lean-receipts/actual-es-pair-matching-bridge.json || {
              python3 -c "import json;r=json.load(open('lean-receipts/actual-es-pair-matching-bridge.json'));print(r.get('status'));print((r.get('stdout') or '')[-40000:]);print((r.get('stderr') or '')[-9000:])" || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/actual-es-pair-matching-bridge.json
          sha256sum research/nightfall/formalization/product_space/ActualESPairMatchingBridge.lean > lean-receipts/actual-es-pair-matching-SHA256SUMS.txt
      - name: Kernel-check heterogeneous alphabets and zero-mass atoms
        shell: bash
        run: |
          set -euo pipefail
          N=Nightfall.ProductSpace.Heterogeneous
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/HeterogeneousAlphabets.lean \
            --workspace /tmp/aa --timeout 2400 \
            --decl $N.liftMass_sum \
            --decl $N.fiber_sum \
            --decl $N.push_sum \
            --decl $N.push_coord \
            --decl $N.pvar_lift \
            --decl $N.pinfl_lift \
            --decl $N.lift_degree \
            --decl $N.heterogeneous_influence \
            --json-out lean-receipts/heterogeneous-alphabets.json || {
              python3 -c "import json;r=json.load(open('lean-receipts/heterogeneous-alphabets.json'));print(r.get('status'));print((r.get('stdout') or '')[:60000]);print((r.get('stderr') or '')[:5000])" || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/heterogeneous-alphabets.json
      - name: Kernel-check same-source heterogeneous Efron–Stein endpoint (separate imported module)
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space
          mkdir -p /tmp/aa/.lake/build/lib/lean lean-receipts
          cp "$P/HeterogeneousAlphabets.lean" /tmp/aa/HeterogeneousAlphabets.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/HeterogeneousAlphabets.olean HeterogeneousAlphabets.lean)
          N=Nightfall.ProductSpace.Heterogeneous
          python3 scripts/lean_bridge.py "research/formalization_candidates/wright/HeterogeneousESDegreeEndpoint.lean" \
            --workspace /tmp/aa --timeout 2400 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.depDegree_implies_depESDegree \
            --decl $N.heterogeneous_es_influence \
            --json-out lean-receipts/heterogeneous-es-endpoint.json || {
              python3 -c "import json;r=json.load(open('lean-receipts/heterogeneous-es-endpoint.json'));print(r.get('status'));print((r.get('stdout') or '')[-45000:]);print((r.get('stderr') or '')[-10000:])" || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/heterogeneous-es-endpoint.json
          sha256sum "research/formalization_candidates/wright/HeterogeneousESDegreeEndpoint.lean" > lean-receipts/heterogeneous-es-source-SHA256SUMS.txt
      - name: Strict kernel-check Swansea Q2 sharp source-level section budget
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space
          O=research/nightfall/formalization/observability
          cp "$O/QuadraticUnifiedFinite.lean" /tmp/aa/QuadraticUnifiedFinite.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/QuadraticUnifiedFinite.olean QuadraticUnifiedFinite.lean)
          N=Nightfall.Observability.Q2SharpSections
          python3 scripts/lean_bridge.py "$P/Q2SharpSections.lean" \
            --workspace /tmp/aa --timeout 1200 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.weighted_variance_le_quarter_range \
            --decl $N.weighted_std_le_half_range \
            --decl $N.actual_quadratic_centered_sections_le_eight \
            --json-out lean-receipts/q2-sharp-sections.json || {
              python3 -c "import json;r=json.load(open('lean-receipts/q2-sharp-sections.json'));print(r.get('status'));print((r.get('stdout') or '')[-50000:]);print((r.get('stderr') or '')[-10000:])" || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-sharp-sections.json
          sha256sum "$P/Q2SharpSections.lean" > lean-receipts/q2-sharp-sections-SHA256SUMS.txt
      - name: Strict kernel-check Swansea Q2 actual-source representation and section bridge
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space
          cp "$P/Q2SharpSections.lean" /tmp/aa/Q2SharpSections.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/Q2SharpSections.olean Q2SharpSections.lean)
          N=Nightfall.Observability.Q2SourceRepresentation
          python3 scripts/lean_bridge.py "$P/Q2SourceRepresentation.lean" \
            --workspace /tmp/aa --timeout 1200 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.small_support_embeds_in_pair \
            --decl $N.exists_actual_quadratic_representation \
            --decl $N.actual_degree_two_source_section_budget_eight \
            --json-out lean-receipts/q2-source-representation.json || {
              python3 -c "import json;r=json.load(open('lean-receipts/q2-source-representation.json'));print(r.get('status'));print((r.get('stdout') or '')[-50000:]);print((r.get('stderr') or '')[-10000:])" || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-source-representation.json
          sha256sum "$P/Q2SourceRepresentation.lean" > lean-receipts/q2-source-representation-SHA256SUMS.txt
      - name: Capture source hashes and upstream pin
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/product_space/ProductInfluence.lean \
            research/nightfall/formalization/product_space/EfronSteinDegree.lean \
            research/nightfall/formalization/product_space/QuadraticHoeffdingBridge.lean \
            research/nightfall/formalization/product_space/HeterogeneousAlphabets.lean \
            research/nightfall/formalization/product_space/ProductRowBound.lean \
            research/nightfall/formalization/product_space/ProductSpaceTwoSidedBridge.lean \
            > lean-receipts/SHA256SUMS.txt
          echo 2a6ceaef872ae993708950f951989134084b851a > lean-receipts/turturean-upstream-commit.txt
          echo leanprover/lean4:v4.33.0 > lean-receipts/lean-toolchain.txt
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-influence-receipt
          path: lean-receipts/
          if-no-files-found: warn
