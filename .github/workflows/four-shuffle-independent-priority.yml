name: Four-shuffle independent exact proof audit

on:
  pull_request:
    paths:
      - "research/nightfall/2026-11-four-shuffle/**"
      - ".github/workflows/four-shuffle-independent-priority.yml"
  push:
    branches: [main]
    paths:
      - "research/nightfall/2026-11-four-shuffle/**"
      - ".github/workflows/four-shuffle-independent-priority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-independent-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        run: python3 --version
      - name: Original complete finite proof
        run: python3 -I research/nightfall/2026-11-four-shuffle/verify_four_shuffle.py
      - name: Separately authored complete finite proof
        run: python3 -I research/nightfall/2026-11-four-shuffle/independent_four_shuffle_audit.py
