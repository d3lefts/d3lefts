name: NIGHTFALL actual F9 two-digit physical square block Lean
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/finite_field/F9PhysicalSquareBlock.lean'
      - '.github/workflows/nightfall-f9-physical-square-block.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f9-physical-block:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Build full actual squared-linear source block dependencies
        shell: bash
        run: |
          set -euo pipefail
          for F in F9OracleBridge F9ActualFieldBasis F9CalibratedRow F9PhysicalSquareBlock; do
            cp "research/nightfall/formalization/finite_field/$F.lean" "/tmp/mathlib4/$F.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$F.olean" "$F.lean")
          done
      - name: Named theorem and standard-axiom audit
        shell: bash
        run: |
          set -euo pipefail
          N=Nightfall.FiniteField.F9PhysicalSquareBlock
          python3 scripts/lean_bridge.py research/nightfall/formalization/finite_field/F9PhysicalSquareBlock.lean --workspace /tmp/mathlib4 --strict --timeout 900 --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.physical_square_two_digit" --decl "$N.actual_squared_linear_reading" --decl "$N.actual_basis_block_expansion" --json-out /tmp/f9-physical-square-block-receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py /tmp/f9-physical-square-block-receipt.json
