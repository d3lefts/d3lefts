name: NIGHTFALL Lean kernel sanity — finite characteristic three
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/characteristic_three/**'
      - 'lean-toolchain'
      - '.github/workflows/lean-char3-sanity.yml'
  push:
    branches: [main]
    paths:
      - 'research/nightfall/formalization/characteristic_three/**'
      - 'lean-toolchain'
      - '.github/workflows/lean-char3-sanity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain without Lake package scaffolding
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.35.0
          ~/.elan/bin/lean --version
      - name: Kernel-elaborate both finite mod-3 lemmas
        run: ~/.elan/bin/lean research/nightfall/formalization/characteristic_three/Finite3.lean
