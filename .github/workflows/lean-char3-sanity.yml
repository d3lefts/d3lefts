name: NIGHTFALL Lean bridge — kernel compilation and receipts
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/**'
      - 'scripts/lean_bridge.py'
      - 'tests/test_lean_bridge.py'
      - 'tests/test_adaptive_information_bound.py'
      - 'lean-toolchain'
      - '.github/workflows/lean-char3-sanity.yml'
  push:
    branches: [main]
    paths:
      - 'research/nightfall/formalization/**'
      - 'scripts/lean_bridge.py'
      - 'tests/test_lean_bridge.py'
      - 'lean-toolchain'
      - '.github/workflows/lean-char3-sanity.yml'
  workflow_dispatch:
    inputs:
      source:
        description: 'Additional committed Lean file to compile (relative to repo root)'
        required: false
        default: 'research/nightfall/formalization/characteristic_three/Finite3.lean'
        type: string

permissions:
  contents: read

jobs:
  lean-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install repo-pinned Lean via elan
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Test bridge protocol (does not substitute for kernel checking)
        run: python3 -m unittest discover -s tests -p test_lean_bridge.py -v
      - name: Compile original two finite-field lemmas and check reported axioms
        run: |
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/characteristic_three/Finite3.lean \
            --strict \
            --decl Nightfall.FiniteField.cubing_is_identity_mod_three \
            --decl Nightfall.FiniteField.cube_additive_mod_three \
            --json-out lean-receipts/finite3.json
      - name: Kernel-check power-information inequality and independently audit foundational axioms
        run: |
          python3 tests/test_adaptive_information_bound.py
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/finite_field/AdaptiveInformationBound.lean \
            --decl Nightfall.FiniteField.information_square_bound \
            --decl Nightfall.FiniteField.information_power_bound \
            --json-out lean-receipts/adaptive-information.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("lean-receipts/adaptive-information.json")
          data = json.loads(path.read_text())
          names = [
              "Nightfall.FiniteField.information_square_bound",
              "Nightfall.FiniteField.information_power_bound",
          ]
          allowed = {"propext", "Quot.sound"}
          assert data["status"] == "COMPILED" and data["version_matches_pin"] is True
          assert not data["policy_findings"], data["policy_findings"]
          checked = {}
          for name in names:
              prefix = "'" + name + "' depends on axioms: ["
              matches = [
                  line[len(prefix):-1]
                  for line in data["stdout"].splitlines()
                  if line.startswith(prefix) and line.endswith("]")
              ]
              assert matches, "Expected Lean axiom dependencies for " + name
              deps = set(x.strip() for x in matches[-1].split(",") if x.strip())
              assert deps <= allowed, (name, deps - allowed)
              checked[name] = sorted(deps)
          result = {
              "status": "COMPILED_FOUNDATIONS_ONLY",
              "source_sha256": data["source_sha256"],
              "compiler_version": data["compiler_version"],
              "declaration_axioms": checked,
              "claim_scope": "arithmetic inequality only; no full oracle theorem or novelty certification",
          }
          Path("lean-receipts/adaptive-information-foundations.json").write_text(
              json.dumps(result, sort_keys=True, indent=2) + "\\n")
          print(json.dumps(result, indent=2))
          PY
      - name: Compile requested committed file (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE: ${{ inputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_bridge.py "$SOURCE" \
            --json-out lean-receipts/dispatch.json
      - name: Upload machine-readable verification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-lean-receipts
          path: lean-receipts/*.json
          if-no-files-found: warn
          retention-days: 30
