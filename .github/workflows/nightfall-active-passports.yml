name: NIGHTFALL addressed-family exact computational replay
on:
  pull_request:
    paths:
      - 'research/nightfall/2026-11-information-cost-dissertation/check_addressed_family_exact.py'
      - 'research/nightfall/2026-11-active-passports/check_addressed_family_independent.cjs'
      - '.github/workflows/nightfall-active-passports.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 research/nightfall/2026-11-information-cost-dissertation/check_addressed_family_exact.py
      - run: node research/nightfall/2026-11-active-passports/check_addressed_family_independent.cjs
