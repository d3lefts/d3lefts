name: NIGHTFALL twelve active Proof Passport scopes and Lean provenance
on:
  pull_request:
    paths:
      - 'docs/active-proof-passport.*'
      - 'docs/*proof-passport.html'
      - 'docs/lean-certificate-provenance.*'
      - 'research/nightfall/formalization/**'
      - 'scripts/test_lean_certificate_provenance.cjs'
      - 'docs/discovery-system.html'
      - 'docs/research.html'
      - 'docs/mathematical-results.html'
      - 'docs/site.js'
      - 'docs/sitemap.xml'
      - 'research/nightfall/2026-11-active-passports/**'
      - 'research/nightfall/2026-11-information-cost-dissertation/**'
      - 'scripts/test_active_proof_passport.cjs'
      - 'scripts/test_unrestricted_terminal_passport.cjs'
      - 'docs/unrestricted-terminal-proof-scope-20261114.json'
      - 'scripts/test_discovery_system_identity.cjs'
      - '.github/workflows/nightfall-active-passports.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # Only PR checkouts may have experimental Lean sources with no historical receipt.
  # Main stays fail-closed via the provenance scripts.
  NIGHTFALL_ALLOW_UNREVIEWED: ${{ github.event_name == 'pull_request' && '1' || '0' }}
permissions:
  contents: read
jobs:
  active-passport-scopes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify active claims, exact Lean provenance and frozen historical boundary
        run: |
          node scripts/test_active_proof_passport.cjs
          node scripts/test_unrestricted_terminal_passport.cjs
          node scripts/test_lean_certificate_provenance.cjs
          node scripts/test_discovery_system_identity.cjs
      - name: Independently replay finite addressed-family tester in two arithmetic implementations
        run: |
          python3 research/nightfall/2026-11-information-cost-dissertation/check_addressed_family_exact.py
          node research/nightfall/2026-11-active-passports/check_addressed_family_independent.cjs
      - name: Check public source links, page anchors and site metadata
        run: python3 scripts/check_site.py
