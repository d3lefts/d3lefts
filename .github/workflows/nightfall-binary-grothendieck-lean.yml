name: NIGHTFALL binary Grothendieck degree-two influence Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/binary_grothendieck/**'
      - '.github/workflows/nightfall-binary-grothendieck-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: binary-grothendieck-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  binary-grothendieck:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned Lean and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile certified Efron-Stein import chain
        shell: bash
        run: |
          set -euo pipefail
          for name in ActualProductMergeTower ActualProductHilbertJensen ActualProductSoftNoise \
                      ActualSourceANOVA ActualProductSourceMarginal ActualProductResampleBridge \
                      ActualSourceCentered ActualSourceOrthogonality ActualSourceVarianceEnergy \
                      ActualSourceInfluenceEnergy ActualSourceEfronStein; do
            cp "research/nightfall/formalization/observability/${name}.lean" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Compile binary Grothendieck source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/binary-grothendieck
          cp research/nightfall/formalization/binary_grothendieck/BinaryGrothendieckQ2.lean /tmp/mathlib4/BinaryGrothendieckQ2.lean
          (cd /tmp/mathlib4 && lake env lean BinaryGrothendieckQ2.lean) 2>&1 | tee lean-receipts/binary-grothendieck/compile.log
      - name: Strict named theorem and standard axiom audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_bridge.py research/nightfall/formalization/binary_grothendieck/BinaryGrothendieckQ2.lean \
            --workspace /tmp/mathlib4 --strict --timeout 1200 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.BinaryGrothendieck.krivine_coefficient_lt_51 \
            --decl Nightfall.BinaryGrothendieck.BinQuad.polarization \
            --decl Nightfall.BinaryGrothendieck.BinQuad.mix \
            --decl Nightfall.BinaryGrothendieck.BinQuad.influence_le \
            --decl Nightfall.BinaryGrothendieck.BinQuad.binary_q2_grothendieck \
            --decl Nightfall.BinaryGrothendieck.BinQuad.binary_q2_coefficient_lt_51 \
            --json-out lean-receipts/binary-grothendieck/receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/binary-grothendieck/receipt.json
      - name: Exact source provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/binary-grothendieck
          git rev-parse HEAD > lean-receipts/binary-grothendieck/head.txt
          sha256sum research/nightfall/formalization/binary_grothendieck/BinaryGrothendieckQ2.lean > lean-receipts/binary-grothendieck/sha256.txt
      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: binary-grothendieck-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/binary-grothendieck
          if-no-files-found: warn
