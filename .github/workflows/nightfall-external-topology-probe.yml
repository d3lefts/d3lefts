name: NIGHTFALL external topology source compatibility probe (NOT certification)
on:
  pull_request:
    paths:
      - '.github/workflows/nightfall-external-topology-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  topology-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Fetch immutable external topology source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/facebookresearch/atlas-lean.git /tmp/atlas-lean
          git -C /tmp/atlas-lean checkout --detach 7857a2e8c32088b5002f7cafe29a21d936baf704
          test "$(git -C /tmp/atlas-lean rev-parse HEAD)" = 7857a2e8c32088b5002f7cafe29a21d936baf704
          mkdir -p /tmp/mathlib4/MathlibExt/Geometry/Manifold
          mkdir -p /tmp/mathlib4/MathlibExt/MeasureTheory/Measure
          for p in \
            MathlibExt/MeasureTheory/Measure/ImageNull.lean \
            MathlibExt/Geometry/Manifold/Sard.lean \
            MathlibExt/Geometry/Manifold/ParametricSard.lean \
            MathlibExt/Geometry/Manifold/RiemannianMetricExistence.lean \
            MathlibExt/Geometry/Manifold/OneDimensional.lean; do
            cp "/tmp/atlas-lean/$p" "/tmp/mathlib4/$p"
            sha256sum "/tmp/mathlib4/$p"
          done
      - name: Source-exact Mathlib 4.36 compatibility build
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for M in \
            MathlibExt/MeasureTheory/Measure/ImageNull \
            MathlibExt/Geometry/Manifold/Sard \
            MathlibExt/Geometry/Manifold/ParametricSard \
            MathlibExt/Geometry/Manifold/RiemannianMetricExistence \
            MathlibExt/Geometry/Manifold/OneDimensional; do
            mkdir -p ".lake/build/lib/lean/$(dirname "$M")"
            echo "=== probing $M ==="
            lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean" 2>&1 | tee "/tmp/$(basename "$M").log"
          done
          echo "PASS: Sard, parametric Sard and one-dimensional manifold sources compile on pin; NOT the zero theorem"

      - name: Audit imported Sard and one-manifold theorem axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          cat > ExternalProductTopologyAxioms.lean <<'LEAN'
          import MathlibExt.Geometry.Manifold.ParametricSard
          import MathlibExt.Geometry.Manifold.OneDimensional
          #check MathlibExt.Geometry.Manifold.ParametricSardWanted.parametricSard
          #check MathlibExt.Geometry.Manifold.OneDimensionalWanted.compact_connected_one_manifold_with_boundary_classification
          #print axioms MathlibExt.Geometry.Manifold.ParametricSardWanted.parametricSard
          #print axioms MathlibExt.Geometry.Manifold.OneDimensionalWanted.compact_connected_one_manifold_with_boundary_classification
          #print axioms MathlibExt.Geometry.Manifold.SardWanted.sard_theorem
          LEAN
          lake env lean ExternalProductTopologyAxioms.lean 2>&1 | tee /tmp/ExternalProductTopologyAxioms.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('/tmp/ExternalProductTopologyAxioms.log').read_text()
          names=[
            'MathlibExt.Geometry.Manifold.ParametricSardWanted.parametricSard',
            'MathlibExt.Geometry.Manifold.OneDimensionalWanted.compact_connected_one_manifold_with_boundary_classification',
            'MathlibExt.Geometry.Manifold.SardWanted.sard_theorem',
          ]
          allowed={'propext','Classical.choice','Quot.sound'}
          for name in names:
            m=re.search(r"'" + re.escape(name) + r"' depends on axioms:\s*\[([^\]]*)\]",log,re.S)
            if m:
              found={a.strip() for a in m.group(1).split(',') if a.strip()}
            else:
              assert f"'{name}' does not depend on any axioms" in log, ('MISSING_AXIOM_RECEIPT',name)
              found=set()
            assert found <= allowed,('NONSTANDARD_AXIOMS',name,found)
            print('EXACT IMPORT AXIOM PASS',name,sorted(found))
          assert 'sorryAx' not in log
          PY
          echo "PASS: external Sard/manifold theorem axiom closure; NOT an unconditional ProductSphereZero proof"
