name: NIGHTFALL v8 sharp finite-product bridge gates (active compiler)
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/aa_v8/**'
      - '.github/workflows/nightfall-v8-sharp-bridges.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  moment346:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile polynomial identity and weighted moment interpolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/v8
          P=research/nightfall/formalization/aa_v8/WrightV8Moment346.lean
          cp "$P" /tmp/mathlib4/WrightV8Moment346.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/WrightV8Moment346.olean WrightV8Moment346.lean)
          python3 scripts/lean_bridge.py "$P" \
            --workspace /tmp/mathlib4 --timeout 1800 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl Nightfall.Wright.Moment346.weighted_moment_346 \
            --json-out lean-receipts/v8/moment346.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/v8/moment346.json
          (cd /tmp/mathlib4 && lake env leanchecker -v WrightV8Moment346)
          sha256sum "$P" > lean-receipts/v8/source-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nightfall-v8-moment346-${{ github.run_id }}
          path: lean-receipts/v8
          if-no-files-found: warn
  median-scalar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile median scalar claims independently of product closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/v8
          cp research/nightfall/formalization/aa_v8/WrightV8MedianMixed.lean /tmp/mathlib4/WrightV8MedianMixed.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/WrightV8MedianMixed.olean WrightV8MedianMixed.lean)
          python3 scripts/lean_bridge.py research/nightfall/formalization/aa_v8/WrightV8MedianMixed.lean \
            --workspace /tmp/mathlib4 --timeout 1800 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl Nightfall.Wright.SharpMedian.mixed_cube_amgm \
            --decl Nightfall.Wright.SharpMedian.mixed_cube_of_crossing \
            --decl Nightfall.Wright.SharpMedian.weighted_mixed_pair_dominance \
            --decl Nightfall.Wright.SharpMedian.normalized_two_sided_median \
            --json-out lean-receipts/v8/scalar.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/v8/scalar.json
          (cd /tmp/mathlib4 && lake env leanchecker -v WrightV8MedianMixed)
          sha256sum research/nightfall/formalization/aa_v8/WrightV8MedianMixed.lean > lean-receipts/v8/sources-sha256.txt
      - name: Upload exact-head scalar certificate or failure receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightfall-v8-scalar-${{ github.run_id }}
          path: lean-receipts/v8
          if-no-files-found: warn
  product-mixed:
    runs-on: ubuntu-latest
    timeout-minutes: 145
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Verify source custody and compile existing 179-module product closure
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_nightfall_lake_scope.py
          mkdir -p lean-receipts/v8
          while read -r M P; do
            [ -z "$M" ] && continue
            REL="${M//.//}"
            mkdir -p "/tmp/mathlib4/$(dirname "$REL")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$REL")"
            cp "$P" "/tmp/mathlib4/$REL.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$REL.olean" "$REL.lean")
          done < research/nightfall/formalization/aa_product/CLOSURE.txt
      - name: Compile product-space transfer modules and print named axiom receipts
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/aa_v8
          for M in WrightV8MedianMixed WrightV8RowConditional WrightV8MixedFunctional WrightV8MixedWeightRemoval; do
            cp "$P/$M.lean" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean")
          done
          python3 scripts/lean_bridge.py "$P/WrightV8RowConditional.lean" \
            --workspace /tmp/mathlib4 --timeout 2400 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl Nightfall.ProductSpace.RowBound.product_block_inequality_of_sharp_sensitivity \
            --decl Nightfall.ProductSpace.RowBound.product_scaled_bound_of_sharp_sensitivity \
            --decl Nightfall.ProductSpace.RowBound.product_packing_bound_of_sharp_sensitivity \
            --decl Nightfall.ProductSpace.RowBound.product_row_bound_of_sharp_sensitivity \
            --json-out lean-receipts/v8/row.json
          python3 scripts/lean_bridge.py "$P/WrightV8MixedFunctional.lean" \
            --workspace /tmp/mathlib4 --timeout 2400 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl Nightfall.Wright.MixedFunctional.weighted_mixed_crossing_budget \
            --json-out lean-receipts/v8/functional.json
          python3 scripts/lean_bridge.py "$P/WrightV8MixedWeightRemoval.lean" \
            --workspace /tmp/mathlib4 --timeout 2400 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl Nightfall.Wright.MixedWeightRemoval.mixed_third_moment_product \
            --json-out lean-receipts/v8/weight-removal.json
          for receipt in lean-receipts/v8/*.json; do
            python3 research/nightfall/formalization/product_space/check_receipts.py "$receipt"
          done
          for M in WrightV8MedianMixed WrightV8RowConditional WrightV8MixedFunctional WrightV8MixedWeightRemoval; do
            (cd /tmp/mathlib4 && lake env leanchecker -v "$M")
          done
          sha256sum "$P"/*.lean > lean-receipts/v8/sources-sha256.txt
          git rev-parse HEAD > lean-receipts/v8/head-sha.txt
      - name: Upload product bridge receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightfall-v8-product-${{ github.run_id }}
          path: lean-receipts/v8
          if-no-files-found: warn
