name: NIGHTFALL Route 1 reciprocal atom Lean
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/Route1ReciprocalAtom.lean'
      - '.github/workflows/nightfall-route1-reciprocal-atom.yml'
      - 'research/nightfall/structural_information/check_route1_injective_simon.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reciprocal-atom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Replay finite exact atom and cover cases
        run: python3 research/nightfall/structural_information/check_route1_injective_simon.py
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile and audit three exact polynomial declarations
        shell: bash
        run: |
          set -euo pipefail
          P="research/nightfall/formalization/product_space/Route1ReciprocalAtom.lean"
          cp "$P" /tmp/mathlib4/Route1ReciprocalAtom.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Route1ReciprocalAtom.olean Route1ReciprocalAtom.lean) 2>&1 | tee /tmp/reciprocal-receipt.log
          python3 - <<'PY'
          import re
          data = open('/tmp/reciprocal-receipt.log').read()
          reports = dict(re.findall(r"'([^']+)' depends on axioms:\s*\[([^\]]*)\]", data, re.S))
          for suffix in ('reciprocalAtom_eval_inv','reciprocalAtom_eval_zero','reciprocalAtom_natDegree_le'):
              name = 'Nightfall.Route1ReciprocalAtom.' + suffix
              assert name in reports, name
              found = {x.strip() for x in reports[name].split(',') if x.strip()}
              assert found <= {'propext','Classical.choice','Quot.sound'}, (name, found)
              print(name, sorted(found))
          assert 'sorryAx' not in data
          PY
