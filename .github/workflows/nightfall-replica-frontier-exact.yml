name: NIGHTFALL replica restriction exact frontier
on:
  push:
    branches:
      - research/sharp-replica-restriction-frontier-20261113
    paths:
      - 'research/nightfall/2026-11-replica-restriction/**'
      - '.github/workflows/nightfall-replica-frontier-exact.yml'
  pull_request:
    paths:
      - 'research/nightfall/2026-11-replica-restriction/**'
      - '.github/workflows/nightfall-replica-frontier-exact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independently-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact full-replica identities
        run: python3 -I research/nightfall/2026-11-replica-restriction/checks/check_replica_restrictions.py
      - name: Independent one-hot sharpness
        run: python3 -I research/nightfall/2026-11-replica-restriction/checks/check_sharp_frontier.py
      - name: Print exact source hashes
        run: |
          sha256sum research/nightfall/2026-11-replica-restriction/SHARP_REPLICA_TRANSFER_20261113.md
          sha256sum research/nightfall/2026-11-replica-restriction/checks/check_replica_restrictions.py
          sha256sum research/nightfall/2026-11-replica-restriction/checks/check_sharp_frontier.py
