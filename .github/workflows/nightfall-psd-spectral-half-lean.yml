name: NIGHTFALL PSD determinant spectral product (Lean 4.35)

on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/SpectralProductHalf.lean'
      - '.github/workflows/nightfall-psd-spectral-half-lean.yml'
  push:
    branches: [main]
    paths:
      - 'research/nightfall/formalization/observability/SpectralProductHalf.lean'
      - '.github/workflows/nightfall-psd-spectral-half-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  psd-spectral:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.35.0 and Mathlib v4.35.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          git clone --depth 1 --branch v4.35.0 https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4
          (cd /tmp/mathlib4 && "$HOME/.elan/bin/lake" exe cache get)
      - name: Strict named-declaration kernel and axiom receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/SpectralProductHalf.lean \
            --workspace /tmp/mathlib4 --timeout 480 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Observability.PSD.product_one_sub_lower \
            --decl Nightfall.Observability.PSD.spectral_product_half \
            --json-out lean-receipts/psd-spectral-half.json || {
              cat lean-receipts/psd-spectral-half.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/psd-spectral-half.json
      - name: Capture source and pin
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/SpectralProductHalf.lean > lean-receipts/SHA256SUMS
          echo leanprover/lean4:v4.35.0 > lean-receipts/lean-toolchain.txt
          git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/mathlib-sha.txt 2>/dev/null || true
      - name: Archive receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-psd-spectral-product-lean
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 45
