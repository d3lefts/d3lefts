name: NIGHTFALL grader stdout-origination adversarial proof attack (synthetic)

on:
  pull_request:
    paths:
      - 'research/nightfall/evaluations/assurance/audit_same_process_score_forgery.py'
      - 'research/nightfall/evaluations/assurance/GRADER_PROCESS_BOUNDARY_NO_GO_20261118.md'
      - '.github/workflows/nightfall-grade-process-forgery.yml'
      - 'research/nightfall/evaluations/assurance/trusted_container_grade.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toy-score-forgery:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - name: Checkout exact audit source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Freeze toy-source custody and local Docker image
        shell: bash
        run: |
          set -euo pipefail
          OUT="proof-receipts/grader-process-boundary"
          mkdir -p "$OUT"
          git rev-parse HEAD > "$OUT/head.txt"
          python -V > "$OUT/python.txt" 2>&1
          sha256sum \
            research/nightfall/evaluations/assurance/audit_same_process_score_forgery.py \
            research/nightfall/evaluations/assurance/trusted_container_grade.py \
            research/nightfall/evaluations/assurance/join_grader_capture.py \
            research/nightfall/evaluations/assurance/GRADER_PROCESS_BOUNDARY_NO_GO_20261118.md \
            > "$OUT/SHA256SUMS"
          docker pull python:3.13-slim
          image="$(docker image inspect --format '{{.Id}}' python:3.13-slim)"
          printf '%s' "$image" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "NIGHTFALL_TEST_DOCKER_ID=$image" >> "$GITHUB_ENV"
          printf '%s\n' "$image" > "$OUT/docker-image-id.txt"
      - name: Reproduce TWO false-perfect grades using actual grading capsule
        shell: bash
        run: |
          set -euo pipefail
          python -I research/nightfall/evaluations/assurance/audit_same_process_score_forgery.py \
            | tee proof-receipts/grader-process-boundary/false-perfect-scores.jsonl
      - name: Archive observed vulnerability with exact SHA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grader-score-origin-bypass-python-${{ matrix.python }}
          path: proof-receipts/grader-process-boundary/
          retention-days: 60
