name: Right to Act — independent ControlArena IaC Fast promotion check
on:
  pull_request:
    paths:
      - ".github/workflows/right-to-act-controlarena-promotion.yml"
      - "research/nightfall/right-to-act-promotion/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: right-to-act-promotion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-source-promotion:
    name: Three-event source-matched CloudFormation promotion
    runs-on: ubuntu-latest
    environment: controlarena-python
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/nightfall/right-to-act-promotion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact CDK and ControlArena source dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'control-arena==20.1.1' 'aws-cdk-lib==2.260.0' 'jsii==1.137.0' 'constructs==10.5.0' 'pytest==8.4.2'
          python -m pip freeze > installed-versions.txt
          node --version
      - name: Independently validate resource-effect verifier negative controls
        run: python -m pytest -q test_effect_verifier.py test_concurrent_authority.py test_atomic_version_gate.py
      - name: Three-event real-source promotion experiment
        env:
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
        run: |
          python promotion_runner.py --out promotion-results
      - name: Separate independent replay of synthesized authorized artifact and benchmark scores
        if: success()
        run: python audit_receipt.py --dir promotion-results
      - name: Second independent artifact-only effect oracle
        if: success()
        run: |
          zip -qr second-oracle-input.zip promotion-results
          python second_oracle.py second-oracle-input.zip | tee promotion-results/second_oracle_audit.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('promotion-results/second_oracle_audit.json').read_text())
          assert r['run']=='github:d3lefts/d3lefts:'+os.environ['GITHUB_RUN_ID'], 'stale or forged run provenance'
          PY
      - name: Source-version and policy-epoch atomic promotion over official CDK fixture
        env:
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
        run: |
          python run_atomic_version_experiment.py --out atomic-results
      - name: Independent version-bound artifact and scorer audit
        run: |
          python audit_atomic_artifacts.py --dir atomic-results | tee atomic-results/audit_stdout.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('atomic-results/atomic_audit.json').read_text())
          assert r['github_run_id']==os.environ['GITHUB_RUN_ID'], 'stale source/version audit run'
          assert r['status']=='passed'
          PY
      - name: Upload exact source-matched evidence and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: right-to-act-iac-fast-promotion
          path: |
            research/nightfall/right-to-act-promotion/promotion-results/receipt.json
            research/nightfall/right-to-act-promotion/promotion-results/independent_audit.json
            research/nightfall/right-to-act-promotion/promotion-results/second_oracle_audit.json
            research/nightfall/right-to-act-promotion/promotion-results/baseline.template.json
            research/nightfall/right-to-act-promotion/promotion-results/legitimate.template.json
            research/nightfall/right-to-act-promotion/promotion-results/harmful.template.json
            research/nightfall/right-to-act-promotion/promotion-results/promoted/OrganisationStack.template.json
            research/nightfall/right-to-act-promotion/installed-versions.txt
            research/nightfall/right-to-act-promotion/atomic-results/atomic_receipt.json
            research/nightfall/right-to-act-promotion/atomic-results/atomic_audit.json
            research/nightfall/right-to-act-promotion/atomic-results/baseline.template.json
            research/nightfall/right-to-act-promotion/atomic-results/legitimate.template.json
            research/nightfall/right-to-act-promotion/atomic-results/harmful.template.json
            research/nightfall/right-to-act-promotion/atomic-results/trusted/state.json
            research/nightfall/right-to-act-promotion/atomic-results/trusted/published.json
            research/nightfall/right-to-act-promotion/atomic-results/trusted/snapshots/**
          if-no-files-found: warn
          retention-days: 14
