name: Right to Act — independent ControlArena IaC Fast promotion check
on:
  pull_request:
    paths:
      - ".github/workflows/right-to-act-controlarena-promotion.yml"
      - "research/nightfall/right-to-act-promotion/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: right-to-act-promotion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-source-promotion:
    name: Three-event source-matched CloudFormation promotion
    runs-on: ubuntu-latest
    environment: controlarena-python
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research/nightfall/right-to-act-promotion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fail-fast OS authority deadline regression (stdlib only)
        run: |
          python - <<'PY'
          from test_service_deadline import (
              test_silent_client_cannot_starve_trusted_request,
              test_slow_drip_cannot_starve_trusted_request)
          test_silent_client_cannot_starve_trusted_request()
          test_slow_drip_cannot_starve_trusted_request()
          print('PASS: two absolute-deadline starvation regressions')
          PY
      - name: Install exact CDK and ControlArena source dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'control-arena==20.1.1' 'aws-cdk-lib==2.260.0' 'jsii==1.137.0' 'constructs==10.5.0' 'pytest==8.4.2'
          python -m pip freeze > installed-versions.txt
          node --version
      - name: Independently validate resource-effect verifier negative controls
        run: python -m pytest -q test_effect_verifier.py test_concurrent_authority.py test_atomic_version_gate.py
      - name: Three-event real-source promotion experiment
        env:
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
        run: |
          python promotion_runner.py --out promotion-results
      - name: Separate independent replay of synthesized authorized artifact and benchmark scores
        if: success()
        run: python audit_receipt.py --dir promotion-results
      - name: Second independent artifact-only effect oracle
        if: success()
        run: |
          zip -qr second-oracle-input.zip promotion-results
          python second_oracle.py second-oracle-input.zip | tee promotion-results/second_oracle_audit.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('promotion-results/second_oracle_audit.json').read_text())
          assert r['run']=='github:d3lefts/d3lefts:'+os.environ['GITHUB_RUN_ID'], 'stale or forged run provenance'
          PY
      - name: Source-version and policy-epoch atomic promotion over official CDK fixture
        env:
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
        run: |
          python run_atomic_version_experiment.py --out atomic-results
      - name: Independent version-bound artifact and scorer audit
        run: |
          python audit_atomic_artifacts.py --dir atomic-results | tee atomic-results/audit_stdout.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('atomic-results/atomic_audit.json').read_text())
          assert r['github_run_id']==os.environ['GITHUB_RUN_ID'], 'stale source/version audit run'
          assert r['status']=='passed'
          PY
      - name: Preserve complete admitted source snapshots and independently replay hashes
        run: |
          tar -C atomic-results/trusted -cf atomic-results/admitted-snapshots.tar snapshots
          python audit_atomic_archive.py --dir atomic-results | tee atomic-results/archive_audit_stdout.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('atomic-results/atomic_archive_audit.json').read_text())
          assert r['archive_audit']=='passed'
          assert r['github_run_id']==os.environ['GITHUB_RUN_ID']
          assert r['includes_hidden_source_files'] is True
          PY
      - name: Build distinct non-root CDK sandbox
        timeout-minutes: 15
        run: |
          docker version
          docker build --progress=plain -f Dockerfile.untrusted-cdk -t nightfall-iac-cdk-sandbox:v16 .
          docker image inspect --format '{{.Id}}' nightfall-iac-cdk-sandbox:v16 | tee isolated-image-id.txt
      - name: Execute OS isolation probes and source-matched authorization
        timeout-minutes: 15
        run: |
          python run_os_isolation.py --out os-isolation-results
      - name: Independently verify Docker boundary and promoted artifact
        run: |
          python audit_os_isolation.py --dir os-isolation-results
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('os-isolation-results')
          receipt=json.loads((root/'os_boundary_receipt.json').read_text())
          audit=json.loads((root/'os_independent_audit.json').read_text())
          assert receipt['sandbox_image_id']==Path('isolated-image-id.txt').read_text().strip()
          assert audit['run_id']==os.environ['GITHUB_RUN_ID']
          assert audit['status']=='passed'
          PY
      - name: Test separately authenticated Linux authority effect service
        timeout-minutes: 5
        run: |
          python run_effect_service_experiment.py --source os-isolation-results --out effect-service-results
      - name: Independent service-owned deployment artifact and authorization audit
        run: |
          python audit_effect_service.py --source os-isolation-results --out effect-service-results
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('effect-service-results/service_independent_audit.json').read_text())
          assert r['independent_audit']=='passed'
          assert r['github_run_id']==os.environ['GITHUB_RUN_ID']
          assert r['verified_event_count']==10
          PY
      - name: Upload exact source-matched evidence and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: right-to-act-iac-fast-promotion
          path: |
            research/nightfall/right-to-act-promotion/promotion-results/receipt.json
            research/nightfall/right-to-act-promotion/promotion-results/independent_audit.json
            research/nightfall/right-to-act-promotion/promotion-results/second_oracle_audit.json
            research/nightfall/right-to-act-promotion/promotion-results/baseline.template.json
            research/nightfall/right-to-act-promotion/promotion-results/legitimate.template.json
            research/nightfall/right-to-act-promotion/promotion-results/harmful.template.json
            research/nightfall/right-to-act-promotion/promotion-results/promoted/OrganisationStack.template.json
            research/nightfall/right-to-act-promotion/installed-versions.txt
            research/nightfall/right-to-act-promotion/atomic-results/atomic_receipt.json
            research/nightfall/right-to-act-promotion/atomic-results/atomic_audit.json
            research/nightfall/right-to-act-promotion/atomic-results/baseline.template.json
            research/nightfall/right-to-act-promotion/atomic-results/legitimate.template.json
            research/nightfall/right-to-act-promotion/atomic-results/harmful.template.json
            research/nightfall/right-to-act-promotion/atomic-results/trusted/state.json
            research/nightfall/right-to-act-promotion/atomic-results/trusted/published.json
            research/nightfall/right-to-act-promotion/atomic-results/admitted-snapshots.tar
            research/nightfall/right-to-act-promotion/atomic-results/atomic_archive_audit.json
            research/nightfall/right-to-act-promotion/os-isolation-results/os_boundary_receipt.json
            research/nightfall/right-to-act-promotion/os-isolation-results/os_independent_audit.json
            research/nightfall/right-to-act-promotion/os-isolation-results/baseline.template.json
            research/nightfall/right-to-act-promotion/os-isolation-results/legitimate.template.json
            research/nightfall/right-to-act-promotion/os-isolation-results/harmful.template.json
            research/nightfall/right-to-act-promotion/os-isolation-results/trusted/state.json
            research/nightfall/right-to-act-promotion/os-isolation-results/trusted/published.json
            research/nightfall/right-to-act-promotion/isolated-image-id.txt
            research/nightfall/right-to-act-promotion/effect-service-results/service_receipt.json
            research/nightfall/right-to-act-promotion/effect-service-results/service_independent_audit.json
            research/nightfall/right-to-act-promotion/effect-service-results/service_final_state.json
            research/nightfall/right-to-act-promotion/effect-service-results/service_committed_template.json
          if-no-files-found: warn
          retention-days: 14
