name: NIGHTFALL DQ2 Lean score-duality scalar interface (scope-limited)
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/dq2/**'
      - '.github/workflows/nightfall-dq2-lean-score.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-score-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install exact pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Generate manifest from pinned Mathlib revision and load cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.36.0-rc2"
          "$HOME/.elan/bin/lake" update
          grep -F '9d581dfff2e41de989072ea63abf3daf69311520' lake-manifest.json
          "$HOME/.elan/bin/lake" exe cache get
      - name: Compile exact source and print named theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/dq2/DQ2HeatBathScoreTransfer.lean
          SECTION=research/nightfall/formalization/dq2/DQ2BinarySection.lean
          test "$(cat lean-toolchain)" = "leanprover/lean4:v4.36.0-rc2"
          python3 - <<'PY_GATE'
          from pathlib import Path
          import re
          s='\n'.join(Path(f).read_text() for f in (
            'research/nightfall/formalization/dq2/DQ2HeatBathScoreTransfer.lean',
            'research/nightfall/formalization/dq2/DQ2BinarySection.lean'))
          s=re.sub(r'/-.*?-/', '', s, flags=re.S)
          s=re.sub(r'--[^\\n]*', '', s)
          assert not re.search(r'\\b(sorry|admit|axiom)\\b', s), 'Unapproved placeholder or custom axiom'
          PY_GATE
          mkdir -p artifacts/dq2-lean
          sha256sum "$SRC" "$SECTION" lean-toolchain lakefile.toml lake-manifest.json | tee artifacts/dq2-lean/SHA256SUMS.txt
          lake env lean "$SRC" 2>&1 | tee artifacts/dq2-lean/named-axioms.log
          lake env lean "$SECTION" 2>&1 | tee -a artifacts/dq2-lean/named-axioms.log
          for d in score_duality_from_heatbath_contract reference_q2_transfer biased_heatbath_q2_scalar_terminal local_floor_heatbath_q2_scalar_terminal binary_section_score_mean_zero binary_section_variance_eq binary_section_variance_pos binary_section_score_energy binary_section_spin_score binary_global_residual_orthogonal binary_global_spin_score; do
            grep -F "'Nightfall.DQ2.${d}' depends on axioms:" artifacts/dq2-lean/named-axioms.log
          done
          ! grep -E 'sorryAx|declaration uses .sorry|error:' artifacts/dq2-lean/named-axioms.log
      - name: Save exact-source Lean proof receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dq2-score-duality-lean-scoped
          path: artifacts/dq2-lean/
          if-no-files-found: warn
