name: NIGHTFALL F9 same-oracle decoder and complement bridge Lean
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [nightfall/erdos-tenure-phase-sld-permission-20261116]
    paths:
      - 'research/nightfall/formalization/finite_field/F9OracleBridge.lean'
      - 'research/nightfall/formalization/finite_field/F9ActualFieldBasis.lean'
      - 'research/nightfall/formalization/finite_field/F9NonadaptiveLower.lean'
      - 'research/nightfall/formalization/finite_field/F9ConcreteLower.lean'
      - 'research/nightfall/2026-11-f9-bridge/**'
      - '.github/workflows/nightfall-f9-oracle-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oracle-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile genuine squared-oracle block and complement lemmas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p f9-receipts
          cp research/nightfall/formalization/finite_field/F9OracleBridge.lean /tmp/mathlib4/F9OracleBridge.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/F9OracleBridge.olean F9OracleBridge.lean)
      - name: Compile concrete GF9 basis and locally unconditional squared two-sign decoder
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/finite_field/F9ActualFieldBasis.lean /tmp/mathlib4/F9ActualFieldBasis.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/F9ActualFieldBasis.olean F9ActualFieldBasis.lean)
      - name: Compile unconditional short-partition fixed lower obstruction
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/finite_field/F9NonadaptiveLower.lean /tmp/mathlib4/F9NonadaptiveLower.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/F9NonadaptiveLower.olean F9NonadaptiveLower.lean)
      - name: Compile exact fixed F9 lower to arithmetic-gap interface
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/finite_field/F9GapArithmetic.lean /tmp/mathlib4/F9GapArithmetic.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/F9GapArithmetic.olean F9GapArithmetic.lean)
          cp research/nightfall/formalization/finite_field/F9ConcreteLower.lean /tmp/mathlib4/F9ConcreteLower.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/F9ConcreteLower.olean F9ConcreteLower.lean)
      - name: Strict named standard-axiom audit
        shell: bash
        run: |
          set -euo pipefail
          N=Nightfall.FiniteField.F9OracleBridge
          python3 scripts/lean_bridge.py research/nightfall/formalization/finite_field/F9OracleBridge.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.signBit_injective" --decl "$N.signBit_neg_collision" --decl "$N.block_value_squared_injective" --decl "$N.dot_add" --decl "$N.dot_sub" --decl "$N.complement_kernel_collision" --decl "$N.complement_witness_not_sign_equivalent" --json-out f9-receipts/bridge.json
          python3 research/nightfall/formalization/product_space/check_receipts.py f9-receipts/bridge.json
          N=Nightfall.FiniteField.F9ActualField
          python3 scripts/lean_bridge.py research/nightfall/formalization/finite_field/F9ActualFieldBasis.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.actual_F9_finrank" --decl "$N.actual_F9_squared_pair_decodes" --json-out f9-receipts/concrete-field.json
          python3 research/nightfall/formalization/product_space/check_receipts.py f9-receipts/concrete-field.json
      - name: Strict named short-partition obstruction audit
        shell: bash
        run: |
          set -euo pipefail
          N=Nightfall.FiniteField.F9NonadaptiveLower
          python3 scripts/lean_bridge.py research/nightfall/formalization/finite_field/F9NonadaptiveLower.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.short_rows_have_nonzero_kernel" --decl "$N.all_short_row_partitions_fail_square_recovery" --decl "$N.concatenated_short_row_designs_fail" --decl "$N.all_short_fixed_designs_fail" --decl "$N.same_oracle_nonadaptive_lower" --json-out f9-receipts/nonadaptive.json
          python3 research/nightfall/formalization/product_space/check_receipts.py f9-receipts/nonadaptive.json
      - name: Audit concrete F9 matched-oracle lower bridge
        shell: bash
        run: |
          set -euo pipefail
          N=Nightfall.FiniteField.F9ConcreteLower
          python3 scripts/lean_bridge.py research/nightfall/formalization/finite_field/F9ConcreteLower.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.F9_two_ne_zero" --decl "$N.actual_fixed_square_lower" --decl "$N.actual_fixed_family_lower" --decl "$N.same_oracle_gap_given_actual_adaptive_upper" --json-out f9-receipts/f9-concrete.json
          python3 research/nightfall/formalization/product_space/check_receipts.py f9-receipts/f9-concrete.json
      - name: Independently reconstruct exact GF9 with two distinct irreducible polynomials
        run: python3 research/nightfall/2026-11-f9-bridge/verify_two_models.py
      - name: Freeze source identities and compiler
        if: always()
        run: |
          mkdir -p f9-receipts
          git rev-parse HEAD > f9-receipts/commit.txt
          git -C /tmp/mathlib4 rev-parse HEAD > f9-receipts/mathlib.txt || true
          sha256sum research/nightfall/formalization/finite_field/{F9GapArithmetic,F9OracleBridge,F9ActualFieldBasis,F9NonadaptiveLower,F9ConcreteLower}.lean research/nightfall/2026-11-f9-bridge/verify_two_models.py > f9-receipts/source_sha256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: nightfall-f9-oracle-bridge-${{ github.run_id }}
          path: f9-receipts/
          retention-days: 60
