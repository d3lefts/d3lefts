name: Verify frozen mathematical evidence
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-frozen-release.yml"
      - "scripts/download_nightfall_curated_assets.py"
      - "scripts/verify_nightfall_curated_assets.py"
      - "research/nightfall/agent-reports/ea36_131072/**"
  pull_request:
    paths:
      - ".github/workflows/verify-frozen-release.yml"
      - "scripts/download_nightfall_curated_assets.py"
      - "scripts/verify_nightfall_curated_assets.py"
      - "research/nightfall/agent-reports/ea36_131072/**"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  curated-public-reproduction:
    if: ${{ github.event_name != 'release' || github.event.release.tag_name == 'nightfall-research-2026-10-28' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fresh anonymous downloads and complete curated manifest checks
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/download_nightfall_curated_assets.py frozen-assets | tee public-asset-receipt.json
      - name: Provision GMP development headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgmp-dev
      - name: Independently reproduce all signed shifts from the public curated witness
        shell: bash
        run: |
          set -euo pipefail
          python3 research/nightfall/agent-reports/ea36_131072/replay_erdos_gmp.py \
            frozen-assets/NIGHTFALL_Curated_Math_Evidence_CANDIDATE_v2_20261029.zip \
            | tee independent-gmp-receipt.json
      - name: Archive byte identity and finite arithmetic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-curated-public-replay-${{ github.run_id }}
          path: |
            public-asset-receipt.json
            independent-gmp-receipt.json
          if-no-files-found: warn
          retention-days: 90
