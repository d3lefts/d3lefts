name: NIGHTFALL original-source finite-info conditional L-infinity bound
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2SourceBoundedCondExp.lean'
      - '.github/workflows/nightfall-q2-source-bounded-condexp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-condexp:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Exact-source kernel build
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2Density InfinitePiQ2SourceBoundedCondExp; do
            cp "research/nightfall/formalization/universal/${name}.lean" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Strict named axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-source-bound
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2SourceBoundedCondExp.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2SourceBoundedCondExp.source_finite_information_condExp_essential_bound \
            --json-out lean-receipts/q2-source-bound/bound.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-source-bound/bound.json
      - name: Preserve source identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-source-bound
          git rev-parse HEAD > lean-receipts/q2-source-bound/HEAD
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2SourceBoundedCondExp.lean > lean-receipts/q2-source-bound/SOURCE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-source-bound-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-source-bound
          if-no-files-found: warn
