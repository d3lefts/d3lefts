name: NIGHTFALL quadratic Wyner independent exact finite audit
on:
  push:
    branches: [main] # Do not double-run feature-branch pushes and PR checks.
    paths:
      - "research/nightfall/structural_information/QUADRATIC_WYNER_SIMULATION_THEOREM_20261122.md"
      - "research/nightfall/structural_information/check_quadratic_wyner_bridge_exact.py"
      - "research/nightfall/structural_information/check_qw_vs_939_same_model.py"
      - "research/nightfall/structural_information/check_qw_939_rational_dominance.py"
      - ".github/workflows/nightfall-quadratic-wyner-exact.yml"
  pull_request:
    paths:
      - "research/nightfall/structural_information/QUADRATIC_WYNER_SIMULATION_THEOREM_20261122.md"
      - "research/nightfall/structural_information/check_quadratic_wyner_bridge_exact.py"
      - ".github/workflows/nightfall-quadratic-wyner-exact.yml"
concurrency:
  # Keep the newest proof job per PR; never replace different workflow checks.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  exact-rational-falsifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show exact source and paper SHA256
        run: sha256sum research/nightfall/structural_information/QUADRATIC_WYNER_SIMULATION_THEOREM_20261122.md research/nightfall/structural_information/check_quadratic_wyner_bridge_exact.py
      - name: Syntax and exact-rational coupling, influence and threshold checks
        run: |
          python3 -m py_compile research/nightfall/structural_information/check_quadratic_wyner_bridge_exact.py
          python3 research/nightfall/structural_information/check_quadratic_wyner_bridge_exact.py
          python3 research/nightfall/structural_information/check_qw_vs_939_same_model.py
          python3 research/nightfall/structural_information/check_qw_939_rational_dominance.py
      - name: Scope gate (not an all-dimensional Lean certificate)
        run: |
          grep -F "NOT yet Lean-certified" research/nightfall/structural_information/QUADRATIC_WYNER_SIMULATION_THEOREM_20261122.md
          grep -F "not a general T-query quantum-simulation" research/nightfall/structural_information/QUADRATIC_WYNER_SIMULATION_THEOREM_20261122.md
