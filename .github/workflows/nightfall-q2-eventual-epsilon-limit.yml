name: NIGHTFALL Q2 arbitrary-product eventual epsilon-terminal Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2EventualTerminal.lean'
      - '.github/workflows/nightfall-q2-eventual-epsilon-limit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eventual-original-source-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile genuine infinitePi source density, variance and epsilon-limit
        shell: bash
        run: |
          set -euo pipefail
          for F in InfinitePiQ2Density InfinitePiQ2Limit InfinitePiQ2EventualTerminal; do
            cp "research/nightfall/formalization/universal/$F.lean" "/tmp/mathlib4/$F.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$F.olean" "$F.lean")
          done
      - name: Strict named-theorem and standard axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-eventual
          N=Nightfall.InfinitePiQ2EventualTerminal
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2EventualTerminal.lean --workspace /tmp/mathlib4 --strict --timeout 900 --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.source_variance_nonneg" --decl "$N.eventual_q2_source_limit" --json-out lean-receipts/q2-eventual/receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-eventual/receipt.json
      - name: Capture exact source and compiler head
        if: always()
        run: |
          mkdir -p lean-receipts/q2-eventual
          git rev-parse HEAD > lean-receipts/q2-eventual/head
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2EventualTerminal.lean > lean-receipts/q2-eventual/source-sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-eventual-epsilon-${{ github.run_id }}
          path: lean-receipts/q2-eventual
          if-no-files-found: warn
