name: NIGHTFALL CertificateCustody-D4 candidate calibration
on:
  pull_request:
    paths:
      - "research/nightfall/evaluations/certcustody-d4/**"
      - ".github/workflows/nightfall-certcustody-d4.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Three deliberately shallow public smoke cases
        run: |
          cd research/nightfall/evaluations/certcustody-d4
          PYTHONPATH=candidate python -m unittest discover -s candidate/tests -v
      - name: Independently attack source custody and proof status
        run: |
          python research/nightfall/evaluations/certcustody-d4/audit/public_contract_probe.py --mode seed --output certcustody-d4-public-receipt.json
      - name: Preserve all predicted wrong admits and source SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certcustody-d4-calibration-${{ matrix.python-version }}
          path: certcustody-d4-public-receipt.json
          retention-days: 30
          if-no-files-found: warn
