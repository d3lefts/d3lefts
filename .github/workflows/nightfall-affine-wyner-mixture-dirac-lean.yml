name: NIGHTFALL affine product-mixture nonfree Dirac Lean
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/structural_information/AffineWynerMixtureDirac.lean'
      - '.github/workflows/nightfall-affine-wyner-mixture-dirac-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mixture-rigidity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile the original support theorem and exact mixture bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/affine-mixture
          git rev-parse HEAD > receipts/affine-mixture/head.txt
          for M in AffineWynerSupport AffineWynerMixtureDirac; do
            src="research/nightfall/formalization/structural_information/$M.lean"
            ! grep -nE '^[[:space:]]*(sorry|admit|axiom|constant)\b' "$src"
            sha256sum "$src" >> receipts/affine-mixture/SHA256SUMS
            cp "$src" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean") 2>&1 | tee "receipts/affine-mixture/$M.log"
            ! grep -E '(^|:)error:|declaration uses .sorry' "receipts/affine-mixture/$M.log"
          done
      - name: Independent kernel replay and three exact theorem axioms
        shell: bash
        run: |
          set -euo pipefail
          for M in AffineWynerSupport AffineWynerMixtureDirac; do
            (cd /tmp/mathlib4 && lake env leanchecker -v "$M") 2>&1 | tee "receipts/affine-mixture/kernel-$M.log"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('receipts/affine-mixture/AffineWynerMixtureDirac.log').read_text()
          for suffix in ('positive_component_supported_in_code',
                         'mixture_nonfree_coordinate_dirac',
                         'mixture_nonfree_dirac_of_source'):
              name='Nightfall.AffineWyner.'+suffix
              hit=re.search(r"'"+re.escape(name)+r"' depends on axioms:\s*\[([^\]]*)\]",s,re.S)
              if hit:
                  axioms={x.strip() for x in hit.group(1).split(',') if x.strip()}
              else:
                  assert f"'{name}' does not depend on any axioms" in s,name
                  axioms=set()
              assert axioms <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
          assert 'sorryAx' not in s
          print('PASS finite product-mixture source support and all positive component nonfree Dirac; not full Wyner entropy infimum')
          PY
      - name: Immutable source/compiler receipt
        if: always()
        shell: bash
        run: |
          mkdir -p receipts/affine-mixture
          cat lean-toolchain > receipts/affine-mixture/compiler.txt
          git -C /tmp/mathlib4 rev-parse HEAD > receipts/affine-mixture/mathlib.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: affine-mixture-dirac-kernel
          path: receipts/affine-mixture
          retention-days: 90
