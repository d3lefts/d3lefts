name: NIGHTFALL Q2 finite Boolean original-source test factor Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2FiniteBooleanTestFactor.lean'
      - '.github/workflows/nightfall-q2-finite-boolean-test-factor.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-finite-boolean-factor-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  exact-original-finite-boolean-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned Lean and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile original source density and finite Boolean test representation
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2Density InfinitePiQ2FiniteCellDensity InfinitePiQ2FiniteBooleanTestFactor; do
            cp "research/nightfall/formalization/universal/${name}.lean" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Strict named kernel and standard-axiom receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-infinite
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2FiniteBooleanTestFactor.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2FiniteBooleanTestFactor.finiteTests_isSetAlgebra \
            --decl Nightfall.InfinitePiQ2FiniteBooleanTestFactor.squareCylinder_hasFiniteTests \
            --decl Nightfall.InfinitePiQ2FiniteBooleanTestFactor.sourceFiniteCellAlgebra_hasFiniteTests \
            --decl Nightfall.InfinitePiQ2FiniteBooleanTestFactor.finiteTests_refine \
            --decl Nightfall.InfinitePiQ2FiniteBooleanTestFactor.finiteFamily_sourceCells_commonTests \
            --json-out lean-receipts/q2-infinite/finite-boolean-factor.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-infinite/finite-boolean-factor.json
      - name: Preserve exact source provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-infinite
          git rev-parse HEAD > lean-receipts/q2-infinite/finite-boolean-factor-head
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2FiniteBooleanTestFactor.lean > lean-receipts/q2-infinite/finite-boolean-factor-sha256
      - name: Upload exact proof receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-finite-boolean-factor-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-infinite
          if-no-files-found: warn
