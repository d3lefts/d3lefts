name: NIGHTFALL phase-block Route1 exact Lean finite certificate
on:
  pull_request:
    paths:
      - "research/nightfall/formalization/structural_information/PhaseBlockRoute1.lean"
      - ".github/workflows/nightfall-phase-block-route1-lean.yml"
      - "docs/lean-pending-source-custody.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase-block-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Pinned Lean compilation of exact code and rectangle proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/phase-block-route1-lean
          src="research/nightfall/formalization/structural_information/PhaseBlockRoute1.lean"
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom|constant)\b' "$src"
          cp "$src" /tmp/mathlib4/PhaseBlockRoute1.lean
          (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/PhaseBlockRoute1.olean" PhaseBlockRoute1.lean) 2>&1 | tee receipts/phase-block-route1-lean/PhaseBlockRoute1.log
          ! grep -E '(^|:)error:|declaration uses .sorry' receipts/phase-block-route1-lean/PhaseBlockRoute1.log
      - name: Named kernel declarations and axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('receipts/phase-block-route1-lean/PhaseBlockRoute1.log').read_text()
          names=('any_three_injective','two_reading_obstruction',
                 'every_two_step_policy_fails','rectangular_support_subsingleton',
                 'block_code_no_hamming_edge','raw_block_product_support_subsingleton')
          for suffix in names:
              name='Nightfall.PhaseBlockRoute1.'+suffix
              m=re.search(r"'" + re.escape(name) + r"' depends on axioms:\s*\[([^\]]*)\]",log,re.S)
              if m: axioms={s.strip() for s in m.group(1).split(',') if s.strip()}
              else:
                  assert f"'{name}' does not depend on any axioms" in log, name
                  axioms=set()
              assert axioms<={'propext','Classical.choice','Quot.sound'},(name,axioms)
          assert 'sorryAx' not in log
          assert 'theorem Nightfall.PhaseBlockRoute1.raw_block_product_support_subsingleton' in log
          print('PASS: exact real phase code and all-block support rectangle rigidity.')
          print('OPEN: formal Wyner entropy, local quantum polynomial and full Route1 terminal.')
          PY
      - name: Pinned source and Mathlib receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/phase-block-route1-lean
          git rev-parse HEAD > receipts/phase-block-route1-lean/source-commit.txt
          git -C /tmp/mathlib4 rev-parse HEAD > receipts/phase-block-route1-lean/mathlib-commit.txt
          cat lean-toolchain > receipts/phase-block-route1-lean/toolchain.txt
          sha256sum research/nightfall/formalization/structural_information/PhaseBlockRoute1.lean > receipts/phase-block-route1-lean/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: nightfall-phase-block-route1-lean-${{ github.run_id }}
          path: receipts/phase-block-route1-lean
          retention-days: 90
