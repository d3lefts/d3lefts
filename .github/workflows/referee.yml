name: NIGHTFALL Referee exact verification
on:
  push:
    branches: [main]
    paths:
      - "docs/referee*"
      - "research/nightfall/referee/**"
      - ".github/workflows/referee.yml"
  pull_request:
    paths:
      - "docs/referee*"
      - "research/nightfall/referee/**"
      - ".github/workflows/referee.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  finite-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check docs/referee-core.js
          node --check docs/referee-app.js
          node --check research/nightfall/referee/check_receipt.cjs
          node --check research/nightfall/referee/test.cjs
      - name: Positive witnesses, adversarial controls and replay
        run: |
          REFEREE_FIXTURE_DIR=/tmp/referee-fixtures node research/nightfall/referee/test.cjs
      - name: Cross-language independent Python replay and forged receipt controls
        run: |
          python3 research/nightfall/referee/independent_verify.py /tmp/referee-fixtures/overlap.json
          python3 research/nightfall/referee/independent_verify.py /tmp/referee-fixtures/sidon.json
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess
          py="research/nightfall/referee/independent_verify.py"
          for name in ("overlap","sidon"):
              base=json.loads(Path(f"/tmp/referee-fixtures/{name}.json").read_text())
              for field,value in (("inputSha256","0"*64),("verdict","COMPETITIVE_RECORD")):
                  tampered={**base,field:value}
                  path=Path(f"/tmp/referee-fixtures/{name}-{field}.json")
                  path.write_text(json.dumps(tampered))
                  r=subprocess.run(["python3",py,str(path)],capture_output=True,text=True)
                  assert r.returncode!=0,(name,field,r.stdout)
          print("PASS: separate Python replay and forged digest / verdict rejection")
          PY
      - name: Static page and local dependency integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("docs/referee.html").read_text()
          assert 'referee-core.js' in p and 'referee-app.js' in p
          assert 'referee.css' in p and 'id="workbench"' in p
          assert 'id="run-overlap"' in p and 'id="run-sidon"' in p
          assert 'id="export-receipt"' in p
          assert 'not an external reviewer' in p.lower()
          print("PASS: executable local assets, interactive controls and evidence-boundary disclosure")
          PY
