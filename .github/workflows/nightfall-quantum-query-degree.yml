name: NIGHTFALL quantum query path degree bridge (pinned Lean)
on:
  push:
    branches: [nightfall-quantum-query-lean-degree-20261118]
    paths:
      - 'research/nightfall/formalization/product_space/QuantumPathDegree.lean'
      - '.github/workflows/nightfall-quantum-query-degree.yml'
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/QuantumPathDegree.lean'
      - '.github/workflows/nightfall-quantum-query-degree.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quantum-path-degree:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile pinned AA source closure plus quantum path-degree bridge
        shell: bash
        run: |
          set -euo pipefail
          while read -r M P; do
            [ -z "$M" ] && continue
            REL="${M//.//}"
            mkdir -p "/tmp/mathlib4/$(dirname "$REL")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$REL")"
            cp "$P" "/tmp/mathlib4/$REL.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$REL.olean" "$REL.lean" 2>&1 | tee "/tmp/log-$M.txt")
            if grep -q "declaration uses .sorry" "/tmp/log-$M.txt"; then echo "sorry in $M"; exit 1; fi
          done < research/nightfall/formalization/aa_product/CLOSURE.txt
          cp research/nightfall/formalization/product_space/QuantumPathDegree.lean /tmp/mathlib4/QuantumPathDegree.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/QuantumPathDegree.olean QuantumPathDegree.lean 2>&1 | tee "$GITHUB_WORKSPACE/quantum-path-compile.log")
          ! grep -E 'sorryAx|declaration uses .sorry' quantum-path-compile.log
      - name: Source-exact Lean declaration and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/quantum-path
          python3 scripts/lean_bridge.py research/nightfall/formalization/product_space/QuantumPathDegree.lean \
            --workspace /tmp/mathlib4 --strict --timeout 1800 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl "Nightfall.ProductSpace.QuantumPath.pathBorn_eq_squares" \
            --decl "Nightfall.ProductSpace.QuantumPath.pathBorn_degree" \
            --decl "Nightfall.ProductSpace.QuantumPath.pathBorn_simulation" \
            --json-out lean-receipts/quantum-path/receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/quantum-path/receipt.json
          (cd /tmp/mathlib4 && cat > QuantumPathAudit.lean <<'LEAN'
          import QuantumPathDegree
          #check @Nightfall.ProductSpace.QuantumPath.pathBorn_degree
          #check @Nightfall.ProductSpace.QuantumPath.pathBorn_simulation
          #print axioms Nightfall.ProductSpace.QuantumPath.pathBorn_eq_squares
          #print axioms Nightfall.ProductSpace.QuantumPath.pathBorn_degree
          #print axioms Nightfall.ProductSpace.QuantumPath.pathBorn_simulation
          LEAN
          lake env lean QuantumPathAudit.lean) | tee lean-receipts/quantum-path/axioms.txt
          ! grep -E 'sorryAx|unknown constant|error:' lean-receipts/quantum-path/axioms.txt
      - name: Preserve exact source hash and compiler provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/quantum-path
          git rev-parse HEAD > lean-receipts/quantum-path/head
          sha256sum research/nightfall/formalization/product_space/QuantumPathDegree.lean > lean-receipts/quantum-path/source.sha256
          sha256sum research/nightfall/formalization/aa_product/CLOSURE.txt > lean-receipts/quantum-path/closure.sha256
          cp /tmp/nightfall-lean-version.txt lean-receipts/quantum-path/lean-version.txt 2>/dev/null || true
          cp quantum-path-compile.log lean-receipts/quantum-path/compile.log 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nightfall-quantum-path-${{ github.run_id }}
          path: lean-receipts/quantum-path
          if-no-files-found: warn
