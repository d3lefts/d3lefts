name: NIGHTFALL Q2 C105.41624 exact 23802 scalar Lean gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/observability/ShiftedC23802Bernstein.lean'
      - 'research/nightfall/formalization/observability/ShiftedC23802Scalar.lean'
      - '.github/workflows/nightfall-q2-23802-scalar-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: q2-23802-scalar-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  q2-23802-rational-bernstein:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Independent exact Fraction interpolation and coefficient audit
        run: python3 research/nightfall/2026-11-quadratic-law-free-audit/check_c105_416_bernstein_exact.py
      - name: Strict 37-box rational Bernstein proof and scalar moment conclusion
        shell: bash
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          OUT=lean-receipts/q2-23802-scalar
          mkdir -p "$OUT"
          for name in ShiftedC23802Bernstein ShiftedC23802Scalar; do
            cp "$SRC/$name.lean" "/tmp/mathlib4/$name.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean")
          done
          python3 scripts/lean_bridge.py "$SRC/ShiftedC23802Bernstein.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.ShiftedC23802Bernstein.shifted_c23802_polynomial \
            --json-out "$OUT/bernstein.json"
          python3 scripts/lean_bridge.py "$SRC/ShiftedC23802Scalar.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.ShiftedC23802Scalar.shifted_c23802_from_strong_moments \
            --json-out "$OUT/scalar.json"
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            "$OUT/bernstein.json" "$OUT/scalar.json"
      - name: Capture pinned provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-23802-scalar
          git rev-parse HEAD > lean-receipts/q2-23802-scalar/source-commit.txt
          cat lean-toolchain > lean-receipts/q2-23802-scalar/toolchain.txt
          sha256sum research/nightfall/formalization/observability/ShiftedC23802Bernstein.lean \
            research/nightfall/formalization/observability/ShiftedC23802Scalar.lean \
            > lean-receipts/q2-23802-scalar/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: q2-23802-scalar-${{ github.run_id }}
          path: lean-receipts/q2-23802-scalar/
          retention-days: 60
