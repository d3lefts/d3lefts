name: NIGHTFALL Swansea V5 union-convolution source-matched Lean

on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/swansea_v5/**'
      - '.github/workflows/nightfall-swansea-v5-union-convolution.yml'
      - '.github/actions/setup-nightfall-lean/**'
      - 'scripts/lean_bridge.py'
      - 'research/nightfall/formalization/product_space/check_receipts.py'
  push:
    branches: [main]
    paths:
      - 'research/nightfall/formalization/swansea_v5/**'
      - '.github/workflows/nightfall-swansea-v5-union-convolution.yml'
      - '.github/actions/setup-nightfall-lean/**'
      - 'scripts/lean_bridge.py'
      - 'research/nightfall/formalization/product_space/check_receipts.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swansea-v5-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Strict kernel-check V5 classical union-convolution scope
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/swansea_v5/SwanseaV5UnionConvolution.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl Nightfall.SwanseaV5.unionConvolution_total_mass \
            --decl Nightfall.SwanseaV5.unionConvolution_nonneg \
            --decl Nightfall.SwanseaV5.weightedRefresh_union_comp \
            --json-out lean-receipts/swansea-v5-union-convolution.json || {
              cat lean-receipts/swansea-v5-union-convolution.json || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/swansea-v5-union-convolution.json
      - name: Capture source and compiler pins
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/swansea_v5/SwanseaV5UnionConvolution.lean > lean-receipts/SHA256SUMS.txt
          git rev-parse HEAD > lean-receipts/repository-commit.txt
          (git -C /tmp/mathlib4 rev-parse HEAD || true) > lean-receipts/mathlib-commit.txt
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
      - name: Upload strict compilation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swansea-v5-union-convolution-lean-receipt
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 45
