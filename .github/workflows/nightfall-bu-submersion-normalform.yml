name: NIGHTFALL Atlas smooth submersion local projection normal form
on:
  pull_request:
    paths:
      - "research/nightfall/formalization/finite_field/ProductBUSubmersionNormalForm.lean"
      - "docs/lean-pending-source-custody.json"
      - ".github/workflows/nightfall-bu-submersion-normalform.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smooth-normal-form:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Fetch exact ATLAS smooth-submersion source and pin Mathlib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/bu-submersion-normalform
          git clone --filter=blob:none https://github.com/facebookresearch/atlas-lean.git /tmp/atlas-lean
          git -C /tmp/atlas-lean checkout --detach 7857a2e8c32088b5002f7cafe29a21d936baf704
          test "$(git -C /tmp/atlas-lean rev-parse HEAD)" = "7857a2e8c32088b5002f7cafe29a21d936baf704"
          M=MathlibExt/Geometry/Manifold/SubmersionOfSurjectiveMFDeriv
          mkdir -p "/tmp/mathlib4/$(dirname "$M")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$M")"
          cp "/tmp/atlas-lean/$M.lean" "/tmp/mathlib4/$M.lean"
          sha256sum "/tmp/mathlib4/$M.lean" > receipts/bu-submersion-normalform/ATLAS-SHA256SUMS
          ! grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' "/tmp/mathlib4/$M.lean"
          (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean") 2>&1 | tee receipts/bu-submersion-normalform/ATLAS.log
          ! grep -E '(^|:)error:|declaration uses .sorry' receipts/bu-submersion-normalform/ATLAS.log
      - name: Compile named normal-form specialization and inspect axioms
        shell: bash
        run: |
          set -euo pipefail
          f=research/nightfall/formalization/finite_field/ProductBUSubmersionNormalForm.lean
          ! grep -nE '^[[:space:]]*(axiom|sorry|admit)[[:space:]]' "$f"
          cp "$f" /tmp/mathlib4/ProductBUSubmersionNormalForm.lean
          (cd /tmp/mathlib4 && lake env lean ProductBUSubmersionNormalForm.lean) 2>&1 | tee receipts/bu-submersion-normalform/NIGHTFALL.log
          ! grep -E '(^|:)error:|declaration uses .sorry' receipts/bu-submersion-normalform/NIGHTFALL.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("receipts/bu-submersion-normalform/NIGHTFALL.log").read_text()
          name="Nightfall.ProductBUSubmersionNormalForm.euclidean_regular_fiber_has_smooth_local_projection"
          assert name in s,("MISSING_NAMED_LEAN_THM",name)
          m=re.search(r"'"+re.escape(name)+r"' depends on axioms:\s*\[([^\]]*)\]",s,re.S)
          if m: a={x.strip() for x in m.group(1).split(",") if x.strip()}
          else:
              assert f"'{name}' does not depend on any axioms" in s
              a=set()
          assert a <= {"propext","Classical.choice","Quot.sound"},a
          assert "sorryAx" not in s
          print("PASS exact ATLAS smooth local projection normal form; axioms",sorted(a))
          print("NOT a global level-set 1-manifold construction or ProductSphereZero certificate")
          PY
      - name: Preserve exact-source provenance
        if: always()
        run: |
          mkdir -p receipts/bu-submersion-normalform
          git rev-parse HEAD > receipts/bu-submersion-normalform/commit.txt
          cat lean-toolchain > receipts/bu-submersion-normalform/toolchain.txt
          sha256sum research/nightfall/formalization/finite_field/ProductBUSubmersionNormalForm.lean > receipts/bu-submersion-normalform/NIGHTFALL-SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bu-submersion-normalform-proof-receipt
          path: receipts/bu-submersion-normalform
          retention-days: 90
