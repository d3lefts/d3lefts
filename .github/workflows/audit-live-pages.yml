name: Audit deployed NIGHTFALL Pages
# Unlike the repository/local-browser suite, this verifies public HTTPS
# responses from GitHub Pages after deployment. It makes no claim about a
# human visiting the page, and does not auto-promote research claims.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/verify_public_pages.py"
      - ".github/workflows/audit-live-pages.yml"
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-pages-audit
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check deployed HTTPS destinations, allowing for propagation
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            if python3 scripts/verify_public_pages.py --base https://d3lefts.github.io/d3lefts/ > live-pages-receipt.json; then
              cat live-pages-receipt.json
              exit 0
            fi
            echo "PUBLIC PAGES AUDIT NOT PASSING; attempt $attempt of 4"
            cat live-pages-receipt.json
            if [ "$attempt" -lt 4 ]; then sleep 20; fi
          done
          echo "PUBLIC PAGES NOT VERIFIED -- inspect receipt; do not infer deployment success"
          exit 1
      - name: Preserve inspection receipt (including failed/blocked responses)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pages-inspection
          path: live-pages-receipt.json
          if-no-files-found: warn
          retention-days: 30
