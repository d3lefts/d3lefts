name: NIGHTFALL Q2 arbitrary-product finite-cylinder density Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2Density.lean'
      - '.github/workflows/nightfall-infinitepi-q2-density.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infinitepi-q2-density-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  original-infinitePi-density:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned Lean and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile source-product density under exact pin
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/universal/InfinitePiQ2Density.lean /tmp/mathlib4/InfinitePiQ2Density.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/InfinitePiQ2Density.olean InfinitePiQ2Density.lean)
      - name: Strict named original-source declaration and standard axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-infinite
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2Density.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2Density.source_finite_cylinders_measure_dense \
            --decl Nightfall.InfinitePiQ2Density.source_finite_cylinders_L2_dense \
            --json-out lean-receipts/q2-infinite/cylinder-measure-dense.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-infinite/cylinder-measure-dense.json
      - name: Source provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-infinite
          git rev-parse HEAD > lean-receipts/q2-infinite/commit.txt
          git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/q2-infinite/mathlib.txt || true
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2Density.lean > lean-receipts/q2-infinite/SHA256SUMS.txt
      - name: Retain exact receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-infinite-density-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-infinite
          if-no-files-found: warn
