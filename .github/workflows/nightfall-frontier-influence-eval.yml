name: NIGHTFALL frontier influence evaluation smoke tests
on:
  pull_request:
    paths:
      - 'research/nightfall/evals/polaris-research-20261119/**'
      - '.github/workflows/nightfall-frontier-influence-eval.yml'
  workflow_dispatch:
jobs:
  exact-oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact rational unit and cross-oracle checks
        working-directory: research/nightfall/evals/polaris-research-20261119
        run: |
          python -m unittest discover -p 'test*.py' -v
          python grade_correlated_influence.py examples/correlated_influence_witness.json
          python audit_frontier.py examples/correlated_influence_witness.json
  proofgraph-pinned-lean-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/nightfall/evals/polaris-research-20261119/proofgraph_hard/fixture/trusted
          auto-config: 'false'
          build: 'false'
          test: 'false'
      - name: ProofGraph grader unit tests (simulated runner only)
        working-directory: research/nightfall/evals/polaris-research-20261119/proofgraph_hard
        run: python3 -m unittest test_proofgraph.py -v
      - name: ProofGraph pinned Lean fixture
        working-directory: research/nightfall/evals/polaris-research-20261119/proofgraph_hard
        run: |
          python3 grade_proofgraph.py --manifest fixture/task.json --trusted-root fixture/trusted --submission fixture/submission --receipt "$RUNNER_TEMP/proofgraph-receipt.json"
      - name: Archive smoke-test receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proofgraph-smoke-receipt
          path: ${{ runner.temp }}/proofgraph-receipt.json
  proofgraph-research-q2-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Research-Q2 trusted-source and bypass preflight tests
        run: |
          python3 -m unittest discover -s research/nightfall/evals/polaris-research-20261119/research_q2 -p 'test*.py' -v
      - name: Exact-rational shifted c/4 polynomial certificate audit
        run: python3 research/nightfall/2026-11-quadratic-law-free-audit/check_shifted_owner_moment_107.py
      - name: Install and independently pin compiler and Mathlib source
        uses: ./.github/actions/setup-nightfall-lean
      - name: Research-Q2 public reference proof, locked target, axiom audit and leanchecker
        run: |
          set -euo pipefail
          python3 research/nightfall/evals/polaris-research-20261119/research_q2/grade_research_q2.py \
            --candidate research/nightfall/formalization/observability/ShiftedC4Scalar.lean \
            --workspace /tmp/mathlib4 \
            --receipt "$RUNNER_TEMP/polaris-q2-reference-receipt.json"
      - name: Research-Q2 adversarial weaker-theorem control must be rejected
        run: |
          set -euo pipefail
          set +e
          python3 research/nightfall/evals/polaris-research-20261119/research_q2/grade_research_q2.py \
            --candidate research/nightfall/evals/polaris-research-20261119/research_q2/examples/weakened_to_true.lean \
            --workspace /tmp/mathlib4 \
            --receipt "$RUNNER_TEMP/polaris-q2-weakened-receipt.json" \
            > "$RUNNER_TEMP/polaris-q2-weakened-output.log"
          code=$?
          set -e
          test "$code" -ne 0
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"polaris-q2-weakened-receipt.json"
          d=json.loads(p.read_text())
          assert d["status"]=="fail",d
          assert "Lean command failure" in d.get("error",""),d
          assert "NightfallPolarisQ2Target.lean" in d["error"],d
          print("PASS: kernel/elaborator rejected candidate theorem weakening")
          PY
      - name: Preserve research-Q2 positive and negative control receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polaris-research-q2-reference-receipt
          path: |
            ${{ runner.temp }}/polaris-q2-reference-receipt.json
            ${{ runner.temp }}/polaris-q2-weakened-receipt.json
          if-no-files-found: warn
