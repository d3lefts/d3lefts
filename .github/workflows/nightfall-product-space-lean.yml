name: NIGHTFALL product-space — Lean 4.35.0 certification
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/**'
      - '.github/workflows/nightfall-product-space-lean.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  product-space:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Kernel-check two-draw orientation
        run: |
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/TwoDrawOrientation.lean \
            --decl Nightfall.ProductSpace.orientation_mass_independent \
            --decl Nightfall.ProductSpace.all_orientations_equiprobable \
            --decl Nightfall.ProductSpace.single_pair_exchangeable \
            --json-out lean-receipts/product-space-orientation.json
      - name: Kernel-check heterogeneous orientation
        run: |
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/HeterogeneousOrientation.lean \
            --decl Nightfall.ProductSpace.heterogeneous_orientation_mass \
            --decl Nightfall.ProductSpace.heterogeneous_all_masks_equal \
            --json-out lean-receipts/product-space-heterogeneous-orientation.json
      - name: Verify standard Lean axiom dependencies
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, re
          r = json.load(open('lean-receipts/product-space-orientation.json'))
          assert r['status'] == 'COMPILED', r['status']
          assert not r['policy_findings'], r['policy_findings']
          standard = {'propext', 'Classical.choice', 'Quot.sound'}
          for theorem in r['declarations_requested']:
              pattern = re.escape("'" + theorem + "'") + r' depends on axioms: \\[([^\\]]*)\\]'
              m = re.search(pattern, r['stdout'])
              if m:
                  deps = {a.strip() for a in m.group(1).split(',')}
              else:
                  assert "'" + theorem + "' does not depend on any axioms" in r['stdout'], theorem
                  deps = set()
              assert deps <= standard, (theorem, deps)
              print(theorem, 'accepted dependencies:', sorted(deps))
          PYCODE
      - name: Verify heterogeneous orientation foundational axioms
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, re
          r = json.load(open('lean-receipts/product-space-heterogeneous-orientation.json'))
          assert r['status'] == 'COMPILED', r['status']
          assert not r['policy_findings'], r['policy_findings']
          standard = {'propext', 'Classical.choice', 'Quot.sound'}
          for theorem in r['declarations_requested']:
              m = re.search(re.escape("'" + theorem + "'") + r' depends on axioms: \\[([^\\]]*)\\]', r['stdout'], re.S)
              if m:
                  deps = {a.strip() for a in m.group(1).split(',')}
              else:
                  assert "'" + theorem + "' does not depend on any axioms" in r['stdout'], theorem
                  deps = set()
              assert deps <= standard, (theorem, deps)
          PYCODE
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-space-lean-receipts
          path: lean-receipts/*.json
          if-no-files-found: warn
          retention-days: 30
