name: NIGHTFALL Q2 exact original-label product transport Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2OriginalLabelTransport.lean'
      - '.github/workflows/nightfall-q2-original-label-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-original-label-transport-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  original-label-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned Lean and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile original density and label transport
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2Density InfinitePiQ2OriginalLabelTransport; do
            cp "research/nightfall/formalization/universal/${name}.lean" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Strict named source and axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-infinite
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2OriginalLabelTransport.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2OriginalLabelTransport.sourceLabelMap_measurable \
            --decl Nightfall.InfinitePiQ2OriginalLabelTransport.sourceLabelLaw_exact \
            --decl Nightfall.InfinitePiQ2OriginalLabelTransport.sourceFiniteLabelLaw_exact \
            --decl Nightfall.InfinitePiQ2OriginalLabelTransport.sourceFiniteLabelMap_measurePreserving \
            --decl Nightfall.InfinitePiQ2OriginalLabelTransport.sourceFiniteLabelVariance_exact \
            --decl Nightfall.InfinitePiQ2OriginalLabelTransport.sourceFiniteLabelL2_norm_exact \
            --json-out lean-receipts/q2-infinite/original-label-transport.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-infinite/original-label-transport.json
      - name: Exact source custody
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-infinite
          git rev-parse HEAD > lean-receipts/q2-infinite/original-label-head.txt
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2OriginalLabelTransport.lean > lean-receipts/q2-infinite/original-label-sha256.txt
      - name: Upload exact receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-original-label-transport-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-infinite
          if-no-files-found: warn
