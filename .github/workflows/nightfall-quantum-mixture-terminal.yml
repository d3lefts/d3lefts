name: NIGHTFALL quantum query mixture theorem (pinned Lean kernel)
on:
  push:
    branches: [nightfall-quantum-mixture-terminal-20261119]
    paths:
      - 'research/nightfall/formalization/product_space/QuantumCircuitPaths.lean'
      - 'research/nightfall/formalization/product_space/QuantumPathDegree.lean'
      - 'research/nightfall/formalization/product_space/QuantumCircuitNormalization.lean'
      - 'research/nightfall/formalization/product_space/QuantumCircuitSimulation.lean'
      - 'research/nightfall/formalization/product_space/QuantumMixtureSimulation.lean'
      - '.github/workflows/nightfall-quantum-mixture-terminal.yml'
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/QuantumMixtureSimulation.lean'
      - '.github/workflows/nightfall-quantum-mixture-terminal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  circuit-to-mixture:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile exact 179-module AA and Jensen mixture proof closure
        shell: bash
        run: |
          set -euo pipefail
          while read -r M P; do
            [ -z "$M" ] && continue
            REL="${M//.//}"
            mkdir -p "/tmp/mathlib4/$(dirname "$REL")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$REL")"
            cp "$P" "/tmp/mathlib4/$REL.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$REL.olean" "$REL.lean" 2>&1 | tee "/tmp/nightfall-mixture-$M.log")
            if grep -q "declaration uses .sorry" "/tmp/nightfall-mixture-$M.log"; then echo "sorry in $M"; exit 1; fi
          done < research/nightfall/formalization/aa_product/CLOSURE.txt
      - name: Compile copied certified circuit chain and new mixture terminal together
        shell: bash
        run: |
          set -euo pipefail
          for M in QuantumCircuitPaths QuantumPathDegree QuantumCircuitNormalization QuantumCircuitSimulation QuantumMixtureSimulation; do
            cp "research/nightfall/formalization/product_space/$M.lean" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean" 2>&1 | tee "$GITHUB_WORKSPACE/quantum-$M-compile.log")
            ! grep -E 'sorryAx|declaration uses .sorry|error:' "quantum-$M-compile.log"
          done
      - name: Exact named theorem axioms and source-bound strict audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/quantum-mixture
          python3 scripts/lean_bridge.py research/nightfall/formalization/product_space/QuantumMixtureSimulation.lean \
            --workspace /tmp/mathlib4 --strict --timeout 1800 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl "Nightfall.ProductSpace.Mixture.mixture_simulation_jensen" \
            --decl "Nightfall.QuantumCircuitPaths.execute_eq_path_sum" \
            --decl "Nightfall.ProductSpace.QuantumPath.pathBorn_degree" \
            --decl "Nightfall.QuantumCircuitNormalization.probability_in_unit_interval" \
            --decl "Nightfall.ProductSpace.QuantumCircuitSimulation.acceptance_degree" \
            --decl "Nightfall.ProductSpace.QuantumCircuitSimulation.unitary_circuit_uniform_simulation" \
            --decl "Nightfall.ProductSpace.QuantumMixture.unitary_circuit_mixture_simulation_jensen" \
            --decl "Nightfall.ProductSpace.QuantumMixture.unitary_circuit_mixture_simulation_delta" \
            --json-out lean-receipts/quantum-mixture/receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/quantum-mixture/receipt.json
          cat >/tmp/mathlib4/QuantumMixtureAudit.lean <<'LEAN'
          import QuantumMixtureSimulation
          #check @Nightfall.ProductSpace.Mixture.mixture_simulation_jensen
          #check @Nightfall.ProductSpace.QuantumCircuitSimulation.acceptance_degree
          #check @Nightfall.ProductSpace.QuantumCircuitSimulation.unitary_circuit_uniform_simulation
          #check @Nightfall.ProductSpace.QuantumMixture.unitary_circuit_mixture_simulation_jensen
          #check @Nightfall.ProductSpace.QuantumMixture.unitary_circuit_mixture_simulation_delta
          #print axioms Nightfall.ProductSpace.QuantumMixture.unitary_circuit_mixture_simulation_jensen
          #print axioms Nightfall.ProductSpace.QuantumMixture.unitary_circuit_mixture_simulation_delta
          LEAN
          (cd /tmp/mathlib4 && lake env lean QuantumMixtureAudit.lean) | tee lean-receipts/quantum-mixture/axioms.txt
          ! grep -E 'sorryAx|unknown constant|error:' lean-receipts/quantum-mixture/axioms.txt
      - name: Preserve immutable source hashes and compiler identity
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/quantum-mixture
          git rev-parse HEAD > lean-receipts/quantum-mixture/head
          sha256sum research/nightfall/formalization/product_space/{MixtureSimulation,QuantumCircuitPaths,QuantumPathDegree,QuantumCircuitNormalization,QuantumCircuitSimulation,QuantumMixtureSimulation}.lean > lean-receipts/quantum-mixture/source-sha256
          sha256sum research/nightfall/formalization/aa_product/CLOSURE.txt > lean-receipts/quantum-mixture/closure-sha256
          cp /tmp/nightfall-lean-version.txt lean-receipts/quantum-mixture/lean-version.txt 2>/dev/null || true
          cp quantum-*compile.log lean-receipts/quantum-mixture/ 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nightfall-quantum-mixture-${{ github.run_id }}
          path: lean-receipts/quantum-mixture
          if-no-files-found: warn
