name: NIGHTFALL Route 1 exact finite maximal coupling kernel Lean
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/Route1FiniteMaxCoupling.lean'
      - 'research/nightfall/formalization/product_space/Route1FiniteJointMass.lean'
      - 'research/nightfall/formalization/product_space/Route1MaximalConditionalKernel.lean'
      - 'research/nightfall/formalization/product_space/Route1StarMaximalBridge.lean'
      - 'research/nightfall/formalization/product_space/Route1StarCoupling.lean'
      - '.github/workflows/nightfall-route1-maximal-kernel-lean-v436.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maximal-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact effective source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify pinned Lean compiler and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile exact maximal-coupling source in pinned workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/route1-maximal-kernel
          cp research/nightfall/formalization/product_space/Route1FiniteMaxCoupling.lean /tmp/mathlib4/Route1FiniteMaxCoupling.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Route1FiniteMaxCoupling.olean Route1FiniteMaxCoupling.lean) 2>&1 | tee lean-receipts/route1-maximal-kernel/compile.log
          cp research/nightfall/formalization/product_space/Route1FiniteJointMass.lean /tmp/mathlib4/Route1FiniteJointMass.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Route1FiniteJointMass.olean Route1FiniteJointMass.lean) 2>&1 | tee -a lean-receipts/route1-maximal-kernel/compile.log
          cp research/nightfall/formalization/product_space/Route1MaximalConditionalKernel.lean /tmp/mathlib4/Route1MaximalConditionalKernel.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Route1MaximalConditionalKernel.olean Route1MaximalConditionalKernel.lean) 2>&1 | tee -a lean-receipts/route1-maximal-kernel/compile.log
          cp research/nightfall/formalization/product_space/Route1StarCoupling.lean /tmp/mathlib4/Route1StarCoupling.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Route1StarCoupling.olean Route1StarCoupling.lean) 2>&1 | tee -a lean-receipts/route1-maximal-kernel/compile.log
          cp research/nightfall/formalization/product_space/Route1StarMaximalBridge.lean /tmp/mathlib4/Route1StarMaximalBridge.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Route1StarMaximalBridge.olean Route1StarMaximalBridge.lean) 2>&1 | tee -a lean-receipts/route1-maximal-kernel/compile.log
          for m in Route1FiniteMaxCoupling Route1FiniteJointMass Route1MaximalConditionalKernel Route1StarCoupling Route1StarMaximalBridge; do
            test -s "/tmp/mathlib4/.lake/build/lib/lean/${m}.olean"
          done
          ! grep -E '(^|:)error:' lean-receipts/route1-maximal-kernel/compile.log
      - name: Independently replay Lean kernel and check exact axiom sets
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for module in Route1FiniteMaxCoupling Route1FiniteJointMass Route1MaximalConditionalKernel Route1StarCoupling Route1StarMaximalBridge; do
            lake env leanchecker "$module" 2>&1 | tee -a "$GITHUB_WORKSPACE/lean-receipts/route1-maximal-kernel/leanchecker.log"
          done
          python3 - <<'PY'
          from pathlib import Path
          names=[
            'overlap_nonneg','residual_nonneg','residual_disjoint',
            'residual_mass_eq','residual_zero_of_mass_zero',
            'pairMass_left','pairMass_right','pairMass_diag_normalized',
            'maximalKernel_row','maximalKernel_push','pairMass_mismatch',
            'finite_maximal_kernel_exists'
          ]
          Path('Route1MaximalAxiomAudit.lean').write_text(
            'import Route1StarMaximalBridge\n' +
            ''.join('#print axioms Nightfall.Route1FiniteMaxCoupling.'+n+'\n' for n in names) +
            ''.join('#print axioms Nightfall.Route1StarMaximalBridge.'+n+'\n' for n in [
              'canonicalStarKernel_sum','canonicalStarMass_component',
              'canonicalStarMass_mismatch','finite_star_maximal_exists']))
          PY
          lake env lean Route1MaximalAxiomAudit.lean 2>&1 | tee "$GITHUB_WORKSPACE/lean-receipts/route1-maximal-kernel/axioms.log"
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          data=Path(os.environ['GITHUB_WORKSPACE']+'/lean-receipts/route1-maximal-kernel/axioms.log').read_text()
          allowed={'propext','Quot.sound','Classical.choice'}
          reports=re.findall(r"depends on axioms:\s*\[([^\]]*)\]",data,re.S)
          if len(reports) != 16:
              raise SystemExit(f'expected sixteen named axiom reports, got {len(reports)}')
          for report in reports:
              axioms={x.strip() for x in report.split(',') if x.strip()}
              if not axioms<=allowed: raise SystemExit('nonstandard axioms: '+str(axioms-allowed))
          print('PASS 16 scoped Lean declarations including finite maximal star coupling, standard axioms only')
          PY
      - name: Preserve source provenance and negative result logs
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/route1-maximal-kernel
          sha256sum research/nightfall/formalization/product_space/Route1FiniteMaxCoupling.lean research/nightfall/formalization/product_space/Route1FiniteJointMass.lean research/nightfall/formalization/product_space/Route1MaximalConditionalKernel.lean research/nightfall/formalization/product_space/Route1StarCoupling.lean research/nightfall/formalization/product_space/Route1StarMaximalBridge.lean > lean-receipts/route1-maximal-kernel/SHA256SUMS
          git rev-parse HEAD > lean-receipts/route1-maximal-kernel/commit.txt
          printf '%s\n' 'leanprover/lean4:v4.36.0-rc2' > lean-receipts/route1-maximal-kernel/toolchain.txt
          printf '%s\n' '9d581dfff2e41de989072ea63abf3daf69311520' > lean-receipts/route1-maximal-kernel/mathlib.txt
      - name: Archive exact evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: route1-maximal-kernel-lean-receipt
          path: lean-receipts/route1-maximal-kernel/
          if-no-files-found: warn
          retention-days: 90
