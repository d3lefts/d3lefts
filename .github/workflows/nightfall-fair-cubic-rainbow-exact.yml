name: NIGHTFALL fair-cube cubic rainbow exact audit (not Lean)
on:
  push:
    branches: [nightfall-fair-cubic-rainbow-e2-20261117]
    paths:
      - 'research/nightfall/cubic-q3/check_cubic_fair_rainbow.py'
      - 'research/nightfall/cubic-q3/check_cubic_mixed_anchor.py'
      - 'research/nightfall/cubic-q3/FAIR_CUBE_CUBIC_RAINBOW_E2.md'
      - '.github/workflows/nightfall-fair-cubic-rainbow-exact.yml'
  pull_request:
    paths:
      - 'research/nightfall/cubic-q3/check_cubic_fair_rainbow.py'
      - 'research/nightfall/cubic-q3/check_cubic_mixed_anchor.py'
      - 'research/nightfall/cubic-q3/FAIR_CUBE_CUBIC_RAINBOW_E2.md'
      - '.github/workflows/nightfall-fair-cubic-rainbow-exact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fraction-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Source custody hash
        run: sha256sum research/nightfall/cubic-q3/check_cubic_fair_rainbow.py research/nightfall/cubic-q3/check_cubic_mixed_anchor.py research/nightfall/cubic-q3/FAIR_CUBE_CUBIC_RAINBOW_E2.md
      - name: Exact independent physical-vs-Walsh replay
        run: python3 -I research/nightfall/cubic-q3/check_cubic_fair_rainbow.py

      - name: Exact original-law mixed categorical/fair replay
        run: python3 -I research/nightfall/cubic-q3/check_cubic_mixed_anchor.py
