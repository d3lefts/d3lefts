name: NIGHTFALL smooth regular local graph infinity theorem (Lean)
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/finite_field/ProductBURegularFiberSmooth.lean'
      - '.github/workflows/nightfall-product-bu-regular-smooth.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bu-smooth-regular-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  smooth-infinite:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Exact C-infinity level-set local graph and ordinary-axiom replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/product-bu-smooth-fiber
          f=research/nightfall/formalization/finite_field/ProductBURegularFiberSmooth.lean
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom)\\b' "$f"
          cp "$f" /tmp/mathlib4/ProductBURegularFiberSmooth.lean
          (cd /tmp/mathlib4 && lake env lean ProductBURegularFiberSmooth.lean) 2>&1 | tee receipts/product-bu-smooth-fiber/lean.log
          ! grep -E '(^|:)error:|declaration uses .sorry' receipts/product-bu-smooth-fiber/lean.log
      - name: Audit actual smooth level-set theorem statement and axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path("receipts/product-bu-smooth-fiber/lean.log").read_text()
          names=["ContDiff.exists_localSmoothGraph_of_surjective_fderiv",
                 "MathlibExt.Geometry.Manifold.LocalGraphWanted.regularLevelSet_localSmoothGraph"]
          for name in names:
              assert name in s,("MISSING",name)
              hit=re.search(r"'"+re.escape(name)+r"' depends on axioms:\s*\[([^\]]*)\]",s,re.S)
              if hit:
                  a={x.strip() for x in hit.group(1).split(",") if x.strip()}
              else:
                  assert f"'{name}' does not depend on any axioms" in s
                  a=set()
              assert a <= {"propext","Classical.choice","Quot.sound"},(name,a)
              print("PASS",name,sorted(a))
          assert "sorryAx" not in s
          assert "(⊤ : ℕ∞)" in s
          print("C-INFINITY local graph only. Does NOT instantiate a global smooth boundary manifold.")
          PY
      - name: Source custody receipts
        if: always()
        shell: bash
        run: |
          mkdir -p receipts/product-bu-smooth-fiber
          git rev-parse HEAD > receipts/product-bu-smooth-fiber/commit.txt
          cat lean-toolchain > receipts/product-bu-smooth-fiber/toolchain.txt
          sha256sum research/nightfall/formalization/finite_field/ProductBURegularFiberSmooth.lean > receipts/product-bu-smooth-fiber/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bu-smooth-local-fiber-lean
          path: receipts/product-bu-smooth-fiber
          retention-days: 90
          if-no-files-found: warn
