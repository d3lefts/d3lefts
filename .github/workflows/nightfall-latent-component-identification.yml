name: NIGHTFALL latent product component exact audit and scoped Lean
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'research/nightfall/latent_component_identification/**'
      - 'research/nightfall/formalization/product_space/LatentComponentArithmetic.lean'
      - 'research/nightfall/formalization/product_space/LatentComponentCertifiedCore.lean'
      - '.github/workflows/nightfall-latent-component-identification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightfall-latent-identification-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  exact-and-scoped-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact independent finite falsifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/latent-component
          python3 research/nightfall/latent_component_identification/check_exact.py | tee lean-receipts/latent-component/checker.log
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Strict named Lean scalar-gate only
        shell: bash
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/product_space/LatentComponentArithmetic.lean
          cp "$SRC" /tmp/mathlib4/LatentComponentArithmetic.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/LatentComponentArithmetic.olean LatentComponentArithmetic.lean)
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.LatentComponent.center_gap_gt_two_eps \
            --decl Nightfall.LatentComponent.bias_difference_identity \
            --decl Nightfall.LatentComponent.bernoulli_variance_le_quarter \
            --json-out lean-receipts/latent-component/scalar-strict.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/latent-component/scalar-strict.json
      - name: Compile full 179-module product-plus-mixture dependencies
        shell: bash
        run: |
          set -euo pipefail
          while read -r M P; do
            [ -z "$M" ] && continue
            REL="${M//.//}"
            mkdir -p "/tmp/mathlib4/$(dirname "$REL")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$REL")"
            cp "$P" "/tmp/mathlib4/$REL.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$REL.olean" "$REL.lean" >"/tmp/log-$M.txt" 2>&1) || { tail -120 "/tmp/log-$M.txt"; exit 1; }
            if grep -E 'declaration uses .sorry|sorryAx|error:' "/tmp/log-$M.txt"; then exit 1; fi
          done < research/nightfall/formalization/aa_product/CLOSURE.txt
      - name: Strict no-minimum-mass separation certificate
        shell: bash
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/product_space/LatentComponentCertifiedCore.lean
          cp "$SRC" /tmp/mathlib4/LatentComponentCertifiedCore.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/LatentComponentCertifiedCore.olean LatentComponentCertifiedCore.lean)
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 1800 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.ProductSpace.LatentComponent.fooling_tv_positive_gap \
            --decl Nightfall.ProductSpace.LatentComponent.expectation_gap_forces_coordinate \
            --json-out lean-receipts/latent-component/separation-strict.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/latent-component/separation-strict.json
      - name: Source and environment provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/latent-component
          sha256sum research/nightfall/latent_component_identification/check_exact.py research/nightfall/formalization/product_space/LatentComponentArithmetic.lean research/nightfall/formalization/product_space/LatentComponentCertifiedCore.lean research/nightfall/formalization/aa_product/CLOSURE.txt > lean-receipts/latent-component/SHA256SUMS.txt
          git rev-parse HEAD > lean-receipts/latent-component/head.txt
          cat lean-toolchain > lean-receipts/latent-component/toolchain.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: latent-component-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/latent-component/
          if-no-files-found: warn
