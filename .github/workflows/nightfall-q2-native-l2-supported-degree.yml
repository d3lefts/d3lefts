name: NIGHTFALL Q2 original native L2 triple-to-positive-support degree
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2NativeL2SupportedDegree.lean'
      - 'research/nightfall/formalization/universal/InfinitePiQ2PositiveAtomL2Zero.lean'
      - 'research/nightfall/formalization/universal/InfinitePiQ2NativeSupportedTerminal.lean'
      - 'research/nightfall/formalization/universal/InfinitePiQ2TripleResidualDegree.lean'
      - '.github/workflows/nightfall-q2-native-l2-supported-degree.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-native-l2-supported-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  original-native-l2-to-positive-degree:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup original pinned Lean 4.36 and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile complete transitive original finite source C105 and degree dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.nightfall_q2_certify import local_sources, closure, sha256, ROOT
          from pathlib import Path
          import shutil, subprocess, json
          files = local_sources()
          ws = Path("/tmp/mathlib4")
          out = ws/".lake/build/lib/lean"
          out.mkdir(parents=True, exist_ok=True)
          receipt = Path("lean-receipts/q2-native-l2-degree")
          receipt.mkdir(parents=True, exist_ok=True)
          manifest = []
          for name in closure("InfinitePiQ2NativeL2SupportedDegree", files):
              src = files[name]
              dst = ws/(name+".lean")
              shutil.copyfile(src,dst)
              assert sha256(src)==sha256(dst)
              print("SOURCE EXACT",name,flush=True)
              subprocess.run(["lake","env","lean","-o",str(out/(name+".olean")),name+".lean"], cwd=ws,check=True,timeout=1200)
              manifest.append({"path":str(src.relative_to(ROOT)),"sha256":sha256(src)})
          (receipt/"sources.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
      - name: Strict named unconditional native support bridge and original axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2NativeL2SupportedDegree.lean \
            --workspace /tmp/mathlib4 --strict --timeout 1200 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2NativeL2SupportedDegree.native_L2_triple_zero_implies_native_supported_degree_two \
            --json-out lean-receipts/q2-native-l2-degree/strict.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-native-l2-degree/strict.json
      - name: Immutable source and compiler provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-native-l2-degree
          git rev-parse HEAD > lean-receipts/q2-native-l2-degree/HEAD
          cat lean-toolchain > lean-receipts/q2-native-l2-degree/TOOLCHAIN
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2NativeL2SupportedDegree.lean > lean-receipts/q2-native-l2-degree/TERMINAL_SHA256
      - name: Upload exact source and kernel receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-native-l2-positive-support-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-native-l2-degree
          if-no-files-found: warn
