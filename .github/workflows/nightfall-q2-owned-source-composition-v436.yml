name: NIGHTFALL Q2 composed actual-source moments Lean 4.36
on:
  push:
    branches: [nightfall-q2-owned-source-composition-20261113]
    paths:
      - 'research/nightfall/formalization/observability/ActualSourceQ2CompositionGate.lean'
      - 'research/nightfall/formalization/observability/ActualSourcePairEnergyBridge.lean'
      - '.github/workflows/nightfall-q2-owned-source-composition-v436.yml'
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/ActualSourceQ2CompositionGate.lean'
      - '.github/workflows/nightfall-q2-owned-source-composition-v436.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-source-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Build transitive local source dependencies on the pinned compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, subprocess
          root = Path.cwd()
          sources = list((root / "research/nightfall/formalization").rglob("*.lean"))
          modules = {}
          for path in sources:
              if path.stem in modules and modules[path.stem] != path:
                  raise SystemExit(f"ambiguous Lean basename: {path.stem}")
              modules[path.stem] = path
          ordered = []
          state = {}
          def visit(module):
              if module not in modules:
                  return
              st = state.get(module, 0)
              if st == 2:
                  return
              if st == 1:
                  raise RuntimeError(f"Lean import cycle at {module}")
              state[module] = 1
              source = modules[module].read_text()
              for name in re.findall(r"(?m)^import\s+([A-Za-z][A-Za-z0-9_'.]*)\s*$", source):
                  visit(name)
              state[module] = 2
              ordered.append(module)
          visit("ActualSourceQ2CompositionGate")
          workspace = Path("/tmp/mathlib4")
          out = workspace / ".lake/build/lib/lean"
          out.mkdir(parents=True, exist_ok=True)
          print(f"Compiling {len(ordered)} local modules", flush=True)
          for mod in ordered:
              shutil.copyfile(modules[mod], workspace / (mod + ".lean"))
              cmd = ["lake","env","lean","-o",str(out / (mod + ".olean")),mod + ".lean"]
              print("BUILD", mod, flush=True)
              subprocess.run(cmd, check=True, cwd=workspace, timeout=1200)
          PY
      - name: Strict exact source-pair moment / ANOVA energy bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourcePairEnergyBridge
          python3 scripts/lean_bridge.py \\
            research/nightfall/formalization/observability/ActualSourcePairEnergyBridge.lean \\
            --workspace /tmp/mathlib4 --timeout 900 --strict \\
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \\
            --decl $N.original_pair_finite_moment_energy_eq_canonical \\
            --json-out lean-receipts/q2-source-pair-energy-fubini.json || {
              cat lean-receipts/q2-source-pair-energy-fubini.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \\
            lean-receipts/q2-source-pair-energy-fubini.json
      - name: Strict source-only structural and genuine owned-neighbor moment receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourceQ2CompositionGate
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceQ2CompositionGate.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.actual_source_q2_structural_moment_package \
            --decl $N.actual_source_single_greedy_owned_moment_package \
            --json-out lean-receipts/q2-owned-source-moment-composition.json || {
              cat lean-receipts/q2-owned-source-moment-composition.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-owned-source-moment-composition.json
      - name: Record precise provenance
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/ActualSourceQ2CompositionGate.lean research/nightfall/formalization/observability/ActualSourcePairEnergyBridge.lean > lean-receipts/SHA256SUMS.txt
          git rev-parse HEAD > lean-receipts/repo-commit.txt
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-actual-source-owned-composition
          path: lean-receipts/
          retention-days: 45
