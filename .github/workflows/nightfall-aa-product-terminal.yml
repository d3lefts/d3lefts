name: NIGHTFALL Aaronson–Ambainis product-space terminal (pinned 4.36)
on:
  push:
    branches: [q-all-degree-lift, nightfall-mixture-jensen]
    paths:
      - 'research/nightfall/formalization/**'
      - '.github/workflows/nightfall-aa-product-terminal.yml'
  pull_request:
    paths:
      - 'research/nightfall/formalization/aa_product/**'
      - 'research/nightfall/formalization/universal/InfinitePiAAProductTerminal.lean'
      - 'research/nightfall/formalization/product_space/MixedDifferenceDegree.lean'
      - 'research/nightfall/formalization/product_space/CubePrintedAA.lean'
      - 'research/nightfall/formalization/product_space/ProductSimulation.lean'
      - 'research/nightfall/formalization/product_space/MixtureSimulation.lean'
      - 'research/nightfall/formalization/vendor/aaronson_ambainis/**'
      - '.github/workflows/nightfall-aa-product-terminal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aa-product-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile the exact 181-module closure (vendored Turturean modules + NIGHTFALL) in dependency order
        shell: bash
        run: |
          set -euo pipefail
          while read -r M P; do
            [ -z "$M" ] && continue
            REL="${M//.//}"
            mkdir -p "/tmp/mathlib4/$(dirname "$REL")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$REL")"
            cp "$P" "/tmp/mathlib4/$REL.lean"
            echo "::group::$M"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$REL.olean" "$REL.lean" 2>&1 | tee "/tmp/log-$M.txt")
            echo "::endgroup::"
            if grep -q "declaration uses .sorry" "/tmp/log-$M.txt"; then echo "sorry in $M"; exit 1; fi
          done < research/nightfall/formalization/aa_product/CLOSURE.txt
      - name: Strict new median and conditional sharp-row proof receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/aa-product-v8
          python3 scripts/lean_bridge.py research/formalization_candidates/wright/WrightV8MedianMixed.lean \
            --workspace /tmp/mathlib4 --strict --timeout 1800 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Wright.SharpMedian.mixed_cube_amgm \
            --decl Nightfall.Wright.SharpMedian.mixed_cube_of_crossing \
            --decl Nightfall.Wright.SharpMedian.weighted_mixed_pair_dominance \
            --decl Nightfall.Wright.SharpMedian.normalized_two_sided_median \
            --json-out lean-receipts/aa-product-v8/median.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/aa-product-v8/median.json
          python3 scripts/lean_bridge.py research/formalization_candidates/wright/WrightV8RowConditional.lean \
            --workspace /tmp/mathlib4 --strict --timeout 1800 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.ProductSpace.RowBound.product_block_inequality_of_sharp_sensitivity \
            --decl Nightfall.ProductSpace.RowBound.product_scaled_bound_of_sharp_sensitivity \
            --decl Nightfall.ProductSpace.RowBound.product_packing_bound_of_sharp_sensitivity \
            --decl Nightfall.ProductSpace.RowBound.product_row_bound_of_sharp_sensitivity \
            --json-out lean-receipts/aa-product-v8/row.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/aa-product-v8/row.json
          (cd /tmp/mathlib4 && lake env leanchecker -v WrightV8MedianMixed)
          (cd /tmp/mathlib4 && lake env leanchecker -v WrightV8RowConditional)
          sha256sum research/formalization_candidates/wright/WrightV8MedianMixed.lean \
                    research/formalization_candidates/wright/WrightV8RowConditional.lean \
            > lean-receipts/aa-product-v8/source-sha256.txt
          cp -r lean-receipts/aa-product-v8/. lean-receipts/aa-product/
      - name: Strict named-theorem and standard axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/aa-product
          N=Nightfall.InfinitePiAAProductTerminal
          C=Nightfall.InfinitePiQ2CellAverage.CellLabels
          D=Nightfall.ProductSpace.MixedDifference
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiAAProductTerminal.lean \
            --workspace /tmp/mathlib4 --strict --timeout 1800 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl "$N.infinitePi_aa_product" \
            --decl "$C.table_aa" \
            --decl "$C.rtable_degree" \
            --decl "$C.mdelta_table_zero" \
            --decl "$C.dinfl_rtable" \
            --decl "$D.depDegree_of_mdelta" \
            --decl "$D.dinfl_eq_heatBath" \
            --decl "Nightfall.ProductSpace.Heterogeneous.heterogeneous_influence" \
            --json-out lean-receipts/aa-product/receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/aa-product/receipt.json
      - name: Print axioms and exact types of the terminal (not an independent kernel replay)
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          cat > NightfallAAProductAudit.lean <<'LEAN'
          import InfinitePiAAProductTerminal
          #print axioms Nightfall.InfinitePiAAProductTerminal.infinitePi_aa_product
          #check @Nightfall.InfinitePiAAProductTerminal.infinitePi_aa_product
          #print Nightfall.InfinitePiAAProductTerminal.ESDegreeLE
          #print Nightfall.InfinitePiAAProductTerminal.iterResidual
          #print axioms Nightfall.ProductSpace.Heterogeneous.heterogeneous_influence
          LEAN
          lake env lean NightfallAAProductAudit.lean | tee "$GITHUB_WORKSPACE/lean-receipts/aa-product/axioms.txt"
          ! grep -E "sorryAx" "$GITHUB_WORKSPACE/lean-receipts/aa-product/axioms.txt"
      - name: Printed Aaronson–Ambainis conjecture from the product-space chain (strict audit)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/aa-product
          Q=Nightfall.ProductSpace.CubeAA
          python3 scripts/lean_bridge.py research/nightfall/formalization/product_space/CubePrintedAA.lean \
            --workspace /tmp/mathlib4 --strict --timeout 1800 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl "$Q.printedConjecture" \
            --decl "$Q.explicitBound" \
            --decl "$Q.mainTheorem_of_productSpace" \
            --decl "$Q.hasProdDegreeLE_of_hasDegreeLE" \
            --decl "$Q.sum_pincr_unif_le" \
            --json-out lean-receipts/aa-product/printed-receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/aa-product/printed-receipt.json
          cd /tmp/mathlib4
          cat > NightfallPrintedAAAudit.lean <<'LEAN'
          import CubePrintedAA
          #check (Nightfall.ProductSpace.CubeAA.printedConjecture : AaronsonAmbainis.PrintedConjecture)
          #check (Nightfall.ProductSpace.CubeAA.explicitBound : AaronsonAmbainis.ExplicitBound)
          #print AaronsonAmbainis.PrintedConjecture
          #print axioms Nightfall.ProductSpace.CubeAA.printedConjecture
          #print axioms Nightfall.ProductSpace.CubeAA.explicitBound
          LEAN
          lake env lean NightfallPrintedAAAudit.lean | tee "$GITHUB_WORKSPACE/lean-receipts/aa-product/printed-axioms.txt"
          ! grep -E "sorryAx" "$GITHUB_WORKSPACE/lean-receipts/aa-product/printed-axioms.txt"
          # The upstream cube theorem and its chain are not in the closure.
          ! grep -E "^AaronsonAmbainis\.(Chain|Main|MainTheorem) " "$GITHUB_WORKSPACE/research/nightfall/formalization/aa_product/CLOSURE.txt"
          # Conjecture.lean is byte-identical to the pinned upstream file.
          sha256sum "$GITHUB_WORKSPACE/research/nightfall/formalization/vendor/aaronson_ambainis/AaronsonAmbainis/Conjecture.lean" | tee -a "$GITHUB_WORKSPACE/lean-receipts/aa-product/printed-axioms.txt"
      - name: Uniform classical simulation over product laws (strict audit)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/aa-product
          S=Nightfall.ProductSpace.Simulation
          python3 scripts/lean_bridge.py research/nightfall/formalization/product_space/ProductSimulation.lean \
            --workspace /tmp/mathlib4 --strict --timeout 1800 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl "$S.simulation_degree" \
            --decl "$S.simulation_rows" \
            --decl "$S.expected_queries" \
            --decl "$S.leaf_error" \
            --decl "$S.bad_queries" \
            --decl "$S.hasRows_of_degree" \
            --json-out lean-receipts/aa-product/simulation-receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/aa-product/simulation-receipt.json
      - name: Simulation over mixtures of product laws (strict audit)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/aa-product
          X=Nightfall.ProductSpace.Mixture
          python3 scripts/lean_bridge.py research/nightfall/formalization/product_space/MixtureSimulation.lean \
            --workspace /tmp/mathlib4 --strict --timeout 2400 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl "$X.mixture_simulation" \
            --decl "$X.mixture_simulation_jensen" \
            --decl "$X.increment_good_jensen" \
            --decl "$X.power_mean" \
            --decl "$X.good_exists" \
            --decl "$X.fooling_tv" \
            --decl "$X.Sq_gain" \
            --decl "$X.mexpected" \
            --decl "$X.mleaf_error" \
            --json-out lean-receipts/aa-product/mixture-receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/aa-product/mixture-receipt.json
      - name: Capture exact source and compiler head
        if: always()
        run: |
          mkdir -p lean-receipts/aa-product
          git rev-parse HEAD > lean-receipts/aa-product/head
          cut -d' ' -f2 research/nightfall/formalization/aa_product/CLOSURE.txt | xargs sha256sum > lean-receipts/aa-product/source-sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aa-product-terminal-${{ github.run_id }}
          path: lean-receipts/aa-product
          if-no-files-found: warn
