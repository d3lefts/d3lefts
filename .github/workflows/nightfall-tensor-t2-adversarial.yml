name: NIGHTFALL T2 complex and all-frequency adversarial exact audit
on:
  pull_request:
    paths:
      - 'research/nightfall/structural_information/check_tensor_t2_complex_group_energy_exact.py'
      - 'research/nightfall/structural_information/check_tensor_all_frequency_primitive_L4.cpp'
      - 'research/nightfall/structural_information/check_tensor_fixed_rank2_fibers.cpp'
      - 'research/nightfall/structural_information/check_tensor_fixed_rank2_direct.py'
      - '.github/workflows/nightfall-tensor-t2-adversarial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Independent all-frequency and complex-Hilbert exact checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p t2-adversarial-receipt
          python3 research/nightfall/structural_information/check_tensor_t2_complex_group_energy_exact.py | tee t2-adversarial-receipt/complex.log
          grep -q 'PASS exact Gaussian-rational full-rank and high-rank POVM group tests' t2-adversarial-receipt/complex.log
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/nightfall/structural_information/check_tensor_all_frequency_primitive_L4.cpp -o /tmp/check_t2_allfreq
          /tmp/check_t2_allfreq | tee t2-adversarial-receipt/all-frequencies.log
          grep -q 'PASS exact all-frequency primitive histogram L<=4' t2-adversarial-receipt/all-frequencies.log
      - name: Exact fixed-rank-two nonrow polynomial replay through depth seven
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O3 -Wall -Wextra -Werror research/nightfall/structural_information/check_tensor_fixed_rank2_fibers.cpp -o /tmp/check_rank2_fixed
          /tmp/check_rank2_fixed 2>&1 | tee t2-adversarial-receipt/fixed-rank2.log
          grep -q 'PASS fixed-rank-two tensor-core polynomial exact through L=7' t2-adversarial-receipt/fixed-rank2.log
      - name: Independent direct fixed-rank-two subset enumeration
        shell: bash
        run: |
          set -euo pipefail
          python3 research/nightfall/structural_information/check_tensor_fixed_rank2_direct.py | tee t2-adversarial-receipt/fixed-rank2-direct.log
          grep -q 'PASS direct fixed-rank-two subset enumeration L2-L4' t2-adversarial-receipt/fixed-rank2-direct.log
      - name: Persist exact source identity and limitations
        if: always()
        shell: bash
        run: |
          mkdir -p t2-adversarial-receipt
          git rev-parse HEAD > t2-adversarial-receipt/HEAD
          sha256sum research/nightfall/structural_information/check_tensor_t2_complex_group_energy_exact.py research/nightfall/structural_information/check_tensor_all_frequency_primitive_L4.cpp research/nightfall/structural_information/check_tensor_fixed_rank2_fibers.cpp research/nightfall/structural_information/check_tensor_fixed_rank2_direct.py > t2-adversarial-receipt/SHA256SUMS
          printf '%s\n' 'FINITE AUDIT ONLY: L<=2 complex amplitudes; L<=4 primitive all-frequency counts; no all-L quantum simulation theorem.' > t2-adversarial-receipt/SCOPE.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: t2-adversarial-exact-receipt
          path: t2-adversarial-receipt/
          retention-days: 90
