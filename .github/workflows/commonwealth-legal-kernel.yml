name: Commonwealth synthetic legal kernel
on:
  push:
    paths:
      - 'projects/commonwealth-os/legal_kernel/**'
      - '.github/workflows/commonwealth-legal-kernel.yml'
  pull_request:
    paths:
      - 'projects/commonwealth-os/legal_kernel/**'
      - '.github/workflows/commonwealth-legal-kernel.yml'
jobs:
  legal-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source and adversarial checker tests
        working-directory: projects/commonwealth-os
        run: python3 -m unittest discover -s legal_kernel/tests -v
      - name: Generate synthetic decision dossier
        working-directory: projects/commonwealth-os
        run: python3 -m legal_kernel.dossier --changed-source Z7 > /tmp/commonwealth-synthetic-dossier.json
