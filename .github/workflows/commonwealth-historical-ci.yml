name: Commonwealth historical synthetic engine
on:
  push:
    paths:
      - 'projects/commonwealth-os/historical/**'
      - '.github/workflows/commonwealth-historical-ci.yml'
  pull_request:
    paths:
      - 'projects/commonwealth-os/historical/**'
      - '.github/workflows/commonwealth-historical-ci.yml'
jobs:
  synthetic-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r app/requirements.txt
        working-directory: projects/commonwealth-os
      - run: python -m pytest -q historical/tests
        working-directory: projects/commonwealth-os
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test historical/web/tests/*.test.mjs
        working-directory: projects/commonwealth-os
      - run: node --check historical/web/app.mjs && node --check historical/web/model.mjs
        working-directory: projects/commonwealth-os
      - run: python -m compileall -q historical
        working-directory: projects/commonwealth-os
