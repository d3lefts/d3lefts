name: NIGHTFALL Q2 shifted original-source Jensen Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/q2_shifted/ShiftedOwnerSourceJensen.lean'
      - '.github/workflows/nightfall-q2-shifted-source-jensen.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightfall-q2-shifted-source-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  shifted-source-jensen:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile source-only dependency DAG and shifted Jensen module
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import pathlib
          import shutil
          import subprocess
          src = pathlib.Path("scripts/nightfall_q2_certify.py")
          spec = importlib.util.spec_from_file_location("q2cert", src)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          files = mod.local_sources()
          ordered = mod.closure("ShiftedOwnerSourceJensen", files)
          print("Compiling", len(ordered), "distinct source modules in dependency order", flush=True)
          dst = pathlib.Path("/tmp/mathlib4")
          out = dst / ".lake/build/lib/lean"
          out.mkdir(parents=True, exist_ok=True)
          for name in ordered:
              shutil.copyfile(files[name], dst / (name + ".lean"))
              print("BUILD", name, flush=True)
              subprocess.run(["lake", "env", "lean", "-o",
                  str(out / (name + ".olean")), name + ".lean"],
                  cwd=dst, timeout=1200, check=True)
          PY
      - name: Strict named source declarations and axiom receipt
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-shifted-source
          SRC=research/nightfall/formalization/q2_shifted/ShiftedOwnerSourceJensen.lean
          N=Nightfall.Observability.ShiftedOwnerSourceJensen
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.shifted_owned_first_norm_eq_projected_source \
            --decl $N.shifted_owned_first_norm_le_source_section \
            --decl $N.shifted_owned_first_norm_sum_le_eight \
            --json-out lean-receipts/q2-shifted-source/receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-shifted-source/receipt.json
      - name: Preserve source exactness
        if: always()
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-shifted-source
          sha256sum research/nightfall/formalization/q2_shifted/ShiftedOwnerSourceJensen.lean \
            > lean-receipts/q2-shifted-source/SHA256SUMS
          git rev-parse HEAD > lean-receipts/q2-shifted-source/commit.txt
          echo leanprover/lean4:v4.36.0-rc2 > lean-receipts/q2-shifted-source/lean-toolchain.txt
      - name: Upload source-matched Lean receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-q2-shifted-source-jensen-lean-receipts
          path: lean-receipts/q2-shifted-source/
          retention-days: 45
