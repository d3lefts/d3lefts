name: Verify Tessera Singer carry and two-step obstruction
on:
  pull_request:
    paths:
      - 'research/nightfall/projects/erdos/tessera-carry189-20261029/**'
      - '.github/workflows/verify-tessera-carry189.yml'
  push:
    paths:
      - 'research/nightfall/projects/erdos/tessera-carry189-20261029/**'
      - '.github/workflows/verify-tessera-carry189.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 research/nightfall/projects/erdos/tessera-carry189-20261029/verify_field_source.py
      - run: python3 research/nightfall/projects/erdos/tessera-carry189-20261029/verify.py
