name: NIGHTFALL Q2 genuine source influence identity pinned Lean 4.36
on:
  push:
    branches:
      - nightfall-q2-original-influence-v436-20261113
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/ActualSourceInfluenceEnergy.lean'
      - 'research/nightfall/formalization/observability/check_actual_source_influence_energy.py'
      - '.github/workflows/nightfall-q2-original-influence-v436.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-genuine-source-influence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Independent exact-rational source energy regression (480 finite cases)
        shell: bash
        run: python3 research/nightfall/formalization/observability/check_actual_source_influence_energy.py
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Recompile original finite product source dependencies under active pin
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ActualProductMergeTower ActualProductHilbertJensen ActualProductSoftNoise ActualProductSourceMarginal ActualSourceANOVA ActualProductResampleBridge ActualProductPairSector ActualProductSoftStar ActualProductSoftStarEnergy ActualProductSoftStarParseval ActualProductSourcePairCentering ActualProductSourceDerivedStar ActualSourceCanonicalPair ActualSourceSingletonProjection ArbitraryLawFourthMoment; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Strict source squared section energy equals resampling influence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourceInfluenceEnergy
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceInfluenceEnergy.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.weighted_centered_eq_pair \
            --decl $N.actual_source_section_energy_eq_influence \
            --json-out lean-receipts/q2-original-source-influence-identity.json || {
              cat lean-receipts/q2-original-source-influence-identity.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-original-source-influence-identity.json
      - name: Exact source and pin hashes
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/ActualSourceInfluenceEnergy.lean > lean-receipts/SHA256SUMS.txt
          git rev-parse HEAD > lean-receipts/repo-commit.txt
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
          git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/mathlib-commit.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-original-source-influence-identity-v436
          path: lean-receipts/
          retention-days: 45
