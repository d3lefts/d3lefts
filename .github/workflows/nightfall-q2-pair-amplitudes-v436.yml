name: NIGHTFALL Q2 attained pair amplitudes Lean 4.36
on:
  # Retained as manual diagnostic; automated Q2 proof CI is consolidated.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pair-amplitude:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Build genuine-source pair centering prerequisites
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ActualProductMergeTower ActualProductHilbertJensen ActualProductSoftNoise ActualProductSourceMarginal ActualProductPairSector ActualProductSoftStar ActualProductSoftStarEnergy ActualProductSoftStarParseval ActualProductSourcePairCentering; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Strict source-derived maximizer and dominance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourcePairAmplitudes
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourcePairAmplitudes.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.source_pair_amplitude_max_attained \
            --decl $N.pairAmplitudeWeight_nonneg \
            --decl $N.source_pair_amplitude_dominated \
            --json-out lean-receipts/q2-attained-source-pair-amplitudes.json || {
              cat lean-receipts/q2-attained-source-pair-amplitudes.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-attained-source-pair-amplitudes.json
      - name: Source fingerprint
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/ActualSourcePairAmplitudes.lean > lean-receipts/SHA256SUMS.txt
          git rev-parse HEAD > lean-receipts/repo-commit.txt
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-attained-source-pair-maxima
          path: lean-receipts/
          retention-days: 45
