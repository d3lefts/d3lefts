name: NIGHTFALL DispatchQ-B1 public smoke
on:
  push:
    paths:
      - 'research/nightfall/evaluations/dispatchq-b1/**'
      - '.github/workflows/nightfall-dispatchq-public.yml'
  pull_request:
    paths:
      - 'research/nightfall/evaluations/dispatchq-b1/**'
      - '.github/workflows/nightfall-dispatchq-public.yml'
permissions:
  contents: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run agent-visible smoke tests only
        working-directory: research/nightfall/evaluations/dispatchq-b1/candidate
        run: python -m unittest discover -s tests -v
