name: NIGHTFALL DQ2 signed-graph exact checks

on:
  pull_request:
    paths:
      - 'research/nightfall/2026-11-dq2/DQ2_SIGNED_DOBRUSHIN_SPECTRAL_SANDWICH_V0_1.md'
      - 'research/nightfall/2026-11-dq2/DQ2_SIGNED_DOBRUSHIN_PASSPORT_V0_1.json'
      - 'research/nightfall/2026-11-dq2/DQ2_ALL_GRAPHS_SCOPE_AND_NO_GO_V0_1.md'
      - 'scripts/check_dq2_signed_dobrushin_exact.py'
      - 'scripts/check_dq2_all_graphs_no_go_exact.py'
      - '.github/workflows/nightfall-dq2-signed-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-ising-exact:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact all-function Poincare and spectral-sandwich matrices
        run: python3 scripts/check_dq2_signed_dobrushin_exact.py
      - name: Verify exact unrestricted all-graph path-Ising no-go family
        run: python3 scripts/check_dq2_all_graphs_no_go_exact.py
      - name: Record both checker source checksums
        run: sha256sum scripts/check_dq2_signed_dobrushin_exact.py scripts/check_dq2_all_graphs_no_go_exact.py
