name: Lemnis uniform semidirect voltage certificate
on:
  pull_request:
    paths:
      - 'research/nightfall/projects/erdos/erdos64-lemnis-20261029/uniform_20261029/**'
      - '.github/workflows/verify-lemnis-uniform-semidir.yml'
  push:
    paths:
      - 'research/nightfall/projects/erdos/erdos64-lemnis-20261029/uniform_20261029/**'
      - '.github/workflows/verify-lemnis-uniform-semidir.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze source bytes against locally executed SHA256
        run: echo '35a0bcdcfb8df3b06b26ba60f338287f06b1f96a628bb66c7f75b30786007b69  research/nightfall/projects/erdos/erdos64-lemnis-20261029/uniform_20261029/verify_uniform.py' | sha256sum -c -
      - name: Exact six-polynomial and independent GF256/GF512 replay
        run: python3 research/nightfall/projects/erdos/erdos64-lemnis-20261029/uniform_20261029/verify_uniform.py
