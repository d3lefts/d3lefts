name: Build Paper C typeset manuscript and exact archive
on:
  push:
    branches: [main]
    paths:
      - 'papers/specialized-complexity/MANUSCRIPT.md'
      - 'papers/specialized-complexity/replay_f16_specialized.py'
      - '.github/workflows/publish-paper-c.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  typeset-and-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0  # needed for a safe rebase when parallel contributors advance main
      - name: Install open-source typesetting toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended zip poppler-utils
      - name: Rebuild manuscript, run finite exact audit and verify
        shell: bash
        run: |
          set -euo pipefail
          cd papers/specialized-complexity
          python3 replay_f16_specialized.py > /tmp/paper-c-audit.json
          python3 -m json.tool replay_f16_receipt.json > /dev/null
          pandoc MANUSCRIPT.md -s --from markdown+tex_math_dollars+yaml_metadata_block -V geometry:margin=1in -V fontsize=10pt -o Specialized_Complexity_Manuscript.tex
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error Specialized_Complexity_Manuscript.tex > /tmp/paper-c-latex.log
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error Specialized_Complexity_Manuscript.tex >> /tmp/paper-c-latex.log
          test -s Specialized_Complexity_Manuscript.pdf
          pdfinfo Specialized_Complexity_Manuscript.pdf | grep -E '^Pages:'
          cat > ARTIFACT_README.md <<'EOF'
          # Paper C reproducible research artifacts

          Generated on GitHub Actions from MANUSCRIPT.md (canonical text).
          TeX/PDF may differ byte-for-byte from the original local draft because
          toolchain version and document metadata differ. Mathematical claims
          retain their certification tiers and do not gain originality status.

          Reproduce: python3 replay_f16_specialized.py
          Verify: sha256sum -c SOURCE_SHA256SUMS
          Original archived finite-code provenance: closed PRs #252 and #255.
          EOF
          sha256sum MANUSCRIPT.md Specialized_Complexity_Manuscript.tex Specialized_Complexity_Manuscript.pdf replay_f16_specialized.py replay_f16_receipt.json ARTIFACT_README.md > SOURCE_SHA256SUMS
          zip -q -9 -j Specialized_Complexity_Source_and_Audit.zip MANUSCRIPT.md Specialized_Complexity_Manuscript.tex Specialized_Complexity_Manuscript.pdf replay_f16_specialized.py replay_f16_receipt.json ARTIFACT_README.md SOURCE_SHA256SUMS
          sha256sum -c SOURCE_SHA256SUMS
          unzip -t Specialized_Complexity_Source_and_Audit.zip | tail -1
          python3 ../../scripts/check_paper_c_bundle.py
      - name: Upload reproducible build even if branch push is protected
        uses: actions/upload-artifact@v4
        with:
          name: paper-c-typeset-and-audit
          path: |
            papers/specialized-complexity/Specialized_Complexity_Manuscript.tex
            papers/specialized-complexity/Specialized_Complexity_Manuscript.pdf
            papers/specialized-complexity/Specialized_Complexity_Source_and_Audit.zip
            papers/specialized-complexity/replay_f16_receipt.json
            papers/specialized-complexity/SOURCE_SHA256SUMS
          retention-days: 90
      - name: Commit reproducible PDF, TeX, and source archive to main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/specialized-complexity/{Specialized_Complexity_Manuscript.tex,Specialized_Complexity_Manuscript.pdf,Specialized_Complexity_Source_and_Audit.zip,replay_f16_receipt.json,SOURCE_SHA256SUMS,ARTIFACT_README.md}
          if ! git diff --cached --quiet; then
            git commit -m 'Build Paper C PDF, LaTeX and self-contained SHA-256 audit archive'
            # Another research instance may merge during a lengthy TeX build.
            # Rebase ONLY when the two canonical source inputs are unchanged
            # on origin/main; never force-push or publish a stale build.
            source_path=papers/specialized-complexity/MANUSCRIPT.md
            checker_path=papers/specialized-complexity/replay_f16_specialized.py
            source_hash="$(sha256sum "$source_path" | cut -d ' ' -f 1)"
            checker_hash="$(sha256sum "$checker_path" | cut -d ' ' -f 1)"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              remote_source_hash="$(git show "origin/main:$source_path" | sha256sum | cut -d ' ' -f 1)"
              remote_checker_hash="$(git show "origin/main:$checker_path" | sha256sum | cut -d ' ' -f 1)"
              if [[ "$remote_source_hash" != "$source_hash" || "$remote_checker_hash" != "$checker_hash" ]]; then
                echo "Canonical Paper C source changed after this build; refuse stale artifact publication"
                exit 1
              fi
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Cannot safely replay generated artifacts onto concurrent branch; manual review required"
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Paper C sources and generated outputs published to latest main"
                exit 0
              fi
              echo "Concurrent push on attempt $attempt; fetching and retrying"
              sleep 2
            done
            echo "Safe optimistic push exhausted; no force push attempted"
            exit 1
          fi
