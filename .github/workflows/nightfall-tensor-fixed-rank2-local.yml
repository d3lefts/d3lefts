name: NIGHTFALL fixed rank-two tensor local Lean
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/structural_information/TensorFixedRank2Local.lean'
      - '.github/workflows/nightfall-tensor-fixed-rank2-local.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-rank2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile and kernel replay source-equivalent local rank-two tensors
        shell: bash
        run: |
          set -euo pipefail
          dir=research/nightfall/formalization/structural_information
          mkdir -p fixed-rank2-local-receipt
          for f in SubcubeL3 TensorPureFibersL3 TensorFixedRank2Local; do
            cp "$dir/$f.lean" "/tmp/mathlib4/$f.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean") 2>&1 | tee "fixed-rank2-local-receipt/$f.log"
          done
          (cd /tmp/mathlib4 && lake env leanchecker TensorFixedRank2Local) 2>&1 | tee fixed-rank2-local-receipt/kernel.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('research/nightfall/formalization/structural_information/TensorFixedRank2Local.lean').read_text()
          log=Path('fixed-rank2-local-receipt/TensorFixedRank2Local.log').read_text()
          assert not re.search(r'(?m)^\s*(sorry|admit|axiom)\b',s)
          assert 'error:' not in log
          names=['pair_rank2_L2','triple_rank2_L2','quadruple_rank2_L2',
                 'pair_rank2_L3','triple_rank2_L3','quadruple_rank2_L3']
          assert all(name in log for name in names)
          reports=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',log)
          assert len(reports)>=6
          allowed={'propext','Classical.choice','Quot.sound'}
          assert all(set(x.strip() for x in m.split(',') if x.strip())<=allowed for m in reports)
          print('TENSOR_FIXED_RANK2_LOCAL_KERNEL_PASS')
          PY
      - name: Archive exact head and sources
        if: always()
        shell: bash
        run: |
          mkdir -p fixed-rank2-local-receipt
          git rev-parse HEAD > fixed-rank2-local-receipt/HEAD
          sha256sum research/nightfall/formalization/structural_information/SubcubeL3.lean research/nightfall/formalization/structural_information/TensorPureFibersL3.lean research/nightfall/formalization/structural_information/TensorFixedRank2Local.lean > fixed-rank2-local-receipt/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: fixed-rank2-local-receipt
          path: fixed-rank2-local-receipt/
          retention-days: 90
