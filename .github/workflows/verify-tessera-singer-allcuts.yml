name: Verify Tessera all-cut Singer source-reuse theorem
on:
  pull_request:
    paths:
      - "research/nightfall/projects/erdos/tessera-singer-cut-barrier-20261029/**"
      - ".github/workflows/verify-tessera-singer-allcuts.yml"
  push:
    paths:
      - "research/nightfall/projects/erdos/tessera-singer-cut-barrier-20261029/**"
      - ".github/workflows/verify-tessera-singer-allcuts.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify both Singer sources and all 1019742 cyclic cuts
        run: python3 research/nightfall/projects/erdos/tessera-singer-cut-barrier-20261029/verify.py
