name: Verify NIGHTFALL fragment salvage
on:
  pull_request:
    paths:
      - 'research/nightfall/**'
      - 'docs/fragment-salvage-lock.json'
      - 'scripts/check_fragment_salvage.cjs'
      - '.github/workflows/verify-fragment-salvage.yml'
  push:
    branches: [main]
    paths:
      - 'research/nightfall/**'
      - 'docs/fragment-salvage-lock.json'
      - 'scripts/check_fragment_salvage.cjs'
      - '.github/workflows/verify-fragment-salvage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check pinned bytes and negative controls
        run: node scripts/check_fragment_salvage.cjs
