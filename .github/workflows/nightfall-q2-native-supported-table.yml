name: NIGHTFALL Q2 native supported heterogeneous original source
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2NativeSupportedTerminal.lean'
      - '.github/workflows/nightfall-q2-native-supported-table.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile existing finite C105 kernel dependency graph and new native supported adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.nightfall_q2_certify import local_sources, closure, sha256, ROOT
          from pathlib import Path
          import shutil, subprocess, json
          files = local_sources()
          ws = Path("/tmp/mathlib4")
          out = ws / ".lake/build/lib/lean"
          out.mkdir(parents=True, exist_ok=True)
          receipts = Path("lean-receipts/q2-native-supported")
          receipts.mkdir(parents=True, exist_ok=True)
          manifest = []
          names = list(closure("InfinitePiQ2FiniteSupportedTerminal", files))
          names.extend([
              "InfinitePiQ2HeterogeneousAlphabet",
              "InfinitePiQ2TaggedSourceTransport",
              "InfinitePiQ2NativeHeterogeneousTerminal",
              "InfinitePiQ2NativeSupportedTerminal",
          ])
          for name in names:
              source = files[name]
              assert source.exists(), (name, source)
              target = ws / (name + ".lean")
              shutil.copyfile(source, target)
              assert sha256(source) == sha256(target)
              print("SOURCE-EXACT KERNEL", name, flush=True)
              subprocess.run(["lake", "env", "lean", "-o", str(out / (name + ".olean")), name + ".lean"],
                  cwd=ws, check=True, timeout=1200)
              manifest.append({"path": str(source.relative_to(ROOT)), "sha256": sha256(source)})
          (receipts / "sources.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Strict four named kernel axiom receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-native-supported
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2NativeSupportedTerminal.lean \
            --workspace /tmp/mathlib4 --strict --timeout 1200 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2NativeSupportedTerminal.native_positive_of_tagged \
            --decl Nightfall.InfinitePiQ2NativeSupportedTerminal.native_supported_degree_two_under_tagging \
            --decl Nightfall.InfinitePiQ2NativeSupportedTerminal.native_supported_bound_under_tagging \
            --decl Nightfall.InfinitePiQ2NativeSupportedTerminal.native_heterogeneous_q2_105416_supported_unconditional \
            --json-out lean-receipts/q2-native-supported/receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-native-supported/receipt.json
      - name: Record immutable source and environment identity
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-native-supported
          git rev-parse HEAD > lean-receipts/q2-native-supported/HEAD
          cat lean-toolchain > lean-receipts/q2-native-supported/TOOLCHAIN
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2NativeSupportedTerminal.lean \
            > lean-receipts/q2-native-supported/TERMINAL_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-native-supported-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-native-supported
          if-no-files-found: warn
