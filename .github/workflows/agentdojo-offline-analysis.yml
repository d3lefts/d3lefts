name: NIGHTFALL AgentDojo offline scorer — synthetic tests only
on:
  pull_request:
    paths:
      - 'research/nightfall/evaluations/agentdojo_asua_20261029/**'
      - '.github/workflows/agentdojo-offline-analysis.yml'
  push:
    branches: [main]
    paths:
      - 'research/nightfall/evaluations/agentdojo_asua_20261029/**'
      - '.github/workflows/agentdojo-offline-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-offline-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate synthetic matched-pair scorer and negative controls
        run: python3 -m unittest discover -v -s research/nightfall/evaluations/agentdojo_asua_20261029 -p 'test_*.py'
      - name: Emit gate-source checksum
        run: sha256sum research/nightfall/evaluations/agentdojo_asua_20261029/authority_gate.py
      - name: Emit protocol-source checksums for freeze preparation
        run: |
          sha256sum research/nightfall/evaluations/agentdojo_asua_20261029/PREREGISTRATION.md
          sha256sum research/nightfall/evaluations/agentdojo_asua_20261029/score_paired.py
          sha256sum research/nightfall/evaluations/agentdojo_asua_20261029/test_score_paired.py
