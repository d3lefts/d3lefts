name: NIGHTFALL cubic leaf-alphabet-free exact tests
on:
  pull_request:
    paths:
      - 'research/nightfall/2026-11-cubic-leaf-alphabet-free/**'
      - '.github/workflows/nightfall-cubic-leaf-free.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-resampling:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Exact heterogeneous cubic star and selector checks
        run: python3 -I research/nightfall/2026-11-cubic-leaf-alphabet-free/check_leaf_free_exact.py
