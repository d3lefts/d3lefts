name: NIGHTFALL Q2 exact original-source label mean preservation
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2OriginalLabelMeanProjection.lean'
      - '.github/workflows/nightfall-q2-source-label-mean-preservation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-source-label-mean-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  original-product:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile exact source-product Hilbert and finite-label mean graph
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from scripts.nightfall_q2_certify import local_sources, closure, sha256, ROOT
          import json, shutil, subprocess
          files=local_sources()
          ws=Path("/tmp/mathlib4")
          out=ws/".lake/build/lib/lean"
          out.mkdir(parents=True,exist_ok=True)
          receipt=Path("lean-receipts/q2-source-label-mean")
          receipt.mkdir(parents=True,exist_ok=True)
          manifest=[]
          for name in closure("InfinitePiQ2OriginalLabelMeanProjection",files):
              src=files[name]
              dst=ws/(name+".lean")
              shutil.copyfile(src,dst)
              assert sha256(src)==sha256(dst)
              print("BUILD SOURCE",name,flush=True)
              subprocess.run(["lake","env","lean","-o",str(out/(name+".olean")),name+".lean"],cwd=ws,check=True,timeout=1200)
              manifest.append({"path":str(src.relative_to(ROOT)),"sha256":sha256(src)})
          (receipt/"sources.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
      - name: Strict source mean preservation standard-axiom gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2OriginalLabelMeanProjection.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2OriginalLabelMeanProjection.labelRangeProjection_preserves_inner \
            --decl Nightfall.InfinitePiQ2OriginalLabelMeanProjection.sourceLabelLift_one \
            --decl Nightfall.InfinitePiQ2OriginalLabelMeanProjection.sourceLabelRangeProjection_preserves_mean \
            --json-out lean-receipts/q2-source-label-mean/strict.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-source-label-mean/strict.json
      - name: Preserve source and toolchain
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-source-label-mean
          git rev-parse HEAD > lean-receipts/q2-source-label-mean/HEAD
          cat lean-toolchain > lean-receipts/q2-source-label-mean/TOOLCHAIN
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2OriginalLabelMeanProjection.lean > lean-receipts/q2-source-label-mean/SOURCE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-source-label-mean-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-source-label-mean
          if-no-files-found: warn
