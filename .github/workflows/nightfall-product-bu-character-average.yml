name: NIGHTFALL BU symmetrization and perturbation kernel
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/finite_field/ProductBUCharacterAverage.lean'
      - 'research/nightfall/formalization/finite_field/ProductBUPerturbation.lean'
      - 'research/nightfall/formalization/finite_field/ProductBUInterval.lean'
      - '.github/workflows/nightfall-product-bu-character-average.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal-operators:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Pinned Lean source and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          dir=research/nightfall/formalization/finite_field
          for M in ProductSphereObstruction ProductBUCharacterAverage ProductBUPerturbation ProductBUInterval; do
            ! grep -nE '\b(sorry|admit|axiom)\b' "$dir/$M.lean"
            cp "$dir/$M.lean" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean") 2>&1 | tee "/tmp/$M.log"
          done
          python3 - <<'PY'
          import re
          sources={
            'Nightfall.ProductBUCharacterAverage.':
              ('charU_flip_left','charU_flip_right','charV_flip_left',
               'charV_flip_right','charU_fixed','charV_fixed',
               'charU_idempotent','charV_idempotent',
               'charU_charV_zero','charV_charU_zero',
               'charU_error_le','charV_eq_charU_swap','charV_error_le',
               'continuous_charU','continuous_charV'),
            'Nightfall.ProductBUPerturbation.':
              ('applyParam_rankOne_unit','weighted_perturbation_surjective',
               'product_weighted_perturbation_surjective',
               'radial_direction_right_inverse',
               'augmented_constraint_parameter_surjective'),
            'Nightfall.ProductBUInterval.':
              ('interval_has_fixedPoint','homeomorphic_interval_has_fixedPoint')
          }
          for prefix,names in sources.items():
              mod=prefix.rstrip('.').split('.')[-1]
              source=open('/tmp/'+mod+'.log',encoding='utf8').read()
              assert 'sorryAx' not in source
              for suffix in names:
                  name=prefix+suffix
                  m=re.search(re.escape("'" + name + "' depends on axioms: [")+r'([^\]]*)\]',source,re.S)
                  if m is None:
                      assert f"'{name}' does not depend on any axioms" in source,name
                      axioms=set()
                  else:
                      axioms={v.strip() for v in m.group(1).split(',') if v.strip()}
                  assert axioms <= {'propext','Classical.choice','Quot.sound'},(name,axioms)
                  print(name,sorted(axioms))
          print('PASS: symmetrization/parameter right-inverse only; NO topological zero theorem')
          PY
