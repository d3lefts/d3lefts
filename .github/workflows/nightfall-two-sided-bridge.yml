name: NIGHTFALL product-space two-sided bridge (single pinned toolchain)
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/ProductSpaceTwoSidedBridge.lean'
      - 'research/nightfall/formalization/product_space/check_certificate_guided_descent.py'
      - 'research/nightfall/formalization/product_space/check_posterior_adaptive_exact.py'
      - '.github/workflows/nightfall-two-sided-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-sided-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Independent exact-rational sampler and posterior check
        run: python3 research/nightfall/formalization/product_space/check_certificate_guided_descent.py
      - name: Exhaustive conditional-product and adaptive Markov audit
        run: python3 research/nightfall/formalization/product_space/check_posterior_adaptive_exact.py
      - name: Install Lean 4.33.0 (Turturean pin)
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned antipodal theorem
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/physical-superintelligence/aaronson-ambainis.git /tmp/aa
          git -C /tmp/aa checkout 2a6ceaef872ae993708950f951989134084b851a
          cd /tmp/aa
          lake exe cache get
          lake build AaronsonAmbainis.DetTheorem AaronsonAmbainis.TwoSided.Antipodal AaronsonAmbainis.Bridge.Positivity
      - name: Compile bridge and record axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/ProductSpaceTwoSidedBridge.lean \
            --workspace /tmp/aa --timeout 1500 \
            --decl Nightfall.ProductSpace.Transfer.weighted_product_reciprocal \
            --decl Nightfall.ProductSpace.Transfer.cross_pair_cost_pos \
            --decl Nightfall.ProductSpace.localized_weight_removal \
            --decl Nightfall.ProductSpace.localized_weight_removal_mass \
            --decl Nightfall.ProductSpace.Transfer.cross_sum_eq \
            --decl Nightfall.ProductSpace.Transfer.localized_two_sided_product \
            --decl Nightfall.ProductSpace.Transfer.two_sided_of_localized \
            --decl Nightfall.ProductSpace.Transfer.two_sided_product \
            --decl Nightfall.ProductSpace.Discovery.weighted_sqrt_cauchy \
            --decl Nightfall.ProductSpace.Discovery.certificate_overlap_sampler \
            --decl Nightfall.ProductSpace.Discovery.weighted_potential_descent \
            --decl Nightfall.ProductSpace.Discovery.geometric_potential_decay \
            --decl Nightfall.ProductSpace.Discovery.overlap_information_sharp \
            --decl Nightfall.ProductSpace.Posterior.finite_observation_partition \
            --decl Nightfall.ProductSpace.Posterior.posterior_edge_mean \
            --decl Nightfall.ProductSpace.Posterior.posterior_total_mean \
            --decl Nightfall.ProductSpace.Posterior.conditional_mass_one \
            --decl Nightfall.ProductSpace.Posterior.push_expectation \
            --decl Nightfall.ProductSpace.Posterior.push_nonneg \
            --decl Nightfall.ProductSpace.Posterior.push_mass_one \
            --decl Nightfall.ProductSpace.Posterior.push_potential_bound \
            --decl Nightfall.ProductSpace.Posterior.evolve_nonneg \
            --decl Nightfall.ProductSpace.Posterior.adaptive_markov_decay \
            --decl Nightfall.ProductSpace.Posterior.adaptive_query_contraction \
            --json-out lean-receipts/two-sided-bridge.json || {
              cat lean-receipts/two-sided-bridge.json || true
              exit 1
            }
      - name: Axiom policy
        run: |
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/two-sided-bridge.json
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-sided-bridge-receipt
          path: lean-receipts/
          if-no-files-found: warn
