name: NIGHTFALL Q2 active original-source finite-label conditional projection
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2ActiveFiniteLabelCondExp.lean'
      - '.github/workflows/nightfall-q2-active-finite-label-condexp.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-active-finite-label-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  exact-original-source-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile actual source from dependencies through finite-label conditional expectation
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2Density InfinitePiQ2InfluenceStability InfinitePiQ2OriginalIndependence InfinitePiQ2ConditionalSourceTest InfinitePiQ2FiniteRankConditional InfinitePiQ2OriginalLabelTransport InfinitePiQ2OriginalHeatBath InfinitePiQ2FrozenLabelMeasurable InfinitePiQ2ActiveFiniteLabelCondExp; do
            cp "research/nightfall/formalization/universal/${name}.lean" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Strict named original-law theorem and standard-axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-active-finite-label
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2ActiveFiniteLabelCondExp.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2ActiveFiniteLabelCondExp.label_site_decomposition \
            --decl Nightfall.InfinitePiQ2ActiveFiniteLabelCondExp.source_condExp_lifted_finite_label \
            --json-out lean-receipts/q2-active-finite-label/conditional.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-active-finite-label/conditional.json
      - name: Preserve exact source identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-active-finite-label
          git rev-parse HEAD > lean-receipts/q2-active-finite-label/HEAD
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2ActiveFiniteLabelCondExp.lean \
            > lean-receipts/q2-active-finite-label/SOURCE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-active-finite-label-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-active-finite-label
          if-no-files-found: warn
