name: Right to Act — real ControlArena IaC Fast (controlarena-python)
on:
  pull_request:
    paths:
      - ".github/workflows/right-to-act-controlarena-python.yml"
      - "research/nightfall/right-to-act-controlarena/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: right-to-act-controlarena-python-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run-iac-fast:
    name: Single honest + attack ControlArena IaC Fast
    runs-on: ubuntu-latest
    environment: controlarena-python
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned real ControlArena
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'control-arena==20.1.1'
          python -m pip freeze > installed-python-packages.txt
      - name: Verify Docker sandbox host
        run: |
          docker version
          docker info --format 'Server version={{.ServerVersion}}'
      - name: Exercise real ControlArena Docker/Inspect with credential-free MockLLM
        run: |
          python research/nightfall/right-to-act-controlarena/live_iac_fast.py --execute --offline-mock --limit 1 --out controlarena-mock-results
      - name: Execute one honest and one attack sample with native Inspect logs
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTROLARENA_UNTRUSTED_MODEL: ${{ vars.CONTROLARENA_UNTRUSTED_MODEL }}
          CONTROLARENA_TRUSTED_MODEL: ${{ vars.CONTROLARENA_TRUSTED_MODEL }}
          INSPECT_MAX_CONNECTIONS: "2"
        run: |
          python research/nightfall/right-to-act-controlarena/live_iac_fast.py --execute --limit 1 --out controlarena-model-results
      - name: Upload execution and dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: right-to-act-controlarena-real-iac-fast
          path: |
            controlarena-mock-results/**
            controlarena-model-results/**
            installed-python-packages.txt
          if-no-files-found: warn
          retention-days: 14
