name: NIGHTFALL RH HalfPlane pinned Lean 4.36 proof probe
on:
  pull_request:
    paths:
      - .github/workflows/nightfall-rh-halfplane-crossrepo-lean.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-rh-halfplane:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RH_COMMIT: 2ffcaefc3c1a4968d3e1fa053771c6123e9b0975
      RH_BASE: c592e91eb8f41bfd149227c09460fae0c17bf3c5
      RH_MATHLIB: fc4f59e577feb1a4956671bc04ac18aaaf8cd842
      RH_TOOLCHAIN: leanprover/lean4:v4.36.0
      MODULE_PATH: Development/AutomorphicArithmetic/CharacterBoxes
    steps:
      - name: Checkout NIGHTFALL compiler bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact RH Lean and pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-rh-init.sh
          sh /tmp/elan-rh-init.sh -y --no-modify-path --default-toolchain "$RH_TOOLCHAIN"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lean" --version | grep -F 'version 4.36.0'
          mkdir /tmp/rh-mathlib
          git -C /tmp/rh-mathlib init
          git -C /tmp/rh-mathlib remote add origin https://github.com/leanprover-community/mathlib4.git
          git -C /tmp/rh-mathlib fetch --depth=1 origin "$RH_MATHLIB"
          git -C /tmp/rh-mathlib checkout --detach FETCH_HEAD
          test "$(git -C /tmp/rh-mathlib rev-parse HEAD)" = "$RH_MATHLIB"
          test "$(cat /tmp/rh-mathlib/lean-toolchain)" = "$RH_TOOLCHAIN"
          (cd /tmp/rh-mathlib && "$HOME/.elan/bin/lake" exe cache get)
      - name: Fetch exact source bytes from immutable RH commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/nightfall/formalization/rh_probe receipts/rh-halfplane
          src=research/nightfall/formalization/rh_probe
          url=https://raw.githubusercontent.com/d3lefts/riemann-hypothesis
          curl -fsSL --retry 3 "$url/$RH_BASE/src/$MODULE_PATH/HalfPlane.lean" -o "$src/HalfPlaneBaseline.lean"
          curl -fsSL --retry 3 "$url/$RH_COMMIT/src/$MODULE_PATH/HalfPlane.lean" -o "$src/HalfPlaneCandidate.lean"
          curl -fsSL --retry 3 "$url/$RH_COMMIT/src/$MODULE_PATH/ClaimStrip.lean" -o "$src/ClaimStrip.lean"
          test "$(git hash-object "$src/HalfPlaneBaseline.lean")" = ba38ed1e1be2287027a8a0baab005e274473d764
          test "$(git hash-object "$src/HalfPlaneCandidate.lean")" = 717bc2b363301add014db1224a3ac606ee87966f
          test "$(git hash-object "$src/ClaimStrip.lean")" = 1027c81dccbaeaf01e077556d60a43cfa57023a0
          python3 - <<'PY'
          from pathlib import Path
          p=Path('research/nightfall/formalization/rh_probe')
          a=(p/'HalfPlaneBaseline.lean').read_bytes()
          b=(p/'HalfPlaneCandidate.lean').read_bytes()
          assert a.count(b'public import Mathlib\n')==1
          assert b==a.replace(b'public import Mathlib\n',
              b'public import Mathlib.NumberTheory.LSeries.DirichletContinuation\npublic import Mathlib.Tactic\n')
          print('Exact source diff: import header only')
          PY
          sha256sum "$src"/*.lean > receipts/rh-halfplane/SHA256SUMS
          git -C /tmp/rh-mathlib rev-parse HEAD > receipts/rh-halfplane/mathlib-sha.txt
          printf '%s\n' "$RH_COMMIT" > receipts/rh-halfplane/rh-sha.txt
          printf '%s\n' "$RH_TOOLCHAIN" > receipts/rh-halfplane/lean-toolchain.txt
      - name: Compile exact HalfPlane candidate using NIGHTFALL strict bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_bridge.py research/nightfall/formalization/rh_probe/HalfPlaneCandidate.lean \
            --workspace /tmp/rh-mathlib --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl Claim.factor_ne_zero --json-out receipts/rh-halfplane/halfplane.json
          python3 research/nightfall/formalization/product_space/check_receipts.py receipts/rh-halfplane/halfplane.json
      - name: Compile direct downstream ClaimStrip and independently replay kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "/tmp/rh-mathlib/$MODULE_PATH" "/tmp/rh-mathlib/.lake/build/lib/lean/$MODULE_PATH"
          cp research/nightfall/formalization/rh_probe/HalfPlaneCandidate.lean "/tmp/rh-mathlib/$MODULE_PATH/HalfPlane.lean"
          cp research/nightfall/formalization/rh_probe/ClaimStrip.lean "/tmp/rh-mathlib/$MODULE_PATH/ClaimStrip.lean"
          (cd /tmp/rh-mathlib && lake env lean -o ".lake/build/lib/lean/$MODULE_PATH/HalfPlane.olean" "$MODULE_PATH/HalfPlane.lean")
          (cd /tmp/rh-mathlib && lake env leanchecker Development.AutomorphicArithmetic.CharacterBoxes.HalfPlane) \
            | tee receipts/rh-halfplane/halfplane-kernel.log
          python3 scripts/lean_bridge.py research/nightfall/formalization/rh_probe/ClaimStrip.lean \
            --workspace /tmp/rh-mathlib --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl Claim.prim_zero --decl Claim.gamma_ne_zero --decl Claim.prim_reflect \
            --decl Claim.strip --decl Claim.zeta --json-out receipts/rh-halfplane/claimstrip.json
          python3 research/nightfall/formalization/product_space/check_receipts.py receipts/rh-halfplane/claimstrip.json
          (cd /tmp/rh-mathlib && lake env lean -o ".lake/build/lib/lean/$MODULE_PATH/ClaimStrip.olean" "$MODULE_PATH/ClaimStrip.lean")
          (cd /tmp/rh-mathlib && lake env leanchecker Development.AutomorphicArithmetic.CharacterBoxes.ClaimStrip) \
            | tee receipts/rh-halfplane/claimstrip-kernel.log
          echo 'PASS: exact RH candidate and ClaimStrip compiled, checked and standard-axiom audited' \
            | tee receipts/rh-halfplane/scope.txt
      - name: Upload immutable source and kernel receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rh-halfplane-lean436-receipts
          path: receipts/rh-halfplane/
          retention-days: 90
          if-no-files-found: warn
