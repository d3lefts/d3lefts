name: NIGHTFALL grid Conjecture E exact dual-chain adversarial audit
on:
  pull_request:
    paths:
      - 'research/nightfall/structural_information/dichotomy_tests/GRID_CYCLE_FRAME_RIGIDITY_20261119.md'
      - 'research/nightfall/structural_information/dichotomy_tests/check_grid_cycle_rigidity.py'
      - 'research/nightfall/structural_information/dichotomy_tests/GRID_FRAME_NO_GO_CONJECTURE_E_20261119.md'
      - 'research/nightfall/structural_information/dichotomy_tests/check_grid_frame_dual_nogo.py'
      - '.github/workflows/nightfall-grid-cycle-frame-rigidity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grid-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exact graph-frame and girth-gate checker
        shell: bash
        run: |
          set -euo pipefail
          python3 -I research/nightfall/structural_information/dichotomy_tests/check_grid_cycle_rigidity.py 2>&1 | tee grid-rigidity.log
          grep -q '^PASS grid rigidity: candidate frames 1659$' grid-rigidity.log
          grep -q '^TREE_STRETCH \[(2, 2, 3, 4), (2, 3, 3, 15), (3, 3, 3, 192)\]$' grid-rigidity.log
          grep -q "'first_gate_negative': 1" grid-rigidity.log
          grep -q "'second_gate_negative': 1" grid-rigidity.log
      - name: Independent exact dual-chain sparse-section checker
        shell: bash
        run: |
          set -euo pipefail
          python3 -I research/nightfall/structural_information/dichotomy_tests/check_grid_frame_dual_nogo.py 2>&1 | tee grid-dual-nogo.log
          grep -q '^PASS grid dual-chain no-go 160 cases$' grid-dual-nogo.log
          grep -q "'exact_face_lift': 8460" grid-dual-nogo.log
          grep -q "'S_boundary2_identity': 3580" grid-dual-nogo.log
          grep -q "'global_bound': 160" grid-dual-nogo.log
      - name: Preserve exact-head provenance and negative results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/grid-frame-nogo
          cp grid-rigidity.log receipts/grid-frame-nogo/ 2>/dev/null || true
          cp grid-dual-nogo.log receipts/grid-frame-nogo/ 2>/dev/null || true
          sha256sum research/nightfall/structural_information/dichotomy_tests/GRID_CYCLE_FRAME_RIGIDITY_20261119.md research/nightfall/structural_information/dichotomy_tests/check_grid_cycle_rigidity.py research/nightfall/structural_information/dichotomy_tests/GRID_FRAME_NO_GO_CONJECTURE_E_20261119.md research/nightfall/structural_information/dichotomy_tests/check_grid_frame_dual_nogo.py > receipts/grid-frame-nogo/SHA256SUMS
          git rev-parse HEAD > receipts/grid-frame-nogo/effective-head.txt
          python3 --version > receipts/grid-frame-nogo/python.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grid-frame-nogo-exact-receipt
          path: receipts/grid-frame-nogo/
          if-no-files-found: error
          retention-days: 90
