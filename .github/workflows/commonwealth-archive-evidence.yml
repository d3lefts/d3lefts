name: Commonwealth OS archive evidence

on:
  pull_request:
    paths:
      - 'projects/commonwealth-os/research/democratic-assurance/**'
      - 'projects/commonwealth-os/architecture/v1.1/**'
      - 'projects/commonwealth-os/prepilot/v1.2/**'
      - 'projects/commonwealth-os/prepilot/v1.3/**'
      - 'projects/commonwealth-os/prepilot/v1.3.1/**'
      - 'projects/commonwealth-os/product-design/figma-import-v1.2/**'
      - 'projects/commonwealth-os/SOURCE_ARCHIVE_MANIFEST_20261115.json'
      - 'projects/commonwealth-os/verification/**'
      - '.github/workflows/commonwealth-archive-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay manifest, finite models, and prepilot assertions
        run: python projects/commonwealth-os/verification/verify_archived_sources.py
