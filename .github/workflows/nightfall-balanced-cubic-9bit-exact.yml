name: NIGHTFALL exact balanced nine-sign cubic proof attack

on:
  push:
    branches: [nightfall-cubic-balanced-9bit-20261117]
    paths:
      - 'research/nightfall/cubic-q3/check_balanced_tripartite_9bit.py'
      - '.github/workflows/nightfall-balanced-cubic-9bit-exact.yml'
  pull_request:
    paths:
      - 'research/nightfall/cubic-q3/check_balanced_tripartite_9bit.py'
      - '.github/workflows/nightfall-balanced-cubic-9bit-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-9bit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Exact source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Archive source hash
        run: sha256sum research/nightfall/cubic-q3/check_balanced_tripartite_9bit.py
      - name: Verify source variance, full Walsh support, all influences, minimal covers and disjoint scaling
        run: python3 -I research/nightfall/cubic-q3/check_balanced_tripartite_9bit.py
