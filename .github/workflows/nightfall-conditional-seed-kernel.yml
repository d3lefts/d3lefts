name: NIGHTFALL conditional seed kernel composition Lean
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/StrongConditionalSeedKernel.lean'
      - 'research/nightfall/strong_simulation_progress/check_conditional_seed_kernel_exact.py'
      - '.github/workflows/nightfall-conditional-seed-kernel.yml'
  push:
    branches:
      - nightfall-strong-seed-kernel-20261119
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conditional-seed-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Independent exact-rational zero-atom regression
        run: python3 research/nightfall/strong_simulation_progress/check_conditional_seed_kernel_exact.py
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Exact source Lean compilation and axiom print
        shell: bash
        run: |
          set -euo pipefail
          SRC="research/nightfall/formalization/product_space/StrongConditionalSeedKernel.lean"
          if grep -En '\bsorry\b|\badmit\b|sorryAx|^[[:space:]]*axiom\b|native_decide|unsafe' "$SRC"; then exit 1; fi
          cp "$SRC" /tmp/mathlib4/StrongConditionalSeedKernel.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/StrongConditionalSeedKernel.olean StrongConditionalSeedKernel.lean) 2>&1 | tee /tmp/seed-kernel.log
          if grep -E 'error:|sorryAx|declaration uses .sorry' /tmp/seed-kernel.log; then exit 1; fi
          for lemma in composeKernel_nonneg composeKernel_sum_one composeKernel_pushforward productKernel_pushforward uniformProductSeed; do
            grep -Fq "Nightfall.StrongSeedKernel.$lemma' depends on axioms:" /tmp/seed-kernel.log
          done
          sha256sum "$SRC" | tee /tmp/seed-kernel-sha256.txt
      - name: Preserve source receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conditional-seed-kernel
          path: |
            /tmp/seed-kernel.log
            /tmp/seed-kernel-sha256.txt
          retention-days: 60
          if-no-files-found: warn
