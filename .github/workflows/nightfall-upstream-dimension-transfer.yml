name: NIGHTFALL upstream dimension-controlled transfer audit
on:
  pull_request:
    paths:
      - 'scripts/check_upstream_dimension_transfer.py'
      - 'research/nightfall/structural_information/UPSTREAM_DIMENSION_CONTROLLED_TRANSFER_20261122.md'
      - '.github/workflows/nightfall-upstream-dimension-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - run: python scripts/check_upstream_dimension_transfer.py
