name: NIGHTFALL quadratic realized range bridge — pinned Lean 4.35
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/QuadraticRealizedRangeBudget.lean'
      - '.github/workflows/nightfall-quadratic-range-bridge-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  range-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean and Mathlib
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          git clone --depth 1 --branch v4.35.0 https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4
          (cd /tmp/mathlib4 && "$HOME/.elan/bin/lake" exe cache get)
      - name: Compile full switching dependency chain
        shell: bash
        run: |
          set -euo pipefail
          for name in ParityBlockCancellation QuadraticMatchedParity QuadraticSwitchingIdentity QuadraticSingleReplacement QuadraticOscillationBound; do
            cp "research/nightfall/formalization/observability/$name.lean" /tmp/mathlib4/
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean")
          done
      - name: Strict bridge declaration and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.QuadraticSwitching
          python3 scripts/lean_bridge.py research/nightfall/formalization/observability/QuadraticRealizedRangeBudget.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.quadratic_realized_range_budget \
            --decl $N.quadratic_realized_half_range_budget \
            --decl $N.quadratic_actual_all_section_ranges_le_sixteen \
            --json-out lean-receipts/range-bridge.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/range-bridge.json
          sha256sum research/nightfall/formalization/observability/{QuadraticOscillationBound,QuadraticRealizedRangeBudget}.lean > lean-receipts/SHA256SUMS
          git rev-parse HEAD > lean-receipts/repository-commit.txt
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quadratic-realized-range-bridge
          path: lean-receipts/
          if-no-files-found: warn
