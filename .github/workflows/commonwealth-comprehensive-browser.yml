name: Commonwealth comprehensive browser workspace
on:
  pull_request:
    paths:
      - 'docs/commonwealth-browser/**'
      - 'docs/commonwealth-os.html'
      - '.github/workflows/commonwealth-comprehensive-browser.yml'
  push:
    branches: [main]
    paths:
      - 'docs/commonwealth-browser/**'
      - 'docs/commonwealth-os.html'
      - '.github/workflows/commonwealth-comprehensive-browser.yml'
permissions:
  contents: read
jobs:
  synthetic-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check ES module syntax
        run: |
          node --check docs/commonwealth-browser/history-core.mjs
          node --check docs/commonwealth-browser/question-data.mjs
          node --check docs/commonwealth-browser/workspace.mjs
          node --check docs/commonwealth-browser/participation-core.mjs
          node --check docs/commonwealth-browser/participation-ui.mjs
          node --check projects/commonwealth-os/apps/browser/participation-core.mjs
          node --check projects/commonwealth-os/apps/browser/participation-ui.mjs
          node --check docs/commonwealth-browser/app.mjs
          node --check projects/commonwealth-os/apps/browser/workspace.mjs
          node --check projects/commonwealth-os/apps/browser/history-core.mjs
          cmp docs/commonwealth-browser/historical-fixtures.js docs/commonwealth-intelligence-fixtures.js
          for file in index.html participation-core.mjs participation-ui.mjs participation.css participation-section.html PARTICIPATION_V1_2.md tests/participation-core.test.mjs; do
            cmp "docs/commonwealth-browser/$file" "projects/commonwealth-os/apps/browser/$file"
          done
      - name: Pure synthetic history, questionnaire and entrypoint tests
        run: node --test docs/commonwealth-browser/tests/*.test.mjs projects/commonwealth-os/apps/browser/tests/*.test.mjs tests/test_commonwealth_web_demo.mjs
