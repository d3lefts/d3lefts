name: Verify NIGHTFALL task-distinction lifecycle theorem

on:
  pull_request:
    paths:
      - "research/nightfall/2026-11-task-distinction-engineering/**"
      - ".github/workflows/task-distinction-lifecycle-audit.yml"
  push:
    branches: [main]
    paths:
      - "research/nightfall/2026-11-task-distinction-engineering/**"
      - ".github/workflows/task-distinction-lifecycle-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-sparse-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Exact signed-shift sparse-update and peak-invariance falsifier
        run: python3 -I research/nightfall/2026-11-task-distinction-engineering/check_sparse_overlap.py
