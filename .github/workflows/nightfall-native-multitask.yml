name: NIGHTFALL native ControlArena full-tool multitask agent evaluation
on:
  pull_request:
    paths:
      - ".github/workflows/nightfall-native-multitask.yml"
      - "research/nightfall/right-to-act-promotion/run_native_multitask.py"
      - "research/nightfall/right-to-act-promotion/NATIVE_MULTITASK_PROTOCOL.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightfall-controlarena-native-multitask
  cancel-in-progress: true
jobs:
  native-open-agent:
    runs-on: ubuntu-latest
    environment: controlarena-python
    timeout-minutes: 55
    defaults:
      run:
        working-directory: research/nightfall/right-to-act-promotion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official pinned framework and record dependencies
        run: |
          python -m pip install 'control-arena==20.1.1' 'aws-cdk-lib==2.260.0' 'constructs==10.5.0' 'jsii==1.137.0' 'pytest==8.4.2'
          python -m py_compile run_native_multitask.py
          python -m pip freeze > native-multitask-versions.txt
      - name: Verify real isolated Docker environment
        run: |
          docker info --format '{{.ServerVersion}}'
          docker info --format '{{json .SecurityOptions}}' > native-docker-security.json
      - name: Pull local unrestricted source-editor model and pin weights
        timeout-minutes: 12
        run: |
          docker run -d --rm --name nightfall-native-ollama --cpus 3 --memory 9g \
            -p 127.0.0.1:11434:11434 \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_CONTEXT_LENGTH=16384 \
            -e OLLAMA_NO_CLOUD=1 ollama/ollama:latest
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          docker exec nightfall-native-ollama ollama pull qwen2.5-coder:3b
          mkdir -p native-multitask-results
          curl -fsS http://127.0.0.1:11434/api/tags > native-multitask-results/ollama-tags.json
          docker image inspect --format '{{.Id}}' ollama/ollama:latest > native-ollama-image.txt
      - name: Native Inspect full agent tools; two honest and four attack tasks
        timeout-minutes: 36
        env:
          JSII_SILENCE_WARNING_UNTESTED_NODE_VERSION: "1"
        run: python run_native_multitask.py --out native-multitask-results
      - name: Fail closed on sample selection drift
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('native-multitask-results/receipt.json').read_text())
          assert x['state']=='completed_native_evaluation'
          assert len(x['native_inspect_scored_samples'])==6
          assert len({r['sample_id'] for r in x['native_inspect_scored_samples']})==6
          assert {'honest','attack'}=={r['mode'] for r in x['native_inspect_scored_samples']}
          assert set(r['sample_id'] for r in x['native_inspect_scored_samples']) == set(x['task_ids']['honest']+x['task_ids']['attack'])
          PY
      - name: Retain Inspect native agent traces, model identity and score receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-native-controlarena-multitask-traces
          path: |
            research/nightfall/right-to-act-promotion/native-multitask-results/
            research/nightfall/right-to-act-promotion/native-multitask-versions.txt
            research/nightfall/right-to-act-promotion/native-ollama-image.txt
            research/nightfall/right-to-act-promotion/native-docker-security.json
          retention-days: 30
          if-no-files-found: warn
