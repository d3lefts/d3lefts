name: NIGHTFALL transitive physical averaged-operator bridge pinned Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [nightfall/quantum-sld-full-20261116]
    paths:
      - 'research/nightfall/formalization/quantum/PhysicalOperatorReduction.lean'
      - '.github/workflows/nightfall-quantum-operator-reduction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operator-reduction:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile physical and character dependency modules under pinned Mathlib
        shell: bash
        run: |
          set -euo pipefail
          for F in PhysicalQubitEnsemble TernaryPhase TensorCharacter; do
            cp "research/nightfall/formalization/quantum/$F.lean" "/tmp/mathlib4/$F.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$F.olean" "$F.lean")
          done
      - name: Compile actual averaged operator bridge
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/PhysicalOperatorReduction.lean /tmp/mathlib4/PhysicalOperatorReduction.lean
          (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/PhysicalOperatorReduction.olean" PhysicalOperatorReduction.lean)
      - name: Strict transitive named axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p operator-reduction-receipts
          N=Nightfall.Quantum.OperatorReduction
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/PhysicalOperatorReduction.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.state_is_physical" --decl "$N.unnormalizedB_entry" --decl "$N.unnormalizedC_entry" --decl "$N.unnormalizedC_zero_of_local" --decl "$N.unnormalizedA_from_actual_states" --json-out operator-reduction-receipts/bridge.json
          python3 research/nightfall/formalization/product_space/check_receipts.py operator-reduction-receipts/bridge.json
      - name: Preserve source and pin
        if: always()
        run: |
          mkdir -p operator-reduction-receipts
          git rev-parse HEAD > operator-reduction-receipts/commit.txt
          git -C /tmp/mathlib4 rev-parse HEAD > operator-reduction-receipts/mathlib.txt || true
          sha256sum research/nightfall/formalization/quantum/{PhysicalQubitEnsemble,TernaryPhase,TensorCharacter,PhysicalOperatorReduction}.lean > operator-reduction-receipts/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: nightfall-operator-reduction-${{ github.run_id }}
          path: operator-reduction-receipts/
          retention-days: 60
