name: NIGHTFALL current-source Q2 mixed rectangle invariance Lean 4.36
on:
  push:
    branches: [nightfall-q2-source-anova-global-v436-20261113]
    paths:
      - 'research/nightfall/formalization/observability/ActualSourceQuadraticRectangles.lean'
      - '.github/workflows/nightfall-q2-source-rectangle-v436.yml'
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/ActualSourceQuadraticRectangles.lean'
      - '.github/workflows/nightfall-q2-source-rectangle-v436.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-rectangles:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile pinned source ANOVA dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ActualProductMergeTower ActualProductHilbertJensen ActualProductSoftNoise ActualSourceANOVA; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Strict original-source quadratic rectangle and background invariance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourceQuadraticRectangles
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceQuadraticRectangles.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.dependsOn_update_outside \
            --decl $N.sourceRectangle_zero_right \
            --decl $N.sourceRectangle_zero_left \
            --decl $N.sourceRectangle_sum \
            --decl $N.actual_quadratic_rectangle_eq_es_pair \
            --decl $N.pair_dependent_rectangle_base_independent \
            --decl $N.actual_quadratic_rectangle_base_independent \
            --json-out lean-receipts/q2-current-source-rectangles.json || {
              cat lean-receipts/q2-current-source-rectangles.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-current-source-rectangles.json
      - name: Source identity
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/ActualSourceQuadraticRectangles.lean > lean-receipts/SHA256SUMS.txt
          git rev-parse HEAD > lean-receipts/repo-commit.txt
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-current-source-rectangles
          path: lean-receipts/
          retention-days: 45
