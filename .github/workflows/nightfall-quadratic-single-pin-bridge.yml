name: NIGHTFALL quadratic cross-pin integration experiment (no headline promotion)
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/Quadratic*.lean'
      - 'research/nightfall/formalization/observability/ParityBlockCancellation.lean'
      - 'research/nightfall/formalization/observability/WeightedGreedy*.lean'
      - 'research/nightfall/formalization/observability/*Moment*.lean'
      - 'research/nightfall/formalization/product_space/QuadraticHoeffdingBridge.lean'
      - '.github/workflows/nightfall-quadratic-single-pin-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  combined-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install EXACT Turturean Lean 4.33 / Mathlib dependency
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          git clone https://github.com/physical-superintelligence/aaronson-ambainis.git /tmp/aa
          git -C /tmp/aa checkout 2a6ceaef872ae993708950f951989134084b851a
          (cd /tmp/aa && lake exe cache get)
      - name: Compile all quadratic matching and many-increment components under SAME 4.33 pin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts /tmp/aa/.lake/build/lib/lean
          for name in ParityBlockCancellation QuadraticMatchedParity QuadraticSwitchingIdentity QuadraticSingleReplacement QuadraticOscillationBound QuadraticRealizedRangeBudget WeightedGreedyMatching WeightedGreedyCover ArbitraryLawFourthMoment HilbertTwoIncrementMoment HilbertManyIncrementMoment QuadraticDiscoveryCore; do
            cp "research/nightfall/formalization/observability/$name.lean" "/tmp/aa/$name.lean"
            echo "::group::SAME PIN 4.33: $name"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean")
            echo "::endgroup::"
          done
      - name: Audit actual-range and many-increment declarations in the unified compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py research/nightfall/formalization/observability/QuadraticRealizedRangeBudget.lean \
            --workspace /tmp/aa --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl Nightfall.Observability.QuadraticSwitching.quadratic_actual_all_section_ranges_le_sixteen \
            --json-out lean-receipts/actual-range-unified-pin.json
          python3 scripts/lean_bridge.py research/nightfall/formalization/observability/HilbertManyIncrementMoment.lean \
            --workspace /tmp/aa --timeout 900 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl Nightfall.Observability.QuadraticHilbertMany.arbitrary_law_many_hilbert_fourth \
            --json-out lean-receipts/hilbert-many-unified-pin.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/actual-range-unified-pin.json lean-receipts/hilbert-many-unified-pin.json
      - name: Hash exact combined source and pin
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/{ParityBlockCancellation,QuadraticMatchedParity,QuadraticSwitchingIdentity,QuadraticSingleReplacement,QuadraticOscillationBound,QuadraticRealizedRangeBudget,WeightedGreedyMatching,WeightedGreedyCover,ArbitraryLawFourthMoment,HilbertTwoIncrementMoment,HilbertManyIncrementMoment,QuadraticDiscoveryCore}.lean > lean-receipts/sha256.txt
          git -C /tmp/aa rev-parse HEAD > lean-receipts/upstream-commit.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quadratic-single-pin-integration-receipts
          path: lean-receipts/
          retention-days: 45
          if-no-files-found: warn
