name: Lemnis nonabelian K33 exact graph certificate
on:
  push:
    branches:
      - research/lemnis-erdos64-port-obstruction-20261029
  pull_request:
    paths:
      - 'research/nightfall/projects/erdos/erdos64-lemnis-20261029/nonabelian_20261029/**'
      - '.github/workflows/verify-lemnis-nonabelian.yml'
  workflow_dispatch:
jobs:
  nonabelian_literal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct S3 and D8 full graphs, simple cycles C4 to C16, C12 and C32 words
        run: |
          python3 research/nightfall/projects/erdos/erdos64-lemnis-20261029/nonabelian_20261029/verify_literal_groups.py
