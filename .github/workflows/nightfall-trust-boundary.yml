name: NIGHTFALL evaluator trust boundary demo
on:
  push:
    paths:
      - 'research/nightfall/evaluations/assurance/trust-boundary/**'
      - '.github/workflows/nightfall-trust-boundary.yml'
  pull_request:
    paths:
      - 'research/nightfall/evaluations/assurance/trust-boundary/**'
      - '.github/workflows/nightfall-trust-boundary.yml'
  workflow_dispatch:
jobs:
  synthetic-proof-attack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.10','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python research/nightfall/evaluations/assurance/trust-boundary/verify_boundary.py