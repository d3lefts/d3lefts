name: NIGHTFALL v7 finite posterior kernel Lean budget
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/PosteriorRankBudget.lean'
      - '.github/workflows/nightfall-v7-posterior-budget.yml'
  push:
    branches: [main]
    paths:
      - 'research/nightfall/formalization/observability/PosteriorRankBudget.lean'
      - '.github/workflows/nightfall-v7-posterior-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v7-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile declarations and strict standard-axiom receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/PosteriorRankBudget.lean \
            --workspace /tmp/mathlib4 --timeout 480 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Observability.V7.potential_flow_identity \
            --decl Nightfall.Observability.V7.expected_kernel_drift \
            --decl Nightfall.Observability.V7.posterior_weighted_budget \
            --json-out lean-receipts/v7-posterior-budget.json || {
              cat lean-receipts/v7-posterior-budget.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/v7-posterior-budget.json
      - name: Save immutable source and compiler hashes
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/PosteriorRankBudget.lean > lean-receipts/SHA256SUMS
          echo leanprover/lean4:v4.36.0-rc2 > lean-receipts/lean-version.txt
          git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/mathlib-commit.txt 2>/dev/null || true
      - name: Upload compiler and axiom receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-posterior-budget-lean-receipts
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 45
