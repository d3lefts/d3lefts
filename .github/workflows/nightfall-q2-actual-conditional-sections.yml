name: NIGHTFALL Q2 actual distinct-neighbor conditional section bridge

on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/ActualESConditionalSection.lean'
      - 'research/nightfall/formalization/product_space/ActualESConditionalJensen.lean'
      - '.github/workflows/nightfall-q2-actual-conditional-sections.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-conditional-sections:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install exact pinned Lean 4.33 upstream Efron-Stein project
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.33.0
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          git clone https://github.com/physical-superintelligence/aaronson-ambainis.git /tmp/aa
          git -C /tmp/aa checkout 2a6ceaef872ae993708950f951989134084b851a
          (cd /tmp/aa && lake exe cache get)
          (cd /tmp/aa && lake build AaronsonAmbainis.DetTheorem AaronsonAmbainis.TwoSided.Antipodal \
             AaronsonAmbainis.Bridge.Positivity AaronsonAmbainis.Row.Main \
             AaronsonAmbainis.Pack.Main AaronsonAmbainis.Dual.Main \
             AaronsonAmbainis.Level.Integral AaronsonAmbainis.TwoSided.CauchySchwarz)
      - name: Build Efron-Stein source dependencies
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space
          mkdir -p /tmp/aa/.lake/build/lib/lean
          for module in ProductSpaceTwoSidedBridge ProductRowBound ProductInfluence EfronSteinDegree; do
            cp "$P/$module.lean" "/tmp/aa/$module.lean"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$module.olean" "$module.lean")
          done
      - name: Strict check exact source conditional expectation and Jensen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualESConditionalSection
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/ActualESConditionalSection.lean \
            --workspace /tmp/aa --timeout 1200 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.merge_update_free \
            --decl $N.merge_insert_update_free \
            --decl $N.average_source_section_eq_condExp_difference \
            --decl $N.finite_weighted_jensen_square \
            --decl $N.actual_condExp_jensen_square \
            --decl $N.actual_section_conditional_jensen_square \
            --json-out lean-receipts/actual-conditional-sections.json || {
              cat lean-receipts/actual-conditional-sections.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/actual-conditional-sections.json
      - name: Strict Hilbert norm Jensen on actual source neighbor sections
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space
          cp "$P/ActualESConditionalSection.lean" /tmp/aa/ActualESConditionalSection.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/ActualESConditionalSection.olean ActualESConditionalSection.lean)
          N=Nightfall.Observability.ActualESConditionalJensen
          python3 scripts/lean_bridge.py \
            "$P/ActualESConditionalJensen.lean" \
            --workspace /tmp/aa --timeout 1200 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.weighted_dot_le_norm_mul \
            --decl $N.weighted_hilbert_jensen \
            --decl $N.actual_source_section_hilbert_jensen \
            --json-out lean-receipts/actual-hilbert-jensen.json || {
              cat lean-receipts/actual-hilbert-jensen.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/actual-hilbert-jensen.json
      - name: Record immutable source and pin
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/product_space/{ActualESConditionalSection,ActualESConditionalJensen}.lean > lean-receipts/SHA256SUMS
          echo leanprover/lean4:v4.33.0 > lean-receipts/lean-toolchain.txt
          echo 2a6ceaef872ae993708950f951989134084b851a > lean-receipts/upstream.txt
          git rev-parse HEAD > lean-receipts/repository-commit.txt
      - name: Upload strict receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-actual-conditional-section-bridge-receipts
          path: lean-receipts/
          retention-days: 45
