name: NIGHTFALL exact local-moment risk transfer named Lean

on:
  pull_request:
    paths:
      - "research/nightfall/formalization/structural_information/LocalMomentRisk.lean"
      - ".github/workflows/nightfall-local-moment-risk-lean.yml"
      - "docs/lean-pending-source-custody.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-dimensional-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile exact risk theorem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/route1-local-moment
          src="research/nightfall/formalization/structural_information/LocalMomentRisk.lean"
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom|constant)\b' "$src"
          cp "$src" /tmp/mathlib4/LocalMomentRisk.lean
          (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/LocalMomentRisk.olean" LocalMomentRisk.lean) 2>&1 | tee receipts/route1-local-moment/LocalMomentRisk.log
          ! grep -E '(^|:)error:|declaration uses .sorry' receipts/route1-local-moment/LocalMomentRisk.log
      - name: Kernel-level named theorem and axiom gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path("research/nightfall/formalization/structural_information/LocalMomentRisk.lean").read_text()
          log=Path("receipts/route1-local-moment/LocalMomentRisk.log").read_text()
          names=["dependsOn_mul","expectation_sum","expectation_sub_sq",
                 "square_sum_of_disjoint","leafValue_sq","exact_squared_risk_transfer"]
          assert "def LocalMomentAgreement" in source
          assert "structure LeafSystem" in source
          assert "max (2*d) (d+q) ≤ k" in source
          for suffix in names:
              name="Nightfall.LocalMomentRisk."+suffix
              m=re.search(r"'" + re.escape(name) + r"' depends on axioms:\s*\[([^\]]*)\]",log,re.S)
              if m: axioms={a.strip() for a in m[1].split(",") if a.strip()}
              else:
                  assert f"'{name}' does not depend on any axioms" in log, name
                  axioms=set()
              assert axioms<= {"propext","Classical.choice","Quot.sound"},(name,axioms)
          assert "sorryAx" not in log
          assert "theorem Nightfall.LocalMomentRisk.exact_squared_risk_transfer" in log
          print("PASS named all-n exact moment risk transfer; ONLY functional local agreement + leaf indicators.")
          print("UNPROVED: equivalence of atomwise marginal equality to functional local agreement and recursive tree→leaf decomposition; full iff theorem remains open.")
          PY
      - name: Immutable exact-head receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/route1-local-moment
          git rev-parse HEAD > receipts/route1-local-moment/commit.txt
          cat lean-toolchain > receipts/route1-local-moment/toolchain.txt
          git -C /tmp/mathlib4 rev-parse HEAD > receipts/route1-local-moment/mathlib.txt
          sha256sum research/nightfall/formalization/structural_information/LocalMomentRisk.lean > receipts/route1-local-moment/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: route1-local-moment-risk-${{ github.run_id }}
          path: receipts/route1-local-moment
          retention-days: 90
