name: NIGHTFALL Q2 exact original finite-label atom heat-bath weights
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2LabelAtomMass.lean'
      - '.github/workflows/nightfall-q2-label-atom-mass.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-label-atom-mass-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  exact-original-label-mass:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile exact source label-mass and original heat-bath
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2Density InfinitePiQ2InfluenceStability InfinitePiQ2OriginalIndependence InfinitePiQ2ConditionalSourceTest InfinitePiQ2FiniteRankConditional InfinitePiQ2OriginalLabelTransport InfinitePiQ2OriginalHeatBath InfinitePiQ2FrozenLabelMeasurable InfinitePiQ2ActiveFiniteLabelCondExp InfinitePiQ2LabelAtomMass; do
            cp "research/nightfall/formalization/universal/${name}.lean" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Strict named source atom and heat-bath axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-label-mass
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2LabelAtomMass.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2LabelAtomMass.source_label_indicator_integral_eq_atom \
            --decl Nightfall.InfinitePiQ2LabelAtomMass.source_condExp_lifted_label_atom_sum \
            --decl Nightfall.InfinitePiQ2LabelAtomMass.sourceOtherProjection_lifted_label_atom_sum_ae \
            --json-out lean-receipts/q2-label-mass/atom-weights.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-label-mass/atom-weights.json
      - name: Preserve source identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-label-mass
          git rev-parse HEAD > lean-receipts/q2-label-mass/HEAD
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2LabelAtomMass.lean > lean-receipts/q2-label-mass/SOURCE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-label-mass-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-label-mass
          if-no-files-found: warn
