name: NIGHTFALL scalar PSI falsifier and source-noise rational replay

on:
  push:
    branches: [nightfall-psi-falsifier-source-noise-20261117]
    paths:
      - 'research/nightfall/2026-11-certificate-engine/**'
      - '.github/workflows/nightfall-psi-source-noise-exact.yml'
  pull_request:
    paths:
      - 'research/nightfall/2026-11-certificate-engine/**'
      - '.github/workflows/nightfall-psi-source-noise-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exact checker provenance
        run: sha256sum research/nightfall/2026-11-certificate-engine/checks/check_source_noise_psi_exact.py
      - name: Counterexample and genuine original-law residual audit
        run: python3 -I research/nightfall/2026-11-certificate-engine/checks/check_source_noise_psi_exact.py
