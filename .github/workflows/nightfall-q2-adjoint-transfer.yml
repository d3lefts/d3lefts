name: NIGHTFALL Q2 Hilbert adjoint source influence transfer Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2AdjointTransfer.lean'
      - '.github/workflows/nightfall-q2-adjoint-transfer.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-adjoint-transfer-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  adjoint-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned Lean and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile adjoint source
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/universal/InfinitePiQ2AdjointTransfer.lean /tmp/mathlib4/InfinitePiQ2AdjointTransfer.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/InfinitePiQ2AdjointTransfer.olean InfinitePiQ2AdjointTransfer.lean)
      - name: Strict named standard-axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-infinite
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2AdjointTransfer.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2AdjointTransfer.isometryAdjoint_contract \
            --decl Nightfall.InfinitePiQ2AdjointTransfer.isometryAdjoint_intertwines \
            --decl Nightfall.InfinitePiQ2AdjointTransfer.isometryAdjoint_residual \
            --decl Nightfall.InfinitePiQ2AdjointTransfer.isometryAdjoint_residual_norm_le \
            --decl Nightfall.InfinitePiQ2AdjointTransfer.isometryAdjoint_triple_zero \
            --json-out lean-receipts/q2-infinite/adjoint-transfer.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-infinite/adjoint-transfer.json
      - name: Exact source custody
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-infinite
          git rev-parse HEAD > lean-receipts/q2-infinite/adjoint-head.txt
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2AdjointTransfer.lean > lean-receipts/q2-infinite/adjoint-sha256.txt
      - name: Upload source receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-adjoint-transfer-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-infinite
          if-no-files-found: warn
