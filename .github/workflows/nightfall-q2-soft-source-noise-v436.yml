name: NIGHTFALL Q2 original-source soft noise Lean 4.36
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/ActualProductSoftNoise.lean'
      - '.github/workflows/nightfall-q2-soft-source-noise-v436.yml'
      - 'research/nightfall/formalization/observability/ActualProductMergeTower.lean'
      - 'research/nightfall/formalization/observability/ActualProductHilbertJensen.lean'
  push:
    branches:
      - nightfall-q2-soft-source-noise-lean-v436-20261113
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-original-source-noise:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile source-identical genuine source tower and Hilbert Jensen
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/ActualProductMergeTower.lean" .
          cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/ActualProductHilbertJensen.lean" .
          lake env lean -o .lake/build/lib/lean/ActualProductMergeTower.olean ActualProductMergeTower.lean
          lake env lean -o .lake/build/lib/lean/ActualProductHilbertJensen.olean ActualProductHilbertJensen.lean
      - name: Strict kernel compilation and scoped axiom audit of soft original-source operator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualProductSoftNoise
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualProductSoftNoise.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.actual_source_conditional_mixture_L1 \
            --decl $N.maskWeight_nonneg \
            --decl $N.maskWeight_total_one \
            --decl $N.actual_soft_source_noise_L1 \
            --decl $N.actual_source_conditional_stationary \
            --decl $N.actual_source_conditional_mixture_stationary \
            --decl $N.actual_soft_source_noise_stationary \
            --json-out lean-receipts/q2-soft-source-noise.json || {
              cat lean-receipts/q2-soft-source-noise.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-soft-source-noise.json
      - name: Exact source and pin receipt
        if: always()
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          sha256sum \
            research/nightfall/formalization/observability/ActualProductMergeTower.lean \
            research/nightfall/formalization/observability/ActualProductHilbertJensen.lean \
            research/nightfall/formalization/observability/ActualProductSoftNoise.lean \
            > lean-receipts/SHA256SUMS.txt
          git rev-parse HEAD > lean-receipts/repo-commit.txt
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
          git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/mathlib-commit.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-original-source-soft-noise-v436
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 45
