name: NIGHTFALL universal Lean checkpoint controls
on:
  pull_request:
    paths:
      - 'scripts/lean_checkpoint.py'
      - 'scripts/test_lean_checkpoint.py'
      - 'docs/lean-certification-protocol.md'
      - '.github/workflows/nightfall-lean-checkpoint-controls.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lean_checkpoint.py'
      - 'scripts/test_lean_checkpoint.py'
      - 'docs/lean-certification-protocol.md'
      - '.github/workflows/nightfall-lean-checkpoint-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise resource, cache identity and evidence gates without compiling research
        run: python3 scripts/test_lean_checkpoint.py
