name: NIGHTFALL Q2 genuine per-site finite-label factorization Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2FiniteTestSiteLabels.lean'
      - 'research/nightfall/formalization/universal/InfinitePiQ2FiniteBooleanTestFactor.lean'
      - '.github/workflows/nightfall-q2-finite-test-site-labels.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-test-site-labels-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  real-original-source-finite-coordinate-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Lean and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile complete native dependency closure with SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.nightfall_q2_certify import local_sources, closure, sha256, ROOT
          from pathlib import Path
          import shutil, subprocess, json
          files = local_sources()
          ws = Path("/tmp/mathlib4")
          out = ws / ".lake/build/lib/lean"
          out.mkdir(parents=True, exist_ok=True)
          receipt = Path("lean-receipts/q2-finite-test-site-labels")
          receipt.mkdir(parents=True, exist_ok=True)
          manifest = []
          for name in closure("InfinitePiQ2FiniteTestSiteLabels", files):
              src = files[name]
              dst = ws / (name + ".lean")
              shutil.copyfile(src, dst)
              assert sha256(src) == sha256(dst)
              print("SOURCE-EXACT", name, flush=True)
              subprocess.run(["lake", "env", "lean", "-o", str(out / (name + ".olean")), name + ".lean"],
                             cwd=ws, check=True, timeout=1200)
              manifest.append({"path": str(src.relative_to(ROOT)), "sha256": sha256(src)})
          (receipt / "sources.json").write_text(json.dumps(manifest, indent=2)+"\n")
          PY
      - name: Strict source law and standard-axiom gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2FiniteTestSiteLabels.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2FiniteTestSiteLabels.siteTestLabel_finite \
            --decl Nightfall.InfinitePiQ2FiniteTestSiteLabels.siteTestLabel_measurable \
            --decl Nightfall.InfinitePiQ2FiniteTestSiteLabels.evalTests_eq_sourceLabelMap \
            --decl Nightfall.InfinitePiQ2FiniteTestSiteLabels.sourceFiniteCellAlgebra_factors_through_site_labels \
            --json-out lean-receipts/q2-finite-test-site-labels/strict.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-finite-test-site-labels/strict.json
      - name: Source hash
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-finite-test-site-labels
          git rev-parse HEAD > lean-receipts/q2-finite-test-site-labels/HEAD
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2FiniteTestSiteLabels.lean > lean-receipts/q2-finite-test-site-labels/SOURCE_SHA256
      - name: Upload source-bound receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-finite-test-site-labels-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-finite-test-site-labels
          if-no-files-found: warn
