name: NIGHTFALL product-space - localized weight removal
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/LocalizedWeightRemoval.lean'
      - '.github/workflows/nightfall-localized-weight-removal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  localized-weight-removal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.35.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Prepare mathlib v4.35.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v4.35.0 https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4
          (cd /tmp/mathlib4 && lake exe cache get)
      - name: Compile and emit axiom receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/LocalizedWeightRemoval.lean \
            --workspace /tmp/mathlib4 \
            --timeout 600 \
            --decl Nightfall.ProductSpace.le_of_forall_reg \
            --decl Nightfall.ProductSpace.localized_weight_optimization \
            --decl Nightfall.ProductSpace.cs_reciprocal \
            --decl Nightfall.ProductSpace.cs_reciprocal₂ \
            --decl Nightfall.ProductSpace.localized_weight_removal \
            --decl Nightfall.ProductSpace.sum_load_eq \
            --decl Nightfall.ProductSpace.weight_removal_max \
            --json-out lean-receipts/localized-weight-removal.json
      - name: Audit only standard Lean axioms
        run: |
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/localized-weight-removal.json
      - name: Upload immutable receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localized-weight-removal-receipt
          path: lean-receipts/*.json
          if-no-files-found: warn
          retention-days: 30
