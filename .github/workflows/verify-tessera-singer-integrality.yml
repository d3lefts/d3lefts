name: Verify Tessera Singer repair integrality examples
on:
  pull_request:
    paths:
      - "research/nightfall/projects/erdos/tessera-singer-hypergraph-gap-20261029/**"
      - ".github/workflows/verify-tessera-singer-integrality.yml"
  push:
    paths:
      - "research/nightfall/projects/erdos/tessera-singer-hypergraph-gap-20261029/**"
      - ".github/workflows/verify-tessera-singer-integrality.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify modular difference sets and exhaustive packing/cover gap
        run: python3 research/nightfall/projects/erdos/tessera-singer-hypergraph-gap-20261029/verify_integrality.py

      - name: Verify q25 full Singer subfield triangle and determinant-two obstruction
        run: python3 research/nightfall/projects/erdos/tessera-singer-hypergraph-gap-20261029/verify_q25_subfield.py
