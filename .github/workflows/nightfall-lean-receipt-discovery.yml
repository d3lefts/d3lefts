name: NIGHTFALL Lean receipt discovery (candidate-only)
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: UTC days to scan (1–366)
        required: false
        default: '7'
permissions:
  contents: read
  actions: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Discover unregistered job-level leads without certification
        env:
          GH_TOKEN: ${{ github.token }}
          SCAN_DAYS: ${{ inputs.days || '7' }}
        run: python3 scripts/discover_lean_receipt_candidates.py --days "$SCAN_DAYS" --output passport-receipts/candidates.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: lean-receipt-candidates
          path: passport-receipts/candidates.json
          if-no-files-found: warn
          retention-days: 90
