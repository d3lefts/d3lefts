name: NIGHTFALL frozen finite-label section source measurability
on:
  pull_request:
    branches: [nightfall-q2-finite-rank-source-tensors-20261117, main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2FrozenLabelMeasurable.lean'
      - '.github/workflows/nightfall-q2-frozen-label-measurable.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  label-factor-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile original source dependencies and frozen-label factor
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2Density InfinitePiQ2InfluenceStability InfinitePiQ2OriginalIndependence InfinitePiQ2ConditionalSourceTest InfinitePiQ2FiniteRankConditional InfinitePiQ2OriginalLabelTransport InfinitePiQ2OriginalHeatBath InfinitePiQ2FrozenLabelMeasurable; do
            src="research/nightfall/formalization/universal/${name}.lean"
            test -f "$src"
            cp "$src" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Strict named theorem and axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-frozen-label
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2FrozenLabelMeasurable.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2FrozenLabelMeasurable.source_other_coordinate_measurable \
            --decl Nightfall.InfinitePiQ2FrozenLabelMeasurable.source_frozen_label_word_measurable \
            --decl Nightfall.InfinitePiQ2FrozenLabelMeasurable.source_frozen_label_factor_stronglyMeasurable \
            --json-out lean-receipts/q2-frozen-label/frozen-label.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-frozen-label/frozen-label.json
      - name: Source and compiler identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-frozen-label
          git rev-parse HEAD > lean-receipts/q2-frozen-label/HEAD
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2FrozenLabelMeasurable.lean > lean-receipts/q2-frozen-label/SOURCE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-frozen-label-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-frozen-label
          if-no-files-found: warn
