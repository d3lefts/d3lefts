name: NIGHTFALL cubic rank-one terminal Lean 4.36.0-rc2 (scoped)
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/CubicRankOneTerminal.lean'
      - 'research/nightfall/formalization/observability/RankOneLeafMoment.lean'
      - '.github/workflows/nightfall-cubic-terminal-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rank-one-terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Strict kernel proof and standard-axiom receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/CubicRankOneTerminal.lean \
            --workspace /tmp/mathlib4 --timeout 480 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Observability.CubicRankOneTerminal.mean_energy_le_sqrt_mul_l1 \
            --decl Nightfall.Observability.CubicRankOneTerminal.mean_energy_le_budget \
            --decl Nightfall.Observability.CubicRankOneTerminal.rank_one_cubic_five_transfer \
            --json-out lean-receipts/cubic-terminal.json || {
              cat lean-receipts/cubic-terminal.json || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/cubic-terminal.json
      - name: Compile exact finite independent-leaf prerequisite and check named theorem
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/observability/{ArbitraryLawFourthMoment,HilbertTwoIncrementMoment,HilbertManyIncrementMoment}.lean /tmp/mathlib4/
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/ArbitraryLawFourthMoment.olean ArbitraryLawFourthMoment.lean)
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/HilbertTwoIncrementMoment.olean HilbertTwoIncrementMoment.lean)
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/HilbertManyIncrementMoment.olean HilbertManyIncrementMoment.lean)
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/RankOneLeafMoment.lean \
            --workspace /tmp/mathlib4 --timeout 480 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Observability.RankOneLeafMoment.rank_one_leaf_second_moment \
            --json-out lean-receipts/rank-one-leaf-moment.json || {
              cat lean-receipts/rank-one-leaf-moment.json || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/rank-one-leaf-moment.json
      - name: Pin source
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/{CubicRankOneTerminal,RankOneLeafMoment}.lean > lean-receipts/SHA256SUMS
          echo leanprover/lean4:v4.36.0-rc2 > lean-receipts/lean-toolchain.txt
          git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/mathlib-sha.txt 2>/dev/null || true
          git rev-parse HEAD > lean-receipts/repository-commit.txt
      - name: Archive receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-cubic-rank-one-terminal
          path: lean-receipts/
          retention-days: 45
