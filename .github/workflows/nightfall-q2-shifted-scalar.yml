name: NIGHTFALL Q2 shifted-owner scalar Lean certificate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/q2_shifted/**'
      - 'research/nightfall/formalization/observability/ShiftedC4Bernstein.lean'
      - 'research/nightfall/formalization/observability/ShiftedC4Scalar.lean'
      - 'research/nightfall/2026-11-quadratic-law-free-audit/check_shifted_owner_moment_107.py'
      - '.github/workflows/nightfall-q2-shifted-scalar.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightfall-q2-shifted-scalar-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  shifted-scalar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Independent exact rational c/4 interpolation checker
        run: |
          set -euo pipefail
          python3 research/nightfall/2026-11-quadratic-law-free-audit/check_shifted_owner_moment_107.py
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Strict pinned Lean compilation and named declaration audit
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/q2_shifted/Q2ShiftedScalar.lean
          cp "$SRC" /tmp/mathlib4/Q2ShiftedScalar.lean
          mkdir -p /tmp/mathlib4/.lake/build/lib/lean lean-receipts/q2-shifted
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Q2ShiftedScalar.olean Q2ShiftedScalar.lean)
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Q2Shifted.shifted_interpolation_third \
            --decl Nightfall.Q2Shifted.shifted_fourth_moment_scalar \
            --json-out lean-receipts/q2-shifted/scalar.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-shifted/scalar.json
      - name: Strict exact Bernstein c/4 and shifted moment scalar declarations
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          OUT=lean-receipts/q2-shifted/c4
          mkdir -p "$OUT"
          for name in ShiftedC4Bernstein ShiftedC4Scalar; do
            cp "$SRC/$name.lean" "/tmp/mathlib4/$name.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean")
          done
          python3 scripts/lean_bridge.py "$SRC/ShiftedC4Bernstein.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.ShiftedC4Bernstein.shifted_c4_F_nonneg \
            --json-out "$OUT/bernstein.json"
          python3 scripts/lean_bridge.py "$SRC/ShiftedC4Scalar.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.ShiftedC4Scalar.shifted_c4_from_strong_moments \
            --json-out "$OUT/moments.json"
          python3 research/nightfall/formalization/product_space/check_receipts.py "$OUT/bernstein.json" "$OUT/moments.json"

      - name: Strict c/5 sufficient-moment bridge and Jensen-aware obstruction
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/q2_shifted/ShiftedC5MomentBridge.lean
          cp "$SRC" /tmp/mathlib4/ShiftedC5MomentBridge.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/ShiftedC5MomentBridge.olean ShiftedC5MomentBridge.lean)
          N=Nightfall.Q2Shifted.C5MomentBridge
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.beta_lt_fifth \
            --decl $N.first_second_sos \
            --decl $N.c5_from_first_second_comparison \
            --decl $N.universal_fifth_from_first_second_comparison \
            --decl $N.rational_pseudo_jensen_holder_fourth \
            --decl $N.rational_pseudo_violates_c5 \
            --json-out lean-receipts/q2-shifted/c5-moment-bridge.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-shifted/c5-moment-bridge.json
      - name: Source/commit manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-shifted
          sha256sum research/nightfall/formalization/q2_shifted/Q2ShiftedScalar.lean \
            research/nightfall/2026-11-quadratic-law-free-audit/check_shifted_owner_moment_107.py \
            research/nightfall/formalization/q2_shifted/ShiftedC5MomentBridge.lean \
            research/nightfall/formalization/observability/ShiftedC4Bernstein.lean \
            research/nightfall/formalization/observability/ShiftedC4Scalar.lean \
            > lean-receipts/q2-shifted/SHA256SUMS
          git rev-parse HEAD > lean-receipts/q2-shifted/commit.txt
          echo leanprover/lean4:v4.36.0-rc2 > lean-receipts/q2-shifted/lean-toolchain.txt
      - name: Preserve scoped receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-q2-shifted-scalar-lean-receipts
          path: lean-receipts/q2-shifted/
          retention-days: 45
