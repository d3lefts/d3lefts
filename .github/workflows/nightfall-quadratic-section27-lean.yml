name: NIGHTFALL quadratic Section 2.7 same-pin Lean gate (scoped, not E2E)
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/ProductSpaceTwoSidedBridge.lean'
      - 'research/nightfall/formalization/product_space/ProductRowBound.lean'
      - 'research/nightfall/formalization/product_space/ProductInfluence.lean'
      - 'research/nightfall/formalization/product_space/EfronSteinDegree.lean'
      - 'research/nightfall/formalization/product_space/QuadraticHoeffdingBridge.lean'
      - 'research/nightfall/formalization/observability/ParityBlockCancellation.lean'
      - 'research/nightfall/formalization/observability/QuadraticMatchedParity.lean'
      - 'research/nightfall/formalization/observability/QuadraticSwitchingIdentity.lean'
      - 'research/nightfall/formalization/observability/QuadraticSingleReplacement.lean'
      - 'research/nightfall/formalization/observability/QuadraticOscillationBound.lean'
      - 'research/nightfall/formalization/observability/QuadraticRealizedRangeBudget.lean'
      - 'research/nightfall/formalization/observability/ArbitraryLawFourthMoment.lean'
      - 'research/nightfall/formalization/observability/HilbertTwoIncrementMoment.lean'
      - 'research/nightfall/formalization/observability/HilbertManyIncrementMoment.lean'
      - 'research/nightfall/formalization/observability/WeightedGreedyMatching.lean'
      - 'research/nightfall/formalization/observability/WeightedGreedyCover.lean'
      - 'research/nightfall/formalization/observability/QuadraticUnifiedFinite.lean'
      - 'scripts/lean_bridge.py'
      - 'research/nightfall/formalization/product_space/check_receipts.py'
      - '.github/workflows/nightfall-quadratic-section27-lean.yml'
  push:
    branches: [main]
    paths:
      - 'research/nightfall/formalization/product_space/ProductSpaceTwoSidedBridge.lean'
      - 'research/nightfall/formalization/product_space/ProductRowBound.lean'
      - 'research/nightfall/formalization/product_space/ProductInfluence.lean'
      - 'research/nightfall/formalization/product_space/EfronSteinDegree.lean'
      - 'research/nightfall/formalization/product_space/QuadraticHoeffdingBridge.lean'
      - 'research/nightfall/formalization/observability/ParityBlockCancellation.lean'
      - 'research/nightfall/formalization/observability/QuadraticMatchedParity.lean'
      - 'research/nightfall/formalization/observability/QuadraticSwitchingIdentity.lean'
      - 'research/nightfall/formalization/observability/QuadraticSingleReplacement.lean'
      - 'research/nightfall/formalization/observability/QuadraticOscillationBound.lean'
      - 'research/nightfall/formalization/observability/QuadraticRealizedRangeBudget.lean'
      - 'research/nightfall/formalization/observability/ArbitraryLawFourthMoment.lean'
      - 'research/nightfall/formalization/observability/HilbertTwoIncrementMoment.lean'
      - 'research/nightfall/formalization/observability/HilbertManyIncrementMoment.lean'
      - 'research/nightfall/formalization/observability/WeightedGreedyMatching.lean'
      - 'research/nightfall/formalization/observability/WeightedGreedyCover.lean'
      - 'research/nightfall/formalization/observability/QuadraticUnifiedFinite.lean'
      - 'scripts/lean_bridge.py'
      - 'research/nightfall/formalization/product_space/check_receipts.py'
      - '.github/workflows/nightfall-quadratic-section27-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-section27-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Turturean Lean 4.33 project
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.33.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
          git clone https://github.com/physical-superintelligence/aaronson-ambainis.git /tmp/aa
          git -C /tmp/aa checkout 2a6ceaef872ae993708950f951989134084b851a
          test "$(git -C /tmp/aa rev-parse HEAD)" = 2a6ceaef872ae993708950f951989134084b851a
      - name: Restore compiled dependencies for immutable Turturean pin
        id: aa-deps-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/aa/.lake
          key: ${{ runner.os }}-nightfall-aa-lean4330-2a6ceaef872ae993708950f951989134084b851a-deps-v1
      - name: Build upstream dependencies only on cache miss
        if: steps.aa-deps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/aa && lake exe cache get)
          (cd /tmp/aa && lake build AaronsonAmbainis.DetTheorem AaronsonAmbainis.TwoSided.Antipodal AaronsonAmbainis.Bridge.Positivity AaronsonAmbainis.Row.Main AaronsonAmbainis.Pack.Main AaronsonAmbainis.Dual.Main AaronsonAmbainis.Level.Integral AaronsonAmbainis.TwoSided.CauchySchwarz)
      - name: Save compiled dependency cache before proof checks
        if: steps.aa-deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/aa/.lake
          key: ${{ runner.os }}-nightfall-aa-lean4330-2a6ceaef872ae993708950f951989134084b851a-deps-v1
      - name: Verify cached Lean project and pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C /tmp/aa rev-parse HEAD)" = 2a6ceaef872ae993708950f951989134084b851a
          test -f /tmp/aa/.lake/build/lib/lean/AaronsonAmbainis/DetTheorem.olean
      - name: Compile genuine source-function and supporting components in one project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/aa/.lake/build/lib/lean
          for name in ProductSpaceTwoSidedBridge ProductRowBound ProductInfluence EfronSteinDegree QuadraticHoeffdingBridge; do
            cp "research/nightfall/formalization/product_space/$name.lean" "/tmp/aa/$name.lean"
          done
          for name in ParityBlockCancellation QuadraticMatchedParity QuadraticSwitchingIdentity QuadraticSingleReplacement QuadraticOscillationBound QuadraticRealizedRangeBudget ArbitraryLawFourthMoment HilbertTwoIncrementMoment HilbertManyIncrementMoment WeightedGreedyMatching WeightedGreedyCover QuadraticUnifiedFinite; do
            cp "research/nightfall/formalization/observability/$name.lean" "/tmp/aa/$name.lean"
          done
          for name in ProductSpaceTwoSidedBridge ProductRowBound ProductInfluence EfronSteinDegree QuadraticHoeffdingBridge ParityBlockCancellation QuadraticMatchedParity QuadraticSwitchingIdentity QuadraticSingleReplacement QuadraticOscillationBound QuadraticRealizedRangeBudget ArbitraryLawFourthMoment HilbertTwoIncrementMoment HilbertManyIncrementMoment WeightedGreedyMatching WeightedGreedyCover QuadraticUnifiedFinite; do
            echo "::group::Compiling $name under Lean 4.33"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean")
            echo "::endgroup::"
          done
      - name: Strict actual theorem and axioms audit, no assumed source certificates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py research/nightfall/formalization/product_space/QuadraticHoeffdingBridge.lean --workspace /tmp/aa --timeout 900 --strict --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound --decl Nightfall.Observability.QuadraticANOVA.quadratic_hoeffding_decomposition --json-out lean-receipts/actual-anova.json
          python3 scripts/lean_bridge.py research/nightfall/formalization/observability/QuadraticMatchedParity.lean --workspace /tmp/aa --timeout 900 --strict --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound --decl Nightfall.Observability.QuadraticMatching.full_matched_rectangles_le_four --json-out lean-receipts/matched-parity.json
          python3 scripts/lean_bridge.py research/nightfall/formalization/observability/QuadraticRealizedRangeBudget.lean --workspace /tmp/aa --timeout 900 --strict --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound --decl Nightfall.Observability.QuadraticSwitching.quadratic_actual_all_section_ranges_le_sixteen --json-out lean-receipts/section-ranges.json
          python3 scripts/lean_bridge.py research/nightfall/formalization/observability/HilbertManyIncrementMoment.lean --workspace /tmp/aa --timeout 900 --strict --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound --decl Nightfall.Observability.QuadraticHilbertMany.arbitrary_law_many_hilbert_fourth --json-out lean-receipts/fourth-moment.json
          python3 scripts/lean_bridge.py research/nightfall/formalization/observability/QuadraticUnifiedFinite.lean --workspace /tmp/aa --timeout 900 --strict --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound --decl Nightfall.Observability.QuadraticUnifiedFinite.actual_degree_two_baseline_and_all_sections --json-out lean-receipts/actual-function-baseline.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/*.json
      - name: Record exact commit, pins, sources and MISSING ENDPOINT status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          git rev-parse HEAD > lean-receipts/commit.txt
          git -C /tmp/aa rev-parse HEAD > lean-receipts/upstream-pin.txt || true
          sha256sum research/nightfall/formalization/observability/{ParityBlockCancellation,QuadraticMatchedParity,QuadraticSwitchingIdentity,QuadraticSingleReplacement,QuadraticOscillationBound,QuadraticRealizedRangeBudget,ArbitraryLawFourthMoment,HilbertTwoIncrementMoment,HilbertManyIncrementMoment,QuadraticUnifiedFinite}.lean research/nightfall/formalization/product_space/{ProductInfluence,EfronSteinDegree,QuadraticHoeffdingBridge}.lean > lean-receipts/SHA256SUMS
          cat > lean-receipts/SCOPE.txt <<'EOF'
          THESE ARE SCOPED VERIFIED DECLARATIONS, NOT THE FINAL QUADRATIC THEOREM.
          Missing: actual source-function global matching construction, ownership,
          section Hilbert budget, ANOVA-to-increment interface, and final
          source-function V^2 <= C2 B^2 max_i I_i implication.
          A green workflow never implies the headline theorem is kernel certified.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quadratic-section27-scope-and-kernel-receipts
          path: lean-receipts/
          retention-days: 60
          if-no-files-found: warn
