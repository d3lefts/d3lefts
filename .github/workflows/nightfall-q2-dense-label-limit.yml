name: NIGHTFALL Q2 genuine original-product dense finite-label L2 limit
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2DenseLabelLimit.lean'
      - '.github/workflows/nightfall-q2-dense-label-limit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-original-dense-label-limit-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  true-original-product-finite-label-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned original Lean and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile source-product L2 density and generalized limit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from scripts.nightfall_q2_certify import local_sources, closure, sha256, ROOT
          from pathlib import Path
          import shutil,subprocess,json
          files=local_sources()
          ws=Path("/tmp/mathlib4")
          out=ws/".lake/build/lib/lean"
          out.mkdir(parents=True,exist_ok=True)
          receipts=Path("lean-receipts/q2-dense-label-limit")
          receipts.mkdir(parents=True,exist_ok=True)
          provenance=[]
          for name in closure("InfinitePiQ2DenseLabelLimit",files):
              src=files[name]
              dst=ws/(name+".lean")
              shutil.copyfile(src,dst)
              assert sha256(src)==sha256(dst)
              print("BUILD SOURCE",name,flush=True)
              subprocess.run(["lake","env","lean","-o",str(out/(name+".olean")),name+".lean"],cwd=ws,check=True,timeout=1200)
              provenance.append({"path":str(src.relative_to(ROOT)),"sha256":sha256(src)})
          (receipts/"sources.json").write_text(json.dumps(provenance,indent=2)+"\n")
          PY
      - name: Strict named finite-label L2 limit and standard axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2DenseLabelLimit.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2DenseLabelLimit.source_q2_bound_of_mean_preserving_closure \
            --decl Nightfall.InfinitePiQ2DenseLabelLimit.source_q2_bound_of_approximate_finite_labels \
            --json-out lean-receipts/q2-dense-label-limit/strict.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-dense-label-limit/strict.json
      - name: Record immutable source provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-dense-label-limit
          git rev-parse HEAD > lean-receipts/q2-dense-label-limit/HEAD
          cat lean-toolchain > lean-receipts/q2-dense-label-limit/TOOLCHAIN
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2DenseLabelLimit.lean > lean-receipts/q2-dense-label-limit/SOURCE_SHA256
      - name: Upload original source kernel receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-original-dense-label-limit-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-dense-label-limit
          if-no-files-found: warn
