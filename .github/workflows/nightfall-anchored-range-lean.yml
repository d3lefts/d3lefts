name: NIGHTFALL Q3 anchored original-law range Lean (NOT full Khintchine)
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/AnchoredRangeBudget.lean'
      - '.github/workflows/nightfall-anchored-range-lean.yml'
  push:
    branches: [nightfall-anchored-multipartite-e2-20261117]
    paths:
      - 'research/nightfall/formalization/observability/AnchoredRangeBudget.lean'
      - '.github/workflows/nightfall-anchored-range-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  anchored-range-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Strict named Lean source-law range and Popoviciu proofs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/AnchoredRangeBudget.lean \
            --workspace /tmp/mathlib4 --timeout 480 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.CubicQ3.AnchoredRange.weighted_popoviciu_centered \
            --decl Nightfall.CubicQ3.AnchoredRange.anchored_endpoint_range_budget \
            --decl Nightfall.CubicQ3.AnchoredRange.anchored_original_law_l2_budget \
            --json-out lean-receipts/q3-anchor-range.json || {
              cat lean-receipts/q3-anchor-range.json || true
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q3-anchor-range.json
      - name: Pin actual source and compiler versions
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/AnchoredRangeBudget.lean > lean-receipts/SHA256SUMS
          git rev-parse HEAD > lean-receipts/repository-head.txt
          (git -C /tmp/mathlib4 rev-parse HEAD || true) > lean-receipts/mathlib-head.txt
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
      - name: Archive audit receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-q3-anchor-range-lean
          path: lean-receipts/
          retention-days: 45
          if-no-files-found: warn
