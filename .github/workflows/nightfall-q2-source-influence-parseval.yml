name: NIGHTFALL Q2 genuine-source influence Parseval (no energy oracles)
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/ActualESInfluenceParseval.lean'
      - '.github/workflows/nightfall-q2-source-influence-parseval.yml'
  workflow_dispatch:
concurrency:
  group: q2-source-influence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-influence-parseval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Acquire exact historical source Lean 4.33.0 environment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain leanprover/lean4:v4.33.0
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          git clone https://github.com/physical-superintelligence/aaronson-ambainis.git /tmp/aa
          git -C /tmp/aa checkout 2a6ceaef872ae993708950f951989134084b851a
          (cd /tmp/aa && lake exe cache get)
          (cd /tmp/aa && lake build AaronsonAmbainis.DetTheorem AaronsonAmbainis.TwoSided.Antipodal \
             AaronsonAmbainis.Bridge.Positivity AaronsonAmbainis.Row.Main \
             AaronsonAmbainis.Pack.Main AaronsonAmbainis.Dual.Main \
             AaronsonAmbainis.Level.Integral AaronsonAmbainis.TwoSided.CauchySchwarz)
      - name: Build certified source representation and energy imports
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/formalization/product_space
          O=research/nightfall/formalization/observability
          mkdir -p /tmp/aa/.lake/build/lib/lean
          for m in ProductSpaceTwoSidedBridge ProductRowBound ProductInfluence EfronSteinDegree QuadraticHoeffdingBridge; do
            cp "$P/$m.lean" "/tmp/aa/$m.lean"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean")
          done
          cp "$O/CenteredRectangles.lean" /tmp/aa/CenteredRectangles.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/CenteredRectangles.olean CenteredRectangles.lean)
          for m in ActualESPairMatchingBridge ActualESOrthogonality ActualESVarianceEnergy ActualESConditionalSection; do
            cp "$P/$m.lean" "/tmp/aa/$m.lean"
            (cd /tmp/aa && lake env lean -o ".lake/build/lib/lean/$m.olean" "$m.lean")
          done
          cp "$O/ArbitraryLawFourthMoment.lean" /tmp/aa/ArbitraryLawFourthMoment.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/ArbitraryLawFourthMoment.olean ArbitraryLawFourthMoment.lean)
          cp "$P/ActualESSourceEnergy.lean" /tmp/aa/ActualESSourceEnergy.lean
          (cd /tmp/aa && lake env lean -o .lake/build/lib/lean/ActualESSourceEnergy.olean ActualESSourceEnergy.lean)
      - name: Strict theorem and axiom check for full source influence ANOVA sector equality
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualESInfluenceParseval
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/product_space/ActualESInfluenceParseval.lean \
            --workspace /tmp/aa --timeout 1200 --strict \
            --allow-axiom propext --allow-axiom Classical.choice --allow-axiom Quot.sound \
            --decl $N.actual_source_section_eq_interaction_sum \
            --decl $N.actual_source_influence_eq_interaction_energy \
            --json-out lean-receipts/actual-source-influence-parseval.json || {
              cat lean-receipts/actual-source-influence-parseval.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/actual-source-influence-parseval.json
      - name: Source hash, exact environment, and provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/product_space/{ActualESInfluenceParseval,ActualESVarianceEnergy,ActualESOrthogonality,ActualESSourceEnergy}.lean > lean-receipts/SHA256SUMS
          printf '%s\n' 'leanprover/lean4:v4.33.0' > lean-receipts/lean-toolchain.txt
          printf '%s\n' '2a6ceaef872ae993708950f951989134084b851a' > lean-receipts/upstream.txt
          git rev-parse HEAD > lean-receipts/source-commit.txt
      - name: Upload proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-source-influence-parseval-historical-pin-receipt
          path: lean-receipts/
          retention-days: 45
