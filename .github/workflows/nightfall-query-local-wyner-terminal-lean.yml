name: NIGHTFALL query-local Wyner general latent terminal Lean
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/QueryLocalWynerCompiler.lean'
      - 'research/nightfall/formalization/product_space/QueryLocalWynerTerminal.lean'
      - 'research/nightfall/formalization/product_space/QueryLocalWynerDegree.lean'
      - 'research/nightfall/formalization/product_space/QueryLocalWynerComplete.lean'
      - 'research/nightfall/formalization/product_space/Route1FiniteSampling.lean'
      - '.github/workflows/nightfall-query-local-wyner-terminal-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile pinned AA / product source chain
        shell: bash
        run: |
          set -euo pipefail
          while read -r M P; do
            [ -z "$M" ] && continue
            REL="$(printf '%s' "$M" | tr '.' '/')"
            mkdir -p "/tmp/mathlib4/$(dirname "$REL")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$REL")"
            cp "$P" "/tmp/mathlib4/$REL.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$REL.olean" "$REL.lean") > "/tmp/log-$M.txt" 2>&1
            ! grep -E '(^|:)error:|declaration uses .sorry' "/tmp/log-$M.txt"
          done < research/nightfall/formalization/aa_product/CLOSURE.txt
      - name: Compile pinned general latent Wyner Route1 chain and new terminal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/query-local-terminal
          for M in Route1LatentDegree Route1DegreeSourceBridge Route1FiniteMaxCoupling Route1FiniteJointMass \
                   Route1MaximalConditionalKernel Route1StarCoupling Route1StarMaximalBridge \
                   Route1PolylogTools Route1Entropy Route1KeyLemma Route1Lift Route1PolylogSimulation \
                   Route1WynerSimulation Route1WynerGeneral QueryLocalWynerCompiler QueryLocalWynerTerminal QueryLocalWynerDegree QueryLocalWynerComplete; do
            src="research/nightfall/formalization/product_space/$M.lean"
            ! grep -nE '^[[:space:]]*(sorry|admit|axiom|constant)\b' "$src"
            cp "$src" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean") 2>&1 | tee "receipts/query-local-terminal/$M.log"
            ! grep -E '(^|:)error:|declaration uses .sorry' "receipts/query-local-terminal/$M.log"
          done
      - name: Independent kernel replay, named axiom gate and exact sources
        shell: bash
        run: |
          set -euo pipefail
          (cd /tmp/mathlib4 && lake env leanchecker QueryLocalWynerComplete) 2>&1 | tee receipts/query-local-terminal/checker.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('receipts/query-local-terminal/QueryLocalWynerTerminal.log').read_text()
          name='Nightfall.QueryLocalWyner.query_local_wyner_terminal'
          m=re.search(r"'"+re.escape(name)+r"' depends on axioms:\s*\[([^\]]*)\]",p,re.S)
          if m:
              ax={x.strip() for x in m[1].split(',') if x.strip()}
              assert ax <= {'propext','Classical.choice','Quot.sound'},ax
          else:
              assert f"'{name}' does not depend on any axioms" in p
          assert 'sorryAx' not in p
          final=Path('receipts/query-local-terminal/QueryLocalWynerComplete.log').read_text()
          name='Nightfall.QueryLocalWyner.query_local_wyner_blocal'
          m=re.search(r"'"+re.escape(name)+r"' depends on axioms:\s*\[([^\]]*)\]",final,re.S)
          if m:
              ax={x.strip() for x in m[1].split(',') if x.strip()}
              assert ax <= {'propext','Classical.choice','Quot.sound'},ax
          else:
              assert f"'{name}' does not depend on any axioms" in final
          assert 'sorryAx' not in final
          print('PASS source-exact query-local b-local Wyner theorem, arbitrary finite source, actual DTree compiler and general-latent C_W')
          PY
          git rev-parse HEAD > receipts/query-local-terminal/head.txt
          sha256sum research/nightfall/formalization/product_space/QueryLocalWyner*.lean > receipts/query-local-terminal/SHA256SUMS
      - name: Keep receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: query-local-wyner-terminal-${{ github.run_id }}
          path: receipts/query-local-terminal
          retention-days: 90
  sampling:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Check finite sampling theorem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/route1-sampling
          src=research/nightfall/formalization/product_space/Route1FiniteSampling.lean
          ! grep -nE '^[[:space:]]*(sorry|admit|axiom|constant)\b' "$src"
          cp "$src" /tmp/mathlib4/Route1FiniteSampling.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Route1FiniteSampling.olean Route1FiniteSampling.lean) 2>&1 | tee receipts/route1-sampling/lean.log
          (cd /tmp/mathlib4 && lake env leanchecker Route1FiniteSampling) 2>&1 | tee receipts/route1-sampling/checker.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('receipts/route1-sampling/lean.log').read_text()
          name='Nightfall.Route1Sampling.finite_test_sample'
          m=re.search(r"'"+re.escape(name)+r"' depends on axioms:\s*\[([^\]]*)\]",p,re.S)
          if m:
              assert {x.strip() for x in m[1].split(',') if x.strip()} <= {'propext','Classical.choice','Quot.sound'}
          else:
              assert f"'{name}' does not depend on any axioms" in p
          assert 'sorryAx' not in p
          PY
          git rev-parse HEAD > receipts/route1-sampling/head.txt
          sha256sum "$src" > receipts/route1-sampling/SHA256SUMS
      - name: Keep sampling receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: route1-sampling-${{ github.run_id }}
          path: receipts/route1-sampling
          retention-days: 90
