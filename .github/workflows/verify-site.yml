name: Verify research website
# Broad docs, research and scripts globs intentionally cover all site regressions.
# Avoid redundant explicit paths: nested file paths are already included.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "research/nightfall/**"
      - "scripts/**"
      - ".github/workflows/verify-site.yml"
  pull_request:
    paths:
      - "docs/**"
      - "research/nightfall/**"
      - "scripts/**"
      - ".github/workflows/verify-site.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # compare full source state against PR base / push predecessor
      - name: Syntax-check all JavaScript test entrypoints
        run: |
          find scripts -type f \( -name "*.cjs" -o -name "*.mjs" -o -name "*.js" \) -print0 | xargs -0 -r -n1 node --check
      - name: Validate static pages, source links, anchors, and fallback catalogue
        run: |
          python3 scripts/check_site.py
          python3 scripts/test_review_queue.py
          node scripts/test_product_destinations.cjs
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("docs/sitemap.xml"); print("Sitemap XML valid")'
      - name: Verify claim graph and report directly affected evidence
        env:
          CLAIM_IMPACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node scripts/test_claim_impact.cjs
          node scripts/claim_impact.cjs
      - name: Reject signed-overlap boundary and zero-extension regressions
        run: python3 scripts/test_overlap_boundary.py
      - name: Parse JavaScript without executing browser code
        run: |
          node --check docs/site.js
          node --check docs/research.js
          node --check docs/desk.js
          node --check docs/agenda.js
          node --check docs/discovery-core.js
          node --check docs/discovery-app.js
          node --check docs/discovery-loop-core.js
          node --check docs/living-investigation.js
          node scripts/test_discovery_core.cjs
          node scripts/test_discovery_loop.cjs
          node --check docs/living-paper.js
          node scripts/test_living_paper.cjs
          node --check docs/erdos-paper-core.js
          node --check docs/erdos-paper.js
          node scripts/test_erdos_paper.cjs
          node --check docs/claim-journey-core.js
          node --check docs/claim-journey.js
          node scripts/test_claim_journey.cjs
          node --check docs/portfolio-core.js
          node --check docs/portfolio.js
          node scripts/test_portfolio.cjs
          node --check docs/portfolio-search-core.js
          node --check docs/portfolio-search.js
          node scripts/test_portfolio_search.cjs
          node scripts/test_home_focus.cjs
          node --check docs/join-evidence-core.js
          node scripts/test_join_evidence.cjs
      - name: Verify PAS v2 finite DAG proof identities (integer-exact)
        run: node scripts/test_pas_v2.cjs
      - name: Independently verify exact Werner and finite-field tools
        run: |
          node --check docs/research-tools-core.js
          node --check docs/research-tools-app.js
          node --check scripts/site_browser_smoke.mjs
          node scripts/test_research_tools.cjs
          node --check docs/sidon-sharpness-core.js
          node --check docs/sidon-sharpness-app.js
          node scripts/test_sidon_sharpness.cjs
          node --check docs/adversary-core.js
          node --check docs/adversary-app.js
          node scripts/test_adversary.cjs
          node --check docs/companion-handoff-core.js
          node scripts/test_companion_handoff.cjs
          node --check docs/orchestrator-core.js
          node --check docs/orchestrator.js
          node scripts/test_orchestrator.cjs
      - name: Discovery Engine external worker acceptance and tamper tests
        run: python3 scripts/test_discovery_worker.py
      - name: Check adaptive granularity study with exact adversarial tests
        run: |
          python3 -m unittest discover -s research/nightfall/discovery-engine -p 'test_adaptive_resolution.py'
          python3 -m unittest discover -s research/nightfall/discovery-engine -p 'test_granularity_study.py'
      - name: Run frozen paired held-out granularity benchmark
        run: |
          python3 research/nightfall/discovery-engine/granularity_study.py --seed 1729 --train 12 --test 12 --output /tmp/granularity_results.json
          python3 -m json.tool /tmp/granularity_results.json > /dev/null
          sha256sum /tmp/granularity_results.json
          cp /tmp/granularity_results.json granularity_results.json
      - name: Archive bounded synthetic study receipt
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-granularity-study
          path: granularity_results.json
          retention-days: 90
      - name: Self-test offline publication-scope scanner
        run: python3 scripts/audit_release_scope.py --self-test
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          mkdir -p browser-artifacts
      - name: Enforce no-lime palette contract and theme contrast
        run: node scripts/check_palette_contract.mjs
      - name: Verify ethereal theme across 25 pages and capture previews
        run: |
          set -o pipefail
          CHROME_BIN="$(command -v google-chrome)" node scripts/test_ethereal_theme.mjs 2>&1 | tee browser-artifacts/ethereal-theme.log
      - name: Verify golden-hour light palette, WCAG colors, and dusk isolation
        run: |
          set -o pipefail
          CHROME_BIN="$(command -v google-chrome)" node scripts/test_golden_hour_light.mjs 2>&1 | tee browser-artifacts/golden-hour-light.log
      - name: Reject visible parchment regressions and audit rare midnight oxblood
        run: |
          set -o pipefail
          CHROME_BIN="$(command -v google-chrome)" node scripts/test_palette_consistency.mjs 2>&1 | tee browser-artifacts/palette-consistency.log
      - name: Test scroll-driven animation in both themes, narrow phones, and reduced motion
        run: |
          set -o pipefail
          CHROME_BIN="$(command -v google-chrome)" node scripts/test_scroll_cinema.mjs 2>&1 | tee browser-artifacts/scroll-cinema.log
      - name: Upload mobile scroll-cinema screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-scroll-cinema-${{ github.run_id }}
          path: browser-artifacts/scroll-cinema-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload golden-hour light design screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-hour-light-preview-${{ github.run_id }}
          path: browser-artifacts/golden-hour-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload ethereal theme screenshots for human approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ethereal-theme-preview-${{ github.run_id }}
          path: browser-artifacts/ethereal-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Browser smoke test (mobile, tablet, desktop)
        run: |
          set -o pipefail
          CHROME_BIN="$(command -v google-chrome)" node scripts/site_browser_smoke.mjs 2>&1 | tee browser-artifacts/browser-smoke.log
      - name: Preserve browser failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-browser-failure-${{ github.run_id }}
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 30
      - name: Compile verification scripts and check machine-readable task ledger
        run: |
          python3 -m py_compile scripts/verify_erdos_independent.py scripts/verify_frozen_release.py
          python3 -m json.tool research/nightfall/AGENT_TASKS.json > /dev/null
      - name: Compile exact conditional lower-envelope verifier
        run: python3 -m py_compile research/nightfall/agent-reports/ea36_lower_20261028/verify_dual_ceiling.py
      - name: Self-test independent exact convolution against direct arithmetic
        run: python3 scripts/verify_erdos_independent.py --self-test
      - name: Check agent GMP source, exact-rational geometry and JSON receipt
        run: |
          echo "4775c2c704d92459762f9f25e921073ea9c7d88daf1d1dd9aaacbd774a5adb79  research/nightfall/agent-reports/ea36_131072/independent_gmp_audit.cpp" | sha256sum --check
          echo "260dd5d7fbb1967a516228990c197f02427102353a1cb4c59d51f0cfcc291fd5  research/nightfall/agent-reports/ea36_131072/verify_bridge.py" | sha256sum --check
          python3 -m py_compile research/nightfall/agent-reports/ea36_131072/replay_erdos_gmp.py research/nightfall/agent-reports/ea36_131072/verify_bridge.py
          python3 -m json.tool research/nightfall/agent-reports/ea36_131072/AGENT_VERDICT.json > /dev/null
          python3 research/nightfall/agent-reports/ea36_131072/verify_bridge.py
          g++ -O3 -std=c++17 research/nightfall/agent-reports/ea36_131072/independent_gmp_audit.cpp -lgmpxx -lgmp -o /tmp/nightfall-gmp-audit
      - name: Independently audit adaptive finite-field decoder and sparse phase separator
        run: |
          python3 research/nightfall/projects/adaptive-finite-field-decoder-2026-10-29/checker.py
          python3 research/nightfall/projects/adaptive-finite-field-decoder-2026-10-29/separator_checker.py
      - name: Verify extension-degree packing, exact optimality and nonadaptive obstruction
        run: |
          python3 research/nightfall/projects/adaptive-finite-field-decoder-2026-10-29/verify_extension_packing.py
          python3 research/nightfall/projects/adaptive-finite-field-decoder-2026-10-29/verify_characteristic_two_subfield.py
      - name: Independently verify characteristic-three cancellation packing and one-query sharpness
        run: python3 research/nightfall/projects/adaptive-finite-field-decoder-2026-10-29/verify_q3_cancellation.py
      - name: Verify projective phase-alphabet criterion and finite-subgroup shift covers
        run: python3 research/nightfall/projects/adaptive-finite-field-decoder-2026-10-29/verify_unified.py
      - name: Machine-certify the exact 30-point Sidon theorem
        run: python3 research/nightfall/projects/sidon-finite-30/verify_sidon30_standalone.py
      - name: Certify universal factor-network equality quotient
        run: |
          python3 -m py_compile research/nightfall/projects/sat-network-universal/check_structural_certificate.py
          python3 research/nightfall/projects/sat-network-universal/check_structural_certificate.py research/nightfall/projects/sat-network-universal/example_graph.json
      - name: Verify nonabelian involution-shadow theorem instance and universal erasure allocation
        run: |
          python3 -m py_compile research/nightfall/projects/involution-shadow-codes/certify_nonabelian_instance.py research/nightfall/projects/involution-shadow-codes/verify_nonabelian_erasure_optimum.py
          python3 research/nightfall/projects/involution-shadow-codes/certify_nonabelian_instance.py research/nightfall/projects/involution-shadow-codes/S4_nonabelian_certificate.json
          python3 research/nightfall/projects/involution-shadow-codes/verify_nonabelian_erasure_optimum.py
      - name: Verify heterogeneous erasure reliability and full two-label Pareto frontier
        run: |
          python3 -m py_compile research/nightfall/projects/involution-shadow-codes/verify_heterogeneous_erasure.py
          python3 research/nightfall/projects/involution-shadow-codes/verify_heterogeneous_erasure.py
