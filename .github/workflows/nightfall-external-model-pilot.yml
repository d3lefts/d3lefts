name: NIGHTFALL external-model benchmark pilot (UNVALIDATED)

on:
  pull_request:
    paths:
      - ".github/workflows/nightfall-external-model-pilot.yml"
      - "research/nightfall/evaluations/external/**"
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  preliminary-external-model-run:
    name: external-model pilot / ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        task: [dispatchq, artifactgraph]
    steps:
      - name: Checkout read-only harness (no persisted credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Freeze candidate from exact draft PR head
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          case "$TASK" in
            dispatchq)
              SHA=c11881717d354462d49205ad86eecbdde719c47e
              TASKPATH=research/nightfall/evaluations/dispatchq-b1/candidate ;;
            artifactgraph)
              SHA=d5158a3aa37fa0f0ac877406ec806389cc04b5b6
              TASKPATH=research/nightfall/evaluations/artifactgraph-b2/candidate ;;
            *) exit 10 ;;
          esac
          WORK="$RUNNER_TEMP/nightfall-$TASK"
          mkdir -p "$WORK/archive" "$WORK/original" "$GITHUB_WORKSPACE/baseline-evidence/$TASK"
          git fetch --no-tags --depth 1 origin "$SHA"
          git archive FETCH_HEAD "$TASKPATH" | tar -x -C "$WORK/archive"
          cp -a "$WORK/archive/$TASKPATH/." "$WORK/original/"
          cp -a "$WORK/original" "$WORK/candidate"
          echo "CANDIDATE_DIR=$WORK/candidate" >> "$GITHUB_ENV"
          echo "ORIGINAL_DIR=$WORK/original" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$GITHUB_WORKSPACE/baseline-evidence/$TASK" >> "$GITHUB_ENV"
          echo "TASK_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Task PR head: $SHA"
          sha256sum "$WORK/candidate/ISSUE.md"

      - name: Prepare separate no-network Python sandbox
        run: docker pull python:3.13-slim

      - name: Run external model with read/edit/smoke-test tools (no evaluator access)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -euo pipefail
          python research/nightfall/evaluations/external/model_agent.py \
            --task "$TASK" --candidate "$CANDIDATE_DIR" \
            --model "openai/gpt-4.1" --max-model-turns 8 --max-tools 20 \
            --out "$OUTPUT_DIR"

      - name: Preliminary contract scoring in separate credential-free step
        env:
          TASK: ${{ matrix.task }}
        shell: bash
        run: |
          set -euo pipefail
          # Source from a model is not executed with GITHUB_TOKEN or on host.
          docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,exec,nosuid,size=128m \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --pids-limit 128 \
            --user "$(id -u):$(id -g)" -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$CANDIDATE_DIR:/task:ro" \
            -v "$GITHUB_WORKSPACE/research/nightfall/evaluations/external:/grader:ro" \
            -v "$OUTPUT_DIR:/out:rw" \
            python:3.13-slim python /grader/contract_scorer.py \
              --task "$TASK" --out /out/grade.json
          diff -ruN "$ORIGINAL_DIR" "$CANDIDATE_DIR" > "$OUTPUT_DIR/patch.diff" || test "$?" -eq 1
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          out=Path(os.environ["OUTPUT_DIR"])
          rec=json.loads((out/"receipt.json").read_text())
          score=json.loads((out/"grade.json").read_text())
          manifest={
            "schema":"nightfall.external-pilot-result.v0.1",
            "task":os.environ["TASK"],"source_git_sha":os.environ["TASK_SHA"],
            "requested_model":"openai/gpt-4.1",
            "agent_status":rec["status"],
            "valid_external_model_attempt":rec["status"]=="completed" and rec["model_responses_received"]>0,
            "preliminary_contract_score":score["points"] if rec["status"]=="completed" else None,
            "score_if_attempt_not_completed":0,
            "score_ceiling":score["max_points"],"tests_total":score["tests_total"],
            "tests_passed":score["tests_passed"],
            "scorer_sha256":hashlib.sha256(Path("research/nightfall/evaluations/external/contract_scorer.py").read_bytes()).hexdigest(),
            "runner_sha256":hashlib.sha256(Path("research/nightfall/evaluations/external/model_agent.py").read_bytes()).hexdigest(),
            "result_classification":"preliminary external-model run; new contract tests; no independent human grader review",
          }
          (out/"manifest.json").write_text(json.dumps(manifest,sort_keys=True,indent=2)+"\n")
          print(json.dumps(manifest,sort_keys=True))
          PY

      - name: Retain original attempts, traces, grader output, and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-model-${{ matrix.task }}-${{ github.sha }}
          path: baseline-evidence/${{ matrix.task }}/
          if-no-files-found: warn
          retention-days: 30
