name: NIGHTFALL Q2 genuine original product L2 label isometry
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2GenuineLabelIsometry.lean'
      - '.github/workflows/nightfall-q2-genuine-label-isometry.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-genuine-label-isometry-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  source-isometry:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile true original-product pushforward and Hilbert pullback
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2Density InfinitePiQ2OriginalLabelTransport InfinitePiQ2GenuineLabelIsometry; do
            cp "research/nightfall/formalization/universal/${name}.lean" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Audit exact named declaration proofs with only standard Lean axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-genuine-label-isometry
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2GenuineLabelIsometry.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2GenuineLabelIsometry.original_infinite_label_measurePreserving \
            --decl Nightfall.InfinitePiQ2GenuineLabelIsometry.original_infinite_label_lift_norm \
            --decl Nightfall.InfinitePiQ2GenuineLabelIsometry.original_infinite_label_lift_ae \
            --json-out lean-receipts/q2-genuine-label-isometry/receipt.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-genuine-label-isometry/receipt.json
      - name: Preserve source and dependency identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-genuine-label-isometry
          git rev-parse HEAD > lean-receipts/q2-genuine-label-isometry/HEAD
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2GenuineLabelIsometry.lean \
            research/nightfall/formalization/universal/InfinitePiQ2OriginalLabelTransport.lean \
            > lean-receipts/q2-genuine-label-isometry/SOURCE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-genuine-label-isometry-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-genuine-label-isometry
          if-no-files-found: warn
