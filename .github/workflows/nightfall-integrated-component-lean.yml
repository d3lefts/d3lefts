name: NIGHTFALL margin-free component identification integrated source Lean
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/MarginFreeIntegrated.lean'
      - 'research/nightfall/formalization/product_space/LatentProductInterpolationDegree.lean'
      - 'research/nightfall/formalization/product_space/MarginFreeProductDisintegration.lean'
      - 'research/nightfall/formalization/product_space/MarginFreeBoundedK.lean'
      - 'research/nightfall/formalization/product_space/MarginFreeLikelihoodDecision.lean'
      - 'research/nightfall/formalization/product_space/MarginFreeClassifierTerminal.lean'
      - 'research/nightfall/formalization/product_space/MarginFreeObservationPushforward.lean'
      - 'research/nightfall/formalization/product_space/MarginFreeOriginalClassifier.lean'
      - 'research/nightfall/formalization/product_space/MarginFreeWeightedOriginal.lean'
      - 'research/nightfall/formalization/product_space/MarginFreeWeightedTree.lean'
      - 'research/nightfall/latent_component_identification/check_weighted_source_likelihood_exact.py'
      - 'research/nightfall/formalization/product_space/PinnedConditionalStability.lean'
      - 'research/nightfall/formalization/product_space/LatentComponentCertifiedCore.lean'
      - 'research/nightfall/formalization/aa_product/CLOSURE_PINNED.txt'
      - '.github/workflows/nightfall-integrated-component-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  marginfree-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Exact weighted-source likelihood regression
        run: python3 research/nightfall/latent_component_identification/check_weighted_source_likelihood_exact.py
      - name: Source pinned dependency closure (minimal 56 modules)
        shell: bash
        run: |
          set -euo pipefail
          counter=0
          while read -r M P; do
            [ -z "$M" ] && continue
            REL="${M//.//}"
            mkdir -p "/tmp/mathlib4/$(dirname "$REL")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$REL")"
            cp "$P" "/tmp/mathlib4/$REL.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$REL.olean" "$REL.lean" >/tmp/closure-current.log 2>&1) || { echo "FAILED: $M"; tail -160 /tmp/closure-current.log; exit 1; }
            if grep -E 'error:|sorryAx|declaration uses .sorry' /tmp/closure-current.log; then exit 1; fi
            counter=$((counter + 1))
          done < research/nightfall/formalization/aa_product/CLOSURE_PINNED.txt
          echo "PASS: compiled $counter source modules"
          test "$counter" -eq 56
      - name: Compile integrated low-TV and high-TV source theorems
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for M in ComponentIdentification MarginFreeCertificate LatentProductInterpolationDegree MarginFreeFiniteTests MarginFreeBhattacharyya MarginFreeTVHellinger MarginFreeLargeGaps LatentComponentCertifiedCore PinnedConditionalStability MarginFreeIntegrated MarginFreeProductDisintegration MarginFreeBoundedK MarginFreeLikelihoodDecision MarginFreeClassifierTerminal MarginFreeObservationPushforward MarginFreeOriginalClassifier MarginFreeWeightedOriginal MarginFreeWeightedTree; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/product_space/$M.lean" "$M.lean"
            lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean" 2>&1 | tee "/tmp/$M.log"
            if grep -E 'error:|sorryAx|declaration uses .sorry' "/tmp/$M.log"; then exit 1; fi
          done
          cat > IntegratedAxioms.lean <<'LEAN'
          import MarginFreeProductDisintegration
          import MarginFreeLargeGaps
          import MarginFreeBoundedK
          import MarginFreeLikelihoodDecision
          import MarginFreeClassifierTerminal
          import MarginFreeObservationPushforward
          import MarginFreeOriginalClassifier
          import MarginFreeWeightedOriginal
          import MarginFreeWeightedTree
          #print axioms Nightfall.MarginFreeIntegrated.pinned_failure_mean_near
          #print axioms Nightfall.MarginFreeIntegrated.weighted_pinned_component_overlap
          #print axioms Nightfall.MarginFreeDisintegration.observed_then_pin_mass
          #print axioms Nightfall.MarginFreeDisintegration.observed_then_pin_failure
          #print axioms Nightfall.MarginFreeDisintegration.observed_component_low_tv
          #print axioms Nightfall.ProductSpace.PinnedConditional.pinned_small_mean_shift
          #print axioms Nightfall.MarginFreeLargeGaps.high_tv_product_bayes_error
          #print axioms Nightfall.MarginFreeBoundedK.high_tv_observed_bayes_error
          #print axioms Nightfall.MarginFreeBoundedK.largeTVCoords_small_complement
          #print axioms Nightfall.MarginFreeBoundedK.bounded_K_component_overlap
          #print axioms Nightfall.MarginFreeLikelihood.likelihood_two_sided_error_eq_overlap
          #print axioms Nightfall.MarginFreeLikelihood.likelihood_observed_locality
          #print axioms Nightfall.MarginFreeLikelihood.observedMass_zero_off_canonical
          #print axioms Nightfall.MarginFreeLikelihood.canonical_likelihood_error_eq_overlap
          #print axioms Nightfall.MarginFreeClassifier.bounded_K_actual_source_classifier
          #print axioms Nightfall.MarginFreeObservationPushforward.canonical_eq_indicator_factors
          #print axioms Nightfall.MarginFreeObservationPushforward.observedLaw_eq_canonical_pushforward
          #print axioms Nightfall.MarginFreeOriginalClassifier.source_canonical_expectation
          #print axioms Nightfall.MarginFreeOriginalClassifier.original_likelihood_error_eq_overlap
          #print axioms Nightfall.MarginFreeOriginalClassifier.bounded_K_original_source_classifier
          #print axioms Nightfall.MarginFreeWeightedOriginal.weighted_likelihood_error_eq_overlap
          #print axioms Nightfall.MarginFreeWeightedOriginal.weighted_original_locality
          #print axioms Nightfall.MarginFreeWeightedOriginal.weighted_original_likelihood_error_eq_overlap
          #print axioms Nightfall.MarginFreeWeightedTree.exists_local_decision_tree
          #print axioms Nightfall.MarginFreeWeightedTree.weighted_original_likelihood_tree
          LEAN
          sed -i 's/^          //' IntegratedAxioms.lean
          lake env lean IntegratedAxioms.lean 2>&1 | tee /tmp/integration-axioms.log
          if grep -E 'error:|sorryAx|declaration uses .sorry' /tmp/integration-axioms.log; then exit 1; fi
          sha256sum MarginFreeProductDisintegration.lean MarginFreeIntegrated.lean PinnedConditionalStability.lean LatentComponentCertifiedCore.lean MarginFreeLargeGaps.lean | tee /tmp/integration-sha256.txt
      - name: Preserve complete integration receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-integrated-kernel
          path: |
            /tmp/closure-current.log
            /tmp/ComponentIdentification.log
            /tmp/MarginFreeCertificate.log
            /tmp/MarginFreeFiniteTests.log
            /tmp/LatentProductInterpolationDegree.log
            /tmp/MarginFreeBhattacharyya.log
            /tmp/MarginFreeTVHellinger.log
            /tmp/MarginFreeLargeGaps.log
            /tmp/LatentComponentCertifiedCore.log
            /tmp/PinnedConditionalStability.log
            /tmp/MarginFreeIntegrated.log
            /tmp/MarginFreeProductDisintegration.log
            /tmp/MarginFreeBoundedK.log
            /tmp/MarginFreeLikelihoodDecision.log
            /tmp/MarginFreeClassifierTerminal.log
            /tmp/MarginFreeObservationPushforward.log
            /tmp/MarginFreeOriginalClassifier.log
            /tmp/MarginFreeWeightedOriginal.log
            /tmp/MarginFreeWeightedTree.log
            /tmp/integration-axioms.log
            /tmp/integration-sha256.txt
          retention-days: 60
          if-no-files-found: warn
