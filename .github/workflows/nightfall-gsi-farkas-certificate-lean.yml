name: NIGHTFALL exact rational Farkas proof-object kernel gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'papers/certifying-algorithms/**'
      - '.github/workflows/nightfall-gsi-farkas-certificate-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightfall-farkas-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  exact-proof-object:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run model-bound rational checker and mutation tests
        run: |
          set -euo pipefail
          python3 -I papers/certifying-algorithms/check_farkas.py --self-test
          python3 -I papers/certifying-algorithms/check_farkas.py papers/certifying-algorithms/two_source_fence.json
      - name: Setup pinned Lean and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile original rational Farkas certificate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mathlib4/.lake/build/lib/lean
          cp papers/certifying-algorithms/lean/RationalFarkasCertificate.lean /tmp/mathlib4/RationalFarkasCertificate.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/RationalFarkasCertificate.olean RationalFarkasCertificate.lean)
      - name: Strict named theorem and standard axiom audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/farkas
          python3 scripts/lean_bridge.py papers/certifying-algorithms/lean/RationalFarkasCertificate.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.CertifyingAlgorithms.rational_linear_combination_bound \
            --decl Nightfall.CertifyingAlgorithms.rational_farkas_infeasibility \
            --json-out lean-receipts/farkas/named.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/farkas/named.json
      - name: Preserve source-bound receipt
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/farkas
          git rev-parse HEAD > lean-receipts/farkas/source-head.txt
          git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/farkas/mathlib-head.txt || true
          cat lean-toolchain > lean-receipts/farkas/toolchain.txt
          sha256sum papers/certifying-algorithms/lean/RationalFarkasCertificate.lean \
            papers/certifying-algorithms/check_farkas.py \
            papers/certifying-algorithms/two_source_fence.json > lean-receipts/farkas/source-sha256.txt
      - name: Upload exact receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightfall-rational-farkas-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/farkas
          if-no-files-found: warn
