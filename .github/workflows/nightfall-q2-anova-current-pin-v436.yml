name: NIGHTFALL Q2 canonical ANOVA / source-global Lean pin 4.36
on:
  push:
    branches:
      - nightfall-q2-source-anova-global-v436-20261113
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/ActualSourceANOVA.lean'
      - 'research/nightfall/formalization/observability/ActualProductResampleBridge.lean'
      - 'research/nightfall/formalization/observability/ActualSourceCanonicalPair.lean'
      - 'research/nightfall/formalization/observability/ActualSourceCanonicalIdentification.lean'
      - 'research/nightfall/formalization/observability/ActualSourceSingletonProjection.lean'
      - '.github/workflows/nightfall-q2-anova-current-pin-v436.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-canonical-anova:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile genuine product-law dependencies on active pin
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ActualProductMergeTower ActualProductHilbertJensen ActualProductSoftNoise ActualProductSourceMarginal; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Strict current-pin Turturean-free canonical ANOVA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourceANOVA
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceANOVA.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.es_decomp \
            --decl $N.actual_degree_two_source_decomposition \
            --decl $N.canonical_condExp_eq_sourceConditional \
            --json-out lean-receipts/q2-actual-source-anova.json || {
              cat lean-receipts/q2-actual-source-anova.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-actual-source-anova.json
      - name: Compile canonical ANOVA as pinned importable module
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/observability/ActualSourceANOVA.lean /tmp/mathlib4/ActualSourceANOVA.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/ActualSourceANOVA.olean ActualSourceANOVA.lean)
      - name: Strict original-source one-coordinate resampling/tower bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualProductResampleBridge
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualProductResampleBridge.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.keep_source_erase_eq_update \
            --decl $N.source_refresh_erase_eq_coordinate_average \
            --decl $N.actual_source_resample_sum \
            --json-out lean-receipts/q2-actual-source-coordinate-resample.json || {
              cat lean-receipts/q2-actual-source-coordinate-resample.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-actual-source-coordinate-resample.json
      - name: Compile actual source resample bridge for pair identification
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/observability/ActualProductResampleBridge.lean /tmp/mathlib4/ActualProductResampleBridge.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/ActualProductResampleBridge.olean ActualProductResampleBridge.lean)
      - name: Compile current-pin source-derived pair/star prerequisites
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ActualProductPairSector ActualProductSoftStar ActualProductSoftStarEnergy ActualProductSoftStarParseval ActualProductSourcePairCentering ActualProductSourceDerivedStar; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Strict genuine-source two-site Mobius pair identification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourceCanonicalPair
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceCanonicalPair.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.distinct_source_updates_commute \
            --decl $N.actual_source_two_site_average_first \
            --decl $N.actual_source_two_site_average_second \
            --decl $N.actual_source_one_site_total_mean \
            --decl $N.actual_source_doublecenter_eq_mobius_pair \
            --json-out lean-receipts/q2-actual-source-mobius-pair.json || {
              cat lean-receipts/q2-actual-source-mobius-pair.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-actual-source-mobius-pair.json
      - name: Compile source pair identification for canonical theorem
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/observability/ActualSourceCanonicalPair.lean /tmp/mathlib4/ActualSourceCanonicalPair.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/ActualSourceCanonicalPair.olean ActualSourceCanonicalPair.lean)
      - name: Strict source singleton-as-section and original vector Jensen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourceSingletonProjection
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceSingletonProjection.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.actual_source_singleton_eq_mean_section \
            --decl $N.actual_source_vector_mean_norm_le_mean_norm \
            --json-out lean-receipts/q2-source-singleton-jensen.json || {
              cat lean-receipts/q2-source-singleton-jensen.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-source-singleton-jensen.json
      - name: Strict original-source canonical two-site projector identification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourceCanonicalIdentification
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceCanonicalIdentification.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.actual_conditional_singleton_eq_source_table \
            --decl $N.actual_conditional_pair_eq_source_table \
            --decl $N.actual_conditional_empty_eq_source_mean \
            --decl $N.actual_pair_is_canonical_mobius_four_term \
            --decl $N.actual_source_esComp_pair_eq_derived \
            --json-out lean-receipts/q2-actual-source-canonical-pair-identification.json || {
              cat lean-receipts/q2-actual-source-canonical-pair-identification.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-actual-source-canonical-pair-identification.json
      - name: Source hashes and pin
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/ActualSourceANOVA.lean research/nightfall/formalization/observability/ActualProductResampleBridge.lean research/nightfall/formalization/observability/ActualSourceCanonicalPair.lean research/nightfall/formalization/observability/ActualSourceCanonicalIdentification.lean research/nightfall/formalization/observability/ActualSourceSingletonProjection.lean > lean-receipts/SHA256SUMS.txt
          git rev-parse HEAD > lean-receipts/repo-commit.txt
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
          git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/mathlib-commit.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-actual-canonical-anova-v436
          path: lean-receipts/
          retention-days: 45
