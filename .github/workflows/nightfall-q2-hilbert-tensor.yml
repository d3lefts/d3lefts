name: NIGHTFALL original-source Hilbert tensor projection
on:
  pull_request:
    branches: [main, nightfall-q2-independent-condexp-lemma-repair-20261117]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2SourceHilbertTensor.lean'
      - 'research/nightfall/formalization/universal/InfinitePiQ2ConditionalSourceTest.lean'
      - '.github/workflows/nightfall-q2-hilbert-tensor.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-source-hilbert-tensor-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  exact-source-hilbert-tensor:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile original-product Hilbert projection tensor source graph
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2Density InfinitePiQ2InfluenceStability InfinitePiQ2OriginalIndependence InfinitePiQ2ConditionalSourceTest InfinitePiQ2SourceHilbertTensor; do
            cp "research/nightfall/formalization/universal/${name}.lean" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Strict named theorem audit under exact original source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-source-hilbert-tensor
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2SourceHilbertTensor.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2SourceHilbertTensor.sourceOtherProjection_tensor_ae \
            --json-out lean-receipts/q2-source-hilbert-tensor/exact.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-source-hilbert-tensor/exact.json
      - name: Preserve immutable compiler/source certificate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-source-hilbert-tensor
          git rev-parse HEAD > lean-receipts/q2-source-hilbert-tensor/HEAD
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2SourceHilbertTensor.lean \
            research/nightfall/formalization/universal/InfinitePiQ2ConditionalSourceTest.lean \
            > lean-receipts/q2-source-hilbert-tensor/SOURCE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-source-hilbert-tensor-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-source-hilbert-tensor
          if-no-files-found: warn
