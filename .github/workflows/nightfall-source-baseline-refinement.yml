name: NIGHTFALL source-to-baseline epoch refinement (real service)
on:
  pull_request:
    paths:
      - ".github/workflows/nightfall-source-baseline-refinement.yml"
      - "research/nightfall/right-to-act-promotion/authority_service.py"
      - "research/nightfall/right-to-act-promotion/test_source_baseline_binding.py"
      - "research/nightfall/right-to-act-promotion/independent_source_binding_audit.py"
      - "research/nightfall/right-to-act-promotion/test_source_epoch_game_refinement.py"
      - "research/nightfall/assurance/source-baseline-refinement-v0.2/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightfall-source-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-bound-effect-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: research/nightfall/right-to-act-promotion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile actual service and independent regression module
        run: python -m py_compile authority_service.py independent_effect_verifier.py test_source_baseline_binding.py independent_source_binding_audit.py test_source_epoch_game_refinement.py
      - name: Exact source-epoch finite game synthesis and exhaustive independent audit
        working-directory: research/nightfall/assurance/source-baseline-refinement-v0.2
        run: |
          python synthesize.py source_epoch_game.json --out source_epoch_game_certificate.json
          python independent_game_audit.py source_epoch_game.json source_epoch_game_certificate.json
      - name: Real-source live Unix socket and certified-game policy refinement
        run: |
          set -euo pipefail
          python -m unittest -v test_source_baseline_binding test_source_epoch_game_refinement 2>&1 | tee baseline-binding-tests.log
      - name: Independent signed-request and recertification truth-table audit
        run: python independent_source_binding_audit.py
      - name: Seal exact source and test receipt
        if: success()
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,platform
          names=['authority_service.py','independent_effect_verifier.py','test_source_baseline_binding.py','independent_source_binding_audit.py','test_source_epoch_game_refinement.py',
                 '../assurance/source-baseline-refinement-v0.2/synthesize.py',
                 '../assurance/source-baseline-refinement-v0.2/independent_game_audit.py',
                 '../assurance/source-baseline-refinement-v0.2/source_epoch_game.json']
          sha={n:hashlib.sha256(pathlib.Path(n).read_bytes()).hexdigest() for n in names}
          receipt={'status':'passed','scope':'local service-owned JSON artifact, not cloud or physical actuation',
                   'github_sha':os.environ['GITHUB_SHA'],'github_run_id':os.environ['GITHUB_RUN_ID'],
                   'python':platform.python_version(),'source_sha256':sha}
          pathlib.Path('source-baseline-refinement-receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Upload executable test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-source-baseline-refinement
          path: |
            research/nightfall/right-to-act-promotion/baseline-binding-tests.log
            research/nightfall/right-to-act-promotion/source-baseline-refinement-receipt.json
            research/nightfall/right-to-act-promotion/source-baseline-truth-table-results.json
            research/nightfall/assurance/source-baseline-refinement-v0.2/source_epoch_game_certificate.json
            research/nightfall/assurance/source-baseline-refinement-v0.2/source-epoch-game-audit.json
          if-no-files-found: warn
          retention-days: 14
