name: NIGHTFALL six-way tensor secant Lean gate
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/structural_information/SubcubeSecantSlices.lean'
      - 'research/nightfall/formalization/structural_information/SubcubeSecantMixed.lean'
      - 'research/nightfall/formalization/structural_information/SubcubeSecantScalar.lean'
      - 'research/nightfall/formalization/structural_information/SubcubeSecantTransfer.lean'
      - 'research/nightfall/formalization/structural_information/SubcubeSecantAllLevels.lean'
      - 'research/nightfall/formalization/structural_information/SubcubeSecantAffine.lean'
      - 'research/nightfall/structural_information/SUBCUBE_SECANT_POLYNOMIAL_20261120.md'
      - 'scripts/check_subcube_secant_structural.py'
      - '.github/workflows/nightfall-subcube-secant-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-way-secants:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Pinned Lean compiler and independent kernel replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secant-receipt
          dir=research/nightfall/formalization/structural_information
          for f in SubcubeL3 SubcubeAllSpacesL3 SubcubeAllLevels SubcubeAffineAllLevels SubcubeSecantSlices SubcubeSecantMixed SubcubeSharpScalar SubcubeSecantScalar SubcubeSecantTransfer SubcubeSecantAllLevels SubcubeSecantAffine; do
            cp "$dir/$f.lean" "/tmp/mathlib4/$f.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean") 2>&1 | tee "secant-receipt/$f.log"
            ! grep -F 'error:' "secant-receipt/$f.log"
          done
          (cd /tmp/mathlib4 && lake env leanchecker SubcubeSecantSlices) 2>&1 | tee secant-receipt/leanchecker.log
          (cd /tmp/mathlib4 && lake env leanchecker SubcubeSecantMixed) 2>&1 | tee secant-receipt/leanchecker-mixed.log
          (cd /tmp/mathlib4 && lake env leanchecker SubcubeSecantScalar) 2>&1 | tee secant-receipt/leanchecker-scalar.log
          (cd /tmp/mathlib4 && lake env leanchecker SubcubeSecantTransfer) 2>&1 | tee secant-receipt/leanchecker-transfer.log
          (cd /tmp/mathlib4 && lake env leanchecker SubcubeSecantAllLevels) 2>&1 | tee secant-receipt/leanchecker-alllevels.log
          (cd /tmp/mathlib4 && lake env leanchecker SubcubeSecantAffine) 2>&1 | tee secant-receipt/leanchecker-affine.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path('research/nightfall/formalization/structural_information/SubcubeSecantSlices.lean').read_text()
          assert not re.search(r'(?m)^\s*(axiom|sorry|admit)\b',source)
          log=Path('secant-receipt/SubcubeSecantSlices.log').read_text()
          assert 'error:' not in log
          assert 'six_way_cover' in log
          r=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',log)
          assert len(r)>=1
          allowed={'propext','Classical.choice','Quot.sound'}
          assert all(set(y.strip() for y in x.split(',') if y.strip()) <= allowed for x in r)
          second=Path('research/nightfall/formalization/structural_information/SubcubeSecantMixed.lean').read_text()
          assert not re.search(r'(?m)^\s*(axiom|sorry|admit)\b',second)
          log2=Path('secant-receipt/SubcubeSecantMixed.log').read_text()
          assert 'error:' not in log2
          assert 'mixed_product_bound' in log2
          reports2=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',log2)
          assert len(reports2)>=1
          assert all(set(y.strip() for y in x.split(',') if y.strip()) <= allowed for x in reports2)
          print('SIX_WAY_SECANT_LEAN_KERNEL_PASS')
          third=Path('research/nightfall/formalization/structural_information/SubcubeSecantScalar.lean').read_text()
          assert not re.search(r'(?m)^\s*(axiom|sorry|admit)\b',third)
          log3=Path('secant-receipt/SubcubeSecantScalar.log').read_text()
          assert 'error:' not in log3
          assert 'triple_beta' in log3
          reports3=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',log3)
          assert len(reports3)>=3
          assert all(set(y.strip() for y in x.split(',') if y.strip()) <= allowed for x in reports3)
          print('MIXED_PRODUCT_QUARTIC_KERNEL_PASS')
          fourth=Path('research/nightfall/formalization/structural_information/SubcubeSecantTransfer.lean').read_text()
          assert not re.search(r'(?m)^\s*(axiom|sorry|admit)\b',fourth)
          log4=Path('secant-receipt/SubcubeSecantTransfer.log').read_text()
          assert 'error:' not in log4
          for name in ['nonzeroHits_up_le','mixed_image_quartic','nonzero_secant_step_quartic']:
              assert name in log4
          reports4=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',log4)
          assert len(reports4)>=3
          assert all(set(y.strip() for y in x.split(',') if y.strip()) <= allowed for x in reports4)
          print('SECANT_SCALAR_BETA_KERNEL_PASS')
          fifth=Path('research/nightfall/formalization/structural_information/SubcubeSecantAllLevels.lean').read_text()
          assert not re.search(r'(?m)^\s*(axiom|sorry|admit)\b',fifth)
          log5=Path('secant-receipt/SubcubeSecantAllLevels.log').read_text()
          assert 'error:' not in log5
          for name in ['triple_fourth','all_levels_nonzero_secants_quartic']:
              assert name in log5
          reports5=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',log5)
          assert len(reports5)>=2
          assert all(set(y.strip() for y in x.split(',') if y.strip()) <= allowed for x in reports5)
          print('SECANT_STEP_QUARTIC_KERNEL_PASS')
          sixth=Path('research/nightfall/formalization/structural_information/SubcubeSecantAffine.lean').read_text()
          assert not re.search(r'(?m)^\s*(axiom|sorry|admit)\b',sixth)
          log6=Path('secant-receipt/SubcubeSecantAffine.log').read_text()
          assert 'error:' not in log6 and 'all_levels_secant_affine_quartic' in log6
          reports6=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',log6)
          assert len(reports6)>=1
          assert all(set(y.strip() for y in x.split(',') if y.strip()) <= allowed for x in reports6)
          print('ALL_LEVELS_SECANT_QUARTIC_KERNEL_PASS')
          print('ALL_LEVELS_AFFINE_SECANT_KERNEL_PASS')
          PY
      - name: Independent full finite checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/check_subcube_secant_structural.py 2>&1 | tee secant-receipt/finite.log
          grep -F 'SUBCUBE_SECANT_STRUCTURAL_FINITE_PASS' secant-receipt/finite.log
          grep -F 'SIX_WAY_EXACT 4 size 25192' secant-receipt/finite.log
      - name: Preserve exact source receipts
        if: always()
        run: |
          mkdir -p secant-receipt
          git rev-parse HEAD > secant-receipt/HEAD
          sha256sum research/nightfall/formalization/structural_information/SubcubeSecantSlices.lean research/nightfall/formalization/structural_information/SubcubeSecantMixed.lean research/nightfall/formalization/structural_information/SubcubeSecantScalar.lean research/nightfall/formalization/structural_information/SubcubeSecantTransfer.lean research/nightfall/formalization/structural_information/SubcubeSecantAllLevels.lean research/nightfall/formalization/structural_information/SubcubeSecantAffine.lean scripts/check_subcube_secant_structural.py research/nightfall/structural_information/SUBCUBE_SECANT_POLYNOMIAL_20261120.md > secant-receipt/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: secant-six-way-receipt
          path: secant-receipt/
          retention-days: 90
