name: NIGHTFALL six-way tensor secant Lean gate
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/structural_information/SubcubeSecantSlices.lean'
      - 'research/nightfall/structural_information/SUBCUBE_SECANT_POLYNOMIAL_20261120.md'
      - 'scripts/check_subcube_secant_structural.py'
      - '.github/workflows/nightfall-subcube-secant-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-way-secants:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Pinned Lean compiler and independent kernel replay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p secant-receipt
          dir=research/nightfall/formalization/structural_information
          for f in SubcubeL3 SubcubeAllSpacesL3 SubcubeAllLevels SubcubeSecantSlices; do
            cp "$dir/$f.lean" "/tmp/mathlib4/$f.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean") 2>&1 | tee "secant-receipt/$f.log"
            ! grep -F 'error:' "secant-receipt/$f.log"
          done
          (cd /tmp/mathlib4 && lake env leanchecker SubcubeSecantSlices) 2>&1 | tee secant-receipt/leanchecker.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path('research/nightfall/formalization/structural_information/SubcubeSecantSlices.lean').read_text()
          assert not re.search(r'(?m)^\s*(axiom|sorry|admit)\b',source)
          log=Path('secant-receipt/SubcubeSecantSlices.log').read_text()
          assert 'error:' not in log
          assert 'six_way_cover' in log
          r=re.findall(r'depends on axioms:\s*\[([^\]]*)\]',log)
          assert len(r)>=1
          allowed={'propext','Classical.choice','Quot.sound'}
          assert all(set(y.strip() for y in x.split(',') if y.strip()) <= allowed for x in r)
          print('SIX_WAY_SECANT_LEAN_KERNEL_PASS')
          PY
      - name: Independent full finite checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -I scripts/check_subcube_secant_structural.py 2>&1 | tee secant-receipt/finite.log
          grep -F 'SUBCUBE_SECANT_STRUCTURAL_FINITE_PASS' secant-receipt/finite.log
          grep -F 'SIX_WAY_EXACT 4 size 25192' secant-receipt/finite.log
      - name: Preserve exact source receipts
        if: always()
        run: |
          mkdir -p secant-receipt
          git rev-parse HEAD > secant-receipt/HEAD
          sha256sum research/nightfall/formalization/structural_information/SubcubeSecantSlices.lean scripts/check_subcube_secant_structural.py research/nightfall/structural_information/SUBCUBE_SECANT_POLYNOMIAL_20261120.md > secant-receipt/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: secant-six-way-receipt
          path: secant-receipt/
          retention-days: 90
