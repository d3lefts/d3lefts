name: NIGHTFALL Q2 529 scalar obstruction Lean

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/observability/Q2529ScalarObstruction.lean'
      - '.github/workflows/nightfall-q2-529-scalar-obstruction.yml'
  workflow_dispatch:

concurrency:
  group: nightfall-q2-529-obstruction-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-scalar-obstruction:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup pinned Lean 4.36.0-rc2 and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Compile and strictly check 529 budget obstruction
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability/Q2529ScalarObstruction.lean
          mkdir -p lean-receipts/q2-529
          cp "$SRC" /tmp/mathlib4/Q2529ScalarObstruction.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Q2529ScalarObstruction.olean Q2529ScalarObstruction.lean)
          N=Nightfall.Q2529ScalarObstruction
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.every_scalar_site_valid \
            --decl $N.weighted_budget_and_variance \
            --decl $N.bound_529_not_a_consequence_of_current_scalar_budgets \
            --json-out lean-receipts/q2-529/obstruction.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-529/obstruction.json
      - name: Record source hashes
        if: always()
        run: |
          mkdir -p lean-receipts/q2-529
          sha256sum research/nightfall/formalization/observability/Q2529ScalarObstruction.lean > lean-receipts/q2-529/SHA256SUMS
          git rev-parse HEAD > lean-receipts/q2-529/HEAD.txt
      - name: Publish fail-closed receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightfall-q2-529-obstruction-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-529
          if-no-files-found: warn
