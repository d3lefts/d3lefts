name: NIGHTFALL source heatbath true Hilbert self-adjointness
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2SourceSelfAdjoint.lean'
      - '.github/workflows/nightfall-q2-source-heatbath-selfadjoint.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile exact original-law Hilbert heatbath selfadjoint proof
        shell: bash
        run: |
          set -euo pipefail
          for n in InfinitePiQ2Density InfinitePiQ2InfluenceStability InfinitePiQ2SourceSelfAdjoint; do
            src="research/nightfall/formalization/universal/${n}.lean"
            test -f "$src"
            ! grep -nE '\\b(sorry|admit)\\b' "$src"
            cp "$src" "/tmp/mathlib4/${n}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${n}.olean" "${n}.lean") 2>&1 | tee "/tmp/${n}.log"
            ! grep -qE "error:|sorryAx" "/tmp/${n}.log"
          done
      - name: Strict named proof audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-source-selfadjoint
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2SourceSelfAdjoint.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2SourceSelfAdjoint.sourceOtherProjectionCLM_apply \
            --decl Nightfall.InfinitePiQ2SourceSelfAdjoint.sourceOtherProjectionCLM_adjoint \
            --json-out lean-receipts/q2-source-selfadjoint/strict.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-source-selfadjoint/strict.json
      - name: Preserve exact source hash
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-source-selfadjoint
          git rev-parse HEAD > lean-receipts/q2-source-selfadjoint/HEAD
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2SourceSelfAdjoint.lean > lean-receipts/q2-source-selfadjoint/SOURCE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-source-selfadjoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-source-selfadjoint
          if-no-files-found: warn
