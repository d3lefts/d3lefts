name: NIGHTFALL product-transfer exact audit + conditional finite Lean
on:
  push:
    branches: [nightfall-strong-product-paper-terminal-20261119]
    paths:
      - 'research/nightfall/strong_simulation_progress/STRONG_PRODUCT_TRANSFER_THEOREM_P_REVISED_20261119.md'
      - 'research/nightfall/strong_simulation_progress/check_strong_product_transfer_exact.py'
      - 'research/nightfall/formalization/product_space/StrongProductTransferConditional.lean'
      - 'research/nightfall/formalization/product_space/StrongDyadicRounding.lean'
      - 'research/nightfall/formalization/product_space/StrongOneSidedCoupling.lean'
      - '.github/workflows/nightfall-strong-product-transfer-exact.yml'
  pull_request:
    paths:
      - 'research/nightfall/strong_simulation_progress/STRONG_PRODUCT_TRANSFER_THEOREM_P_REVISED_20261119.md'
      - 'research/nightfall/strong_simulation_progress/check_strong_product_transfer_exact.py'
      - '.github/workflows/nightfall-strong-product-transfer-exact.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-source-mass-lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile scoped finite error-union and fixed-tape kernel declarations
        shell: bash
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/product_space/StrongProductTransferConditional.lean
          mkdir -p product-transfer-lean-receipts
          if grep -En '\bsorry\b|\badmit\b|sorryAx|^\s*axiom\b|native_decide|unsafe' "$SRC"; then
            echo 'Disallowed gap or axiom marker'; exit 1
          fi
          ROUND=research/nightfall/formalization/product_space/StrongDyadicRounding.lean
          if grep -En '\bsorry\b|\badmit\b|sorryAx|^[[:space:]]*axiom\b|native_decide|unsafe' "$ROUND"; then
            echo 'Disallowed rounding proof gap'; exit 1
          fi
          cp "$ROUND" /tmp/mathlib4/StrongDyadicRounding.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/StrongDyadicRounding.olean StrongDyadicRounding.lean) 2>&1 | tee product-transfer-lean-receipts/dyadic-rounding.log
          ! grep -E 'error:|sorryAx|declaration uses .sorry' product-transfer-lean-receipts/dyadic-rounding.log
          for name in upperGrid_ge upperGrid_lt increment_nonneg increment_lt anchor_survives roundedMass_nonneg roundedMass_support roundedMass_sum; do
            grep -Fq "Nightfall.StrongDyadicRounding.$name' depends on axioms:" product-transfer-lean-receipts/dyadic-rounding.log
          done
          ! grep -E 'sorryAx|Lean.ofReduceBool' product-transfer-lean-receipts/dyadic-rounding.log
          COUPLING=research/nightfall/formalization/product_space/StrongOneSidedCoupling.lean
          if grep -En '\bsorry\b|\badmit\b|sorryAx|^[[:space:]]*axiom\b|native_decide|unsafe' "$COUPLING"; then
            echo 'Disallowed coupling proof gap'; exit 1
          fi
          cp "$COUPLING" /tmp/mathlib4/StrongOneSidedCoupling.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/StrongOneSidedCoupling.olean StrongOneSidedCoupling.lean) 2>&1 | tee product-transfer-lean-receipts/one-sided-coupling.log
          ! grep -E 'error:|sorryAx|declaration uses .sorry' product-transfer-lean-receipts/one-sided-coupling.log
          for name in kernel_nonneg kernel_sum_one kernel_pushforward; do
            grep -Fq "Nightfall.StrongOneSidedCoupling.$name' depends on axioms:" product-transfer-lean-receipts/one-sided-coupling.log
          done
          ! grep -E 'sorryAx|Lean.ofReduceBool' product-transfer-lean-receipts/one-sided-coupling.log
          cp "$SRC" /tmp/mathlib4/StrongProductTransferConditional.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/StrongProductTransferConditional.olean StrongProductTransferConditional.lean) 2>&1 | tee product-transfer-lean-receipts/compile.log
          ! grep -E 'error:|sorryAx|declaration uses .sorry|unknown constant' product-transfer-lean-receipts/compile.log
          for name in bad_triangle uniform_seed_bad_mass source_joint_failure_le fix_random_tape; do
            grep -F "Nightfall.StrongProductTransferConditional.$name" product-transfer-lean-receipts/compile.log
          done
          ! grep -E 'sorryAx|Lean.ofReduceBool' product-transfer-lean-receipts/compile.log
      - name: Preserve explicit conditional-theorem and compiler hashes
        if: always()
        shell: bash
        run: |
          mkdir -p product-transfer-lean-receipts
          git rev-parse HEAD > product-transfer-lean-receipts/head.txt
          sha256sum research/nightfall/formalization/product_space/{StrongProductTransferConditional,StrongDyadicRounding,StrongOneSidedCoupling}.lean > product-transfer-lean-receipts/source.sha256
          cp /tmp/nightfall-lean-version.txt product-transfer-lean-receipts/lean-version.txt 2>/dev/null || true
          echo 'CONDITIONAL_FINITE_PROBABILITY_CORE_ONLY; NOT BDST / NOT QUANTUM PRODUCT TRANSFER' > product-transfer-lean-receipts/status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nightfall-product-transfer-lean-${{ github.run_id }}
          path: product-transfer-lean-receipts
          if-no-files-found: warn
  independent-finite-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run exact rational enumeration and verify checklist
        shell: bash
        run: |
          set -euo pipefail
          P=research/nightfall/strong_simulation_progress
          python3 "$P/check_strong_product_transfer_exact.py" | tee strong-product-exact.json
          python3 - <<'PY'
          import json
          r=json.load(open('strong-product-exact.json'))
          assert r['status']=='FINITE_TESTS_ONLY'
          assert r['total']>=40000
          assert all(v>0 for v in r['checks'].values())
          print('Finite exact audit: PASS (not a universal/Lean proof)')
          PY
      - name: Preserve immutable source/fixture provenance and scope
        if: always()
        shell: bash
        run: |
          mkdir -p product-transfer-receipts
          git rev-parse HEAD > product-transfer-receipts/head.txt
          sha256sum research/nightfall/strong_simulation_progress/{STRONG_PRODUCT_TRANSFER_THEOREM_P_REVISED_20261119.md,check_strong_product_transfer_exact.py} > product-transfer-receipts/sources.sha256
          cp strong-product-exact.json product-transfer-receipts/ 2>/dev/null || true
          echo 'FINITE_EXACT_AUDIT_ONLY; not a Lean kernel proof or independent referee certificate' > product-transfer-receipts/status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nightfall-product-transfer-exact-${{ github.run_id }}
          path: product-transfer-receipts
          if-no-files-found: warn
