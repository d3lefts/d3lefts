name: NIGHTFALL unconditional planar continuous causal obstruction (Lean)
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/finite_field/PlanarTwoRowsDirect.lean'
      - '.github/workflows/nightfall-phase-n2-unconditional.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase-n2-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  planar-source-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Pin source and compile dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/phase-n2
          for M in PlanarTwoRowsDirect; do
            src="research/nightfall/formalization/finite_field/$M.lean"
            ! grep -nE '^[[:space:]]*(sorry|admit|axiom)\b' "$src"
            cp "$src" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean") 2>&1 | tee "receipts/phase-n2/$M.log"
            ! grep -E '(^|:)error:|declaration uses .sorry' "receipts/phase-n2/$M.log"
          done
      - name: Verify named theorem and ordinary axioms
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path("receipts/phase-n2/PlanarTwoRowsDirect.log").read_text()
          name="Nightfall.PlanarTwoRowsDirect.two_readings_not_injective"
          assert name in text, "DECLARATION_TYPE_UNVERIFIED"
          a=re.search(r"'" + re.escape(name) + r"' depends on axioms:\s*\[([^\]]*)\]",text,re.S)
          if a is None:
              assert f"'{name}' does not depend on any axioms" in text, "MISSING_AXIOM_RECEIPT"
              found=set()
          else:
              found={v.strip() for v in a[1].split(',') if v.strip()}
          assert found <= {'propext','Classical.choice','Quot.sound'},found
          assert 'sorryAx' not in text
          source=Path('research/nightfall/formalization/finite_field/PlanarTwoRowsDirect.lean').read_text()
          assert "theorem two_readings_not_injective (a : V2) (b : ℝ → V2)" in source\n          assert "(hb : Continuous b)" in source\n          assert "ProductSphereZero" not in source.split("theorem two_readings_not_injective",1)[1].split("#check",1)[0]
          print('PASS self-contained globally-continuous planar two-row theorem; exact Lean theorem and axiom receipt',found)
          print('SCOPE: n=2 and global second-selector continuity only; reachable-only and all-dimensional ProductSphereZero still open.')
          PY
      - name: Preserve source closure hashes and logs
        if: always()
        run: |
          mkdir -p receipts/phase-n2
          git rev-parse HEAD > receipts/phase-n2/head.txt
          git -C /tmp/mathlib4 rev-parse HEAD > receipts/phase-n2/mathlib-head.txt
          cat lean-toolchain > receipts/phase-n2/toolchain.txt
          sha256sum research/nightfall/formalization/finite_field/PlanarTwoRowsDirect.lean > receipts/phase-n2/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: phase-n2-source-receipt-${{ github.run_id }}
          path: receipts/phase-n2
          retention-days: 90
