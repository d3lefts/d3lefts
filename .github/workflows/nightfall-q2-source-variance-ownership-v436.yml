name: NIGHTFALL Q2 exact source variance-owned moments Lean 4.36
on:
  push:
    branches: [nightfall-q2-variance-sector-bridge-20261114]
    paths:
      - 'research/nightfall/formalization/observability/ActualSourceQ2VarianceOwnership.lean'
      - '.github/workflows/nightfall-q2-source-variance-ownership-v436.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-source-variance-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile all transitive source imports on the pinned Lean compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, subprocess
          root = Path.cwd()
          sources = list((root / "research/nightfall/formalization").rglob("*.lean"))
          modules = {}
          for path in sources:
              if path.stem in modules and modules[path.stem] != path:
                  raise SystemExit(f"ambiguous Lean basename: {path.stem}")
              modules[path.stem] = path
          ordered = []
          state = {}
          def visit(module):
              if module not in modules:
                  return
              st = state.get(module, 0)
              if st == 2:
                  return
              if st == 1:
                  raise RuntimeError(f"Lean import cycle at {module}")
              state[module] = 1
              for name in re.findall(
                  r"(?m)^import\s+([A-Za-z][A-Za-z0-9_'.]*)\s*$",
                  modules[module].read_text()
              ):
                  visit(name)
              state[module] = 2
              ordered.append(module)
          visit("ActualSourceQ2VarianceOwnership")
          workspace = Path("/tmp/mathlib4")
          out = workspace / ".lake/build/lib/lean"
          out.mkdir(parents=True, exist_ok=True)
          print(f"Compiling {len(ordered)} source modules", flush=True)
          for mod in ordered:
              shutil.copyfile(modules[mod], workspace / (mod + ".lean"))
              print("BUILD", mod, flush=True)
              subprocess.run(
                  ["lake", "env", "lean", "-o", str(out / (mod + ".olean")), mod + ".lean"],
                  check=True, cwd=workspace, timeout=1200
              )
          PY
      - name: Strict declaration-specific theorem and axiom check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourceQ2VarianceOwnership
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceQ2VarianceOwnership.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.sum_degree_two_sectors \
            --decl $N.actual_source_variance_singletons_and_pairs \
            --decl $N.actual_source_variance_singletons_and_owned_moments \
            --json-out lean-receipts/q2-source-variance-ownership.json || {
              cat lean-receipts/q2-source-variance-ownership.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-source-variance-ownership.json
      - name: Record source, compiler and exact commit hashes
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/ActualSourceQ2VarianceOwnership.lean > lean-receipts/SHA256SUMS.txt
          git rev-parse HEAD > lean-receipts/repo-commit.txt
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-source-variance-ownership
          path: lean-receipts/
          retention-days: 45
