name: NIGHTFALL original-product finite-rank conditional expectations
on:
  pull_request:
    branches: [nightfall-q2-independent-condexp-lemma-repair-20261117, main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2FiniteRankConditional.lean'
      - '.github/workflows/nightfall-q2-finite-rank-conditional.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-rank-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile actual source dependencies and finite-rank operator proof
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2Density InfinitePiQ2InfluenceStability InfinitePiQ2OriginalIndependence InfinitePiQ2ConditionalSourceTest InfinitePiQ2FiniteRankConditional; do
            src="research/nightfall/formalization/universal/${name}.lean"
            cp "$src" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Strict source-head named axiom check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-finite-rank
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2FiniteRankConditional.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2FiniteRankConditional.source_condExp_finset_tensors \
            --json-out lean-receipts/q2-finite-rank/rank-one-sum.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-finite-rank/rank-one-sum.json
      - name: Save exact source identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-finite-rank
          git rev-parse HEAD > lean-receipts/q2-finite-rank/HEAD
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2FiniteRankConditional.lean > lean-receipts/q2-finite-rank/SOURCE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-finite-rank-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-finite-rank
          if-no-files-found: warn
