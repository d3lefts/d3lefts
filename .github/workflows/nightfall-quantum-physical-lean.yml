name: NIGHTFALL quantum physical ensemble and operational theorem pinned Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, nightfall/quantum-sld-full-20261116]
    paths:
      - 'research/nightfall/formalization/quantum/**'
      - '.github/workflows/nightfall-quantum-physical-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-quantum:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile quantum ensemble construction and PSD/trace
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/PhysicalQubitEnsemble.lean /tmp/mathlib4/PhysicalQubitEnsemble.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/PhysicalQubitEnsemble.olean PhysicalQubitEnsemble.lean)
      - name: Compile finite-outcome Bayes/POVM Gram optimization
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/BayesPOVMCorner.lean /tmp/mathlib4/BayesPOVMCorner.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/BayesPOVMCorner.olean BayesPOVMCorner.lean)
      - name: Compile all-length tensor-character exact sum transfer
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/TensorCharacter.lean /tmp/mathlib4/TensorCharacter.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/TensorCharacter.olean TensorCharacter.lean)
      - name: Compile explicit physical cubic root with character cancellation
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/TernaryPhase.lean /tmp/mathlib4/TernaryPhase.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/TernaryPhase.olean TernaryPhase.lean)
      - name: Compile source-derived local qubit moments and averaged B/C/A bridge
        shell: bash
        run: |
          set -euo pipefail
          for F in LocalTernaryMoments PhysicalOperatorReduction; do
            cp "research/nightfall/formalization/quantum/$F.lean" "/tmp/mathlib4/$F.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$F.olean" "$F.lean")
          done
      - name: Compile actual local p=3/4 ternary operator coefficients
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/TernaryLocalMoments.lean /tmp/mathlib4/TernaryLocalMoments.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/TernaryLocalMoments.olean TernaryLocalMoments.lean)
      - name: Compile arbitrary complex PSD effect coherence constraint
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/PhysicalPOVMCompression.lean /tmp/mathlib4/PhysicalPOVMCompression.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/PhysicalPOVMCompression.olean PhysicalPOVMCompression.lean)
      - name: Compile concrete ternary quantum source, all-length physical states and cancellation
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/TernaryQuantumEnsemble.lean /tmp/mathlib4/TernaryQuantumEnsemble.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/TernaryQuantumEnsemble.olean TernaryQuantumEnsemble.lean)
      - name: Compile physical all-complex-POVM energy optimum
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/ComplexPOVMOptimal.lean /tmp/mathlib4/ComplexPOVMOptimal.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/ComplexPOVMOptimal.olean ComplexPOVMOptimal.lean)
      - name: Compile actual physical source Born-weight domination for arbitrary complex POVMs
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/PhysicalSourceBorn.lean /tmp/mathlib4/PhysicalSourceBorn.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/PhysicalSourceBorn.olean PhysicalSourceBorn.lean)
      - name: Compile real physical Born trace identity from the actual source operator
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/PhysicalSourceBornTrace.lean /tmp/mathlib4/PhysicalSourceBornTrace.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/PhysicalSourceBornTrace.olean PhysicalSourceBornTrace.lean)
      - name: Compile physical GHZ projective POVM and optimality witness
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/GHZTwoRayMeasurement.lean /tmp/mathlib4/GHZTwoRayMeasurement.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/GHZTwoRayMeasurement.olean GHZTwoRayMeasurement.lean)
      - name: Strict named kernel theorem audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quantum-receipts
          SRC=research/nightfall/formalization/quantum/PhysicalQubitEnsemble.lean
          N=Nightfall.Quantum.PhysicalQubit
          python3 scripts/lean_bridge.py "$SRC" --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.densityOfAmplitude_psd" --decl "$N.qubitDensity_psd" --decl "$N.productDensity_psd" --decl "$N.productDensity_entry" --decl "$N.productDensity_trace_one" --decl "$N.qubitAmplitude_norm_one" --decl "$N.normalized_product_physical" --decl "$N.powered_phase_product_physical" --json-out quantum-receipts/physical.json
          N=Nightfall.Quantum.LocalMoments
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/LocalTernaryMoments.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.weighted_00_zero" --decl "$N.weighted_11_zero" --decl "$N.weighted_10_zero" --decl "$N.weighted_01_value" --decl "$N.unweighted_00_value" --decl "$N.unweighted_11_value" --decl "$N.unweighted_10_zero" --decl "$N.unweighted_01_zero" --json-out quantum-receipts/local-source-moments.json
          N=Nightfall.Quantum.OperatorReduction
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/PhysicalOperatorReduction.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.state_is_physical" --decl "$N.unnormalizedB_entry" --decl "$N.unnormalizedC_entry" --decl "$N.actual_fourier_entry_zero_off_ghz" --decl "$N.actual_fourier_ghz_corner_value" --decl "$N.actual_B_diagonal" --decl "$N.actual_B_offdiagonal" --decl "$N.physical_A_entry_is_two_characters" --decl "$N.physical_A_entry_from_fourier" --decl "$N.actual_A_zero_if_local_diagonal" --decl "$N.actual_A_ghz_corner_value" --json-out quantum-receipts/operator-bridge.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/local-source-moments.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/operator-bridge.json
          N=Nightfall.Quantum.LocalTernaryMoments
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/TernaryLocalMoments.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.omega_star_sq" --decl "$N.actual_local_density_entry" --json-out quantum-receipts/local-moments.json
          N=Nightfall.Quantum.GHZTwoRay
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/GHZTwoRayMeasurement.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.projectPlus_posSemidef" --decl "$N.projectMinus_posSemidef" --decl "$N.two_projectors_complete" --decl "$N.ghzMeasurement_complete" --decl "$N.ghz_measurement_attains_bayes_optimum" --decl "$N.ghz_measurement_optimal_among_all_physical_povms" --json-out quantum-receipts/ghz-measurement.json
          N=Nightfall.Quantum.ComplexPOVM
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/ComplexPOVMOptimal.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.effects_diagonal_normalized" --decl "$N.complex_povm_energy_optimal" --json-out quantum-receipts/complex-povm.json
          N=Nightfall.Quantum.SourceBorn
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/PhysicalSourceBorn.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.actual_source_B_diagonal_is_weight" --decl "$N.finite_two_ray_mass_lower" --decl "$N.actual_source_born_lower" --decl "$N.physical_source_bayes_upper" --json-out quantum-receipts/source-born.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/source-born.json
          N=Nightfall.Quantum.SourceBornTrace
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/PhysicalSourceBornTrace.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.actual_source_B_offdiagonal" --decl "$N.actual_source_B_is_diagonal" --decl "$N.trace_actual_source_effect" --decl "$N.actual_source_born_is_real_trace" --decl "$N.physical_povm_upper_with_actual_source_trace" --json-out quantum-receipts/source-born-trace.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/source-born-trace.json
          N=Nightfall.Quantum.TernarySource
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/TernaryQuantumEnsemble.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.actual_ternary_state_physical" --decl "$N.first_character_tensor_cancels" --decl "$N.actual_source_unweighted_tensor_factor" --decl "$N.actual_source_character_weighted_tensor_factor" --json-out quantum-receipts/ternary-source.json
          N=Nightfall.Quantum.PhysicalPOVM
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/PhysicalPOVMCompression.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.complex_psd_corner_gram" --decl "$N.complex_psd_compressed_gram" --json-out quantum-receipts/psd-povm.json
          N=Nightfall.Quantum.TernaryPhase
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/TernaryPhase.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.omega_poly" --decl "$N.omega_unit" --decl "$N.omega_cube" --decl "$N.omega_sum" --decl "$N.omega_square_sum" --json-out quantum-receipts/phase.json
          N=Nightfall.Quantum.TensorCharacter
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/TensorCharacter.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.ternary_tensor_sum_factor" --decl "$N.character_weighted_tensor_sum" --decl "$N.local_moment_zero_kills_tensor" --decl "$N.weighted_local_zero_kills_tensor" --json-out quantum-receipts/tensor.json
          N=Nightfall.Quantum.BayesCorner
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/BayesPOVMCorner.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.single_outcome_bayes_bound" --decl "$N.finite_povm_bayes_bound" --decl "$N.physical_bayes_gain_upper" --decl "$N.ghz_three_outcome_normalized" --decl "$N.ghz_three_outcome_attains" --decl "$N.ghz_three_outcome_optimal" --json-out quantum-receipts/bayes.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/physical.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/bayes.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/tensor.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/phase.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/psd-povm.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/ternary-source.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/complex-povm.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/ghz-measurement.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/local-moments.json
      - name: Freeze provenance
        if: always()
        run: |
          mkdir -p quantum-receipts
          git rev-parse HEAD > quantum-receipts/commit.txt
          git -C /tmp/mathlib4 rev-parse HEAD > quantum-receipts/mathlib.txt || true
          sha256sum research/nightfall/formalization/quantum/PhysicalQubitEnsemble.lean research/nightfall/formalization/quantum/BayesPOVMCorner.lean research/nightfall/formalization/quantum/TensorCharacter.lean research/nightfall/formalization/quantum/TernaryPhase.lean research/nightfall/formalization/quantum/PhysicalPOVMCompression.lean research/nightfall/formalization/quantum/TernaryQuantumEnsemble.lean research/nightfall/formalization/quantum/ComplexPOVMOptimal.lean research/nightfall/formalization/quantum/GHZTwoRayMeasurement.lean research/nightfall/formalization/quantum/TernaryLocalMoments.lean research/nightfall/formalization/quantum/LocalTernaryMoments.lean research/nightfall/formalization/quantum/PhysicalOperatorReduction.lean research/nightfall/formalization/quantum/PhysicalSourceBorn.lean research/nightfall/formalization/quantum/PhysicalSourceBornTrace.lean > quantum-receipts/SHA256SUMS.txt
      - name: Retain artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quantum-full-${{ github.run_id }}
          path: quantum-receipts/
          retention-days: 60
