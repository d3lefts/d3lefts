name: NIGHTFALL quantum physical ensemble and operational theorem pinned Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/quantum/**'
      - '.github/workflows/nightfall-quantum-physical-lean.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-quantum:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile quantum ensemble construction and PSD/trace
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/PhysicalQubitEnsemble.lean /tmp/mathlib4/PhysicalQubitEnsemble.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/PhysicalQubitEnsemble.olean PhysicalQubitEnsemble.lean)
      - name: Compile finite-outcome Bayes/POVM Gram optimization
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/BayesPOVMCorner.lean /tmp/mathlib4/BayesPOVMCorner.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/BayesPOVMCorner.olean BayesPOVMCorner.lean)
      - name: Compile all-length tensor-character exact sum transfer
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/TensorCharacter.lean /tmp/mathlib4/TensorCharacter.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/TensorCharacter.olean TensorCharacter.lean)
      - name: Compile explicit physical cubic root with character cancellation
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/TernaryPhase.lean /tmp/mathlib4/TernaryPhase.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/TernaryPhase.olean TernaryPhase.lean)
      - name: Compile arbitrary complex PSD effect coherence constraint
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/PhysicalPOVMCompression.lean /tmp/mathlib4/PhysicalPOVMCompression.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/PhysicalPOVMCompression.olean PhysicalPOVMCompression.lean)
      - name: Compile concrete ternary quantum source, all-length physical states and cancellation
        shell: bash
        run: |
          set -euo pipefail
          cp research/nightfall/formalization/quantum/TernaryQuantumEnsemble.lean /tmp/mathlib4/TernaryQuantumEnsemble.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/TernaryQuantumEnsemble.olean TernaryQuantumEnsemble.lean)
      - name: Strict named kernel theorem audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p quantum-receipts
          SRC=research/nightfall/formalization/quantum/PhysicalQubitEnsemble.lean
          N=Nightfall.Quantum.PhysicalQubit
          python3 scripts/lean_bridge.py "$SRC" --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.densityOfAmplitude_psd" --decl "$N.qubitDensity_psd" --decl "$N.productDensity_psd" --decl "$N.productDensity_entry" --decl "$N.productDensity_trace_one" --decl "$N.qubitAmplitude_norm_one" --decl "$N.normalized_product_physical" --decl "$N.powered_phase_product_physical" --json-out quantum-receipts/physical.json
          N=Nightfall.Quantum.TernarySource
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/TernaryQuantumEnsemble.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.actual_ternary_state_physical" --decl "$N.first_character_tensor_cancels" --json-out quantum-receipts/ternary-source.json
          N=Nightfall.Quantum.PhysicalPOVM
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/PhysicalPOVMCompression.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.complex_psd_corner_gram" --decl "$N.complex_psd_compressed_gram" --json-out quantum-receipts/psd-povm.json
          N=Nightfall.Quantum.TernaryPhase
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/TernaryPhase.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.omega_poly" --decl "$N.omega_unit" --decl "$N.omega_cube" --decl "$N.omega_sum" --decl "$N.omega_square_sum" --json-out quantum-receipts/phase.json
          N=Nightfall.Quantum.TensorCharacter
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/TensorCharacter.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.ternary_tensor_sum_factor" --decl "$N.character_weighted_tensor_sum" --decl "$N.local_moment_zero_kills_tensor" --decl "$N.weighted_local_zero_kills_tensor" --json-out quantum-receipts/tensor.json
          N=Nightfall.Quantum.BayesCorner
          python3 scripts/lean_bridge.py research/nightfall/formalization/quantum/BayesPOVMCorner.lean --workspace /tmp/mathlib4 --timeout 900 --strict --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext --decl "$N.single_outcome_bayes_bound" --decl "$N.finite_povm_bayes_bound" --decl "$N.physical_bayes_gain_upper" --decl "$N.ghz_three_outcome_normalized" --decl "$N.ghz_three_outcome_attains" --decl "$N.ghz_three_outcome_optimal" --json-out quantum-receipts/bayes.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/physical.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/bayes.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/tensor.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/phase.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/psd-povm.json
          python3 research/nightfall/formalization/product_space/check_receipts.py quantum-receipts/ternary-source.json
      - name: Freeze provenance
        if: always()
        run: |
          mkdir -p quantum-receipts
          git rev-parse HEAD > quantum-receipts/commit.txt
          git -C /tmp/mathlib4 rev-parse HEAD > quantum-receipts/mathlib.txt || true
          sha256sum research/nightfall/formalization/quantum/PhysicalQubitEnsemble.lean research/nightfall/formalization/quantum/BayesPOVMCorner.lean research/nightfall/formalization/quantum/TensorCharacter.lean research/nightfall/formalization/quantum/TernaryPhase.lean research/nightfall/formalization/quantum/PhysicalPOVMCompression.lean research/nightfall/formalization/quantum/TernaryQuantumEnsemble.lean > quantum-receipts/SHA256SUMS.txt
      - name: Retain artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quantum-full-${{ github.run_id }}
          path: quantum-receipts/
          retention-days: 60
