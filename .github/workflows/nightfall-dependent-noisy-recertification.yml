name: NIGHTFALL dependent noisy recertification exact replay
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/2026-11-dependent-noisy-recertification/**'
      - '.github/workflows/nightfall-dependent-noisy-recertification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-exact-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Strict audited cryptography dependency
        run: python -m pip install 'cryptography==46.0.3'
      - name: Regenerate immutable receipt and independently replay
        shell: bash
        run: |
          set -euo pipefail
          cd research/nightfall/2026-11-dependent-noisy-recertification
          python3 make_receipt.py
          sha256sum -c SHA256SUMS.txt
          python3 run_all.py | tee replay.log
          grep -F '"status": "PASS"' replay.log
          sha256sum -c SHA256SUMS.txt
          git rev-parse HEAD > source-commit.txt
          sha256sum recert.py audit_independent.py make_receipt.py check_receipt.py > executed-source-hashes.txt
      - name: Retain receipts even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dependent-noisy-source-replay-${{ github.run_id }}
          path: |
            research/nightfall/2026-11-dependent-noisy-recertification/replay.log
            research/nightfall/2026-11-dependent-noisy-recertification/bellman_receipt.json
            research/nightfall/2026-11-dependent-noisy-recertification/source-commit.txt
            research/nightfall/2026-11-dependent-noisy-recertification/executed-source-hashes.txt
          retention-days: 60
