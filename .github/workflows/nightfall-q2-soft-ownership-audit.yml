name: NIGHTFALL Q2 source-preserving soft-ownership exact audit

on:
  pull_request:
    paths:
      - 'research/nightfall/2026-11-quadratic-law-free-audit/Q2_SOFT_OWNERSHIP_SOURCE_NOISE_BRIDGE_20261113.md'
      - 'research/nightfall/2026-11-quadratic-law-free-audit/check_q2_soft_ownership_independent.py'
      - 'research/nightfall/2026-11-quadratic-law-free-audit/check_q2_soft_ownership_exact.py'
      - '.github/workflows/nightfall-q2-soft-ownership-audit.yml'
  push:
    branches: [main]
    paths:
      - 'research/nightfall/2026-11-quadratic-law-free-audit/Q2_SOFT_OWNERSHIP_SOURCE_NOISE_BRIDGE_20261113.md'
      - 'research/nightfall/2026-11-quadratic-law-free-audit/check_q2_soft_ownership_independent.py'
      - 'research/nightfall/2026-11-quadratic-law-free-audit/check_q2_soft_ownership_exact.py'
      - '.github/workflows/nightfall-q2-soft-ownership-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-finite-source-control:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Enforce byte-identical certified test inputs
        run: |
          cd research/nightfall/2026-11-quadratic-law-free-audit
          printf '%s  %s\n' '26c867d2b23d056638ea6c40eba6f7f3fe1e0ad8dc04e3736052359fe25aef75' 'check_q2_soft_ownership_exact.py' 'e929586841e5b488c82ef67ecef9fdbc4abc700ad7e07eee9220e8e689755d9d' 'check_q2_soft_ownership_independent.py' | sha256sum -c -
      - name: Replay full finite source enumeration (rational, zero-mass, matching)
        run: python3 -I research/nightfall/2026-11-quadratic-law-free-audit/check_q2_soft_ownership_exact.py
      - name: Replay independent exact quadratic-radical source model
        run: python3 -I research/nightfall/2026-11-quadratic-law-free-audit/check_q2_soft_ownership_independent.py
      - name: Assert this test does not claim terminal Q2 certificate
        run: |
          grep -F 'NOT a new sharp numerical constant' research/nightfall/2026-11-quadratic-law-free-audit/Q2_SOFT_OWNERSHIP_SOURCE_NOISE_BRIDGE_20261113.md
          grep -F 'No synthetic fresh-neighbor table' research/nightfall/2026-11-quadratic-law-free-audit/Q2_SOFT_OWNERSHIP_SOURCE_NOISE_BRIDGE_20261113.md
