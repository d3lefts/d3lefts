name: NIGHTFALL Q2 one-source pinned Lean certification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/observability/**'
      - 'research/nightfall/formalization/product_space/**'
      - 'scripts/lean_bridge.py'
      - 'scripts/nightfall_q2_certify.py'
      - '.github/actions/setup-nightfall-lean/**'
      - '.github/workflows/nightfall-q2-consolidated-lean.yml'
      - '.github/workflows/nightfall-q2-*-v436.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Repo branch/commit to certify (defaults to selected dispatch ref)'
        required: false
        type: string

# One generation of the same Q2 proof branch can run at a time.
# Superseding commits cancel older builds BEFORE they consume more time.
concurrency:
  group: nightfall-q2-one-certificate-${{ github.event.pull_request.head.ref || inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  one-pinned-source-certificate:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'nightfall-q2-'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Test the actual PR merge tree: it includes the canonical CI script on main
      # even when a proof branch predates installation of this pipeline.
      - name: Checkout exact effective PR merge tree
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_ref) || github.sha }}
          persist-credentials: false

      - name: Validate exact dependency DAG before installing Lean
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/nightfall_q2_certify.py
          python3 scripts/nightfall_q2_certify.py --plan

      - name: Install one pinned Lean and exact Mathlib cache
        uses: ./.github/actions/setup-nightfall-lean

      - name: Compile every source module once, then certify declarations in order
        run: |
          set -euo pipefail
          python3 scripts/nightfall_q2_certify.py \
            --workspace /tmp/mathlib4 \
            --receipt-dir lean-receipts/q2-consolidated

      - name: Strict original-source ES soft-refresh spectrum for additive upgrade
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          if [ ! -f "$SRC/ActualSourceNoiseEfronStein.lean" ]; then
            echo "No proposed original-source spectral lemma on this ref."
            exit 0
          fi
          mkdir -p lean-receipts/q2-consolidated/sharp-conditional
          cp "$SRC/ActualSourceNoiseEfronStein.lean" /tmp/mathlib4/ActualSourceNoiseEfronStein.lean
          (cd /tmp/mathlib4 &&
            lake env lean -o .lake/build/lib/lean/ActualSourceNoiseEfronStein.olean ActualSourceNoiseEfronStein.lean)
          N=Nightfall.Observability.ActualSourceNoiseEfronStein
          python3 scripts/lean_bridge.py \
            "$SRC/ActualSourceNoiseEfronStein.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.original_mask_subset_weight \
            --decl $N.original_soft_noise_es_component_eigen \
            --decl $N.original_soft_noise_es_expansion \
            --json-out lean-receipts/q2-consolidated/sharp-conditional/00-soft-spectrum.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-consolidated/sharp-conditional/00-soft-spectrum.json

      - name: Strict sharp scalar and source-additive reduction checkpoints when present
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          if [ ! -f "$SRC/ActualSourceQ2SharpScalarClosure.lean" ]; then
            echo "No sharp scalar source in this tree; base eight-stage Q2 remains authoritative."
            exit 0
          fi
          mkdir -p lean-receipts/q2-consolidated/sharp-conditional
          cp "$SRC/ActualSourceQ2SharpScalarClosure.lean" /tmp/mathlib4/ActualSourceQ2SharpScalarClosure.lean
          (cd /tmp/mathlib4 &&
            lake env lean -o .lake/build/lib/lean/ActualSourceQ2SharpScalarClosure.olean ActualSourceQ2SharpScalarClosure.lean)
          N=Nightfall.Observability.ActualSourceQ2SharpScalarClosure
          python3 scripts/lean_bridge.py \
            "$SRC/ActualSourceQ2SharpScalarClosure.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.q2_sharp_scalar_from_additive_budget \
            --json-out lean-receipts/q2-consolidated/sharp-conditional/01-scalar.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-consolidated/sharp-conditional/01-scalar.json
          if [ -f "$SRC/ActualSourceQ2SharpTerminalGate.lean" ]; then
            N=Nightfall.Observability.ActualSourceQ2SharpTerminalGate
            python3 scripts/lean_bridge.py \
              "$SRC/ActualSourceQ2SharpTerminalGate.lean" \
              --workspace /tmp/mathlib4 --timeout 900 --strict \
              --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
              --decl $N.actual_source_q2_sharp_given_additive_budget \
              --json-out lean-receipts/q2-consolidated/sharp-conditional/02-source-gate.json
            python3 research/nightfall/formalization/product_space/check_receipts.py \
              lean-receipts/q2-consolidated/sharp-conditional/02-source-gate.json
          fi
          echo "Sharp reduction is conditional on original additive singleton budget; NOT a sharp terminal certificate."

      - name: Strict exact interpolation and homogeneous source-mask arithmetic
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          mkdir -p lean-receipts/q2-consolidated/sharp-unconditional
          cp "$SRC/ActualSourceQ2SharpAdditive.lean" /tmp/mathlib4/ActualSourceQ2SharpAdditive.lean
          (cd /tmp/mathlib4 &&
            lake env lean -o .lake/build/lib/lean/ActualSourceQ2SharpAdditive.olean ActualSourceQ2SharpAdditive.lean)
          N=Nightfall.Observability.ActualSourceQ2SharpAdditive
          python3 scripts/lean_bridge.py "$SRC/ActualSourceQ2SharpAdditive.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.original_uniform_mask_weight \
            --decl $N.quadratic_noise_linear_coefficient_le \
            --json-out lean-receipts/q2-consolidated/sharp-unconditional/00-interpolation.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-consolidated/sharp-unconditional/00-interpolation.json

      - name: Immutable input and toolchain provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-consolidated
          git rev-parse HEAD > lean-receipts/q2-consolidated/checkout-commit.txt
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > lean-receipts/q2-consolidated/declared-source-head.txt
          cat lean-toolchain > lean-receipts/q2-consolidated/toolchain.txt
          sha256sum scripts/nightfall_q2_certify.py scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceQ2Terminal.lean \
            research/nightfall/formalization/observability/ActualSourceOwnedFourthClosure.lean \
            > lean-receipts/q2-consolidated/SHA256SUMS.txt
          if [ -d /tmp/mathlib4/.git ]; then
            git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/q2-consolidated/mathlib-commit.txt
          fi

      - name: Preserve stage-by-stage strict Lean receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-single-source-certificate-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-consolidated/
          retention-days: 60
