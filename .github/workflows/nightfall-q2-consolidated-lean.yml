name: NIGHTFALL Q2 one-source pinned Lean certification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/observability/**'
      - 'research/nightfall/formalization/product_space/**'
      - 'scripts/lean_bridge.py'
      - 'scripts/nightfall_q2_certify.py'
      - '.github/actions/setup-nightfall-lean/**'
      - '.github/workflows/nightfall-q2-consolidated-lean.yml'
      - '.github/workflows/nightfall-q2-*-v436.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Repo branch/commit to certify (defaults to selected dispatch ref)'
        required: false
        type: string

# One generation of the same Q2 proof branch can run at a time.
# Superseding commits cancel older builds BEFORE they consume more time.
concurrency:
  group: nightfall-q2-one-certificate-${{ github.event.pull_request.head.ref || inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  one-pinned-source-certificate:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'nightfall-q2-'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Test the actual PR merge tree: it includes the canonical CI script on main
      # even when a proof branch predates installation of this pipeline.
      - name: Checkout exact effective PR merge tree
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_ref) || github.sha }}
          persist-credentials: false

      - name: Validate exact dependency DAG before installing Lean
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/nightfall_q2_certify.py
          python3 scripts/nightfall_q2_certify.py --plan

      - name: Install one pinned Lean and exact Mathlib cache
        uses: ./.github/actions/setup-nightfall-lean

      - name: Compile every source module once, then certify declarations in order
        run: |
          set -euo pipefail
          python3 scripts/nightfall_q2_certify.py \
            --workspace /tmp/mathlib4 \
            --receipt-dir lean-receipts/q2-consolidated

      - name: Immutable input and toolchain provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-consolidated
          git rev-parse HEAD > lean-receipts/q2-consolidated/checkout-commit.txt
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > lean-receipts/q2-consolidated/declared-source-head.txt
          cat lean-toolchain > lean-receipts/q2-consolidated/toolchain.txt
          sha256sum scripts/nightfall_q2_certify.py scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceQ2Terminal.lean \
            research/nightfall/formalization/observability/ActualSourceOwnedFourthClosure.lean \
            > lean-receipts/q2-consolidated/SHA256SUMS.txt
          if [ -d /tmp/mathlib4/.git ]; then
            git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/q2-consolidated/mathlib-commit.txt
          fi

      - name: Preserve stage-by-stage strict Lean receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-single-source-certificate-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-consolidated/
          retention-days: 60
