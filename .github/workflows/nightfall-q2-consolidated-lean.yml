name: NIGHTFALL Q2 one-source pinned Lean certification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/observability/**'
      - 'research/nightfall/formalization/product_space/**'
      - 'scripts/lean_bridge.py'
      - 'scripts/nightfall_q2_certify.py'
      - '.github/actions/setup-nightfall-lean/**'
      - '.github/workflows/nightfall-q2-consolidated-lean.yml'
      - '.github/workflows/nightfall-q2-*-v436.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Repo branch/commit to certify (defaults to selected dispatch ref)'
        required: false
        type: string

# One generation of the same Q2 proof branch can run at a time.
# Superseding commits cancel older builds BEFORE they consume more time.
concurrency:
  group: nightfall-q2-one-certificate-${{ github.event.pull_request.head.ref || inputs.target_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  one-pinned-source-certificate:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'nightfall-q2-'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Test the actual PR merge tree: it includes the canonical CI script on main
      # even when a proof branch predates installation of this pipeline.
      - name: Checkout exact effective PR merge tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_ref) || github.sha }}
          persist-credentials: false

      - name: Validate exact dependency DAG before installing Lean
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/nightfall_q2_certify.py
          python3 scripts/nightfall_q2_certify.py --plan

      - name: Install one pinned Lean and exact Mathlib cache
        uses: ./.github/actions/setup-nightfall-lean

      - name: Compile every source module once, then certify declarations in order
        run: |
          set -euo pipefail
          python3 scripts/nightfall_q2_certify.py \
            --workspace /tmp/mathlib4 \
            --receipt-dir lean-receipts/q2-consolidated

      - name: Strict original-source ES soft-refresh spectrum for additive upgrade
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          if [ ! -f "$SRC/ActualSourceNoiseEfronStein.lean" ]; then
            echo "No proposed original-source spectral lemma on this ref."
            exit 0
          fi
          mkdir -p lean-receipts/q2-consolidated/sharp-conditional
          cp "$SRC/ActualSourceNoiseEfronStein.lean" /tmp/mathlib4/ActualSourceNoiseEfronStein.lean
          (cd /tmp/mathlib4 &&
            lake env lean -o .lake/build/lib/lean/ActualSourceNoiseEfronStein.olean ActualSourceNoiseEfronStein.lean)
          N=Nightfall.Observability.ActualSourceNoiseEfronStein
          python3 scripts/lean_bridge.py \
            "$SRC/ActualSourceNoiseEfronStein.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.original_mask_subset_weight \
            --decl $N.original_soft_noise_es_component_eigen \
            --decl $N.original_soft_noise_es_expansion \
            --json-out lean-receipts/q2-consolidated/sharp-conditional/00-soft-spectrum.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-consolidated/sharp-conditional/00-soft-spectrum.json

      - name: Strict sharp scalar and source-additive reduction checkpoints when present
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          if [ ! -f "$SRC/ActualSourceQ2SharpScalarClosure.lean" ]; then
            echo "No sharp scalar source in this tree; base eight-stage Q2 remains authoritative."
            exit 0
          fi
          mkdir -p lean-receipts/q2-consolidated/sharp-conditional
          cp "$SRC/ActualSourceQ2SharpScalarClosure.lean" /tmp/mathlib4/ActualSourceQ2SharpScalarClosure.lean
          (cd /tmp/mathlib4 &&
            lake env lean -o .lake/build/lib/lean/ActualSourceQ2SharpScalarClosure.olean ActualSourceQ2SharpScalarClosure.lean)
          N=Nightfall.Observability.ActualSourceQ2SharpScalarClosure
          python3 scripts/lean_bridge.py \
            "$SRC/ActualSourceQ2SharpScalarClosure.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.q2_sharp_scalar_from_additive_budget \
            --json-out lean-receipts/q2-consolidated/sharp-conditional/01-scalar.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-consolidated/sharp-conditional/01-scalar.json
          if [ -f "$SRC/ActualSourceQ2SharpTerminalGate.lean" ]; then
            N=Nightfall.Observability.ActualSourceQ2SharpTerminalGate
            python3 scripts/lean_bridge.py \
              "$SRC/ActualSourceQ2SharpTerminalGate.lean" \
              --workspace /tmp/mathlib4 --timeout 900 --strict \
              --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
              --decl $N.actual_source_q2_sharp_given_additive_budget \
              --json-out lean-receipts/q2-consolidated/sharp-conditional/02-source-gate.json
            python3 research/nightfall/formalization/product_space/check_receipts.py \
              lean-receipts/q2-consolidated/sharp-conditional/02-source-gate.json
          fi
          echo "Sharp reduction is conditional on original additive singleton budget; NOT a sharp terminal certificate."

      - name: Strict exact interpolation and homogeneous source-mask arithmetic
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          mkdir -p lean-receipts/q2-consolidated/sharp-unconditional
          cp "$SRC/ActualSourceQ2SharpAdditive.lean" /tmp/mathlib4/ActualSourceQ2SharpAdditive.lean
          (cd /tmp/mathlib4 &&
            lake env lean -o .lake/build/lib/lean/ActualSourceQ2SharpAdditive.olean ActualSourceQ2SharpAdditive.lean)
          N=Nightfall.Observability.ActualSourceQ2SharpAdditive
          python3 scripts/lean_bridge.py "$SRC/ActualSourceQ2SharpAdditive.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.original_uniform_mask_weight \
            --decl $N.quadratic_noise_linear_coefficient_le \
            --json-out lean-receipts/q2-consolidated/sharp-unconditional/00-interpolation.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-consolidated/sharp-unconditional/00-interpolation.json

      - name: Strict source-only soft-noise spectral polynomial and singleton extraction
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          mkdir -p lean-receipts/q2-consolidated/sharp-unconditional
          cp "$SRC/ActualSourceQ2SharpAdditiveSource.lean" /tmp/mathlib4/ActualSourceQ2SharpAdditiveSource.lean
          (cd /tmp/mathlib4 &&
            lake env lean -o .lake/build/lib/lean/ActualSourceQ2SharpAdditiveSource.olean ActualSourceQ2SharpAdditiveSource.lean)
          N=Nightfall.Observability.ActualSourceQ2SharpAdditiveSource
          python3 scripts/lean_bridge.py "$SRC/ActualSourceQ2SharpAdditiveSource.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.finite_weighted_abs_bound \
            --decl $N.original_uniform_source_noise_bounded \
            --decl $N.original_degree_two_uniform_noise_polynomial \
            --decl $N.original_first_sector_eq_singleton_sum \
            --json-out lean-receipts/q2-consolidated/sharp-unconditional/01-source-noise-poly.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-consolidated/sharp-unconditional/01-source-noise-poly.json

      # This is the ONLY accepted strong proof certificate gate.
      # It must compile a theorem with no caller-supplied sharp additive,
      # matching, spectral, fourth-moment or energy budget.
      - name: Strict unconditional Q2 1228.356 source-only terminal declaration
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          mkdir -p lean-receipts/q2-consolidated/sharp-unconditional
          cp "$SRC/ActualSourceQ2SharpAdditiveFinal.lean" /tmp/mathlib4/ActualSourceQ2SharpAdditiveFinal.lean
          (cd /tmp/mathlib4 &&
            lake env lean -o .lake/build/lib/lean/ActualSourceQ2SharpAdditiveFinal.olean ActualSourceQ2SharpAdditiveFinal.lean)
          N=Nightfall.Observability.ActualSourceQ2SharpAdditiveFinal
          python3 scripts/lean_bridge.py "$SRC/ActualSourceQ2SharpAdditiveFinal.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.original_first_sector_oscillation \
            --decl $N.original_singleton_norm_source_table \
            --decl $N.original_source_sharp_additive_budget \
            --json-out lean-receipts/q2-consolidated/sharp-unconditional/02-additive.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-consolidated/sharp-unconditional/02-additive.json
          cp "$SRC/ActualSourceQ2SharpTerminalGate.lean" /tmp/mathlib4/ActualSourceQ2SharpTerminalGate.lean
          (cd /tmp/mathlib4 &&
            lake env lean -o .lake/build/lib/lean/ActualSourceQ2SharpTerminalGate.olean ActualSourceQ2SharpTerminalGate.lean)
          cp "$SRC/ActualSourceQ2StrongUnconditional.lean" /tmp/mathlib4/ActualSourceQ2StrongUnconditional.lean
          (cd /tmp/mathlib4 &&
            lake env lean -o .lake/build/lib/lean/ActualSourceQ2StrongUnconditional.olean ActualSourceQ2StrongUnconditional.lean)
          N=Nightfall.Observability.ActualSourceQ2StrongUnconditional
          python3 scripts/lean_bridge.py "$SRC/ActualSourceQ2StrongUnconditional.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.actual_source_q2_strong_unconditional \
            --json-out lean-receipts/q2-consolidated/sharp-unconditional/03-strong-terminal.json
          python3 research/nightfall/formalization/product_space/check_receipts.py \
            lean-receipts/q2-consolidated/sharp-unconditional/03-strong-terminal.json

      # This is a separate stronger source-only certificate; preserve
      # the verified 1228.356 theorem and eight-stage baseline unchanged.
      - name: Strict coupled-source Q2 1064.958 improvement
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          OUT=lean-receipts/q2-consolidated/coupled-1064
          mkdir -p "$OUT"
          for name in ActualSourceQ2CoupledScalarClosure ActualSourceQ2CoupledTerminalGate ActualSourceQ2CoupledUnconditional; do
            cp "$SRC/$name.lean" "/tmp/mathlib4/$name.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean")
          done
          N=Nightfall.Observability.ActualSourceQ2CoupledScalarClosure
          python3 scripts/lean_bridge.py "$SRC/ActualSourceQ2CoupledScalarClosure.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.coupled_singleton_owner_site \
            --decl $N.coupled_scalar_endpoint \
            --decl $N.q2_1064_scalar_from_existing_budgets \
            --json-out "$OUT/01-coupled-scalar.json"
          python3 research/nightfall/formalization/product_space/check_receipts.py "$OUT/01-coupled-scalar.json"
          N=Nightfall.Observability.ActualSourceQ2CoupledTerminalGate
          python3 scripts/lean_bridge.py "$SRC/ActualSourceQ2CoupledTerminalGate.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.actual_source_q2_coupled_given_additive_budget \
            --json-out "$OUT/02-source-conditional.json"
          python3 research/nightfall/formalization/product_space/check_receipts.py "$OUT/02-source-conditional.json"
          N=Nightfall.Observability.ActualSourceQ2CoupledUnconditional
          python3 scripts/lean_bridge.py "$SRC/ActualSourceQ2CoupledUnconditional.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.actual_source_q2_coupled_unconditional \
            --json-out "$OUT/03-source-unconditional.json"
          python3 research/nightfall/formalization/product_space/check_receipts.py "$OUT/03-source-unconditional.json"

      # This is a separate source-only 736.673 gate. Source's joint
      # singleton plus owned Hilbert energy must come from original p,f,
      # NEVER from a caller-supplied auxiliary hypothesis.
      - name: Strict Q2 energy-dual 736.673 complete source-only terminal gate
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability
          OUT=lean-receipts/q2-consolidated/energy-dual-736
          mkdir -p "$OUT"
          for name in ActualSourceQ2EnergyDualScalar ActualSourceQ2EnergyDualSource ActualSourceQ2EnergyDualTerminalGate ActualSourceQ2EnergyDualUnconditional; do
            cp "$SRC/$name.lean" "/tmp/mathlib4/$name.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$name.olean" "$name.lean")
          done
          N=Nightfall.Observability.ActualSourceQ2EnergyDualScalar
          python3 scripts/lean_bridge.py "$SRC/ActualSourceQ2EnergyDualScalar.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.energy_dual_site --decl $N.energy_dual_scalar_endpoint \
            --json-out "$OUT/01-site-and-scalar.json"
          python3 research/nightfall/formalization/product_space/check_receipts.py "$OUT/01-site-and-scalar.json"
          N=Nightfall.Observability.ActualSourceQ2EnergyDualSource
          python3 scripts/lean_bridge.py "$SRC/ActualSourceQ2EnergyDualSource.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.original_singleton_plus_owned_energy_le_influence \
            --json-out "$OUT/02-actual-source-joint-energy.json"
          python3 research/nightfall/formalization/product_space/check_receipts.py "$OUT/02-actual-source-joint-energy.json"
          N=Nightfall.Observability.ActualSourceQ2EnergyDualTerminalGate
          python3 scripts/lean_bridge.py "$SRC/ActualSourceQ2EnergyDualTerminalGate.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.actual_source_q2_energy_dual_given_additive_budget \
            --json-out "$OUT/03-source-conditional.json"
          python3 research/nightfall/formalization/product_space/check_receipts.py "$OUT/03-source-conditional.json"
          N=Nightfall.Observability.ActualSourceQ2EnergyDualUnconditional
          python3 scripts/lean_bridge.py "$SRC/ActualSourceQ2EnergyDualUnconditional.lean" \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.actual_source_q2_energy_dual_unconditional \
            --json-out "$OUT/04-source-unconditional.json"
          python3 research/nightfall/formalization/product_space/check_receipts.py "$OUT/04-source-unconditional.json"
          echo "PASS: source-only unconditional Q2 736.673 strict Lean declaration and axioms"

      - name: Immutable input and toolchain provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-consolidated
          git rev-parse HEAD > lean-receipts/q2-consolidated/checkout-commit.txt
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > lean-receipts/q2-consolidated/declared-source-head.txt
          cat lean-toolchain > lean-receipts/q2-consolidated/toolchain.txt
          sha256sum scripts/nightfall_q2_certify.py scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceQ2Terminal.lean \
            research/nightfall/formalization/observability/ActualSourceOwnedFourthClosure.lean \
            research/nightfall/formalization/observability/ActualSourceQ2StrongUnconditional.lean \
            research/nightfall/formalization/observability/ActualSourceQ2SharpAdditiveFinal.lean \
            research/nightfall/formalization/observability/ActualSourceQ2CoupledScalarClosure.lean \
            research/nightfall/formalization/observability/ActualSourceQ2CoupledTerminalGate.lean \
            research/nightfall/formalization/observability/ActualSourceQ2CoupledUnconditional.lean \
            research/nightfall/formalization/observability/ActualSourceQ2EnergyDualScalar.lean \
            research/nightfall/formalization/observability/ActualSourceQ2EnergyDualSource.lean \
            research/nightfall/formalization/observability/ActualSourceQ2EnergyDualTerminalGate.lean \
            research/nightfall/formalization/observability/ActualSourceQ2EnergyDualUnconditional.lean \
            > lean-receipts/q2-consolidated/SHA256SUMS.txt
          if [ -d /tmp/mathlib4/.git ]; then
            git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/q2-consolidated/mathlib-commit.txt
          fi

      - name: Preserve stage-by-stage strict Lean receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: q2-single-source-certificate-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-consolidated/
          retention-days: 60
