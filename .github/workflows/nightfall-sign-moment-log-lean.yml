name: NIGHTFALL finite Hilbert sign-moment log transfer (Lean 4.35)

on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/SignMomentLogTransfer.lean'
      - '.github/workflows/nightfall-sign-moment-log-lean.yml'
  push:
    branches: [main]
    paths:
      - 'research/nightfall/formalization/observability/SignMomentLogTransfer.lean'
      - '.github/workflows/nightfall-sign-moment-log-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-moment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Strict named-declaration kernel and axiom receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/SignMomentLogTransfer.lean \
            --workspace /tmp/mathlib4 --timeout 480 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Observability.SignMoment.exp_union \
            --decl Nightfall.Observability.SignMoment.logarithmic_trace_from_moment \
            --decl Nightfall.Observability.SignMoment.exp_chord \
            --decl Nightfall.Observability.SignMoment.scaled_moment_of_normalized \
            --decl Nightfall.Observability.SignMoment.log_from_normalized_psd_moment \
            --json-out lean-receipts/sign-moment-log.json || {
              cat lean-receipts/sign-moment-log.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/sign-moment-log.json
      - name: Capture source and pin
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/SignMomentLogTransfer.lean > lean-receipts/SHA256SUMS
          echo leanprover/lean4:v4.36.0-rc2 > lean-receipts/lean-toolchain.txt
          git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/mathlib-sha.txt 2>/dev/null || true
      - name: Archive receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-sign-moment-log-lean
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 45
