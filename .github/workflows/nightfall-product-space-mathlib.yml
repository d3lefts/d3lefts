name: NIGHTFALL product-space — Mathlib localized optimization
on:
  pull_request:
    paths:
      - 'research/nightfall/formalization/product_space/**'
      - '.github/workflows/nightfall-product-space-mathlib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localized-optimization:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean 4.35.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --no-modify-path --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib v4.35.0 and compiled cache
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v4.35.0 https://github.com/leanprover-community/mathlib4.git /tmp/mathlib4
          echo "Mathlib commit: $(git -C /tmp/mathlib4 rev-parse HEAD)"
          (cd /tmp/mathlib4 && lake exe cache get)
      - name: Compile localized theorem and report named axiom dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          python3 "$GITHUB_WORKSPACE/scripts/lean_bridge.py" \
            "$GITHUB_WORKSPACE/research/nightfall/formalization/product_space/LocalizedOptimization.lean" \
            --workspace /tmp/mathlib4 \
            --decl Nightfall.ProductSpace.localized_weight_optimization_positive \
            --timeout 240 \
            --json-out "$GITHUB_WORKSPACE/lean-receipts/product-space-localized-optimization.json"
      - name: Audit standard mathematical foundations
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, re
          r = json.load(open('lean-receipts/product-space-localized-optimization.json'))
          assert r['status'] == 'COMPILED', r['status']
          assert not r['policy_findings'], r['policy_findings']
          name = 'Nightfall.ProductSpace.localized_weight_optimization_positive'
          m = re.search(re.escape("'" + name + "'") + r' depends on axioms: \\[([^\\]]*)\\]', r['stdout'], re.S)
          if m:
              deps = {a.strip() for a in m.group(1).split(',')}
          else:
              assert "'" + name + "' does not depend on any axioms" in r['stdout']
              deps = set()
          assert deps <= {'propext', 'Classical.choice', 'Quot.sound'}, deps
          print(name, 'accepted dependencies:', sorted(deps))
          PYCODE
      - name: Preserve source and toolchain provenance
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/product_space/*.lean > lean-receipts/SHA256SUMS.txt
          git -C /tmp/mathlib4 rev-parse HEAD > lean-receipts/mathlib-commit.txt 2>/dev/null || true
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-space-mathlib-receipts
          path: lean-receipts/
          if-no-files-found: warn
          retention-days: 30
