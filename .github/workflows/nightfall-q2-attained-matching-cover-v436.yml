name: NIGHTFALL Q2 source-real attained matching cover Lean 4.36
on:
  push:
    branches: [nightfall-q2-source-anova-global-v436-20261113, nightfall-q2-consolidated-terminal-20261114]
    paths:
      - 'research/nightfall/formalization/observability/ActualSourceAmplitudeRectangles.lean'
      - 'research/nightfall/formalization/observability/ActualSourceMatchingCover.lean'
      - '.github/workflows/nightfall-q2-attained-matching-cover-v436.yml'
  pull_request:
    paths:
      - 'research/nightfall/formalization/observability/ActualSourceAmplitudeRectangles.lean'
      - 'research/nightfall/formalization/observability/ActualSourceMatchingCover.lean'
      - '.github/workflows/nightfall-q2-attained-matching-cover-v436.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  matched-source-amplitude:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Build all genuine-source, canonical-pair, and mixed rectangle dependencies
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ActualProductMergeTower ActualProductHilbertJensen ActualProductSoftNoise ActualProductSourceMarginal ActualProductPairSector ActualProductSoftStar ActualProductSoftStarEnergy ActualProductSoftStarParseval ActualProductSourcePairCentering ActualSourceANOVA ActualProductResampleBridge ActualProductSourceDerivedStar ActualSourceCanonicalPair ActualSourceCanonicalIdentification ActualSourceQuadraticRectangles ActualSourcePairAmplitudes CenteredRectangles; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Strict source-amplitude oriented rectangle witness
        run: |
          set -euo pipefail
          mkdir -p lean-receipts
          N=Nightfall.Observability.ActualSourceAmplitudeRectangles
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceAmplitudeRectangles.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.original_source_rectangle_eq_pair_table \
            --decl $N.original_source_pair_amplitude_oriented_rectangle \
            --json-out lean-receipts/q2-source-amplitude-rectangle.json || {
              cat lean-receipts/q2-source-amplitude-rectangle.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-source-amplitude-rectangle.json
      - name: Build current source amplitude rectangle and global parity telescope
        run: |
          set -euo pipefail
          cd /tmp/mathlib4
          for f in ActualSourceAmplitudeRectangles ParityBlockCancellation QuadraticHybridTelescoping ActualSourceGeneralMatching WeightedGreedyMatching WeightedGreedyCover; do
            cp "$GITHUB_WORKSPACE/research/nightfall/formalization/observability/$f.lean" .
            lake env lean -o ".lake/build/lib/lean/$f.olean" "$f.lean"
          done
      - name: Strict 4B attained matching and 8B generated greedy cover
        run: |
          set -euo pipefail
          N=Nightfall.Observability.ActualSourceMatchingCover
          python3 scripts/lean_bridge.py \
            research/nightfall/formalization/observability/ActualSourceMatchingCover.lean \
            --workspace /tmp/mathlib4 --timeout 900 --strict \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl $N.selected_matchingCoord_injective \
            --decl $N.source_attained_matching_amplitudes_le_four \
            --decl $N.source_greedy_attained_endpoint_cover \
            --json-out lean-receipts/q2-source-real-matching-cover.json || {
              cat lean-receipts/q2-source-real-matching-cover.json
              exit 1
            }
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-source-real-matching-cover.json
      - name: Source fingerprint, active toolchain
        if: always()
        run: |
          mkdir -p lean-receipts
          sha256sum research/nightfall/formalization/observability/ActualSourceAmplitudeRectangles.lean research/nightfall/formalization/observability/ActualSourceMatchingCover.lean > lean-receipts/SHA256SUMS.txt
          git rev-parse HEAD > lean-receipts/repo-commit.txt
          cat lean-toolchain > lean-receipts/lean-toolchain.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-source-amplitude-greedy-cover
          path: lean-receipts/
          retention-days: 45
