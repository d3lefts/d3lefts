name: NIGHTFALL exact bounded one-step shifted c5 Lean
on:
  push:
    branches: [nightfall-q2-one-step-sharp-c5-20261114]
    paths:
      - 'research/nightfall/formalization/observability/Q2OneStepShiftedC5.lean'
      - '.github/workflows/nightfall-q2-one-step-c5.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-one-step-c5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  one-step-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Strict pinned one-increment c5 SOS and axiom audit
        run: |
          set -euo pipefail
          SRC=research/nightfall/formalization/observability/Q2OneStepShiftedC5.lean
          mkdir -p lean-receipts/q2-one-step
          cp "$SRC" /tmp/mathlib4/Q2OneStepShiftedC5.lean
          (cd /tmp/mathlib4 && lake env lean -o .lake/build/lib/lean/Q2OneStepShiftedC5.olean Q2OneStepShiftedC5.lean)
          python3 scripts/lean_bridge.py "$SRC" \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.Q2OneStep.single_increment_shifted_c5 \
            --decl Nightfall.Q2OneStep.one_increment_sos_identity \
            --decl Nightfall.Q2OneStep.sharpK_le_fifth \
            --decl Nightfall.Q2OneStep.single_increment_shifted_sharp \
            --json-out lean-receipts/q2-one-step/one-step.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-one-step/one-step.json
      - name: SHA source custody
        if: always()
        run: |
          mkdir -p lean-receipts/q2-one-step
          sha256sum research/nightfall/formalization/observability/Q2OneStepShiftedC5.lean > lean-receipts/q2-one-step/SHA256SUMS
          git rev-parse HEAD > lean-receipts/q2-one-step/HEAD
          cat lean-toolchain > lean-receipts/q2-one-step/lean-toolchain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: q2-one-step-c5-sos-lean
          path: lean-receipts/q2-one-step
          retention-days: 45
