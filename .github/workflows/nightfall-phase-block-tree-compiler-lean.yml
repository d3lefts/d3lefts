name: NIGHTFALL phase block physical Route1 DTree compiler Lean
on:
  pull_request:
    paths:
      - "research/nightfall/formalization/structural_information/PhaseBlockTreeCompiler.lean"
      - "research/nightfall/formalization/structural_information/PhaseBlockRoute1.lean"
      - ".github/workflows/nightfall-phase-block-tree-compiler-lean.yml"
      - "docs/lean-pending-source-custody.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-tree-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Compile existing AA and ProductSimulation closure in pinned dependency order
        shell: bash
        run: |
          set -euo pipefail
          while read -r M P; do
            [ -z "$M" ] && continue
            REL="$(printf '%s' "$M" | tr '.' '/')"
            mkdir -p "/tmp/mathlib4/$(dirname "$REL")" "/tmp/mathlib4/.lake/build/lib/lean/$(dirname "$REL")"
            cp "$P" "/tmp/mathlib4/$REL.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$REL.olean" "$REL.lean") > "/tmp/log-$M.txt" 2>&1
            ! grep -E '(^|:)error:|declaration uses .sorry' "/tmp/log-$M.txt"
          done < research/nightfall/formalization/aa_product/CLOSURE.txt
      - name: Exact real-sensor table and actual Route1 DTree compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/phase-block-tree
          for M in PhaseBlockRoute1 PhaseBlockTreeCompiler; do
            src="research/nightfall/formalization/structural_information/$M.lean"
            ! grep -nE '^[[:space:]]*(sorry|admit|axiom|constant)\b' "$src"
            cp "$src" "/tmp/mathlib4/$M.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/$M.olean" "$M.lean") 2>&1 | tee "receipts/phase-block-tree/$M.log"
            ! grep -E '(^|:)error:|declaration uses .sorry' "receipts/phase-block-tree/$M.log"
          done
      - name: Named kernel types and standard axiom policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('receipts/phase-block-tree/PhaseBlockTreeCompiler.log').read_text()
          names=('tripleRead_injective','decodeTriple_correct','compileTree_eval','compileTree_queries')
          for suffix in names:
              name='Nightfall.PhaseBlockTreeCompiler.'+suffix
              m=re.search(r"'" + re.escape(name) + r"' depends on axioms:\s*\[([^\]]*)\]",log,re.S)
              if m: ax={x.strip() for x in m[1].split(',') if x.strip()}
              else:
                  assert f"'{name}' does not depend on any axioms" in log,name
                  ax=set()
              assert ax <= {'propext','Classical.choice','Quot.sound'},(name,ax)
          assert 'sorryAx' not in log
          assert 'theorem Nightfall.PhaseBlockTreeCompiler.compileTree_queries' in log
          print('PASS compiled actual Route1 DTree to 3 original intensity queries per decoded query.')
          print('OPEN: arbitrary quantum matrix circuit→path sum, complete source theorem terminal.')
          PY
      - name: Exact-source and compiler pin receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts/phase-block-tree
          git rev-parse HEAD > receipts/phase-block-tree/head.txt
          git -C /tmp/mathlib4 rev-parse HEAD > receipts/phase-block-tree/mathlib.txt
          cat lean-toolchain > receipts/phase-block-tree/toolchain.txt
          sha256sum research/nightfall/formalization/structural_information/PhaseBlockRoute1.lean research/nightfall/formalization/structural_information/PhaseBlockTreeCompiler.lean > receipts/phase-block-tree/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: phase-block-tree-compiler-${{ github.run_id }}
          path: receipts/phase-block-tree
          retention-days: 90
