name: NIGHTFALL all-dimensional phase-noise exact rational replay (not a theorem certificate)
on:
  pull_request:
    paths:
      - 'research/nightfall/phase-noise-all-n-20261122/**'
      - '.github/workflows/nightfall-phase-noise-all-n.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase-noise-all-n-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  exact-interpolation-fiber-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact Vandermonde inverses, convolution bounds, full-ball feasible fibers
        run: |
          python3 -m py_compile research/nightfall/phase-noise-all-n-20261122/check_polynomial_noise.py
          python3 research/nightfall/phase-noise-all-n-20261122/check_polynomial_noise.py
      - name: Assert nonpromotion and source separation
        run: |
          grep -F 'author-side paper theorem candidate' research/nightfall/phase-noise-all-n-20261122/ALL_DIMENSION_LINEAR_MODULUS.md
          grep -F 'not a Lean certificate' research/nightfall/phase-noise-all-n-20261122/ALL_DIMENSION_LINEAR_MODULUS.md
