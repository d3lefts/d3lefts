name: NIGHTFALL Q2 original-product robust vanishing slack limit Lean
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2RobustLabelLimit.lean'
      - '.github/workflows/nightfall-q2-robust-slack-limit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-robust-slack-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  original-product-vanishing-slack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Exact source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Pinned Lean 4.36 and Mathlib
        uses: ./.github/actions/setup-nightfall-lean
      - name: Build exact original source dependencies
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2Density InfinitePiQ2DenseLabelLimit InfinitePiQ2RobustLabelLimit; do
            cp "research/nightfall/formalization/universal/${name}.lean" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Strict named theorem and standard axioms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-robust-slack
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2RobustLabelLimit.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2RobustLabelLimit.source_q2_bound_with_vanishing_finite_model_slack \
            --json-out lean-receipts/q2-robust-slack/strict.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-robust-slack/strict.json
      - name: Preserve exact source receipt
        if: always()
        shell: bash
        run: |
          mkdir -p lean-receipts/q2-robust-slack
          git rev-parse HEAD > lean-receipts/q2-robust-slack/HEAD
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2RobustLabelLimit.lean > lean-receipts/q2-robust-slack/SHA256
      - name: Upload proof passport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: q2-robust-slack-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-robust-slack
          if-no-files-found: warn
