name: NIGHTFALL genuine source single-coordinate conditional expectation
on:
  pull_request:
    branches: [main, nightfall-q2-source-conditional-independence-20261117]
    paths:
      - 'research/nightfall/formalization/universal/InfinitePiQ2ConditionalSourceTest.lean'
      - 'research/nightfall/formalization/universal/InfinitePiQ2InfluenceStability.lean'
      - '.github/workflows/nightfall-q2-conditional-source-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: q2-conditional-source-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  source-heatbath:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nightfall-lean
      - name: Build original original-product conditional source test
        shell: bash
        run: |
          set -euo pipefail
          for name in InfinitePiQ2Density InfinitePiQ2InfluenceStability InfinitePiQ2OriginalIndependence InfinitePiQ2ConditionalSourceTest; do
            cp "research/nightfall/formalization/universal/${name}.lean" "/tmp/mathlib4/${name}.lean"
            (cd /tmp/mathlib4 && lake env lean -o ".lake/build/lib/lean/${name}.olean" "${name}.lean")
          done
      - name: Strict named theorem axiom check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-conditional-source-test
          python3 scripts/lean_bridge.py research/nightfall/formalization/universal/InfinitePiQ2ConditionalSourceTest.lean \
            --workspace /tmp/mathlib4 --strict --timeout 900 \
            --allow-axiom Classical.choice --allow-axiom Quot.sound --allow-axiom propext \
            --decl Nightfall.InfinitePiQ2ConditionalSourceTest.source_coordinate_other_sigma_indep \
            --decl Nightfall.InfinitePiQ2ConditionalSourceTest.original_source_coordinate_integral \
            --decl Nightfall.InfinitePiQ2ConditionalSourceTest.source_condExp_coordinate_test \
            --decl Nightfall.InfinitePiQ2ConditionalSourceTest.independent_condExp_product \
            --json-out lean-receipts/q2-conditional-source-test/independence.json
          python3 research/nightfall/formalization/product_space/check_receipts.py lean-receipts/q2-conditional-source-test/independence.json
      - name: Preserve exact source, compiler and dependency identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean-receipts/q2-conditional-source-test
          git rev-parse HEAD > lean-receipts/q2-conditional-source-test/HEAD
          sha256sum research/nightfall/formalization/universal/InfinitePiQ2ConditionalSourceTest.lean \
            research/nightfall/formalization/universal/InfinitePiQ2InfluenceStability.lean \
            > lean-receipts/q2-conditional-source-test/SOURCE_SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: q2-conditional-source-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: lean-receipts/q2-conditional-source-test
          if-no-files-found: warn
