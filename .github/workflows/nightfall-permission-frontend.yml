name: NIGHTFALL permission lab finite frontend replay
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/permission-lab*'
      - 'docs/index.html'
      - 'docs/research.html'
      - 'docs/active-proof-passport.html'
      - 'docs/cost-of-knowing.html'
      - 'docs/review.html'
      - 'docs/commonwealth-os.html'
      - 'docs/commonwealth.html'
      - 'docs/constellation.html'
      - 'docs/atlas.html'
      - 'tests/nightfall-permission-frontend.test.cjs'
      - 'tests/test_permission_lab_browser.mjs'
      - '.github/workflows/nightfall-permission-frontend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Node version and exact finite demo cases
        run: |
          node --version
          node --test tests/nightfall-permission-frontend.test.cjs
      - name: Browser functional regression on desktop and phone
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          CHROME_BIN="$(command -v google-chrome)" node --test tests/test_permission_lab_browser.mjs
      - name: Retain visual review screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nightfall-permission-lab-${{ github.run_id }}
          path: browser-artifacts/permission-lab-*.png
          if-no-files-found: warn
          retention-days: 30
