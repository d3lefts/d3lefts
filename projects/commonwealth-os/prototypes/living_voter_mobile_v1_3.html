<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><meta name="color-scheme" content="dark">
<title>Living Voter · Commonwealth OS — Mobile Prepilot v1.3</title>
<style>
:root{--bg:#0a1221;--s1:#111d30;--s2:#17263b;--line:#2b3d53;--text:#f6f8fd;--muted:#a9bdd1;--mint:#9fe5d5;--mint2:#284e51;--blue:#9ebafe;--gold:#e8d4ab;--red:#ffb7b6;--r:18px;--shadow:0 18px 60px #0003}
[hidden]{display:none!important}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 10% -25%,#254165 0%,var(--bg) 48%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;font-size:15px;line-height:1.52;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.46;cursor:not-allowed}a{color:var(--mint)}:focus-visible{outline:3px solid #e8d4ab;outline-offset:3px}button{-webkit-tap-highlight-color:transparent}
#stage{max-width:460px;min-height:100dvh;margin:0 auto;position:relative;background:linear-gradient(#0e192a,#0a1221);box-shadow:0 0 0 1px #ffffff08,0 0 85px #0008}
.appbar{height:76px;padding:21px 22px 10px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0e192afa 72%,#0e192ae9);border-bottom:1px solid #ffffff0b;backdrop-filter:blur(22px)}.brand{display:flex;align-items:center;gap:10px;min-width:0}.brandmark{height:33px;width:33px;display:grid;place-items:center;border:1px solid #6b8b9b;background:#18354b;border-radius:10px;color:var(--mint);font-size:22px;line-height:1}.brandtxt{font-size:12px;font-weight:780;letter-spacing:.15em;line-height:1.25}.brandsub{display:block;font-size:9px;font-weight:650;letter-spacing:.16em;color:var(--muted);margin-top:3px}.headright{display:flex;gap:8px;align-items:center}.chip{border:1px solid #496077;color:var(--muted);background:#101f32;display:inline-flex;gap:5px;align-items:center;border-radius:40px;padding:6px 10px;font-size:10px;font-weight:750;letter-spacing:.06em;white-space:nowrap;text-transform:uppercase}.chip.mint{border-color:#416e6c;color:var(--mint);background:#18363a}.chip.gold{border-color:#625746;color:var(--gold);background:#29271e}
main{padding:24px 22px calc(110px + env(safe-area-inset-bottom))}.prepilot{color:var(--mint);font-size:11px;text-transform:uppercase;font-weight:800;letter-spacing:.17em;margin:0 0 10px}.title{font-size:34px;line-height:1.1;letter-spacing:-.048em;font-weight:760;margin:8px 0 14px}.title.sm{font-size:29px}.title.xs{font-size:25px}.lead{color:var(--muted);font-size:15px;line-height:1.62;margin:0 0 20px}.muted{color:var(--muted)}.tiny{font-size:11px}.small{font-size:13px}.semibold{font-weight:700}.row{display:flex;align-items:center;gap:10px}.row.between{justify-content:space-between}.stack{display:grid;gap:12px}.card{background:linear-gradient(140deg,#18283e,#101e31);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:15px 0;box-shadow:0 4px 20px #0000000d}.card.soft{background:#142238}.card h3{font-size:17px;line-height:1.25;margin:5px 0 8px;letter-spacing:-.02em}.card p{margin:7px 0}.sectionTitle{font-size:16px;font-weight:760;margin:24px 0 10px;letter-spacing:-.025em}.eyebrow{font-size:10px;color:var(--mint);text-transform:uppercase;letter-spacing:.15em;font-weight:800}.rule{border-top:1px solid var(--line);margin:14px 0}.pill{display:inline-block;padding:4px 9px;border-radius:9px;color:var(--muted);background:#223146;font-size:11px;margin:2px 5px 2px 0}.pill.mint{color:var(--mint);background:#1c4042}.pill.blue{color:var(--blue);background:#263655}.pill.gold{color:var(--gold);background:#3d342b}.pill.red{color:var(--red);background:#402a33}
.btn{width:100%;min-height:51px;border-radius:13px;padding:12px 14px;font-weight:750;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:9px;line-height:1.25;transition:transform .1s,background .1s}.btn:active{transform:scale(.985)}.btn.primary{background:var(--mint);color:#092129}.btn.secondary{background:#24364e;color:var(--text);border-color:#3a516c}.btn.ghost{background:transparent;color:var(--muted);border-color:#3a5064}.btn.tertiary{background:transparent;border:none;color:var(--mint)}.btn.warn{background:transparent;color:var(--red);border:1px solid #795258}.actions{display:grid;gap:10px;margin-top:17px}.miniBtn{font-size:12px;min-height:34px;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:#23364c;color:var(--text);font-weight:660}
.heroGraphic{background:radial-gradient(circle at 65% 40%,#2b5b64 0%,#152e42 38%,#132237 72%);border:1px solid #345064;border-radius:21px;height:177px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin:19px 0 22px}.heroGraphic:before,.heroGraphic:after{content:"";position:absolute;border:1px solid #8dd6d644;border-radius:50%;width:310px;height:310px;top:-67px;left:30px}.heroGraphic:after{width:218px;height:218px;top:-19px;left:75px}.heroGraphic .ballot{position:relative;z-index:1;width:105px;height:118px;border:1px solid #9fe5d599;background:#183a48;border-radius:14px;padding:18px;box-shadow:0 11px 30px #0005;transform:rotate(-6deg)}.ballot .line{width:100%;height:7px;background:#4f7884;border-radius:4px;margin:10px 0}.ballot .line.short{width:60%}.ballot .check{position:absolute;right:8px;bottom:-12px;background:#9fe5d5;color:#15353a;border-radius:12px;padding:8px 12px;font-size:22px;font-weight:900}
.progress{height:5px;background:#293b50;border-radius:10px;overflow:hidden;margin:13px 0 24px}.progress div{height:100%;background:var(--mint);transition:width .15s}.option{display:flex;width:100%;min-height:52px;align-items:center;justify-content:space-between;border:1px solid #3d5269;background:#172940;border-radius:12px;padding:13px 15px;color:var(--text);margin:8px 0;text-align:left}.option.sel{border-color:var(--mint);background:#1d3b43}.option .ring{height:18px;width:18px;border:2px solid #7891a7;border-radius:50%;flex:none}.option.sel .ring{border:5px solid var(--mint)}.callout{border-left:3px solid var(--mint);background:#142c3a;padding:13px 14px;border-radius:0 12px 12px 0;color:#d5e9f0;margin:18px 0;font-size:12px;line-height:1.6}.callout.gold{border-color:var(--gold);background:#2c2930}.select{border:1px solid var(--line);background:var(--s2);color:var(--text);padding:13px;border-radius:12px;width:100%}
.stories{display:grid;gap:10px}.issueCard{width:100%;display:block;text-align:left;border:1px solid var(--line);background:linear-gradient(100deg,#16263c,#122035);border-radius:16px;color:var(--text);padding:16px;min-height:145px}.issueCard:active{border-color:var(--mint)}.issueCard h3{font-size:16px;line-height:1.3;margin:9px 0}.issueCard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:11px}.issueCard .suffix{color:var(--mint);font-weight:720;font-size:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.stat{background:#182b40;border:1px solid var(--line);border-radius:15px;padding:13px}.stat strong{display:block;font-size:29px;letter-spacing:-.04em}.stat span{display:block;font-size:11px;color:var(--muted)}.persona{display:grid;grid-template-columns:39px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #2c3e52}.persona:last-child{border-bottom:none}.avatar{width:37px;height:37px;border-radius:50%;background:#293b54;border:1px solid #4c617c;display:grid;place-items:center;font-weight:800;font-size:12px;color:#d6e3f9}.persona .name{font-size:13px;font-weight:730}.persona .role{font-size:11px;color:var(--muted)}.position{font-size:13px;font-weight:800;color:var(--text);padding:5px 9px;border-radius:8px;background:#23394d;white-space:nowrap}.position.nv{color:var(--gold)}.tabs{display:flex;gap:5px;margin:15px 0}.tabs button{background:#1d2c40;border:1px solid #33475d;padding:8px 11px;color:var(--muted);font-size:12px;border-radius:11px;flex:1}.tabs button.selected{background:#264f55;border-color:#4c8987;color:var(--mint);font-weight:750}.input{width:100%;background:#16273c;border:1px solid #48617c;border-radius:12px;color:var(--text);font-size:15px;padding:13px}.input::placeholder{color:#95aabf}
.bottom{position:fixed;bottom:0;width:100%;max-width:460px;height:calc(74px + env(safe-area-inset-bottom));background:#0e1b2bf2;border-top:1px solid #334358;display:grid;grid-template-columns:repeat(4,1fr);padding:9px 9px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(20px);z-index:20}.nav{background:transparent;border:0;color:#9eb1c4;font-size:10px;letter-spacing:.01em;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:center;min-height:47px}.nav .symbol{font-size:21px;line-height:20px}.nav.active{color:var(--mint);font-weight:770}.stepno{display:inline-flex;align-items:center;justify-content:center;border:1px solid #476077;width:27px;height:27px;border-radius:8px;color:var(--mint);font-weight:850;font-size:12px}.decisionBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:17px}.decisionBtns .btn{font-size:16px}.disabledExplain{padding:12px;border:1px dashed #60758c;border-radius:10px;font-size:12px;color:var(--muted)}.source{font-size:12px;color:#d2e9f3;overflow-wrap:anywhere;text-decoration:underline;text-underline-offset:3px}.timeline{border-left:2px solid #45637a;padding-left:15px;margin:10px 0 10px 12px}.timeline > div{position:relative;margin-bottom:16px}.timeline > div:before{content:"";position:absolute;width:9px;height:9px;background:var(--mint);border-radius:50%;left:-20.5px;top:7px}.label{font-size:10px;letter-spacing:.1em;font-weight:800;color:var(--mint);text-transform:uppercase}.barline{height:1px;background:#2e4155;margin:13px 0}.legal{font-size:11px;color:#93a8bd;line-height:1.55;margin:16px 0}.empty{border:1px dashed #566a7e;border-radius:14px;padding:20px;color:var(--muted);font-size:14px;text-align:center}
@media(min-width:700px){body{padding:30px 0}#stage{border-radius:26px;overflow:hidden;min-height:880px}.bottom{bottom:30px;border-radius:0 0 26px 26px}main{min-height:780px}}@media(prefers-reduced-motion:reduce){*,*::after,*::before{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body><div id="stage"><header class="appbar"><div class="brand"><div class="brandmark" aria-hidden="true">◇</div><div class="brandtxt">COMMONWEALTH <span style="color:var(--mint)">OS</span><span class="brandsub">THE LIVING VOTER</span></div></div><div class="headright"><span class="chip">RESEARCH DEMO</span></div></header><main id="view" aria-live="polite"></main><nav class="bottom" id="bottomNav" aria-label="Main navigation" hidden></nav></div>
<script>
'use strict';
// Demonstration data, independently linked to dated official House and Senate roll-call records.
const issues=[
{id:'h297',chamber:'House',date:'2026-09-14',reference:'H.R. 3276',roll:'House 297',type:'House passage motion under suspension',title:'Local Communities & Bird Habitat Stewardship Act',question:'On Motion to Suspend the Rules and Pass, as Amended',result:'Passed (345 Yea; 60 Nay; 27 Not Voting)',source:'https://clerk.house.gov/Votes/2026297',positions:[{name:'Rep. Dale Strong',role:'Alabama · House District 5',initials:'DS',vote:'Nay'}],yea:'Support passing this amended House bill under the suspension-of-the-rules procedure.',nay:'Oppose passing this amended House bill under that procedure.',caveat:'The record does not explain individual members\' motives. It is not evidence of their positions on every provision in the bill.',comparable:'Only House members voted on this House roll call. Alabama senators have no recorded vote on this House question.',scope:'Substantive passage motion'},
{id:'s259',chamber:'Senate',date:'2026-11-12',reference:'PN1181-1',roll:'Senate 259',type:'Senate cloture motion',title:'Cloture on Gregory Carl Cook nomination',question:'On the Cloture Motion (Motion to Invoke Cloture: Gregory Carl Cook to be U.S. District Judge for the Northern District of Alabama)',result:'Cloture motion agreed to',source:'https://www.senate.gov/legislative/LIS/roll_call_votes/vote1192/vote_119_2_00259.htm',positions:[{name:'Sen. Katie Britt',role:'Alabama · U.S. Senator',initials:'KB',vote:'Yea'},{name:'Sen. Tommy Tuberville',role:'Alabama · U.S. Senator',initials:'TT',vote:'Yea'}],yea:'Support ending debate under the Senate cloture procedure, allowing the nomination to proceed.',nay:'Oppose invoking cloture at that time; this is not necessarily a vote against confirmation.',caveat:'Cloture is a procedural decision. A Yea here is not a final confirmation vote, and the vote alone cannot establish why a senator acted.',comparable:'House members do not vote on Senate cloture motions.',scope:'Procedure, not confirmation'},
{id:'s262',chamber:'Senate',date:'2026-11-12',reference:'PN1181-7',roll:'Senate 262',type:'Senate cloture motion',title:'Cloture on Anna St. John nomination',question:'On the Cloture Motion (Motion to Invoke Cloture: Anna St. John to be U.S. Circuit Judge for the Fifth Circuit)',result:'Cloture motion agreed to',source:'https://www.senate.gov/legislative/LIS/roll_call_votes/vote1192/vote_119_2_00262.htm',positions:[{name:'Sen. Katie Britt',role:'Alabama · U.S. Senator',initials:'KB',vote:'Yea'},{name:'Sen. Tommy Tuberville',role:'Alabama · U.S. Senator',initials:'TT',vote:'Not Voting'}],yea:'Support invoking cloture and allowing the Senate to proceed to further consideration.',nay:'Oppose invoking cloture at this time. This is not itself a final confirmation vote.',caveat:'“Not Voting” means no recorded Yea or Nay on this roll call. It does not imply opposition or support.',comparable:'House members do not vote on Senate cloture motions.',scope:'Procedure, not confirmation'}
];
const survey=[
{topic:'Transparent administration',q:'Should a hypothetical student council normally publish its meeting agenda at least 72 hours beforehand?',note:'Illustrative institutional question · not an actual referendum.'},
{topic:'Local spending rules',q:'Should a hypothetical association require a membership vote before expenditures above a published threshold?',note:'Illustrative governance question · legal franchise unspecified.'},
{topic:'Legislative transparency',q:'Should a legislature publish an explanation of each recorded vote alongside a link to its exact text?',note:'Illustrative policy question · not a recorded congressional ballot.'},
{topic:'Deliberation process',q:'Should a legislative body provide an opportunity to review competing arguments before a binding policy vote?',note:'Illustrative process preference · not a real ballot.'}
];
const state={view:'welcome',surveyIndex:0,answers:{},choices:{},selected:'h297',filter:'All',query:'',explainFirst:true};
const view=document.getElementById('view');const nav=document.getElementById('bottomNav');
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function go(v){state.view=v;render();window.scrollTo({top:0,behavior:'instant'});}function detail(id){state.selected=id;go('brief');}
function button(label,action,cl='primary',extra=''){return `<button class="btn ${cl}" data-action="${action}" ${extra}>${label}</button>`}
function issueCard(r){const chosen=state.choices[r.id];return `<button class="issueCard" data-action="open:${r.id}"><span class="meta"><span>${escapeHTML(r.roll)} · ${escapeHTML(r.date)}</span><span class="pill ${r.chamber==='House'?'blue':'gold'}">${r.chamber}</span></span><h3>${escapeHTML(r.title)}</h3><span class="small muted">${escapeHTML(r.scope)}</span><div class="barline"></div><span class="suffix">${chosen?'View your choice and official record':'Review the exact question'}  ›</span></button>`;}
function renderWelcome(){return `<p class="prepilot">A citizen-centered democracy</p><h1 class="title">Government should be understandable.</h1><p class="lead">Learn what a public decision means, decide how <em>you</em> would vote, then inspect how your elected officials actually voted.</p><div class="heroGraphic" aria-hidden="true"><div class="ballot"><div class="line short"></div><div class="line"></div><div class="line short"></div><div class="check">✓</div></div></div><section class="card"><div class="eyebrow">Demonstration constituency</div><h3>Alabama · Congressional District 5</h3><p class="small muted">One House representative and Alabama's two U.S. senators. This is a fixed example, <strong>not</strong> your inferred location or voting registration.</p></section><div class="callout">Your survey responses and simulated choices stay in this browser page's memory only. Refreshing or closing clears them. No official votes are cast.</div><div class="actions">${button('Start with a brief, optional survey  →','start')}${button('Skip survey · explore decisions','skip','secondary')}</div><p class="legal">Independent judgment first. Civic AI is not connected in this research preview; the source material is presented directly.</p>`;}
function renderSurvey(){const i=state.surveyIndex,s=survey[i];const options=['Support',"Don't support",'No preference','Need more information','Skip'];return `<div class="row between"><p class="prepilot" style="margin:0">Your civic starting point</p><span class="chip">${i+1} of ${survey.length}</span></div><div class="progress"><div style="width:${(i+1)/survey.length*100}%"></div></div><h1 class="title sm">What matters to you?</h1><p class="lead">These questions organize the issues you might explore. They do not determine a party or automatically cast votes.</p><section class="card"><div class="eyebrow">${escapeHTML(s.topic)}</div><h3 style="font-size:21px;line-height:1.36;margin:13px 0">${escapeHTML(s.q)}</h3><p class="tiny muted">${escapeHTML(s.note)}</p></section><div class="stack">${options.map((x,i)=>`<button class="option" data-action="survey:${i}"><span>${escapeHTML(x)}</span><span class="ring"></span></button>`).join('')}</div><div class="actions">${i>0?button('Back to previous question','surveyBack','ghost'):''}${button('Skip entire survey','skip','tertiary')}</div><p class="legal">A question's wording can affect responses. These illustrative questions have not completed an independent neutrality study.</p>`;}
function renderHome(){const count=Object.keys(state.choices).length;const answered=Object.values(state.answers).filter(v=>v!=='Skip').length;return `<div class="row between"><div><p class="prepilot">Your civic home</p><h1 class="title sm">The Living Voter</h1></div><span class="chip mint">Private demo</span></div><p class="lead">Your questions, your choices, and the public record—kept distinct.</p><section class="card" style="background:linear-gradient(135deg,#1d4749,#182841 70%);border-color:#43696e"><div class="eyebrow">Ready for an informed decision?</div><h3 style="font-size:23px;margin:10px 0">Understand the question. Then choose.</h3><p class="small muted">Read the exact motion, consider both options, and record a nonbinding retrospective vote.</p><div class="actions">${button('Explore governance decisions  →','explore')}</div></section><div class="stats"><div class="stat"><span>Survey answers</span><strong>${answered}<small style="font-size:14px;color:var(--muted)"> / ${survey.length}</small></strong><span>Private issue views</span></div><div class="stat"><span>My simulated votes</span><strong>${count}</strong><span>Not official ballots</span></div></div><div class="row between"><h2 class="sectionTitle">My policy views</h2><button class="miniBtn" data-action="reviewSurvey">Review ›</button></div><section class="card soft">${Object.keys(state.answers).length ? survey.map((q,i)=>`<div class="row between" style="gap:12px;padding:8px 0;border-bottom:1px solid #ffffff13"><div class="small" style="max-width:72%">${escapeHTML(q.topic)}</div><span class="pill ${state.answers[i]==='Support'?'mint':''}">${escapeHTML(state.answers[i]||'Unanswered')}</span></div>`).join('') : '<p class="small muted">No questionnaire answers recorded. The survey is optional.</p>'}<p class="tiny muted" style="margin-top:13px">Responses are your direct answers to illustrative wording, not automatic positions on enacted laws.</p></section><div class="row between"><h2 class="sectionTitle">A decision to explore</h2><button class="miniBtn" data-action="explore">View all ›</button></div>${issueCard(issues[0])}<h2 class="sectionTitle">How the proof works</h2><div class="card soft"><div class="timeline"><div><div class="label">01 · Source</div><div class="small">Start from the actual recorded question, not an AI-generated paraphrase.</div></div><div><div class="label">02 · Agency</div><div class="small">You independently choose how you would have voted.</div></div><div><div class="label">03 · Accountability</div><div class="small">See the exact dated official record and its limits.</div></div></div></div><div class="callout gold">Three dated congressional roll calls are included. This is not a complete archive of all historical issues.</div>`;}
function renderReviewSurvey(){return `<p class="prepilot">Your answers, in your words</p><h1 class="title sm">Review my policy views</h1><p class="lead">Answers reflect the exact illustrative questions, not inferred party affiliation or votes on existing bills.</p>${survey.map((q,i)=>`<section class="card"><span class="eyebrow">${escapeHTML(q.topic)}</span><h3>${escapeHTML(q.q)}</h3><span class="pill ${state.answers[i]==='Support'?'mint':''}">${escapeHTML(state.answers[i]||'Not answered')}</span><p class="tiny muted">${escapeHTML(q.note)}</p></section>`).join('')}<div class="actions">${button('Retake the optional survey','retake','secondary')}${button('Back to dashboard','home','ghost')}</div>`;}
function renderExplore(){let records=issues.filter(x=>(state.filter==='All'||x.chamber===state.filter)&&(`${x.title} ${x.reference} ${x.question}`.toLowerCase().includes(state.query.toLowerCase())));return `<p class="prepilot">Public decisions</p><h1 class="title sm">Explore the record</h1><p class="lead">Every example is tied to the exact House or Senate roll-call question. Recorded votes are not the same as political positions on an entire issue.</p><label class="visually-hidden" for="issueSearch">Search issues</label><input class="input" id="issueSearch" type="search" placeholder="Search bill, nomination, or motion" value="${escapeHTML(state.query)}"><div class="tabs" role="group" aria-label="Chamber filter">${['All','House','Senate'].map(x=>`<button class="${state.filter===x?'selected':''}" data-action="filter:${x}">${x}</button>`).join('')}</div><div class="stories">${records.map(issueCard).join('')||'<div class="empty">No matching records in the three-item demo.</div>'}</div><div class="callout"><strong>Coverage notice:</strong> This prepilot includes three selected primary-source examples, not all relevant congressional votes. A production system requires complete-source ingestion and an auditable relevance policy.</div>`;}
function renderBrief(){const r=issues.find(x=>x.id===state.selected);return `<button class="miniBtn" data-action="explore">‹ All public decisions</button><p class="prepilot" style="margin-top:22px">Read before you decide</p><h1 class="title xs">${escapeHTML(r.title)}</h1><div class="row" style="flex-wrap:wrap"><span class="pill">${escapeHTML(r.reference)}</span><span class="pill">${escapeHTML(r.roll)}</span><span class="pill">${escapeHTML(r.date)}</span></div><section class="card" style="border-color:#4b697a"><div class="eyebrow">Exact recorded question</div><h3>${escapeHTML(r.question)}</h3><p class="small muted">${escapeHTML(r.type)} · ${escapeHTML(r.result)}</p><a class="source" href="${r.source}" target="_blank" rel="noopener noreferrer">Read the primary official roll-call record ↗</a></section><h2 class="sectionTitle">Understand your choices</h2><div class="card"><span class="pill mint">A Yea would mean</span><p>${escapeHTML(r.yea)}</p><div class="rule"></div><span class="pill gold">A Nay would mean</span><p>${escapeHTML(r.nay)}</p></div><section class="card soft"><div class="eyebrow">What the record cannot tell you</div><p class="small muted">${escapeHTML(r.caveat)}</p><p class="small muted">${escapeHTML(r.comparable)}</p></section><div class="callout gold">Evidence is limited to this exact official roll call. No verified fiscal scoring, bill-section analysis, or personalized AI analysis is provided in this demo.</div><div class="actions">${button('I understand · simulate my vote  →','vote')}${button('Back to the record','explore','secondary')}</div>`;}
function renderVote(){const r=issues.find(x=>x.id===state.selected);return `<p class="prepilot">Nonbinding retrospective choice</p><h1 class="title sm">How would you have voted?</h1><section class="card"><div class="eyebrow">${escapeHTML(r.roll)} · ${escapeHTML(r.date)}</div><h3>${escapeHTML(r.title)}</h3><p class="small muted">${escapeHTML(r.question)}</p></section><div class="callout gold"><strong>This is a simulation.</strong> Your selection is not a ballot you cast in the past, and it does not change the government's recorded result.</div><div class="decisionBtns">${button('Yea','choose:Yea')}${button('Nay','choose:Nay','secondary')}</div><div class="actions">${button('No preference','choose:No preference','ghost')}${button('I need to review the source','backBrief','tertiary')}</div><p class="legal">Before seeing the named official positions, make your own choice. You may revise or delete it afterward.</p>`;}
function renderCompare(){const r=issues.find(x=>x.id===state.selected);const x=state.choices[r.id];return `<p class="prepilot">Your choice · The public record</p><h1 class="title sm">Now compare the decisions.</h1><section class="card" style="background:linear-gradient(135deg,#194548,#12253a);border-color:#47716f"><div class="eyebrow">My retrospective vote</div><h3 style="font-size:30px;margin:12px 0">${escapeHTML(x||'No choice recorded')}</h3><span class="chip mint">Simulated · Private</span><p class="small muted">${escapeHTML(r.title)} · ${escapeHTML(r.date)}</p></section><section class="card"><div class="row between"><h3>Official member record</h3><span class="pill blue">Same motion</span></div>${r.positions.map(p=>`<div class="persona"><div class="avatar">${p.initials}</div><div><div class="name">${escapeHTML(p.name)}</div><div class="role">${escapeHTML(p.role)}</div></div><span class="position ${p.vote==='Not Voting'?'nv':''}">${escapeHTML(p.vote)}</span></div>`).join('')}<p style="margin-top:14px"><a class="source" href="${r.source}" target="_blank" rel="noopener noreferrer">Verify this roll call at the official source ↗</a></p></section><div class="callout">${escapeHTML(r.comparable)} ${escapeHTML(r.caveat)}</div><div class="actions">${button('Explore another decision  →','explore')}${button('Change my simulated choice','vote','secondary')}${button('View my vote history','history','ghost')}</div>`;}
function renderHistory(){const rows=Object.entries(state.choices);return `<p class="prepilot">My simulated decisions</p><h1 class="title sm">Your private vote history</h1><p class="lead">Your choices during this visit. These are never official referendum or congressional ballots.</p>${rows.length?rows.map(([id,val])=>{const r=issues.find(x=>x.id===id);return `<section class="card"><div class="row between"><span class="pill">${escapeHTML(r.roll)}</span><span class="tiny muted">${escapeHTML(r.date)}</span></div><h3>${escapeHTML(r.title)}</h3><div class="row between"><span class="small muted">My simulated vote</span><span class="position">${escapeHTML(val)}</span></div><div class="rule"></div><p class="small muted">Official positions: ${r.positions.map(p=>`${escapeHTML(p.name)} — ${escapeHTML(p.vote)}`).join('; ')}</p><div class="row" style="justify-content:space-between;gap:12px;margin-top:13px"><button class="miniBtn" data-action="compare:${id}">View exact record</button><button class="miniBtn" data-action="delete:${id}" style="color:var(--red)">Delete my choice</button></div></section>`}).join(''):'<div class="empty">Your ledger is empty. Start with a sourced public decision, then simulate how you would vote.</div>'}<div class="actions">${button('Explore decisions','explore','secondary')}</div>`;}
function renderSettings(){return `<p class="prepilot">Privacy · Methodology</p><h1 class="title sm">Your decisions belong to you.</h1><div class="card"><h3>What this prototype stores</h3><p class="small muted">Survey answers and simulated votes exist only in the current page's memory. There is no backend, no account, no analytics, and no local-storage persistence in this HTML artifact.</p><p class="small muted">Refreshing or closing the page clears the demonstration data. You can also clear it immediately below.</p><div class="actions">${button('Clear all private demo data','reset','warn')}</div></div><div class="card"><h3>Evidence and democratic assurance</h3><div class="timeline"><div><div class="label">Verified public facts</div><div class="small">Three dated House/Senate roll calls linked directly to official chamber records.</div></div><div><div class="label">User-generated private facts</div><div class="small">Your answers and hypothetical retrospective choices, which are not verified historic ballots.</div></div><div><div class="label">Not established here</div><div class="small">Real election security, legal eligibility, binding voter consent, complete roll-call coverage, unbiased AI advice, or equal civic outcomes.</div></div></div></div><div class="card"><h3>Source coverage</h3><p class="small muted">Example set as of November 15, 2026: House 297 from September 14; Senate 259 and 262 from November 12. Official links appear within every item. This prototype does not claim to fetch all relevant votes or infer a representative's position from a related matter.</p></div>`;}
function render(){let output;if(state.view==='welcome')output=renderWelcome();else if(state.view==='survey')output=renderSurvey();else if(state.view==='home')output=renderHome();else if(state.view==='explore')output=renderExplore();else if(state.view==='reviewSurvey')output=renderReviewSurvey();else if(state.view==='brief')output=renderBrief();else if(state.view==='vote')output=renderVote();else if(state.view==='compare')output=renderCompare();else if(state.view==='history')output=renderHistory();else output=renderSettings();view.innerHTML=output;const hasNav=!['welcome','survey'].includes(state.view);nav.hidden=!hasNav;if(hasNav){const selected=['brief','vote','compare'].includes(state.view)?'explore':(state.view==='reviewSurvey'?'home':state.view);nav.innerHTML=[['home','⌂','Home'],['explore','▤','Explore'],['history','✓','My votes'],['settings','⚙','Privacy']].map(([screen,icon,label])=>`<button class="nav ${screen===selected?'active':''}" data-action="${screen}" ${screen===selected?'aria-current="page"':''}><span class="symbol" aria-hidden="true">${icon}</span><span>${label}</span></button>`).join('')}const search=document.getElementById('issueSearch');if(search)search.addEventListener('input',e=>{state.query=e.target.value;const filtered=issues.filter(x=>(state.filter==='All'||x.chamber===state.filter)&&(`${x.title} ${x.reference} ${x.question}`.toLowerCase().includes(state.query.toLowerCase())));const list=document.querySelector('.stories');if(list)list.innerHTML=filtered.map(issueCard).join('')||'<div class="empty">No matching records in this three-item demo.</div>'})}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='start'){state.surveyIndex=0;go('survey')}else if(action==='skip'){go('home')}else if(action.startsWith('survey:')){state.answers[state.surveyIndex]=['Support',"Don't support",'No preference','Need more information','Skip'][Number(action.split(':')[1])];state.surveyIndex++;go(state.surveyIndex>=survey.length?'home':'survey')}else if(action==='surveyBack'){state.surveyIndex=Math.max(0,state.surveyIndex-1);go('survey')}else if(action.startsWith('open:')){detail(action.split(':')[1])}else if(action==='vote'){go('vote')}else if(action==='backBrief'){go('brief')}else if(action==='retake'){state.surveyIndex=0;go('survey')}else if(action.startsWith('choose:')){state.choices[state.selected]=action.slice(7);go('compare')}else if(action.startsWith('compare:')){state.selected=action.split(':')[1];go('compare')}else if(action.startsWith('delete:')){delete state.choices[action.split(':')[1]];go('history')}else if(action.startsWith('filter:')){state.filter=action.split(':')[1];go('explore')}else if(action==='reset'){state.answers={};state.choices={};state.surveyIndex=0;state.query='';state.filter='All';go('welcome')}else{go(action)}});
render();
</script></body></html>
