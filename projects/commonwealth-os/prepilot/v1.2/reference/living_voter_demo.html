<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Living Voter | Commonwealth OS — Prepilot</title>
<style>
:root{--bg:#0d1422;--surface:#172238;--sub:#1d2c45;--line:#35445e;--ink:#f3f7ff;--muted:#b9c9dd;--cyan:#85deee;--accent:#a6b6ff;--green:#a0efd1;--amber:#f1dba2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#1c2b46,#0d1422 50%);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.5}button,input{font:inherit}a{color:var(--cyan)}.container{max-width:1100px;margin:auto;padding:20px 18px 95px}.mast{display:flex;justify-content:space-between;align-items:center;gap:14px;margin:12px 0 30px}.logo{font-weight:800;letter-spacing:.09em;font-size:14px}.tag{font-size:11px;font-weight:750;letter-spacing:.04em;border:1px solid var(--line);border-radius:30px;padding:5px 9px;color:var(--muted)}h1{font-size:clamp(30px,5vw,50px);line-height:1.14;letter-spacing:-.035em;margin:8px 0 14px}h2{font-size:25px;line-height:1.18;margin:8px 0 16px}h3{font-size:18px;margin:2px 0 10px}p{margin:8px 0 16px}.muted{color:var(--muted)}.eyebrow{font-size:12px;color:var(--cyan);font-weight:750;letter-spacing:.09em;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.panel{background:var(--surface);border:1px solid var(--line);padding:20px;border-radius:18px;margin:14px 0}.small{font-size:13px}.btn{background:var(--cyan);color:#0b1724;border:0;border-radius:11px;padding:12px 17px;font-weight:750;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;text-align:center}.btn.secondary{background:var(--sub);color:var(--ink);border:1px solid var(--line)}.btn.tertiary{background:transparent;border:1px solid var(--line);color:var(--muted)}.btn:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:2px}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.choicegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:20px 0 10px}.choicegrid button{min-height:58px;padding:10px;border:1px solid var(--line);background:var(--sub);border-radius:12px;color:var(--ink);font-weight:650;cursor:pointer}.choicegrid button:hover,.choicegrid button:focus-visible{border-color:var(--cyan)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stats .panel{margin:0;padding:16px}.statval{font-size:28px;font-weight:800}.pill{display:inline-block;border:1px solid var(--line);border-radius:25px;padding:4px 8px;font-size:11px;color:var(--muted);margin-right:4px;margin-bottom:5px}.record{border-bottom:1px solid var(--line);padding:16px 0}.record:last-child{border:0}.record h3{margin:6px 0}.pairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.pair{border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--sub)}.pair .v{font-size:18px;font-weight:750}.note{border-left:3px solid var(--cyan);padding:9px 12px;background:#1e3348;margin:18px 0;border-radius:0 10px 10px 0}.topnav{display:flex;gap:8px;flex-wrap:wrap}.topnav button{padding:8px 12px}.sources{font-size:12px;color:var(--muted)}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}select{background:var(--sub);color:var(--ink);border:1px solid var(--line);padding:11px;border-radius:9px;max-width:100%}.limit{max-width:750px}.sep{height:1px;background:var(--line);margin:22px 0}@media(max-width:700px){.grid,.stats,.pairs{grid-template-columns:1fr}.choicegrid{grid-template-columns:1fr}.container{padding:14px 14px 85px}.panel{padding:16px}}
</style></head>
<body><div class="container">
<header class="mast"><div class="logo">◈ COMMONWEALTH <span style="color:var(--cyan)">OS</span></div><span class="tag">LIVING VOTER · RESEARCH PREPILOT</span></header>
<main id="app" aria-live="polite"></main>
<footer class="small muted" style="margin-top:45px;border-top:1px solid var(--line);padding-top:16px">Demonstration · No real ballots are cast · Survey/choices never sent to a server · Official sources are a limited dated snapshot, not a complete legislative archive or a judgment of any official.</footer>
</div>
<script>
'use strict';
const recordData = [
 {id:'US-H-119-2-297',date:'2026-09-14',title:'Local Communities & Bird Habitat Stewardship Act',question:'On Motion to Suspend the Rules and Pass, as Amended',type:'House final-passage motion under suspension',ref:'H.R. 3276',source:'https://clerk.house.gov/evs/2026/roll297',result:'Passed',positions:[['Rep. Dale Strong (AL-05)','Nay']],summary:'The recorded House question was whether to pass the amended bill under a special procedure. The complete text and its legislative history must be checked before drawing conclusions about individual provisions.',forText:'A member could favor passing the amended bill under this procedure to advance its stated conservation and local-stewardship purposes.',againstText:'A member could oppose the text, particular provisions, costs, or the special procedure; a Nay does not identify which reason applies.',mapping:'EXACT_QUESTION'},
 {id:'US-S-119-2-259',date:'2026-11-12',title:'Cloture on Gregory Carl Cook judicial nomination',question:'On the Cloture Motion (Motion to Invoke Cloture: Gregory Carl Cook to be U.S. District Judge for the Northern District of Alabama)',type:'Senate procedural cloture',ref:'PN1181-1',source:'https://www.senate.gov/legislative/LIS/roll_call_votes/vote1192/vote_119_2_00259.htm',result:'Cloture Motion Agreed to',positions:[['Sen. Katie Britt (AL)','Yea'],['Sen. Tommy Tuberville (AL)','Yea']],summary:'This is a vote on invoking cloture, a procedural step addressing debate on a nomination. It is not by itself a confirmation vote.',forText:'A member could favor ending debate and moving the nomination toward further Senate consideration.',againstText:'A member could favor additional debate or oppose proceeding at that time. Neither position alone establishes a complete view of the nominee.',mapping:'EXACT_QUESTION'},
 {id:'US-S-119-2-262',date:'2026-11-12',title:'Cloture on Anna St. John judicial nomination',question:'On the Cloture Motion (Motion to Invoke Cloture: Anna St. John to be U.S. Circuit Judge for the Fifth Circuit)',type:'Senate procedural cloture',ref:'PN1181-7',source:'https://www.senate.gov/legislative/LIS/roll_call_votes/vote1192/vote_119_2_00262.htm',result:'Cloture Motion Agreed to',positions:[['Sen. Katie Britt (AL)','Yea'],['Sen. Tommy Tuberville (AL)','Not Voting']],summary:'This is a procedural Senate cloture vote, not the eventual confirmation decision. “Not Voting” means no vote is recorded for that senator on this roll call.',forText:'A member could support bringing debate to an end so that the chamber can proceed.',againstText:'A member could prefer debate to continue or oppose proceeding now. The recorded vote cannot reveal motive.',mapping:'EXACT_QUESTION'}
];
const questions=[
 {topic:'Public transparency',q:'Should a student organization normally publish its meeting agendas at least 72 hours in advance?',scope:'Illustrative organizational rule; not an enacted law.'},
 {topic:'Local budgets',q:'Should a hypothetical local association require a membership vote for expenditures above a stated threshold?',scope:'Illustrative association governance; no verified legal franchise.'},
 {topic:'Environmental policy',q:'Should a legislature consider legislation supporting community habitat stewardship, subject to a published fiscal analysis?',scope:'Illustrative issue question; not an exact match to H.R. 3276.'},
 {topic:'Congressional procedure',q:'Should a legislative chamber generally limit debate on nominations under its duly adopted rules?',scope:'Illustrative procedural preference; not a vote on PN1181-1 or PN1181-7.'}
];
const state={screen:'welcome',surveyIndex:0,survey:[],choices:{},active:null};
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=document.getElementById('app');
function setScreen(s){state.screen=s;render();window.scrollTo(0,0)}
function button(txt,fn,cls='secondary'){const b=document.createElement('button');b.type='button';b.className='btn '+cls;b.textContent=txt;b.addEventListener('click',fn);return b;}
function layout(head,html){app.innerHTML='<div class="eyebrow">'+esc(head)+'</div>'+html;}
function welcome(){layout('Step 1 of 3 · Private introduction',`<div class="limit"><h1>Democracy, in the present tense.</h1><p class="muted">Explore how you would evaluate a governance question, make an informed choice, and inspect the recorded votes of your representatives.</p><div class="panel"><h3>Your demonstration constituency</h3><p>Alabama · U.S. House District 5 · Alabama U.S. Senators</p><span class="pill">Example selected for this demo</span><span class="pill">Not inferred from your location</span><p class="small muted">A complete service would ask you to select and verify the state and House district you want to examine; it would never assume your voting address from device location.</p></div><div class="note small">This is a nonbinding retrospective simulation. Your survey answers and simulated choices remain in this open page only; closing or refreshing clears them. No party or ideological profile is created or shared.</div></div>`);app.append(button('Start optional survey',()=>setScreen('survey'),'primary'));}
function survey(){const i=state.surveyIndex,q=questions[i];layout('Step 2 of 3 · Voluntary survey',`<div class="limit"><h1>Your policy views</h1><p class="muted">Question ${i+1} of ${questions.length}. Answering helps organize questions you might want to review; an answer is <strong>not a vote</strong>.</p><div class="panel"><span class="pill">${esc(q.topic)}</span><h2>${esc(q.q)}</h2><p class="small muted">${esc(q.scope)}</p></div><div class="note small">Need more information? No answer is required. Survey answers are direct opinions on this wording, not inferred positions on related laws.</div></div>`);const grid=document.createElement('div');grid.className='choicegrid limit';for(const v of ['Support','Don\'t support','No preference'])grid.append(button(v,()=>answer(v),'secondary'));app.append(grid);const foot=document.createElement('div');foot.className='bar';foot.append(button('Need more information',()=>answer('Need more information'),'tertiary'),button('Skip question',()=>answer('Skipped'),'tertiary'));app.append(foot);}
function answer(v){state.survey[state.surveyIndex]=v;state.surveyIndex++;if(state.surveyIndex>=questions.length)setScreen('dashboard');else render();}
function dashboard(){let choices=Object.values(state.choices);layout('Step 3 of 3 · Living Voter Dashboard',`<h1>Your living voter dashboard</h1><p class="muted">Your research views, retrospective decisions, and documented congressional roll calls are separate evidence types.</p><div class="stats"><section class="panel"><div class="eyebrow">Survey questions answered</div><div class="statval">${state.survey.filter(x=>x&&x!=='Skipped').length} / ${questions.length}</div><div class="small muted">Private issue views</div></section><section class="panel"><div class="eyebrow">Choices made here</div><div class="statval">${choices.length}</div><div class="small muted">Nonbinding retrospective choices</div></section><section class="panel"><div class="eyebrow">Verified example roll calls</div><div class="statval">${recordData.length}</div><div class="small muted">Limited Alabama snapshot</div></section></div><div class="bar" style="margin:14px 0"><button id="reset" class="btn tertiary">Clear my answers and restart</button><button id="surveyagain" class="btn secondary">Review survey answers</button></div><div class="grid"><section class="panel"><h2>How would you vote?</h2><p class="small muted">Choose a verified historical parliamentary question. See its original text, evidence and procedural meaning before recording your hypothetical choice.</p><div id="issues"></div></section><section class="panel"><h2>My decision history</h2><p class="small muted">Selections made inside this demonstration only. These are <strong>not</strong> your past official ballots.</p><div id="history"></div></section></div><div class="panel"><h3>Coverage and honest limits</h3><p class="small muted">These three source-backed records illustrate the comparison workflow. They do not represent all relevant legislation, all legislators or every vote. Voice votes and unanimous consent often have no member-by-member record. Further issues require reviewed source ingestion and an explicit source coverage report.</p></div>`);document.getElementById('reset').onclick=()=>{state.survey=[];state.surveyIndex=0;state.choices={};setScreen('welcome')};document.getElementById('surveyagain').onclick=()=>setScreen('surveyReview');const issues=document.getElementById('issues');for(const r of recordData){const div=document.createElement('article');div.className='record';div.innerHTML=`<div class="small muted">${esc(r.date)} · ${esc(r.ref)} · ${esc(r.type)}</div><h3>${esc(r.title)}</h3><div class="small muted">${esc(r.question)}</div>`;div.append(button('Review and simulate vote',()=>{state.active=r.id;setScreen('issue');},'secondary'));issues.append(div)}let hist=document.getElementById('history');if(!choices.length)hist.innerHTML='<p class="small muted">No simulated choices yet. Explore any issue at left.</p>';else for(const [id,ch] of Object.entries(state.choices)){const r=recordData.find(x=>x.id===id);let p=document.createElement('article');p.className='record';p.innerHTML=`<div class="small muted">${esc(r.date)} · ${esc(r.ref)}</div><h3>${esc(r.title)}</h3><p>My retrospective choice: <strong>${esc(ch)}</strong></p><p class="small muted">Not an official historical vote</p><div class="pairs">${r.positions.map(v=>`<div class="pair"><div class="small">${esc(v[0])}</div><div class="v">${esc(v[1])}</div><a class="small" target="_blank" rel="noopener" href="${esc(r.source)}">Official record</a></div>`).join('')}</div>`;hist.append(p);}}
function surveyReview(){layout('Private survey responses',`<h1>What you answered</h1><p class="muted">These are statements on exact question wording, not party classifications or official votes.</p><div class="panel">${questions.map((q,i)=>`<div class="record"><span class="pill">${esc(q.topic)}</span><h3>${esc(q.q)}</h3><strong>${esc(state.survey[i]||'Not answered')}</strong><p class="small muted">${esc(q.scope)}</p></div>`).join('')}</div>`);app.append(button('Return to dashboard',()=>setScreen('dashboard'),'primary'));}
function issue(){const r=recordData.find(x=>x.id===state.active);layout('Nonbinding historical decision simulator',`<h1>${esc(r.title)}</h1><div class="bar"><span class="pill">${esc(r.ref)}</span><span class="pill">${esc(r.date)}</span><span class="pill">${esc(r.type)}</span><span class="pill">Exact roll-call question</span></div><section class="panel"><h3>What the chamber actually voted on</h3><p>${esc(r.question)}</p><p class="muted small">${esc(r.summary)}</p><p><a href="${esc(r.source)}" target="_blank" rel="noopener">Read official roll-call record</a></p></section><div class="grid"><section class="panel"><h3>Consideration favoring Yea</h3><p>${esc(r.forText)}</p></section><section class="panel"><h3>Consideration favoring Nay</h3><p>${esc(r.againstText)}</p></section></div><section class="panel"><h3>Material uncertainty and context</h3><p class="small muted">The official record establishes who voted on this exact question. It does not establish each member's reasons, individual positions on every provision, private intent, or other votes. For complete analysis, consult the current legislative text, other votes on the matter and fiscal evidence where available; this demo does not certify full coverage.</p><p class="small"><strong>Result:</strong> ${esc(r.result)}. <strong>Source match:</strong> exact roll-call question.</p></section><div class="panel"><h3>How would you have voted on this exact question?</h3><p class="small muted">Your answer is a new private simulation recorded today, not a ballot cast in ${esc(r.date.slice(0,4))}. It does not count toward the official tally or establish eligibility.</p><div class="choicegrid" id="simchoices"></div><div class="bar" id="simactions"></div></div>`);const grid=document.getElementById('simchoices');for(const x of ['Yea','Nay','No preference'])grid.append(button(x,()=>{state.choices[r.id]=x;setScreen('dashboard')},'secondary'));document.getElementById('simactions').append(button('Return without choosing',()=>setScreen('dashboard'),'tertiary'));}
function render(){if(state.screen==='welcome')welcome();else if(state.screen==='survey')survey();else if(state.screen==='issue')issue();else if(state.screen==='surveyReview')surveyReview();else dashboard();}render();
</script></body></html>
