<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1170" version="1.1" width="390" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#0D1422" height="1170" width="390" x="0" y="0" /><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" x="18" y="30">◆  COMMONWEALTH OS</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0" x="218" y="30">LIVING VOTER · PREPILOT</text><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" x="18" y="77">STEP 3 OF 3 · DASHBOARD</text><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0" x="18" y="107">Your living voter</text><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0" x="18" y="144">dashboard</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" x="18" y="169">Your survey responses, simulated choices, and</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" x="18" y="188">official congressional records are different</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" x="18" y="207">kinds of evidence.</text><rect fill="#172238" height="98" rx="14" stroke="#35445E" width="114.0" x="15.0" y="240" /><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="0" x="27.0" y="275">4 / 4</text><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0" x="27.0" y="297">Survey answers</text><rect fill="#172238" height="98" rx="14" stroke="#35445E" width="114.0" x="138.0" y="240" /><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="0" x="150.0" y="275">1</text><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0" x="150.0" y="297">Simulated</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0" x="150.0" y="313">choices</text><rect fill="#172238" height="98" rx="14" stroke="#35445E" width="114.0" x="261.0" y="240" /><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="0" x="273.0" y="275">3</text><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0" x="273.0" y="297">Source-backed</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0" x="273.0" y="313">roll calls</text><rect fill="#172238" height="142" rx="15" stroke="#35445E" stroke-width="1" width="360" x="15" y="351" /><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" x="29" y="375">SOURCE-LINKED EXAMPLE</text><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0" x="29" y="394">Explore a governance issue</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="423">H.R. 3276 · Local Communities &amp; Bird</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="442">Habitat Stewardship Act</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="461">House roll call 297 · September 14, 2026</text><rect fill="#85DEEE" height="47" rx="12" stroke="#85DEEE" stroke-width="1" width="354" x="18" y="505" /><text fill="#0D1422" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0" x="33" y="534">Review evidence and simulate</text><rect fill="#172238" height="105" rx="15" stroke="#35445E" stroke-width="1" width="360" x="15" y="563" /><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0" x="29" y="587">My decision history</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="616">One hypothetical selection. This is not a</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="635">ballot from the historical election.</text><rect fill="#132437" height="82" rx="10" stroke="#35445E" width="360" x="15" y="680" /><rect fill="#85DEEE" height="82" width="4" x="15" y="680" /><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" x="29" y="704">Only three example records are loaded. Full</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" x="29" y="721">historical issue coverage requires a separately</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" x="29" y="738">verified source database and mapping review.</text><line stroke="#35445E" x1="18" x2="372" y1="1120" y2="1120" /><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0" x="18" y="1146">DEMO ONLY · NO OFFICIAL BALLOTS CAST</text></svg>