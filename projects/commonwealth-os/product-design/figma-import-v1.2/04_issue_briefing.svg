<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1170" version="1.1" width="390" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#0D1422" height="1170" width="390" x="0" y="0" /><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" x="18" y="30">◆  COMMONWEALTH OS</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0" x="218" y="30">LIVING VOTER · PREPILOT</text><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" x="18" y="77">ISSUE REVIEW · PRIMARY SOURCES</text><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0" x="18" y="107">Understand the precise</text><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0" x="18" y="144">question</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" x="18" y="169">Do not confuse the general topic with the</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" x="18" y="188">exact motion that legislators voted upon.</text><rect fill="#172238" height="163" rx="15" stroke="#35445E" stroke-width="1" width="360" x="15" y="221" /><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" x="29" y="245">RECORDED HOUSE QUESTION</text><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0" x="29" y="264">Local Communities &amp; Bird Habitat</text><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0" x="29" y="285">Stewardship Act</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="314">H.R. 3276 · House roll 297 · Sep 14, 2026</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="333">Motion to suspend rules and pass, as</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="352">amended.</text><rect fill="#172238" height="105" rx="15" stroke="#35445E" stroke-width="1" width="360" x="15" y="396" /><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0" x="29" y="420">Consideration favoring Yea</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="449">A member may support advancing the amended</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="468">legislation under the recorded procedure.</text><rect fill="#172238" height="124" rx="15" stroke="#35445E" stroke-width="1" width="360" x="15" y="513" /><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0" x="29" y="537">Consideration favoring Nay</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="566">A member may oppose the text, its</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="585">provisions, costs, or the procedure. A Nay</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="604">does not establish the reason.</text><rect fill="#172238" height="124" rx="15" stroke="#35445E" stroke-width="1" width="360" x="15" y="649" /><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0" x="29" y="673">What is not established</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="702">This record alone does not show motives,</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="721">preferences on every provision, or all</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="740">subsequent bill actions.</text><rect fill="#1D2C45" height="47" rx="12" stroke="#35445E" stroke-width="1" width="354" x="18" y="785" /><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0" x="33" y="814">Open official House record</text><rect fill="#85DEEE" height="47" rx="12" stroke="#85DEEE" stroke-width="1" width="354" x="18" y="843" /><text fill="#0D1422" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0" x="33" y="872">Continue to simulated vote</text><line stroke="#35445E" x1="18" x2="372" y1="1120" y2="1120" /><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0" x="18" y="1146">DEMO ONLY · NO OFFICIAL BALLOTS CAST</text></svg>