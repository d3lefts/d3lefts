<svg baseProfile="full" height="1170" version="1.1" width="390" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#0D1422" height="1170" width="390" x="0" y="0" /><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" x="18" y="30">◆  COMMONWEALTH OS</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0" x="218" y="30">LIVING VOTER · PREPILOT</text><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" x="18" y="77">STEP 2 OF 3 · OPTIONAL SURVEY</text><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0" x="18" y="107">Your policy views</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" x="18" y="150">Question 1 of 4 · You can skip any question.</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" x="18" y="169">Survey responses are not election ballots.</text><rect fill="#172238" height="142" rx="15" stroke="#35445E" stroke-width="1" width="360" x="15" y="202" /><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" x="29" y="226">ILLUSTRATIVE POLICY QUESTION</text><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0" x="29" y="245">Environmental policy</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="274">Should a legislature consider supporting</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="293">community habitat stewardship, subject to a</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="312">published fiscal analysis?</text><rect fill="#132437" height="82" rx="10" stroke="#35445E" width="360" x="15" y="356" /><rect fill="#85DEEE" height="82" width="4" x="15" y="356" /><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" x="29" y="380">This question is a research prompt, not an exact</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" x="29" y="397">substitute for H.R. 3276 or any recorded</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" x="29" y="414">congressional vote.</text><rect fill="#85DEEE" height="47" rx="12" stroke="#85DEEE" stroke-width="1" width="354" x="18" y="450" /><text fill="#0D1422" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0" x="33" y="479">Support</text><rect fill="#1D2C45" height="47" rx="12" stroke="#35445E" stroke-width="1" width="354" x="18" y="508" /><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0" x="33" y="537">Do not support</text><rect fill="#1D2C45" height="47" rx="12" stroke="#35445E" stroke-width="1" width="354" x="18" y="566" /><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0" x="33" y="595">No preference</text><rect fill="#1D2C45" height="47" rx="12" stroke="#35445E" stroke-width="1" width="354" x="18" y="624" /><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0" x="33" y="653">Need more information</text><rect fill="#1D2C45" height="47" rx="12" stroke="#35445E" stroke-width="1" width="354" x="18" y="682" /><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0" x="33" y="711">Skip question</text><line stroke="#35445E" x1="18" x2="372" y1="1120" y2="1120" /><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0" x="18" y="1146">DEMO ONLY · NO OFFICIAL BALLOTS CAST</text></svg>