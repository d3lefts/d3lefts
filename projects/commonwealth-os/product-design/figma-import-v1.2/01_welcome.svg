<svg baseProfile="full" height="1170" version="1.1" width="390" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#0D1422" height="1170" width="390" x="0" y="0" /><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" x="18" y="30">◆  COMMONWEALTH OS</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0" x="218" y="30">LIVING VOTER · PREPILOT</text><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" x="18" y="77">STEP 1 OF 3 · INTRODUCTION</text><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0" x="18" y="107">Democracy, in the</text><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="0" x="18" y="144">present tense.</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" x="18" y="169">Explore how you would decide on a governance</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" x="18" y="188">matter and inspect your representatives’</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="0" x="18" y="207">recorded votes.</text><rect fill="#172238" height="144" rx="15" stroke="#35445E" stroke-width="1" width="360" x="15" y="240" /><text fill="#85DEEE" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.5" x="29" y="264">USER-SELECTED EXAMPLE</text><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0" x="29" y="283">Selected demonstration</text><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0" x="29" y="304">constituency</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="333">Alabama · U.S. House District 5</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="352">Alabama’s two U.S. senators</text><rect fill="#172238" height="105" rx="15" stroke="#35445E" stroke-width="1" width="360" x="15" y="396" /><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0" x="29" y="420">This is your civic workspace</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="449">Private issue responses · Plain-language</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" letter-spacing="0" x="29" y="468">evidence · Historical roll-call records</text><rect fill="#132437" height="82" rx="10" stroke="#35445E" width="360" x="15" y="513" /><rect fill="#85DEEE" height="82" width="4" x="15" y="513" /><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" x="29" y="537">The demo does not infer your district from device</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" x="29" y="554">location, store political profiles on a server, or</text><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0" x="29" y="571">cast an official ballot.</text><rect fill="#85DEEE" height="47" rx="12" stroke="#85DEEE" stroke-width="1" width="354" x="18" y="607" /><text fill="#0D1422" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0" x="33" y="636">Start optional survey</text><rect fill="#1D2C45" height="47" rx="12" stroke="#35445E" stroke-width="1" width="354" x="18" y="665" /><text fill="#F3F7FF" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0" x="33" y="694">Skip survey and view dashboard</text><line stroke="#35445E" x1="18" x2="372" y1="1120" y2="1120" /><text fill="#B9C9DD" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0" x="18" y="1146">DEMO ONLY · NO OFFICIAL BALLOTS CAST</text></svg>