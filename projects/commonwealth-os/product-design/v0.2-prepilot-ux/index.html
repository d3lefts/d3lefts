<style>
:root{--bg:#0b1625;--shell:#0f1c2d;--surface:#162940;--surface2:#1d334c;--muted:#a8bfd3;--line:#2a435c;--text:#eaf3fc;--accent:#72d5c8;--accent-dark:#082f36;--amber:#f0d093;--danger:#ffacaa;--radius:14px;--ring:0 0 0 3px #72d5c89c;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #7de5d7;outline-offset:4px}a{color:var(--accent)}
.app{min-height:100dvh;display:grid;grid-template-columns:264px minmax(0,1fr)}aside{background:#102037;border-right:1px solid var(--line);padding:26px 18px;display:flex;flex-direction:column;gap:30px}.brand{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:750;letter-spacing:.035em}.brand-mark{display:grid;place-items:center;height:30px;width:30px;border:1.5px solid var(--accent);border-radius:8px;color:var(--accent);font-size:19px}.institution{background:#1a3048;border:1px solid #28435c;border-radius:12px;padding:15px}.eyebrow{color:var(--accent);font-weight:750;font-size:11px;letter-spacing:.12em;text-transform:uppercase}.institution h3{font-size:16px;margin:8px 0 5px}.muted{color:var(--muted)}.tiny{font-size:12px}.navigation{display:grid;gap:6px}.nav-item{border:0;width:100%;border-radius:9px;padding:13px 15px;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;color:#d1e2f0;font-weight:550}.nav-item:hover{background:#1d354c}.nav-item.active{background:#2b4e62;color:#f5ffff;font-weight:750}.nav-symbol{width:20px;text-align:center;color:#80c9c7}.aside-bottom{margin-top:auto;border-top:1px solid #30475d;padding-top:20px}.aside-bottom p{font-size:12px;color:#a4bfd2;margin:8px 0}
main{min-width:0}header.top{height:84px;padding:20px 48px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid #20374b}.crumb{color:#9fb9d0;font-size:13px}.crumb strong{color:#fff;font-weight:650}.right-header{display:flex;gap:10px;align-items:center}.chip{font-weight:750;font-size:11px;letter-spacing:.03em;border:1px solid #416e70;color:#9ce9df;padding:7px 12px;border-radius:99px;white-space:nowrap}.chip.warn{border-color:#886d43;color:var(--amber)}.chip.neutral{border-color:#46627e;color:#bed2ea}.content{max-width:1400px;padding:39px 48px 76px;margin:0 auto}.page-title{font-size:38px;letter-spacing:-.04em;line-height:1.13;margin:10px 0 9px;font-weight:780}.intro{max-width:820px;color:var(--muted);margin:0 0 26px;font-size:16px}.notice{display:flex;gap:16px;align-items:center;border-radius:11px;padding:15px 18px;background:#18333d;border:1px solid #2a5e62;color:#dfefe9;margin:20px 0}.notice strong{flex-shrink:0;letter-spacing:.06em;font-size:11px;color:#f4d797}.notice.alert{background:#362934;border-color:#845c60;color:#ffd6d2}.notice.alert strong{color:#ffb8b0}
.stepper{display:flex;gap:8px;align-items:center;margin-bottom:28px;overflow:auto;padding-bottom:3px}.step{display:flex;gap:7px;align-items:center;color:#a1bace;white-space:nowrap;padding:9px 11px;border-radius:6px;font-size:13px}.step b{display:grid;place-items:center;border:1px solid #516d82;height:22px;width:22px;border-radius:50%;font-size:11px;color:#c1d7e8}.step.on{background:#23465b;color:#f6fffe;font-weight:700}.step.on b,.step.done b{border-color:var(--accent);color:var(--accent)}.step-sep{color:#5e7c91}.panel{background:var(--surface);border:1px solid #273f56;border-radius:14px;padding:24px}.panel h2,.panel h3{margin-top:0}.panel h2{font-size:22px}.panel h3{font-size:18px}.panel p{margin:8px 0}.columns{display:grid;grid-template-columns:minmax(0,1.58fr) minmax(270px,.9fr);gap:20px}.stack{display:grid;gap:18px}.pane-title{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.subheading{color:#9ebed0;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;margin:0 0 8px}.source-tag{display:inline-flex;font-size:12px;background:#253d55;color:#bed7e8;border:1px solid #42607a;border-radius:7px;padding:5px 9px}.bodytext{font-size:16px;max-width:72ch}.legal{border-left:3px solid var(--accent);padding:10px 0 10px 18px;color:#e4f0fa;font-size:16px}.legal strong{color:#fff}.legal .old{background:#49333d;text-decoration:line-through;color:#ffc5ca}.legal .new{background:#22483e;color:#b7ffde}.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metric{background:var(--surface2);padding:13px 15px;border-radius:10px}.metric small{display:block;color:#98b5c9}.metric b{display:block;margin-top:3px;font-size:14px}.button-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.btn{border:1px solid #4e6f84;background:#28445b;color:#ebf5ff;border-radius:10px;padding:12px 18px;font-weight:750;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:46px}.btn:hover{filter:brightness(1.12)}.btn.primary{color:var(--accent-dark);background:var(--accent);border-color:var(--accent)}.btn.ghost{background:transparent}.btn.warn{border-color:#917448;color:#f6dbab;background:#473d32}.btn.danger{border-color:#925560;color:#ffcbca;background:#4c303e}.pillbar{display:flex;gap:5px;padding:5px;background:#20374d;border-radius:10px;max-width:max-content;margin:14px 0}.pillbar button{border:0;background:transparent;color:#bed2e1;border-radius:7px;padding:8px 14px;font-weight:650}.pillbar button.selected{background:#3a5c70;color:#fff}.divider{height:1px;background:#30465c;margin:20px 0}.timeline{margin:20px 0 0;padding:0;list-style:none}.timeline li{position:relative;margin:0 0 14px;padding-left:22px;color:#b8d0e0}.timeline li:before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;border-radius:50%;background:var(--accent)}.textarea,input[type=text]{display:block;width:100%;min-height:48px;border:1px solid #4b6980;background:#0e2034;color:var(--text);padding:12px 14px;border-radius:9px}.textarea{min-height:126px;resize:vertical}.field-label{display:block;color:#d0e7f6;margin-bottom:8px;font-weight:650}.field-help{color:#9eb6cc;font-size:13px;margin:8px 0 20px}.sample{padding:15px;border:1px solid #3b5b72;background:#0e2336;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}.radio-list{display:grid;gap:12px}.choice{display:flex;gap:12px;align-items:center;border:1px solid #455f77;background:#1b3149;padding:14px 17px;border-radius:11px;cursor:pointer;font-size:17px;font-weight:600}.choice:hover{border-color:#77c4bc}.choice input{accent-color:#72d5c8;width:18px;height:18px}.choice:has(input:checked){border:2px solid #72d5c8;background:#1c3b45}.check-row{display:flex;align-items:flex-start;gap:11px;padding:13px 0;border-bottom:1px solid #2e485e}.check-row:last-child{border-bottom:0}.check-icon{display:grid;place-items:center;width:24px;height:24px;flex-shrink:0;border-radius:7px;background:#2d615b;color:#c7fff0;font-weight:800}.check-icon.blocked{background:#6e424a;color:#ffb7b7}.check-row strong{font-size:14px}.check-row small{display:block;color:#b0c7d9;font-size:12px}.receipt-row{display:flex;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid #2f495e}.receipt-row:last-child{border-bottom:0}.receipt-row .label{color:#9db7ca}.receipt-row .value{color:#eaf8ff;text-align:right;font-weight:700}.callout{background:#18313a;border:1px solid #3d666c;padding:20px;border-radius:12px}.callout h3{margin:0 0 8px}.callout p{margin:0}.error{color:#ffb9b9}.success{color:#97efd6}.amber{color:var(--amber)}.scenario{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.scenario select{color:#eff5ff;background:#1e344b;border:1px solid #526c82;padding:11px;border-radius:8px;min-height:45px}.footer-note{font-size:12px;color:#94aec1;margin-top:24px}.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(290px,.8fr);gap:40px;padding:32px 0}.hero h1{font-size:46px;line-height:1.13;letter-spacing:-.044em;margin:16px 0}.mission-card{background:#172e43;border-radius:15px;border:1px solid #375267;padding:30px}.mission-card li{padding:8px 0}.feature-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.feature-list .panel{padding:20px}.feature-list b{display:block;font-size:16px;margin-bottom:5px}.feature-list p{font-size:13px;color:#abc5da}.screen-reader-only{position:absolute!important;clip:rect(1px,1px,1px,1px);height:1px;width:1px;overflow:hidden;white-space:nowrap}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px}.feedback{display:flex;align-items:center;gap:11px;color:#bcd3e5;font-size:13px}.feedback input{accent-color:#72d5c8}.rubric{font-size:13px;color:#b7cde0}.rubric li{margin-bottom:7px}details{margin:14px 0}summary{cursor:pointer;color:var(--accent);font-weight:700}.tag{padding:3px 8px;border-radius:6px;background:#2a4257;font-size:12px;font-weight:700;white-space:nowrap}.tag.green{background:#26483c;color:#c5ffde}.tag.yellow{background:#594731;color:#ffe0a8}.tag.red{background:#643c44;color:#ffd1d2}
.modal-backdrop{position:fixed;inset:0;background:#020a14d9;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.modal{background:#1a3048;border:1px solid #668c97;max-width:610px;width:100%;padding:32px;border-radius:16px;box-shadow:0 28px 60px #000a}.modal h2{margin:10px 0 12px;font-size:28px}.modal p{color:#ccdeed}.lock{width:18px;height:18px;border:2px solid #82d8cf;border-radius:6px;display:inline-block;position:relative}.lock:before{content:"";position:absolute;top:-8px;left:3px;width:8px;height:9px;border:2px solid #82d8cf;border-bottom:0;border-radius:7px 7px 0 0}
@media(max-width:1000px){.app{grid-template-columns:72px minmax(0,1fr)}aside{padding:20px 9px}.brand-label,.institution,.nav-copy,.aside-bottom{display:none}.brand{justify-content:center}.nav-item{justify-content:center;padding:13px 10px}.nav-symbol{width:24px}.content{padding:30px 26px}.columns{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.top{padding:16px 26px!important}.feature-list{grid-template-columns:1fr}}
@media(max-width:650px){.app{display:block}aside{height:auto;position:sticky;top:0;z-index:30;padding:12px 15px;background:#102037;flex-direction:row;gap:8px;border-right:0;border-bottom:1px solid #2d4860;align-items:center}.brand{margin-right:auto}.brand-label{display:none}.navigation{display:flex;gap:0}.nav-item{width:46px}.content{padding:23px 17px 65px}.top{height:62px!important;padding:11px 18px!important}.crumb{font-size:11px}.right-header .chip.neutral{display:none}.page-title{font-size:30px}.hero h1{font-size:34px}.panel{padding:18px}.button-row .btn{flex:1 1 100%}.meta-grid{grid-template-columns:1fr}.receipt-row{display:block}.receipt-row .value{text-align:left}.right-header{gap:4px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside aria-label="Primary navigation">
 <div class="brand"><span class="brand-mark" aria-hidden="true">◇</span><span class="brand-label">COMMONWEALTH OS</span></div>
 <div class="institution"><div class="eyebrow">Institution</div><h3>Fictional Campus Senate</h3><p class="tiny muted" style="margin:0">Representative · DEMO</p></div>
 <nav id="nav" class="navigation" aria-label="Workspace"></nav>
 <div class="aside-bottom"><div class="eyebrow">Research build v0.2</div><p>Fictional records, simulated decisions.</p><p>Not an official ballot or an institutionally approved deployment.</p></div>
</aside>
<main id="main">
 <header class="top"><div class="crumb">COMMONWEALTH OS <span aria-hidden="true">/</span> <strong id="crumbTitle">Guided prepilot</strong></div><div class="right-header"><span class="chip neutral">FICTIONAL CAMPUS</span><span class="chip">SANDBOX / PREPILOT</span></div></header>
 <section class="content" id="content" aria-live="polite"></section>
</main>
</div>
<div id="modalRoot"></div>
<script>
(function(){
'use strict';
const BASE={id:'SYN-014',title:'Campus Walkway Improvements',version:3,old:'Provide shaded access along the east campus walkway.',text:'Install twelve shade structures along the east campus walkway, with installation scheduled for the next academic year.',rule:'SYN-RULE-04@v2',eligibility:'Synthetic 12-seat student senate',quorum:'7 of 12 simulated members'};
const state={page:'welcome',reviewTab:'text',version:3,text:BASE.text,priorText:BASE.old,amendment:'',amendmentRationale:'',choice:'',receipt:null,modal:false,checkScenario:'intact',checkRun:false,mode:'demo',feedback:{},reviewed:false};
const screens=[['welcome','Welcome','◇'],['today','Today','▦'],['review','Legislation','▤'],['amend','Amendment','✎'],['vote','Demo vote','◉'],['passport','Proof Passport','✓']];
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(action,label,style='ghost',extra='')=>`<button class="btn ${style}" data-action="${esc(action)}" ${extra}>${esc(label)}</button>`;
const stepper=()=>{const names=['Review','Amend','Demo vote','Verify'];const ix=Math.max(0,['review','amend','vote','passport'].indexOf(state.page));return `<div class="stepper" aria-label="Scenario progress">${names.map((s,i)=>`<span class="step ${i===ix?'on':i<ix?'done':''}"><b>${i<ix?'✓':i+1}</b>${s}</span>${i<3?'<span class="step-sep">›</span>':''}`).join('')}</div>`};
const ribbon=()=>`<div class="notice"><strong>DEMONSTRATION</strong><span>All people, rules, records, votes and outcomes in this walkthrough are fictional. Nothing is filed or officially certified.</span></div>`;
function renderNav(){const allowed=['today','review','amend','vote','passport'];const icons={today:'▦',review:'▤',amend:'✎',vote:'◉',passport:'✓'};document.getElementById('nav').innerHTML=allowed.map(p=>`<button class="nav-item ${state.page===p?'active':''}" data-page="${p}" title="${p==='vote'?'Simulated ':''}${p}" aria-current="${state.page===p?'page':'false'}"><span class="nav-symbol" aria-hidden="true">${icons[p]}</span><span class="nav-copy">${screens.find(s=>s[0]===p)[1]}</span></button>`).join('')}
function navigate(p){state.page=p;if(p==='review')state.reviewed=true;if(p==='passport')state.checkScenario='intact';document.getElementById('modalRoot').innerHTML='';state.modal=false;render();document.getElementById('main').scrollTo(0,0);window.scrollTo({top:0,behavior:'instant'});}
function pageWelcome(){return `<div class="hero"><div><div class="eyebrow">Invited prepilot • browser walkthrough</div><h1>One decision.<br>Every step accounted for.</h1><p class="intro">Experience a fictional legislative workflow from proposal review to an inspectable decision receipt. Learn what the system knows—and what it cannot certify.</p>${btn('begin','Begin guided scenario →','primary')} ${btn('today','Explore representative workspace','ghost')}<p class="footer-note">No account required. No individual political profile is collected. This prototype runs in your browser only.</p></div><div class="mission-card"><div class="eyebrow">Your guided mission</div><h2>Campus Walkway Improvements</h2><p class="muted">A synthetic student senate scenario in four steps.</p><ol class="timeline"><li>Review operative text and source version</li><li>Suggest a reasoned amendment</li><li>Make a clearly simulated decision</li><li>Inspect provisional assurance evidence</li></ol><span class="chip warn">NO REAL VOTING</span></div></div><div class="feature-list"><div class="panel"><b>Rule-bound</b><p>Versioned governing rules and explicit authority modes.</p></div><div class="panel"><b>Traceable</b><p>Each changed document keeps a reviewable revision history.</p></div><div class="panel"><b>Verifiable</b><p>Every simulated decision exposes its limits, not an unsupported green check.</p></div></div>`;}
function pageToday(){return `<div class="eyebrow">PREPILOT WORKSPACE  /  FICTIONAL REPRESENTATIVE</div><h1 class="page-title">Today</h1><p class="intro">Your next task is ready for review.</p>${ribbon()}<div class="columns"><div class="stack"><section class="panel"><div class="subheading">YOUR NEXT TASK • ACTION REQUIRED</div><div class="pane-title"><h2 style="font-size:28px">${BASE.title}</h2><span class="tag">Revision ${state.version}</span></div><p class="muted">${BASE.id} • Deliberation open • Fictional proposal</p><div class="divider"></div><p>Read the exact proposed wording, compare versions, and record your decision in the demo session.</p><div class="button-row">${btn('review','Review proposal →','primary')}</div></section><section class="panel"><div class="subheading">Recent activity</div><h3>Draft motion imported</h3><p class="muted">A fictional source was added to the sandbox. No authoritative campus system is connected.</p></section></div><aside class="panel" style="display:block;padding:25px;background:var(--surface);border-right:1px solid #273f56"><div class="subheading">Next demo session</div><h2>Wednesday · 2:00 PM</h2><p class="muted">3 sample agenda items · 1 assigned to you</p><div class="divider"></div><div class="subheading">Proof Passport</div><p>Evidence status: <strong class="amber">provisional</strong></p><p class="tiny muted">Preview checks are not independent verification.</p>${btn('passport','Inspect example evidence')}</aside></div>`;}
function pageReview(){const box=state.reviewTab==='text'?`<div class="subheading">PROPOSED OPERATIVE TEXT  /  REVISION ${state.version}</div><p class="legal">${esc(state.text)}</p><div class="divider"></div><p class="muted">This is the exact text that any later simulated vote must lock. The AI explanation is not the authoritative record.</p>`:state.reviewTab==='compare'?`<div class="subheading">COMPARISON  /  REVISION 2 → ${state.version}</div><p class="legal"><span class="old">${esc(state.priorText)}</span></p><p class="legal"><span class="new">${esc(state.text)}</span></p><p class="muted tiny">Illustrative diff between synthetic revisions. Real semantic-diff verification is not implemented.</p>`:`<div class="subheading">SOURCE EVIDENCE</div><div class="receipt-row"><span class="label">Source authority</span><span class="value">Fictional fixture</span></div><div class="receipt-row"><span class="label">Source version</span><span class="value">${BASE.id}@v${state.version}</span></div><div class="receipt-row"><span class="label">Rule basis</span><span class="value">${BASE.rule} (synthetic)</span></div><p class="muted tiny">The source does not originate from UAH or any official record provider.</p>`;
return `<div class="eyebrow">LEGISLATION / REVIEW</div><h1 class="page-title">${BASE.title}</h1><p class="intro">${BASE.id} • Revision ${state.version} • Deliberation open • Fictional campus source</p>${stepper()}${ribbon()}<div class="columns"><div class="stack"><section class="panel"><div class="pane-title"><h2>Proposal details</h2><span class="source-tag">${BASE.id}@v${state.version}</span></div><div class="pillbar" role="tablist" aria-label="Proposal detail views">${[['text','Current text'],['compare','Compare revisions'],['evidence','Source evidence']].map(([id,label])=>`<button data-tab="${id}" class="${state.reviewTab===id?'selected':''}" role="tab" aria-selected="${state.reviewTab===id}">${label}</button>`).join('')}</div>${box}<div class="button-row">${btn('amend','Draft amendment →','primary')}${btn('vote','Continue to demo vote','ghost')}</div></section><section class="panel"><div class="subheading">DISCUSSION  /  FICTIONAL RECORD</div><h3>Why this proposal?</h3><p class="bodytext">The mock deliberation cites summer accessibility needs and shade coverage. Costs, safety requirements and installation timing have not been evaluated.</p><p class="tiny muted">A neutral design exercise: this text is not a policy endorsement.</p></section></div><div class="stack"><section class="panel"><h3>Decision context</h3><div class="meta-grid"><div class="metric"><small>Version</small><b>Revision ${state.version}</b></div><div class="metric"><small>Authority</small><b>Demo only</b></div><div class="metric"><small>Body</small><b>12-seat synthetic senate</b></div><div class="metric"><small>Vote method</small><b>Simulated roll call</b></div></div><div class="divider"></div><h3>Evidence before action</h3><ul class="timeline"><li>Source attributed to a fictional fixture</li><li>Amendments create new versions</li><li>Vote freezes the reviewed motion text</li></ul></section><section class="panel"><div class="subheading">SOURCED EXPLANATION</div><p>This proposal would install twelve shade structures. Its exact wording and historical revisions—not this summary—govern the demonstration.</p><p class="tiny muted">Synthetic explanation; AI assistance cannot cast a vote or certify an outcome.</p></section></div></div>`;}
function pageAmend(){return `<div class="eyebrow">LEGISLATION / PROPOSE AMENDMENT</div><h1 class="page-title">Draft an amendment</h1><p class="intro">A change becomes a new immutable proposal revision in the demo; it does not alter any real institution's record.</p>${stepper()}${ribbon()}<div class="columns"><div class="stack"><section class="panel"><div class="subheading">STARTING FROM  ${BASE.id}@v${state.version}</div><h2>Replace proposed Section 2 text</h2><label class="field-label" for="amendText">Proposed replacement wording</label><textarea class="textarea" id="amendText" maxlength="800" aria-describedby="amendHelp">${esc(state.amendment||state.text)}</textarea><div class="field-help" id="amendHelp">A new revision is recorded only after you confirm this simulated amendment.</div><label class="field-label" for="rationale">Reason for change (optional)</label><textarea class="textarea" id="rationale" style="min-height:83px" maxlength="500" placeholder="What tradeoff or concern does this amendment address?">${esc(state.amendmentRationale)}</textarea><div class="button-row">${btn('saveAmend','Save simulated amendment','primary')}${btn('review','Cancel','ghost')}</div></section></div><div class="stack"><section class="panel"><h3>Version comparison</h3><div class="subheading">CURRENT TEXT</div><div class="sample">${esc(state.text)}</div><div class="divider"></div><div class="subheading">PROPOSED REPLACEMENT</div><div class="sample" id="draftPreview">${esc(state.amendment||state.text)}</div><div class="divider"></div><p class="tiny muted">The draft is never silently substituted into an already locked ballot.</p></section><section class="panel"><div class="subheading">DESIGN CONSTRAINT</div><p>An amendment changes the text version. A subsequent vote must reference and confirm the new version explicitly.</p></section></div></div>`;}
function preflight(){return [{name:'Authority mode',detail:'DEMO only; no official authority',ok:true},{name:'Motion text',detail:`${BASE.id}@v${state.version} is the active synthetic text`,ok:true},{name:'Role eligibility',detail:'Synthetic representative identity',ok:true},{name:'Quorum snapshot',detail:'Fictional 8 / 12 present; 7 required',ok:true}];}
function pageVote(){let done=!!state.receipt;return `<div class="eyebrow">SESSION / BALLOT SIMULATION</div><h1 class="page-title">${done?'Simulated ballot receipt':'Confirm the exact motion'}</h1><p class="intro">The selected text is locked for this scenario. Nothing is transmitted to an institution or counted as an authorized vote.</p>${stepper()}${ribbon()}<div class="columns"><div class="stack"><section class="panel"><div class="panel-head"><h2>Motion to decide</h2><span class="tag yellow">DEMO VOTE</span></div><p class="muted">Motion ${BASE.id} · Text revision ${state.version}</p><div class="legal">${esc(state.text)}</div><p class="tiny muted">Changing this text after ballot confirmation would require returning to drafting and creating a new revision.</p></section>${done?`<section class="panel"><h2>Submission recorded (demo)</h2><div class="callout"><h3 class="success">✓ Local demonstration receipt</h3><p>Your simulated response is stored only in this browser session. No independent or institutional tally has occurred.</p></div><div class="receipt-row"><span class="label">Choice</span><span class="value">${esc(state.receipt.choice)}</span></div><div class="receipt-row"><span class="label">Text version</span><span class="value">${esc(state.receipt.version)}</span></div><div class="receipt-row"><span class="label">Receipt reference</span><span class="value">${esc(state.receipt.ref)}</span></div><div class="button-row">${btn('passport','View Proof Passport →','primary')}${btn('resetVote','Reset simulation','ghost')}</div></section>`:`<section class="panel"><h2>Your simulated decision</h2><p class="muted">Choose an option. No selection is made on your behalf.</p><fieldset style="border:0;padding:0;margin:18px 0"><legend class="screen-reader-only">Select simulated voting choice</legend><div class="radio-list">${['Support','Oppose','Abstain'].map(c=>`<label class="choice"><input type="radio" name="choice" value="${c}" ${state.choice===c?'checked':''}>${c}</label>`).join('')}</div></fieldset><div class="button-row">${btn('confirmVote','Review and confirm simulation →','primary',state.choice?'':'disabled')}${btn('review','Back to proposal','ghost')}</div><p class="tiny muted">An advisory preference is not a vote; this is an explicitly simulated ballot used only to test interface clarity.</p></section>`}</div><div class="stack"><section class="panel"><h3>Decision readiness</h3>${preflight().map(k=>`<div class="check-row"><span class="check-icon">✓</span><div><strong>${esc(k.name)}</strong><small>${esc(k.detail)}</small></div></div>`).join('')}<p class="footer-note amber">These four checks are illustrative UI fixtures, not legally sufficient authorization.</p></section><section class="panel"><div class="subheading">CONSEQUENTIAL ACTION BOUNDARY</div><p>Official voting remains disabled. A production ballot would require legal approval, verified eligibility, server-side enforcement, and independent assurance.</p></section></div></div>`;}
function checks(){const scenario=state.checkScenario;const arr=[{title:'Locked motion version',detail:`Recorded ${BASE.id}@v${state.receipt?.versionNum||state.version}`,ok:scenario!=='stale'},{title:'Governing rule version',detail:scenario==='missing'?'Rule evidence missing':`${BASE.rule} / fictional rule`,ok:scenario!=='missing'},{title:'Eligibility snapshot',detail:'Synthetic membership / not identity proof',ok:true},{title:'Tally / quorum evidence',detail:state.receipt?'One local demo receipt; no independent tally':'No simulated ballot submitted',ok:!!state.receipt},{title:'Institutional legal authority',detail:'None; demo mode only',ok:false}];return arr;}
function pagePassport(){const list=checks();const pass=list.filter(x=>x.ok).length;const broken=state.checkRun&&state.checkScenario!=='intact';return `<div class="eyebrow">RECORDS / ASSURANCE</div><h1 class="page-title">Decision Proof Passport</h1><p class="intro">Review precisely what the evidence supports. A demo pass never becomes a certified official result.</p>${stepper()}<div class="notice ${broken?'alert':''}"><strong>${broken?'EVIDENCE CHECK FAILED':'PROVISIONAL / CONCEPT'}</strong><span>${broken?'The selected counterexample invalidates a simulated prerequisite. No authorization can be inferred.':'This is a demonstrative evidence bundle, not an independent proof or authorized election certificate.'}</span></div><div class="columns"><div class="stack"><section class="panel"><div class="pane-title"><h2>Evidence verification</h2><span class="tag ${broken?'red':'yellow'}">${broken?'Failed (demo)':'Not certified'}</span></div><p class="muted">Reference: ${BASE.id} · Current text revision ${state.version}</p><div class="scenario"><label class="field-label" for="scenario" style="margin:0">Adversarial test</label><select id="scenario"><option value="intact" ${state.checkScenario==='intact'?'selected':''}>Unmodified synthetic evidence</option><option value="stale" ${state.checkScenario==='stale'?'selected':''}>Stale motion version</option><option value="missing" ${state.checkScenario==='missing'?'selected':''}>Missing governing rule</option></select>${btn('runChecks','Run sample checks','primary')}</div><div class="divider"></div>${list.map(x=>`<div class="check-row"><span class="check-icon ${x.ok?'':'blocked'}">${x.ok?'✓':'×'}</span><div><strong>${esc(x.title)}</strong><small>${esc(x.detail)}</small></div></div>`).join('')}<p class="footer-note">Result: ${pass}/5 demonstrative criteria satisfied. The authority condition remains false in every scenario. This browser code is not an independent checker.</p></section></div><div class="stack"><section class="panel"><div class="subheading">DECISION RECORD</div><div class="receipt-row"><span class="label">Instrument</span><span class="value">${BASE.id}</span></div><div class="receipt-row"><span class="label">Vote mode</span><span class="value amber">Demo only</span></div><div class="receipt-row"><span class="label">Text revision</span><span class="value">${state.receipt?.version||'Not locked by a demo vote'}</span></div><div class="receipt-row"><span class="label">Recorded choice</span><span class="value">${esc(state.receipt?.choice||'No simulated submission')}</span></div><div class="receipt-row"><span class="label">Outcome</span><span class="value amber">Not independently certified</span></div><div class="button-row">${btn('export','Export synthetic evidence JSON','primary')}${btn('vote','Back to demo vote','ghost')}</div></section><section class="panel"><h3>What the passport does not establish</h3><ul class="rubric"><li>Legal authorization or legitimacy of the synthetic rule.</li><li>Authenticity of institutional identities.</li><li>Independence of any actual verifier.</li><li>Real turnout, quorum, tally, or enacted law.</li></ul></section></div></div>`;}
const handlers={begin:()=>navigate('review'),today:()=>navigate('today'),review:()=>navigate('review'),amend:()=>navigate('amend'),vote:()=>navigate('vote'),passport:()=>navigate('passport'),confirmVote:()=>{if(!state.choice)return;state.modal=true;renderModal();},saveAmend:()=>{const x=document.getElementById('amendText')?.value.trim(),r=document.getElementById('rationale')?.value.trim()||'';if(!x){alert('Please enter proposed replacement wording.');return;}if(x===state.text){alert('No change to record. Revise the wording or return to review.');return;}state.priorText=state.text;state.text=x;state.amendmentRationale=r;state.amendment='';state.version++;state.choice='';state.receipt=null;state.reviewTab='compare';state.checkRun=false;navigate('review');},resetVote:()=>{state.receipt=null;state.choice='';navigate('vote');},runChecks:()=>{state.checkRun=true;render();},export:()=>{const payload={notice:'FICTIONAL PREPILOT DEMONSTRATION — NOT A CERTIFIED BALLOT OR PROOF',instrument_id:BASE.id,institution:'fictional-campus',authority_mode:'demo',motion:{version:`v${state.version}`,text:state.text},governing_rule:BASE.rule,receipt:state.receipt,independent_verification:false,verification_status:'provisional-demo-only',test_scenario:state.checkScenario,example_checks:checks(),generated_at:new Date().toISOString()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='SYN-014-demo-proof-passport.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);}};
function renderModal(){if(!state.modal){document.getElementById('modalRoot').innerHTML='';return;}document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="eyebrow">FINAL SIMULATION CONFIRMATION</div><h2 id="modalTitle">Confirm simulated ${esc(state.choice)}?</h2><p>Proposal: <strong>${BASE.id}@v${state.version}</strong>. This action records a local demo response only. It is not an authorized institutional ballot.</p><div class="sample">${esc(state.text)}</div><p class="amber" style="margin:18px 0">Authority mode: DEMO. Independent certification: not available.</p><div class="button-row">${btn('commit','Record demo response','primary')}${btn('cancelModal','Cancel','ghost')}</div></section></div>`;const close=document.querySelector('[data-action=cancelModal]');if(close)close.focus();}
handlers.cancelModal=()=>{state.modal=false;renderModal();};handlers.commit=()=>{if(!state.modal||!state.choice)return;state.receipt={ref:`DEMO-${BASE.id}-V${state.version}-001`,version:`${BASE.id}@v${state.version}`,versionNum:state.version,choice:state.choice,mode:'demo',authority:'none'};state.modal=false;state.checkRun=false;navigate('vote');};
function render(){renderNav();const titles={welcome:'Prepilot preview',today:'Today',review:'Legislation',amend:'Draft amendment',vote:'Demo vote',passport:'Proof Passport'};document.getElementById('crumbTitle').textContent=titles[state.page]||'Prepilot';const pages={welcome:pageWelcome,today:pageToday,review:pageReview,amend:pageAmend,vote:pageVote,passport:pagePassport};document.getElementById('content').innerHTML=pages[state.page]();renderModal();}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){navigate(page.dataset.page);return;}const tab=e.target.closest('[data-tab]');if(tab){state.reviewTab=tab.dataset.tab;render();return;}const action=e.target.closest('[data-action]');if(action){const h=handlers[action.dataset.action];if(h)h();}});
document.addEventListener('input',e=>{if(e.target.id==='amendText'){state.amendment=e.target.value;const p=document.getElementById('draftPreview');if(p)p.textContent=state.amendment;}if(e.target.id==='rationale'){state.amendmentRationale=e.target.value;}if(e.target.name==='choice'){state.choice=e.target.value;render();}});
document.addEventListener('change',e=>{if(e.target.name==='choice'){state.choice=e.target.value;render();}if(e.target.id==='scenario'){state.checkScenario=e.target.value;state.checkRun=false;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=false;renderModal();}});
render();
})();
</script>
</body>
